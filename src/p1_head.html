<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1">
<meta name="theme-color" content="#1f6f4a">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="mobile-web-app-capable" content="yes">
<meta name="referrer" content="no-referrer">
<title>Pocket Fertilizer</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ctext y='.9em' font-size='90'%3E%F0%9F%8C%B1%3C/text%3E%3C/svg%3E">
<style>
:root{
  --green-900:#0f3b28; --green-800:#165236; --green-700:#1f6f4a; --green-600:#2a8c5e;
  --green-500:#37a870; --green-300:#8fd9b6; --green-100:#e3f5ec;
  --earth:#8a6a4f; --earth-l:#c9ab8c;
  --sun:#f0a500; --sun-l:#ffd98a;
  --danger:#c9453c; --danger-l:#fde3e1;
  --warn:#d98324; --warn-l:#fdf0dd;
  --info:#2f6fb0; --info-l:#e3eefb;
  --bg:#f6f8f5; --surface:#ffffff; --surface-2:#f0f3ef; --line:#e2e7e0;
  --text:#16211c; --text-2:#5c6b62; --text-3:#8b9a91;
  --radius:16px; --radius-sm:10px; --radius-lg:24px;
  --shadow:0 1px 2px rgba(16,32,24,.06),0 8px 24px rgba(16,32,24,.06);
  --shadow-lg:0 8px 40px rgba(16,32,24,.18);
  --nav-h:64px;
  --safe-b:env(safe-area-inset-bottom,0px);
  --safe-t:env(safe-area-inset-top,0px);
  --ff:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;
}
html[data-theme="dark"]{
  --bg:#0e1512; --surface:#161f1a; --surface-2:#1d2822; --line:#2a3730;
  --text:#e8f0ea; --text-2:#9db0a5; --text-3:#6f8378;
  --green-100:#163024; --green-300:#4fbf8b; --danger-l:#3a1c1a; --warn-l:#3a2a15; --info-l:#152a3f;
  --shadow:0 1px 2px rgba(0,0,0,.4),0 8px 24px rgba(0,0,0,.35);
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0;height:100%}
body{
  font-family:var(--ff); background:var(--bg); color:var(--text);
  font-size:16px; line-height:1.45; overscroll-behavior-y:none;
  -webkit-font-smoothing:antialiased;
}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer;border:0;background:none}
a{color:var(--green-700);text-decoration:none}
h1,h2,h3,h4{margin:0;line-height:1.2;letter-spacing:-.02em}
h1{font-size:1.5rem;font-weight:700}
h2{font-size:1.15rem;font-weight:700}
h3{font-size:1rem;font-weight:650}
.muted{color:var(--text-2)}
.tiny{font-size:.75rem}
.sm{font-size:.85rem}
.b{font-weight:650}
.center{text-align:center}
.hide{display:none !important}
.row{display:flex;align-items:center;gap:10px}
.row.wrap{flex-wrap:wrap}
.between{justify-content:space-between}
.grow{flex:1;min-width:0}
.stack{display:flex;flex-direction:column;gap:12px}
.stack.sm{gap:8px}
.truncate{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}

#app{max-width:520px;margin:0 auto;min-height:100%;display:flex;flex-direction:column;position:relative;background:var(--bg)}
@media(min-width:560px){#app{box-shadow:0 0 0 1px var(--line)}}
header.appbar{
  position:sticky;top:0;z-index:40;padding:calc(var(--safe-t) + 10px) 16px 10px;
  background:var(--bg);
}
header.appbar .bar{display:flex;align-items:center;gap:10px;min-height:36px}
header.appbar .title{font-size:1.35rem;font-weight:750;letter-spacing:-.03em}
header.appbar .sub{font-size:.72rem;color:var(--text-2);margin-top:-2px}
.iconbtn{
  width:38px;height:38px;border-radius:12px;display:grid;place-items:center;
  background:var(--surface-2);color:var(--text);font-size:1.05rem;flex:0 0 auto;
  transition:transform .12s ease, background .12s ease;
}
.iconbtn:active{transform:scale(.92)}
main{flex:1;padding:4px 16px calc(var(--nav-h) + var(--safe-b) + 28px)}
.screen{display:none;animation:fade .22s ease}
.screen.active{display:block}
@keyframes fade{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}

nav.tabs{
  position:fixed;bottom:0;left:0;right:0;z-index:50;
  max-width:520px;margin:0 auto;
  padding:6px 4px calc(6px + var(--safe-b));
  background:var(--surface);
  border-top:1px solid var(--line);
  display:grid;grid-template-columns:repeat(6,1fr);gap:1px;
}
nav.tabs button{
  display:flex;flex-direction:column;align-items:center;gap:1px;
  padding:6px 1px;border-radius:11px;color:var(--text-3);font-size:.55rem;font-weight:600;
  transition:color .15s ease,background .15s ease;letter-spacing:-.01em;
}
nav.tabs button .ic{font-size:1.18rem;line-height:1.15;filter:grayscale(1) opacity(.65);transition:filter .15s}
nav.tabs button[data-tab="assist"]{color:var(--green-600)}
nav.tabs button[data-tab="assist"] .ic{filter:none}
nav.tabs button[data-tab="assist"]:not(.on){background:var(--green-100)}

/* ---- assistant ---- */
.bub{max-width:82%;padding:10px 13px;border-radius:16px;font-size:.9rem;line-height:1.45;word-wrap:break-word}
.bub.me{background:var(--green-700);color:#fff;border-bottom-right-radius:5px}
.bub.ai{background:var(--surface);border:1px solid var(--line);border-bottom-left-radius:5px;box-shadow:var(--shadow)}
.asbar{
  position:sticky;bottom:calc(var(--nav-h) + var(--safe-b) + 6px);z-index:20;
  display:flex;gap:7px;align-items:center;padding:7px;border-radius:16px;
  background:var(--surface);border:1px solid var(--line);box-shadow:var(--shadow);margin-top:10px;
}
.asbar input{border:0;background:transparent;padding:6px 2px;flex:1;min-width:0}
.asbar input:focus{box-shadow:none}
.asbar .iconbtn.send{background:var(--green-700);color:#fff;width:36px;height:36px;font-size:1.1rem;font-weight:700}
.asbar .iconbtn.mic-on{background:var(--danger);color:#fff;animation:pulse 1.1s ease-in-out infinite}
@keyframes pulse{0%,100%{transform:scale(1)}50%{transform:scale(1.12)}}
nav.tabs button.on{color:var(--green-700);background:var(--green-100)}
nav.tabs button.on .ic{filter:none}
html[data-theme="dark"] nav.tabs button.on{color:var(--green-300)}

.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);padding:14px;box-shadow:var(--shadow)}
.card.pad0{padding:0;overflow:hidden}
.card + .card{margin-top:12px}
.sec{margin:20px 0 10px;display:flex;align-items:baseline;justify-content:space-between;gap:8px}
.sec h2{font-size:.95rem;text-transform:uppercase;letter-spacing:.06em;color:var(--text-2);font-weight:700}
.hero{
  border-radius:var(--radius-lg);padding:16px;color:#fff;
  background:linear-gradient(135deg,#1f6f4a,#37a870 60%,#5cc08a);
  box-shadow:var(--shadow);position:relative;overflow:hidden;
}
.hero:after{content:"";position:absolute;right:-30px;top:-40px;width:160px;height:160px;border-radius:50%;background:rgba(255,255,255,.12)}
.hero .lbl{font-size:.7rem;text-transform:uppercase;letter-spacing:.1em;opacity:.85}
.stat{display:flex;flex-direction:column}
.stat .n{font-size:1.5rem;font-weight:750;letter-spacing:-.03em}
.stat .l{font-size:.68rem;text-transform:uppercase;letter-spacing:.06em;color:var(--text-2);font-weight:600}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}

.btn{
  display:inline-flex;align-items:center;justify-content:center;gap:7px;
  padding:11px 16px;border-radius:12px;font-weight:650;font-size:.92rem;
  background:var(--green-700);color:#fff;transition:transform .12s,filter .12s;
  border:1px solid transparent;
}
.btn:active{transform:scale(.97);filter:brightness(.95)}
.btn.block{display:flex;width:100%}
.btn.ghost{background:var(--surface-2);color:var(--text);border-color:var(--line)}
.btn.outline{background:transparent;color:var(--green-700);border-color:var(--green-700)}
.btn.danger{background:var(--danger)}
.btn.warn{background:var(--warn)}
.btn.sm{padding:7px 11px;font-size:.8rem;border-radius:10px}
.btn.xs{padding:5px 9px;font-size:.72rem;border-radius:9px}
.btn[disabled]{opacity:.45;pointer-events:none}
.chip{
  display:inline-flex;align-items:center;gap:5px;padding:5px 10px;border-radius:999px;
  background:var(--surface-2);border:1px solid var(--line);font-size:.75rem;font-weight:600;color:var(--text-2);
}
.chip.on{background:var(--green-700);border-color:var(--green-700);color:#fff}
.chip.good{background:var(--green-100);color:var(--green-700);border-color:transparent}
.chip.bad{background:var(--danger-l);color:var(--danger);border-color:transparent}
.chip.warn{background:var(--warn-l);color:var(--warn);border-color:transparent}
.chip.info{background:var(--info-l);color:var(--info);border-color:transparent}
html[data-theme="dark"] .chip.good{color:var(--green-300)}
.scroller{display:flex;gap:8px;overflow-x:auto;padding:2px 16px 6px;margin:0 -16px;scrollbar-width:none}
.scroller::-webkit-scrollbar{display:none}
.scroller > *{flex:0 0 auto}

label.f{display:block;font-size:.72rem;font-weight:700;text-transform:uppercase;letter-spacing:.05em;color:var(--text-2);margin-bottom:5px}
input[type=text],input[type=number],input[type=date],input[type=password],input[type=search],select,textarea{
  width:100%;padding:11px 12px;border-radius:12px;border:1px solid var(--line);
  background:var(--surface);color:var(--text);outline:none;transition:border-color .15s,box-shadow .15s;
  font-size:16px;
}
input:focus,select:focus,textarea:focus{border-color:var(--green-500);box-shadow:0 0 0 3px var(--green-100)}
textarea{min-height:80px;resize:vertical}
.field + .field{margin-top:12px}
.switch{position:relative;width:46px;height:28px;border-radius:999px;background:var(--line);transition:background .18s;flex:0 0 auto}
.switch:after{content:"";position:absolute;top:3px;left:3px;width:22px;height:22px;border-radius:50%;background:#fff;transition:transform .18s;box-shadow:0 1px 3px rgba(0,0,0,.25)}
.switch.on{background:var(--green-600)}
.switch.on:after{transform:translateX(18px)}
.seg{display:flex;background:var(--surface-2);border-radius:12px;padding:3px;gap:2px;border:1px solid var(--line)}
.seg button{flex:1;padding:8px 4px;border-radius:9px;font-size:.8rem;font-weight:650;color:var(--text-2)}
.seg button.on{background:var(--surface);color:var(--text);box-shadow:var(--shadow)}
.stepper{display:flex;align-items:center;gap:8px}
.stepper button{width:34px;height:34px;border-radius:10px;background:var(--surface-2);border:1px solid var(--line);font-size:1.1rem;font-weight:700;display:grid;place-items:center}
.stepper .v{min-width:34px;text-align:center;font-weight:700}

.list{display:flex;flex-direction:column}
.item{display:flex;align-items:center;gap:12px;padding:12px 14px;border-bottom:1px solid var(--line);background:var(--surface);width:100%;text-align:left}
.item:last-child{border-bottom:0}
.item .av{width:42px;height:42px;border-radius:12px;display:grid;place-items:center;font-size:1.35rem;background:var(--surface-2);flex:0 0 auto;overflow:hidden}
.item .av img{width:100%;height:100%;object-fit:cover}
.item .go{color:var(--text-3);font-size:1.1rem}

.scrim{position:fixed;inset:0;background:rgba(10,20,15,.5);z-index:60;opacity:0;pointer-events:none;transition:opacity .2s}
.scrim.on{opacity:1;pointer-events:auto}
.sheet{
  position:fixed;left:0;right:0;bottom:0;z-index:61;max-width:520px;margin:0 auto;
  background:var(--surface);border-radius:24px 24px 0 0;box-shadow:var(--shadow-lg);
  transform:translateY(102%);transition:transform .26s cubic-bezier(.32,.72,0,1);
  max-height:92vh;display:flex;flex-direction:column;
}
.sheet.on{transform:none}
.sheet .grab{width:38px;height:4px;border-radius:2px;background:var(--line);margin:10px auto 4px;flex:0 0 auto}
.sheet .shead{padding:6px 18px 10px;display:flex;align-items:center;gap:10px;border-bottom:1px solid var(--line)}
.sheet .sbody{padding:16px 18px calc(20px + var(--safe-b));overflow-y:auto;-webkit-overflow-scrolling:touch}
.toast{
  position:fixed;left:50%;bottom:calc(var(--nav-h) + var(--safe-b) + 16px);transform:translate(-50%,20px);
  background:var(--text);color:var(--bg);padding:10px 16px;border-radius:999px;font-size:.85rem;font-weight:600;
  z-index:90;opacity:0;pointer-events:none;transition:.24s;max-width:90vw;text-align:center;
}
.toast.on{opacity:1;transform:translate(-50%,0)}

.bedwrap{overflow:auto;padding:6px;background:var(--surface-2);border-radius:var(--radius);border:1px solid var(--line)}
.bed{display:grid;gap:3px;margin:0 auto;width:max-content;position:relative;
  background:linear-gradient(135deg,#6b4f38,#8a6a4f);padding:6px;border-radius:10px;
  box-shadow:inset 0 0 0 3px rgba(0,0,0,.12);
}
.cell{
  width:var(--cs,46px);height:var(--cs,46px);border-radius:7px;
  background:#3d2c1e;display:grid;place-items:center;position:relative;
  font-size:calc(var(--cs,46px) * .5);line-height:1;
  box-shadow:inset 0 1px 0 rgba(255,255,255,.06);
  transition:transform .1s;
}
.cell:active{transform:scale(.9)}
.cell.filled{background:radial-gradient(circle at 50% 35%,#4a3625,#2c1f14)}
.cell.sel{outline:3px solid var(--sun);outline-offset:-3px;z-index:2}
.cell .qty{position:absolute;bottom:1px;right:2px;font-size:9px;background:rgba(0,0,0,.55);color:#fff;border-radius:4px;padding:0 3px;font-weight:700}
.cell .warnflag{position:absolute;top:0;left:2px;font-size:10px}
.cell .loveflag{position:absolute;top:0;left:2px;font-size:10px;filter:drop-shadow(0 1px 1px rgba(0,0,0,.4))}
.cell{-webkit-user-select:none;user-select:none}
.cell.filled{touch-action:pan-y}
.cell.lifted{z-index:30;transition:none;opacity:.92;
  box-shadow:0 12px 28px rgba(0,0,0,.5);outline:3px solid var(--sun);outline-offset:-2px}
.cell.lifted:active{transform:none}
.cell.dragging{opacity:.55;z-index:9;box-shadow:0 8px 20px rgba(0,0,0,.4);transition:none}
.dropghost{position:absolute;border-radius:7px;pointer-events:none;z-index:8;transition:left .06s ease,top .06s ease}
.dropghost.ok{border:2.5px dashed var(--green-500);background:rgba(55,168,112,.18)}
.dropghost.swap{border:2.5px dashed var(--sun);background:rgba(240,165,0,.20)}
.dropghost.bad{border:2.5px dashed var(--danger);background:rgba(201,69,60,.16)}
.cell .one{position:absolute;bottom:2px;left:0;right:0;text-align:center;font-size:9px;
  color:rgba(255,255,255,.82);font-weight:700;letter-spacing:.02em;text-transform:uppercase}
.cell .grip{position:absolute;right:-6px;bottom:-6px;width:22px;height:22px;border-radius:50%;
  background:var(--sun);border:2px solid #fff;box-shadow:0 2px 6px rgba(0,0,0,.35);cursor:nwse-resize;
  touch-action:none;z-index:5}
.cell .grip:after{content:"⤢";position:absolute;inset:0;display:grid;place-items:center;font-size:11px;color:#4a3200}
.bed{align-items:start;justify-items:start}
.bedtitle{display:flex;align-items:center;gap:8px;justify-content:space-between;margin-bottom:8px}

.cal{display:grid;grid-template-columns:repeat(7,1fr);gap:3px}
.cal .dow{font-size:.6rem;text-align:center;color:var(--text-3);font-weight:700;text-transform:uppercase;padding-bottom:2px}
.cal .d{aspect-ratio:1;border-radius:9px;background:var(--surface-2);display:flex;flex-direction:column;align-items:center;justify-content:center;font-size:.72rem;position:relative;border:1px solid transparent}
.cal .d.out{opacity:.28}
.cal .d.today{border-color:var(--green-600);font-weight:800;color:var(--green-700)}
.cal .d .dots{display:flex;gap:2px;margin-top:2px;height:5px}
.cal .d .dot{width:5px;height:5px;border-radius:50%}
.tl{position:relative;padding-left:22px}
.tl:before{content:"";position:absolute;left:7px;top:6px;bottom:6px;width:2px;background:var(--line)}
.tl .ev{position:relative;padding:8px 0}
.tl .ev:before{content:"";position:absolute;left:-19px;top:14px;width:10px;height:10px;border-radius:50%;background:var(--green-600);box-shadow:0 0 0 3px var(--bg)}

.bar-track{height:8px;border-radius:999px;background:var(--surface-2);overflow:hidden}
.bar-fill{height:100%;border-radius:999px;background:var(--green-600);transition:width .4s}
.note{padding:11px 13px;border-radius:12px;font-size:.82rem;line-height:1.45}
.note.i{background:var(--info-l);color:var(--info)}
.note.w{background:var(--warn-l);color:var(--warn)}
.note.d{background:var(--danger-l);color:var(--danger)}
.note.g{background:var(--green-100);color:var(--green-700)}
html[data-theme="dark"] .note.g{color:var(--green-300)}
html[data-theme="dark"] .note.i{color:#8fbdf0}
html[data-theme="dark"] .note.w{color:#f0c27a}
html[data-theme="dark"] .note.d{color:#f0a6a0}
.empty{text-align:center;padding:32px 16px;color:var(--text-2)}
.empty .e{font-size:2.6rem;opacity:.5;display:block;margin-bottom:8px}
.photo{width:100%;border-radius:var(--radius);display:block;background:var(--surface-2)}
/* A live camera has to fit on the phone with its shutter button visible without
   scrolling — the sheet is capped at 92vh and the stage takes a fixed slice of it,
   so the controls under it are always reachable. object-fit is CONTAIN, not cover:
   the skyline survey measures the whole frame, and cropping to fill would both
   look like an unasked-for zoom and quietly falsify the horizon angles. */
.camstage{position:relative;background:#000;border-radius:var(--radius);overflow:hidden;
  height:min(50vh,72vw);display:flex;align-items:center;justify-content:center;touch-action:none}
.camstage video{width:100%;height:100%;object-fit:contain;display:block;transform-origin:50% 50%}
.camstage .ztag{position:absolute;right:8px;top:8px;background:rgba(0,0,0,.55);color:#fff;
  padding:2px 9px;border-radius:999px;font-size:.72rem;font-weight:700;pointer-events:none}
.camstage .chint{position:absolute;left:0;right:0;bottom:6px;text-align:center;color:#fff;
  font-size:.68rem;opacity:.8;pointer-events:none;text-shadow:0 1px 3px #000}
video#camfeed{width:100%;border-radius:var(--radius);background:#000;display:block;
  aspect-ratio:3/4;object-fit:cover;max-height:52vh}
.spinner{width:18px;height:18px;border-radius:50%;border:2.5px solid var(--line);border-top-color:var(--green-600);animation:spin .7s linear infinite;display:inline-block;vertical-align:-3px}
@keyframes spin{to{transform:rotate(360deg)}}
/* a field the app filled in from a photo — visibly the app's guess, still fully editable */
input.ai-filled,textarea.ai-filled,select.ai-filled{border-color:var(--green-500);background:var(--green-100);animation:aifill .5s ease-out}
@keyframes aifill{from{background:var(--green-300)}to{background:var(--green-100)}}
table.mini{width:100%;border-collapse:collapse;font-size:.82rem}
table.mini th{text-align:left;font-size:.65rem;text-transform:uppercase;letter-spacing:.05em;color:var(--text-3);padding:6px 6px;border-bottom:1px solid var(--line)}
table.mini td{padding:8px 6px;border-bottom:1px solid var(--line)}
table.mini tr:last-child td{border-bottom:0}
code,pre{font-family:ui-monospace,SFMono-Regular,Menlo,monospace;font-size:.8rem}
pre{background:var(--surface-2);padding:12px;border-radius:12px;overflow:auto;margin:0}
.lock-screen{position:fixed;inset:0;z-index:100;background:linear-gradient(160deg,#165236,#37a870);display:flex;align-items:center;justify-content:center;padding:24px}
.lock-card{background:var(--surface);border-radius:24px;padding:24px;width:100%;max-width:380px;box-shadow:var(--shadow-lg)}
.swatch{width:14px;height:14px;border-radius:4px;flex:0 0 auto}
.ibtn{width:19px;height:19px;border-radius:50%;background:var(--surface-2);border:1px solid var(--line);
  color:var(--text-2);font-size:11px;font-weight:700;font-style:italic;line-height:1;display:inline-grid;
  place-items:center;flex:0 0 auto;font-family:Georgia,serif}
.ibtn:active{transform:scale(.9)}
#coach{position:sticky;top:calc(var(--safe-t) + 56px);z-index:45;max-width:520px;margin:0 auto;padding:0 16px}
#coach:empty{display:none}
.coach-card{background:var(--green-100);border:1px solid var(--green-300);border-radius:14px;padding:11px 12px;
  box-shadow:var(--shadow);animation:fade .2s ease}
html[data-theme="dark"] .coach-card{background:var(--green-100);border-color:var(--green-600)}
.coach-x{background:transparent;color:var(--text-2);font-size:1rem;line-height:1;padding:2px 4px;flex:0 0 auto}

/* ---- garden map ---- */
.mapwrap{overflow:auto;border-radius:var(--radius);border:1px solid var(--line);background:var(--surface-2);padding:8px}
.mapplot{position:relative;width:100%;min-height:160px;border-radius:10px;overflow:hidden;
  background:linear-gradient(160deg,#eef3ea,#e4ece0)}
html[data-theme="dark"] .mapplot{background:linear-gradient(160deg,#1a231d,#16201a)}
.mapgrid{position:absolute;inset:0;pointer-events:none;opacity:.5;
  background-image:linear-gradient(to right,rgba(0,0,0,.10) 1px,transparent 1px),
                   linear-gradient(to bottom,rgba(0,0,0,.10) 1px,transparent 1px)}
html[data-theme="dark"] .mapgrid{background-image:linear-gradient(to right,rgba(255,255,255,.09) 1px,transparent 1px),
                   linear-gradient(to bottom,rgba(255,255,255,.09) 1px,transparent 1px)}
.mapnorth{position:absolute;top:6px;right:8px;font-size:.7rem;font-weight:800;color:var(--text-2);
  background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:2px 6px;pointer-events:none;z-index:3}
.mapbed,.mapfeat{position:absolute;border-radius:8px;overflow:hidden;touch-action:none;
  box-shadow:0 1px 3px rgba(0,0,0,.22);transition:box-shadow .12s,transform .08s;cursor:pointer}
.mapbed{background:linear-gradient(135deg,#7d5f45,#8a6a4f);border:1.5px solid #5f4630;color:#fff;padding:3px 5px}
.mapfeat{background:var(--surface);border:1.5px dashed var(--line);color:var(--text);
  display:grid;place-items:center;text-align:center}
.mapbed.sel,.mapfeat.sel{outline:3px solid var(--sun);outline-offset:-1px;z-index:4;box-shadow:0 6px 16px rgba(0,0,0,.3)}
.mapbed:active,.mapfeat:active{transform:scale(.985)}
.mb-name{font-size:11px;font-weight:800;line-height:1.15;text-shadow:0 1px 2px rgba(0,0,0,.45);
  overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.mb-emo{font-size:13px;line-height:1.3;margin-top:2px;word-break:break-all}
.mb-sub{position:absolute;bottom:3px;left:5px;right:5px;font-size:9px;opacity:.85;
  overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.mf-e{font-size:16px;line-height:1}
.mf-n{font-size:9px;font-weight:700;color:var(--text-2);margin-top:1px;
  overflow:hidden;text-overflow:ellipsis;white-space:nowrap;max-width:100%}
</style>
