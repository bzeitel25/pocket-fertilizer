<script>
/* ============================================================
   JOURNAL — water, feed, treat, spend, harvest
   ============================================================ */
const JTYPE = {
  water:    { i:"💧", n:"Watering",    unit:"inches",  amount:true, cost:false },
  feed:     { i:"🌿", n:"Fertilizer",  unit:"cups",    amount:true, cost:true  },
  amend:    { i:"🪵", n:"Amendment",   unit:"lbs",     amount:true, cost:true  },
  treat:    { i:"🧴", n:"Pest / disease treatment", unit:"applications", amount:true, cost:true },
  weed:     { i:"🌾", n:"Weeding",     unit:"",        amount:false, cost:false },
  prune:    { i:"✂️", n:"Pruning",     unit:"",        amount:false, cost:false },
  soil:     { i:"🧪", n:"Soil test",   unit:"",        amount:false, cost:true  },
  buy:      { i:"🧾", n:"Purchase",    unit:"",        amount:false, cost:true  },
  note:     { i:"📝", n:"Note",        unit:"",        amount:false, cost:false }
};

const Journal = {
  filter: "all",

  render(){
    const box = $("#s-journal");
    const yr = String(today().getFullYear());
    let rows = DB.all("journal").map(j => ({ kind:"j", d: j.date, o: j }))
      .concat(DB.all("harvests").map(x => ({ kind:"h", d: x.date, o: x })))
      .sort((a,b) => (b.d || "").localeCompare(a.d || ""));
    if(Journal.filter !== "all") rows = rows.filter(r => Journal.filter === "harvest" ? r.kind === "h" : (r.kind === "j" && r.o.type === Journal.filter));

    const jy = DB.all("journal").filter(j => (j.date||"").slice(0,4) === yr);
    const hy = DB.all("harvests").filter(x => (x.date||"").slice(0,4) === yr);
    const water = jy.filter(j => j.type === "water").reduce((a,j) => a + num(j.amount), 0);
    const spend = jy.reduce((a,j) => a + num(j.cost), 0);
    const lbs = hy.reduce((a,x) => a + Journal.lbs(x), 0);

    let h = '<div class="card"><div class="grid3">' +
      '<div class="stat"><span class="n">' + (Math.round(lbs*10)/10) + '</span><span class="l">lbs picked</span></div>' +
      '<div class="stat"><span class="n">' + (Math.round(water*10)/10) + '"</span><span class="l">water logged</span></div>' +
      '<div class="stat"><span class="n">$' + Math.round(spend) + '</span><span class="l">spent</span></div>' +
      '</div></div>';

    h += '<div class="grid2" style="margin-top:12px">' +
      '<button class="btn" onclick="Journal.quick(\'harvest\')">🧺 Log harvest</button>' +
      '<button class="btn ghost" onclick="Journal.quick()">＋ Log activity</button></div>';

    h += '<div class="scroller" style="margin-top:12px">' +
      '<button class="chip ' + (Journal.filter === "all" ? "on" : "") + '" onclick="Journal.filter=\'all\';Journal.render()">All</button>' +
      '<button class="chip ' + (Journal.filter === "harvest" ? "on" : "") + '" onclick="Journal.filter=\'harvest\';Journal.render()">🧺 Harvests</button>' +
      Object.keys(JTYPE).map(k => '<button class="chip ' + (Journal.filter === k ? "on" : "") + '" onclick="Journal.filter=\'' + k + '\';Journal.render()">' +
        JTYPE[k].i + ' ' + JTYPE[k].n + '</button>').join("") + '</div>';

    if(!rows.length){
      h += '<div class="card" style="margin-top:12px"><div class="empty"><span class="e">📖</span><div class="b">Nothing logged yet</div>' +
        '<div class="tiny">Every watering, feeding and harvest you log feeds the end-of-season recap — yield per bed, cost per pound, what actually paid off.</div></div></div>';
    } else {
      h += '<div class="card pad0" style="margin-top:12px"><div class="list">';
      let lastDate = null;
      rows.slice(0, 120).forEach(r => {
        if(r.d !== lastDate){ lastDate = r.d;
          h += '<div style="padding:8px 14px 4px;background:var(--surface-2)" class="tiny b muted">' + fmtY(r.d) + '</div>'; }
        if(r.kind === "h"){
          const x = r.o;
          h += '<button class="item" onclick="Journal.openHarvest(\'' + x.id + '\')"><div class="av">🧺</div>' +
            '<div class="grow"><div class="b">' + esc(cropName(x.crop_id)) + ' · ' + esc(x.weight) + ' ' + esc(x.unit || "lbs") + '</div>' +
            '<div class="tiny muted">' + (x.value ? '$' + esc(x.value) + ' value · ' : '') + esc(Journal.bedName(x.bed_id)) + '</div></div><span class="go">›</span></button>';
        } else {
          const j = r.o, t = JTYPE[j.type] || JTYPE.note;
          h += '<button class="item" onclick="Journal.openEntry(\'' + j.id + '\')"><div class="av">' + t.i + '</div>' +
            '<div class="grow"><div class="b">' + esc(t.n) + (j.amount ? ' · ' + esc(j.amount) + ' ' + esc(j.unit || t.unit) : '') + '</div>' +
            '<div class="tiny muted truncate">' + esc(Journal.bedName(j.bed_id)) + (j.product ? ' · ' + esc(j.product) : '') +
            (j.cost ? ' · $' + esc(j.cost) : '') + (j.notes ? ' · ' + esc(j.notes.slice(0, 40)) : '') + '</div></div><span class="go">›</span></button>';
        }
      });
      h += '</div></div>';
    }
    box.innerHTML = h;
  },

  lbs(x){ const w = num(x.weight); return x.unit === "oz" ? w/16 : x.unit === "kg" ? w*2.205 : x.unit === "g" ? w/453.6 : w; },
  bedName(id){ const b = id ? DB.find("beds", id) : null; return b ? b.name : "Garden"; },

  quick(type, bedId, plantingId){
    if(type === "harvest") return Journal.harvestForm(null, bedId, plantingId);
    const beds = DB.all("beds");
    const t = type || "water";
    let h = '<div class="field"><label class="f">Activity</label><select id="jl-type" onchange="Journal.formSwap()">' +
      Object.keys(JTYPE).map(k => '<option value="' + k + '"' + (k === t ? " selected" : "") + '>' + JTYPE[k].i + ' ' + JTYPE[k].n + '</option>').join("") +
      '</select></div>';
    h += '<div class="grid2" style="margin-top:12px">' +
      '<div><label class="f">Date</label><input type="date" id="jl-date" value="' + iso(today()) + '"></div>' +
      '<div><label class="f">Bed</label><select id="jl-bed"><option value="">Whole garden</option>' +
        beds.map(b => '<option value="' + b.id + '"' + (bedId === b.id ? " selected" : "") + '>' + esc(b.name) + '</option>').join("") + '</select></div></div>';
    h += '<div id="jl-dyn"></div>';
    h += '<div class="field"><label class="f">Notes</label><textarea id="jl-notes"></textarea></div>';
    h += '<button class="btn block" style="margin-top:14px" onclick="Journal.save()">Save entry</button>';
    openSheet("Log activity", h);
    Journal.formSwap();
  },

  formSwap(){
    const t = JTYPE[$("#jl-type").value] || JTYPE.note;
    let h = '';
    if(t.amount) h += '<div class="grid2" style="margin-top:12px">' +
      '<div><label class="f">Amount</label><input type="number" step="0.01" id="jl-amt" placeholder="1"></div>' +
      '<div><label class="f">Unit</label><input type="text" id="jl-unit" value="' + esc(t.unit) + '"></div></div>';
    if($("#jl-type").value === "water") h += '<div class="note i" style="margin-top:8px">Log in inches to match crop requirements. Rough guide: 0.6 gallons per square foot ≈ 1 inch of water.</div>';
    if($("#jl-type").value === "feed" || $("#jl-type").value === "treat" || $("#jl-type").value === "amend")
      h += '<div class="field"><label class="f">Product</label><input type="text" id="jl-prod" placeholder="Fish emulsion 5-1-1"></div>';
    if($("#jl-type").value === "soil") h += '<div class="grid2" style="margin-top:12px">' +
      '<div><label class="f">pH</label><input type="number" step="0.1" id="jl-ph" placeholder="6.5"></div>' +
      '<div><label class="f">Soil temp °F</label><input type="number" id="jl-temp" placeholder="62"></div></div>';
    if(t.cost) h += '<div class="field"><label class="f">Cost ($)</label><input type="number" step="0.01" id="jl-cost" placeholder="0.00"></div>';
    h += '<div class="field"><label class="f">Time spent (minutes)</label><input type="number" id="jl-min" placeholder="15"></div>';
    $("#jl-dyn").innerHTML = h;
  },

  save(){
    const type = $("#jl-type").value;
    const rec = {
      date: $("#jl-date").value, type: type, bed_id: $("#jl-bed").value || null,
      amount: $("#jl-amt") ? num($("#jl-amt").value) : null,
      unit: $("#jl-unit") ? $("#jl-unit").value : null,
      product: $("#jl-prod") ? $("#jl-prod").value.trim() : null,
      cost: $("#jl-cost") ? num($("#jl-cost").value) : null,
      minutes: $("#jl-min") ? num($("#jl-min").value) : null,
      notes: $("#jl-notes").value.trim()
    };
    DB.insert("journal", rec);
    if(type === "soil" && $("#jl-ph"))
      DB.insert("observations", { date: rec.date, bed_id: rec.bed_id, ph: num($("#jl-ph").value), soil_temp: num($("#jl-temp").value), notes: rec.notes });
    closeSheet(); Journal.render(); refresh(); toast("Logged");
  },

  openEntry(id){
    const j = DB.find("journal", id); if(!j) return;
    const t = JTYPE[j.type] || JTYPE.note;
    openSheet(t.n,
      '<div class="row" style="gap:12px"><div style="font-size:2.2rem">' + t.i + '</div><div class="grow">' +
      '<div class="b">' + esc(t.n) + '</div><div class="tiny muted">' + fmtY(j.date) + ' · ' + esc(Journal.bedName(j.bed_id)) + '</div></div></div>' +
      '<table class="mini" style="margin-top:14px">' +
        (j.amount ? '<tr><th>Amount</th><td>' + esc(j.amount) + ' ' + esc(j.unit || "") + '</td></tr>' : '') +
        (j.product ? '<tr><th>Product</th><td>' + esc(j.product) + '</td></tr>' : '') +
        (j.cost ? '<tr><th>Cost</th><td>$' + esc(j.cost) + '</td></tr>' : '') +
        (j.minutes ? '<tr><th>Time</th><td>' + esc(j.minutes) + ' min</td></tr>' : '') +
      '</table>' +
      (j.notes ? '<div class="note i" style="margin-top:12px">' + esc(j.notes) + '</div>' : '') +
      '<button class="btn danger block" style="margin-top:16px" onclick="DB.remove(\'journal\',\'' + id + '\');closeSheet();Journal.render()">Delete entry</button>');
  },

  /* ---------- harvests ---------- */
  harvestForm(h0, bedId, plantingId){
    const beds = DB.all("beds");
    const plantings = DB.where("plantings", p => p.status !== "removed");
    let h = '<div class="grid2">' +
      '<div><label class="f">Date</label><input type="date" id="hv-date" value="' + esc(h0 ? h0.date : iso(today())) + '"></div>' +
      '<div><label class="f">Bed</label><select id="hv-bed"><option value="">Garden</option>' +
        beds.map(b => '<option value="' + b.id + '"' + ((h0 && h0.bed_id === b.id) || bedId === b.id ? " selected" : "") + '>' + esc(b.name) + '</option>').join("") + '</select></div></div>';
    h += '<div class="field"><label class="f">Plant</label><select id="hv-plant" onchange="Journal.hvSync()"><option value="">— pick from your beds —</option>' +
      plantings.map(p => { const b = DB.find("beds", p.bed_id);
        return '<option value="' + p.id + '" data-crop="' + esc(p.crop_id) + '"' + ((h0 && h0.planting_id === p.id) || plantingId === p.id ? " selected" : "") + '>' +
          esc(cropName(p.crop_id)) + ' · ' + esc(b ? b.name : "?") + '</option>'; }).join("") + '</select></div>';
    h += '<div class="field"><label class="f">Crop</label><select id="hv-crop">' +
      '<option value="">— choose —</option>' + CROPS.map(c => '<option value="' + c.id + '"' + (h0 && h0.crop_id === c.id ? " selected" : "") + '>' + esc(c.n) + '</option>').join("") + '</select></div>';
    h += '<div class="grid2" style="margin-top:12px">' +
      '<div><label class="f">Weight</label><input type="number" step="0.01" id="hv-w" value="' + esc(h0 ? h0.weight : "") + '" placeholder="1.5"></div>' +
      '<div><label class="f">Unit</label><select id="hv-unit">' + ["lbs","oz","kg","g","count"].map(u =>
        '<option' + (h0 && h0.unit === u ? " selected" : "") + '>' + u + '</option>').join("") + '</select></div></div>';
    h += '<div class="grid2" style="margin-top:12px">' +
      '<div><label class="f">Count (optional)</label><input type="number" id="hv-count" value="' + esc(h0 ? h0.count : "") + '" placeholder="12"></div>' +
      '<div><label class="f">Value ($)</label><input type="number" step="0.01" id="hv-val" value="' + esc(h0 ? h0.value : "") + '" placeholder="market price"></div></div>';
    h += '<div class="field"><label class="f">Notes</label><textarea id="hv-notes" placeholder="Flavour, size, what you would change">' + esc(h0 ? h0.notes || "" : "") + '</textarea></div>';
    h += '<div class="note i" style="margin-top:12px">Filling in value turns the recap into a real cost-per-pound picture. Use whatever your local shop charges.</div>';
    h += '<button class="btn block" style="margin-top:14px" onclick="Journal.saveHarvest(' + (h0 ? "'" + h0.id + "'" : "null") + ')">Save harvest</button>';
    openSheet(h0 ? "Edit harvest" : "Log a harvest", h);
    setTimeout(Journal.hvSync, 50);
  },
  hvSync(){
    const sel = $("#hv-plant"); if(!sel || !sel.value) return;
    const opt = sel.options[sel.selectedIndex];
    const cid = opt.getAttribute("data-crop");
    if(cid && $("#hv-crop")) $("#hv-crop").value = cid;
    const p = DB.find("plantings", sel.value);
    if(p && p.bed_id && $("#hv-bed")) $("#hv-bed").value = p.bed_id;
  },
  saveHarvest(id){
    const rec = {
      date: $("#hv-date").value, bed_id: $("#hv-bed").value || null, planting_id: $("#hv-plant").value || null,
      crop_id: $("#hv-crop").value || null, weight: num($("#hv-w").value), unit: $("#hv-unit").value,
      count: num($("#hv-count").value), value: num($("#hv-val").value), notes: $("#hv-notes").value.trim()
    };
    if(!rec.crop_id) return toast("Pick a crop");
    if(id) DB.update("harvests", id, rec); else DB.insert("harvests", rec);
    if(rec.planting_id) DB.update("plantings", rec.planting_id, { status:"harvesting" });
    closeSheet(); Journal.render(); refresh(); toast("Harvest logged 🧺");
  },
  openHarvest(id){
    const x = DB.find("harvests", id); if(!x) return;
    openSheet("Harvest",
      '<div class="row" style="gap:12px"><div style="font-size:2.2rem">' + cropEmoji(x.crop_id) + '</div>' +
      '<div class="grow"><div class="b">' + esc(cropName(x.crop_id)) + '</div>' +
      '<div class="tiny muted">' + fmtY(x.date) + ' · ' + esc(Journal.bedName(x.bed_id)) + '</div></div></div>' +
      '<table class="mini" style="margin-top:14px">' +
        '<tr><th>Weight</th><td>' + esc(x.weight) + ' ' + esc(x.unit) + '</td></tr>' +
        (x.count ? '<tr><th>Count</th><td>' + esc(x.count) + '</td></tr>' : '') +
        (x.value ? '<tr><th>Value</th><td>$' + esc(x.value) + '</td></tr>' : '') +
      '</table>' + (x.notes ? '<div class="note i" style="margin-top:12px">' + esc(x.notes) + '</div>' : '') +
      '<div class="row" style="gap:8px;margin-top:16px">' +
      '<button class="btn ghost grow" onclick="closeSheet();setTimeout(function(){Journal.harvestForm(DB.find(\'harvests\',\'' + id + '\'))},250)">Edit</button>' +
      '<button class="btn danger grow" onclick="DB.remove(\'harvests\',\'' + id + '\');closeSheet();Journal.render()">Delete</button></div>');
  }
};

/* ============================================================
   SEASON RECAP
   ============================================================ */
const Recap = {
  year: null,

  render(){
    const box = $("#s-recap");
    const years = {};
    DB.all("harvests").forEach(x => { if(x.date) years[x.date.slice(0,4)] = 1; });
    DB.all("journal").forEach(x => { if(x.date) years[x.date.slice(0,4)] = 1; });
    years[String(today().getFullYear())] = 1;
    const ys = Object.keys(years).sort().reverse();
    if(!Recap.year || ys.indexOf(Recap.year) < 0) Recap.year = ys[0];
    const Y = Recap.year;

    const hv = DB.all("harvests").filter(x => (x.date||"").slice(0,4) === Y);
    const jl = DB.all("journal").filter(x => (x.date||"").slice(0,4) === Y);
    const sd = DB.all("seeds").filter(s => (s.created||"").slice(0,4) === Y);
    const dx = DB.all("diagnoses").filter(x => (x.date||"").slice(0,4) === Y);

    const lbs = hv.reduce((a,x) => a + Journal.lbs(x), 0);
    const value = hv.reduce((a,x) => a + num(x.value), 0);
    const spendJ = jl.reduce((a,x) => a + num(x.cost), 0);
    const spendS = sd.reduce((a,s) => a + num(s.cost), 0);
    const spend = spendJ + spendS;
    const water = jl.filter(j => j.type === "water").reduce((a,j) => a + num(j.amount), 0);
    const mins = jl.reduce((a,j) => a + num(j.minutes), 0);
    const feeds = jl.filter(j => j.type === "feed").length;

    let h = '';
    h += '<div class="scroller">' + ys.map(y => '<button class="chip ' + (y === Y ? "on" : "") + '" onclick="Recap.year=\'' + y + '\';Recap.render()">' + y + '</button>').join("") + '</div>';

    h += '<div class="hero" style="margin-top:12px"><div class="lbl">' + Y + ' season</div>' +
      '<div style="font-size:2.4rem;font-weight:800;line-height:1.1">' + (Math.round(lbs*10)/10) + ' lbs</div>' +
      '<div class="sm" style="opacity:.92">' + hv.length + ' harvests across ' +
      Object.keys(hv.reduce((a,x) => (a[x.crop_id]=1, a), {})).length + ' crops</div>' +
      '<div class="row" style="gap:16px;margin-top:12px;font-size:.82rem;opacity:.95">' +
      '<span>💵 $' + Math.round(value) + ' value</span><span>🧾 $' + Math.round(spend) + ' spent</span>' +
      '<span>' + (value - spend >= 0 ? "📈 +$" : "📉 −$") + Math.abs(Math.round(value - spend)) + '</span></div></div>';

    if(!hv.length && !jl.length){
      h += '<div class="card" style="margin-top:12px"><div class="empty"><span class="e">📊</span><div class="b">Nothing logged for ' + Y + '</div>' +
        '<div class="tiny">Log harvests and inputs through the season and this page writes itself.</div></div></div>';
      box.innerHTML = h; return;
    }

    /* per crop */
    const byCrop = {};
    hv.forEach(x => { const k = x.crop_id || "other";
      byCrop[k] = byCrop[k] || { lbs:0, val:0, n:0 };
      byCrop[k].lbs += Journal.lbs(x); byCrop[k].val += num(x.value); byCrop[k].n++; });
    const cropRows = Object.keys(byCrop).map(k => ({ id:k, ...byCrop[k] })).sort((a,b) => b.lbs - a.lbs);
    const maxL = Math.max.apply(null, cropRows.map(r => r.lbs).concat([1]));

    h += '<div class="sec"><h2>What produced</h2></div><div class="card">';
    cropRows.forEach(r => {
      h += '<div style="margin-bottom:10px"><div class="row between"><div class="sm b">' + cropEmoji(r.id) + ' ' + esc(cropName(r.id)) + '</div>' +
        '<div class="tiny muted">' + (Math.round(r.lbs*10)/10) + ' lbs' + (r.val ? ' · $' + Math.round(r.val) : '') + '</div></div>' +
        '<div class="bar-track" style="margin-top:4px"><div class="bar-fill" style="width:' + Math.round(r.lbs/maxL*100) + '%"></div></div></div>';
    });
    h += '</div>';

    /* per bed productivity */
    const byBed = {};
    hv.forEach(x => { const k = x.bed_id || "none"; byBed[k] = byBed[k] || { lbs:0, val:0 };
      byBed[k].lbs += Journal.lbs(x); byBed[k].val += num(x.value); });
    const bedRows = Object.keys(byBed).filter(k => k !== "none").map(k => {
      const b = DB.find("beds", k);
      const sq = b ? num(b.cols) * num(b.rows) * Math.pow(num(b.cell_in,12)/12, 2) : 0;
      return { name: b ? b.name : "—", lbs: byBed[k].lbs, sq: sq, per: sq ? byBed[k].lbs / sq : 0 };
    }).sort((a,b) => b.per - a.per);
    if(bedRows.length){
      h += '<div class="sec"><h2>Bed productivity</h2></div><div class="card"><table class="mini">' +
        '<tr><th>Bed</th><th>Yield</th><th>Sq ft</th><th>lbs/sq ft</th></tr>' +
        bedRows.map(r => '<tr><td class="b">' + esc(r.name) + '</td><td>' + (Math.round(r.lbs*10)/10) + '</td><td>' +
          Math.round(r.sq) + '</td><td class="b">' + (Math.round(r.per*100)/100) + '</td></tr>').join("") +
        '</table><div class="tiny muted" style="margin-top:8px">A well-run intensive bed runs about 0.5–1.5 lbs per square foot per season. Use this to decide what to expand.</div></div>';
    }

    /* resources */
    h += '<div class="sec"><h2>Resources used</h2></div><div class="card"><div class="grid2">' +
      '<div class="stat"><span class="n">' + (Math.round(water*10)/10) + '"</span><span class="l">water logged</span></div>' +
      '<div class="stat"><span class="n">' + feeds + '</span><span class="l">feedings</span></div>' +
      '<div class="stat"><span class="n">' + Math.round(mins/60*10)/10 + 'h</span><span class="l">time logged</span></div>' +
      '<div class="stat"><span class="n">' + dx.length + '</span><span class="l">problems diagnosed</span></div>' +
      '</div>';
    if(lbs > 0){
      h += '<table class="mini" style="margin-top:12px">' +
        '<tr><th>Cost per pound</th><td class="b">$' + (Math.round(spend/lbs*100)/100) + '</td></tr>' +
        '<tr><th>Value per pound</th><td>$' + (value ? Math.round(value/lbs*100)/100 : "—") + '</td></tr>' +
        (mins ? '<tr><th>Pounds per hour</th><td>' + (Math.round(lbs/(mins/60)*10)/10) + '</td></tr>' : '') +
        '</table>';
    }
    h += '</div>';

    /* spend breakdown */
    const bySpend = {};
    jl.forEach(j => { if(num(j.cost)) bySpend[j.type] = (bySpend[j.type] || 0) + num(j.cost); });
    if(spendS) bySpend.seeds = spendS;
    if(Object.keys(bySpend).length){
      h += '<div class="sec"><h2>Where the money went</h2></div><div class="card"><table class="mini">' +
        Object.keys(bySpend).sort((a,b) => bySpend[b] - bySpend[a]).map(k =>
          '<tr><td>' + ((JTYPE[k] ? JTYPE[k].i + " " + JTYPE[k].n : "🌰 Seeds")) + '</td><td class="b">$' + (Math.round(bySpend[k]*100)/100) + '</td></tr>').join("") +
        '</table></div>';
    }

    /* problems */
    if(dx.length){
      const byDx = {}; dx.forEach(d => byDx[d.result] = (byDx[d.result] || 0) + 1);
      h += '<div class="sec"><h2>Problems this season</h2></div><div class="card"><div class="row wrap" style="gap:6px">' +
        Object.keys(byDx).sort((a,b) => byDx[b] - byDx[a]).map(k => '<span class="chip warn">' + esc(k) + ' ×' + byDx[k] + '</span>').join("") +
        '</div><div class="tiny muted" style="margin-top:8px">Repeat problems are usually a siting or rotation issue, not bad luck. Change the variable before next season.</div></div>';
    }

    /* what the garden has taught the app */
    const mat = Maturity.summary();
    if(mat.length){
      h += '<div class="sec"><h2>Your days to maturity</h2></div><div class="card"><table class="mini">' +
        '<tr><th>Crop</th><th>Yours</th><th>Published</th><th>Difference</th></tr>' +
        mat.map(m => '<tr><td class="b">' + cropEmoji(m.crop_id) + ' ' + esc(cropName(m.crop_id)) +
          (m.variety ? '<div class="tiny muted" style="font-weight:400">' + esc(m.variety) + '</div>' : '') + '</td>' +
          '<td>' + m.avg + 'd<div class="tiny muted">' + m.n + ' record' + (m.n === 1 ? "" : "s") + '</div></td>' +
          '<td>' + (m.pub || "—") + '</td>' +
          '<td class="b" style="color:' + (m.delta === null ? "inherit" : m.delta > 0 ? "var(--warn)" : "var(--green-600)") + '">' +
          (m.delta === null ? "—" : (m.delta > 0 ? "+" : "") + m.delta + "d") + '</td></tr>').join("") +
        '</table><div class="tiny muted" style="margin-top:8px">Positive means your garden runs slower than the catalogue. Once a crop has three records the app plans with your figure instead.</div></div>';
    }

    /* takeaways */
    h += '<div class="sec"><h2>Notes for next year</h2></div><div class="card">';
    const notes = [];
    if(cropRows.length) notes.push("🏆 <b>" + esc(cropName(cropRows[0].id)) + "</b> was your biggest producer at " + (Math.round(cropRows[0].lbs*10)/10) + " lbs. Give it at least as much space.");
    const dud = cropRows.filter(r => r.lbs < 0.3);
    if(dud.length) notes.push("🤔 " + dud.map(r => esc(cropName(r.id))).join(", ") + " barely produced. Either the spot is wrong or the variety is — worth changing one thing, not both.");
    if(bedRows.length > 1) notes.push("📐 <b>" + esc(bedRows[0].name) + "</b> was your most productive ground at " + (Math.round(bedRows[0].per*100)/100) + " lbs/sq ft.");
    if(lbs && spend) notes.push("💵 You grew food at $" + (Math.round(spend/lbs*100)/100) + " per pound" + (value > spend ? " and came out ahead by $" + Math.round(value - spend) + "." : "."));
    if(!water) notes.push("💧 No watering logged — start logging it and next year's recap can tell you gallons per pound.");
    if(dx.length) notes.push("🔬 " + dx.length + " problem" + (dx.length > 1 ? "s" : "") + " diagnosed. Check the rotation history on those beds before replanting the same family.");
    notes.forEach(n => h += '<div class="note g" style="margin-bottom:8px">' + n + '</div>');
    h += '</div>';

    h += '<div class="grid2" style="margin-top:14px">' +
      '<button class="btn ghost" onclick="Recap.csv()">⬇︎ Export CSV</button>' +
      '<button class="btn ghost" onclick="window.print()">🖨️ Print recap</button></div>';

    box.innerHTML = h;
  },

  csv(){
    const Y = Recap.year;
    const rows = [["type","date","crop","bed","amount","unit","value","cost","notes"]];
    DB.all("harvests").filter(x => (x.date||"").slice(0,4) === Y).forEach(x =>
      rows.push(["harvest", x.date, cropName(x.crop_id), Journal.bedName(x.bed_id), x.weight, x.unit, x.value || "", "", (x.notes||"").replace(/[\r\n]+/g," ")]));
    DB.all("journal").filter(x => (x.date||"").slice(0,4) === Y).forEach(j =>
      rows.push([j.type, j.date, "", Journal.bedName(j.bed_id), j.amount || "", j.unit || "", "", j.cost || "", (j.notes||"").replace(/[\r\n]+/g," ")]));
    const csv = rows.map(r => r.map(v => '"' + String(v === null || v === undefined ? "" : v).replace(/"/g,'""') + '"').join(",")).join("\n");
    download("pocket-fertilizer-" + Y + ".csv", new Blob([csv], { type:"text/csv" }));
  }
};

function download(name, blob){
  const u = URL.createObjectURL(blob);
  const a = document.createElement("a"); a.href = u; a.download = name;
  document.body.appendChild(a); a.click(); a.remove();
  setTimeout(() => { if(URL.revokeObjectURL) URL.revokeObjectURL(u); }, 4000);
}

<script>
/* ============================================================
   DAYS TO MATURITY — ranges, and this garden's own averages

   Published days-to-maturity is a single number pretending to be
   precise. It shifts with heat, light, soil and season, and the
   same variety can swing weeks between gardens. So the app shows
   a RANGE, and every time a real first harvest is recorded it
   learns: after one picking it reports what actually happened,
   and after a few it uses her own average for projections
   instead of the catalogue figure.
   ============================================================ */
const Maturity = {
  /* published range — honest about the spread rather than a false point */
  cropRange(cropId){
    const c = crop(cropId); if(!c) return null;
    return { lo: Math.max(15, Math.round(c.dtm * 0.85)), hi: Math.round(c.dtm * 1.15), mid: c.dtm };
  },
  varietyRange(cropId, variety){
    if(!variety) return null;
    const v = Varieties.find(cropId, variety);
    if(!v || !num(v.dtm)) return null;
    const d = num(v.dtm);
    return { lo: Math.max(15, d - 7), hi: d + 10, mid: d };
  },

  /* ---- her own records ---- */
  mine(cropId, variety){
    let rows = DB.where("maturity", m => m.crop_id === cropId);
    if(variety){
      const exact = rows.filter(m => (m.variety || "").toLowerCase() === String(variety).toLowerCase());
      if(exact.length) rows = exact;
    }
    if(!rows.length) return null;
    const days = rows.map(m => num(m.days)).filter(d => d > 0);
    if(!days.length) return null;
    const avg = days.reduce((a, b) => a + b, 0) / days.length;
    return {
      n: days.length, avg: Math.round(avg),
      lo: Math.min.apply(null, days), hi: Math.max.apply(null, days),
      varietySpecific: !!variety && rows.every(m => (m.variety || "").toLowerCase() === String(variety).toLowerCase()),
      last: rows.sort((a, b) => (b.harvested_on || "").localeCompare(a.harvested_on || ""))[0]
    };
  },

  /* what the app should actually use for projections */
  expected(cropId, variety){
    const mine = Maturity.mine(cropId, variety);
    if(mine && mine.n >= 1){
      /* one record is a data point, three is a pattern — weight accordingly */
      const pub = Maturity.varietyRange(cropId, variety) || Maturity.cropRange(cropId);
      const w = Math.min(mine.n, 3) / 3;
      const blended = pub ? Math.round(mine.avg * w + pub.mid * (1 - w)) : mine.avg;
      return {
        days: mine.n >= 3 ? mine.avg : blended,
        lo: Math.min(mine.lo, pub ? pub.lo : mine.lo),
        hi: Math.max(mine.hi, pub ? pub.hi : mine.hi),
        source: mine.n >= 3 ? "yours" : "blend", n: mine.n, mine: mine, pub: pub
      };
    }
    const v = Maturity.varietyRange(cropId, variety);
    if(v) return { days: v.mid, lo: v.lo, hi: v.hi, source:"variety", n: 0, pub: v };
    const c = Maturity.cropRange(cropId);
    if(!c) return null;
    return { days: c.mid, lo: c.lo, hi: c.hi, source:"crop", n: 0, pub: c };
  },

  label(cropId, variety){
    const e = Maturity.expected(cropId, variety);
    if(!e) return "—";
    const tag = { yours:"your average", blend:"your results + catalogue", variety:"this variety", crop:"typical for the crop" }[e.source];
    return e.lo + "–" + e.hi + " days (" + tag + ")";
  },

  /* ---- recording a real first harvest ---- */
  record(plantingId, harvestedOn, note){
    const p = DB.find("plantings", plantingId); if(!p) return null;
    const sown = p.sown_on; if(!sown) return null;
    const hd = harvestedOn || iso(today());
    const days = diffDays(parseISO(sown), parseISO(hd));
    if(!(days > 0)) return null;
    const ex = DB.where("maturity", m => m.planting_id === plantingId)[0];
    const row = { crop_id: p.crop_id, variety: p.variety || null, days: days,
                  sown_on: sown, harvested_on: hd, planting_id: plantingId,
                  bed_id: p.bed_id, note: note || null };
    const saved = ex ? DB.update("maturity", ex.id, row) : DB.insert("maturity", row);
    DB.update("plantings", plantingId, { harvest_from: hd });
    return saved;
  },

  /* called whenever a harvest is logged, so it learns without being asked */
  noteHarvest(plantingId, dateISO){
    const p = DB.find("plantings", plantingId); if(!p || !p.sown_on) return null;
    if(DB.where("maturity", m => m.planting_id === plantingId).length) return null;
    const rec = Maturity.record(plantingId, dateISO);
    if(rec){
      const e = Maturity.expected(p.crop_id, p.variety);
      const pub = e && e.pub ? e.pub.mid : null;
      const diff = pub ? num(rec.days) - pub : 0;
      toast("📈 " + cropName(p.crop_id) + " took " + rec.days + " days" +
        (pub ? (Math.abs(diff) >= 5 ? " — " + Math.abs(diff) + " " + (diff > 0 ? "longer" : "faster") + " than the book" : " — right on schedule") : ""));
    }
    return rec;
  },

  /* everything she has learned, for the recap and library */
  summary(){
    const by = {};
    DB.all("maturity").forEach(m => {
      const k = m.crop_id + "|" + (m.variety || "");
      (by[k] = by[k] || { crop_id: m.crop_id, variety: m.variety, days: [] }).days.push(num(m.days));
    });
    return Object.keys(by).map(k => {
      const r = by[k], avg = r.days.reduce((a, b) => a + b, 0) / r.days.length;
      const pub = (Maturity.varietyRange(r.crop_id, r.variety) || Maturity.cropRange(r.crop_id));
      return { crop_id: r.crop_id, variety: r.variety, n: r.days.length,
               avg: Math.round(avg), lo: Math.min.apply(null, r.days), hi: Math.max.apply(null, r.days),
               pub: pub ? pub.mid : null, delta: pub ? Math.round(avg - pub.mid) : null };
    }).sort((a, b) => b.n - a.n);
  },

  /* the sheet for logging or correcting a first harvest */
  sheet(plantingId){
    const p = DB.find("plantings", plantingId); if(!p) return;
    const ex = DB.where("maturity", m => m.planting_id === plantingId)[0];
    const e = Maturity.expected(p.crop_id, p.variety);
    openSheet("First harvest",
      '<p class="muted sm" style="margin-top:0">Recording when this actually gave you its first pick teaches the app how ' +
      esc(cropName(p.crop_id)) + ' behaves in <b>your</b> garden. After a few records it uses your own timing instead of the catalogue figure.</p>' +
      (p.sown_on ? '<div class="note i">Sown <b>' + fmtY(p.sown_on) + '</b>' +
        (e ? ' · expected ' + e.lo + '–' + e.hi + ' days' : '') + '</div>'
        : '<div class="note w">This planting has no sowing date, so days to maturity cannot be worked out. Add one first.</div>') +
      '<div class="field" style="margin-top:12px"><label class="f">First harvest date</label>' +
        '<input type="date" id="mt-date" value="' + esc(ex ? ex.harvested_on : iso(today())) + '"></div>' +
      '<div class="field"><label class="f">Note (optional)</label>' +
        '<input type="text" id="mt-note" value="' + esc(ex ? ex.note || "" : "") + '" placeholder="Cool spring, slow start"></div>' +
      '<div id="mt-calc" class="tiny muted" style="margin-top:8px"></div>' +
      (p.sown_on ? '<button class="btn block" style="margin-top:14px" onclick="Maturity.save(\'' + plantingId + '\')">Save first harvest</button>' : '') +
      (ex ? '<button class="btn ghost block danger" style="margin-top:8px" onclick="DB.remove(\'maturity\',\'' + ex.id + '\');closeSheet();Garden.render();toast(\'Record removed\')">Remove this record</button>' : ''));
    const upd = () => {
      const d = $("#mt-date").value;
      if(!p.sown_on || !d) return;
      const n = diffDays(parseISO(p.sown_on), parseISO(d));
      $("#mt-calc").innerHTML = n > 0
        ? '<b>' + n + ' days</b> from sowing to first harvest.' +
          (e && e.pub ? ' The catalogue figure is ' + e.pub.mid + '.' : '')
        : 'That date is before the sowing date.';
    };
    if($("#mt-date")){ $("#mt-date").oninput = upd; upd(); }
  },
  save(plantingId){
    const d = $("#mt-date").value, note = $("#mt-note").value.trim();
    const rec = Maturity.record(plantingId, d, note);
    if(!rec) return toast("Check the dates");
    const p = DB.find("plantings", plantingId);
    const mine = Maturity.mine(p.crop_id, p.variety);
    closeSheet(); Garden.render();
    toast(mine && mine.n > 1
      ? "Saved · your average is now " + mine.avg + " days over " + mine.n + " plantings"
      : "Saved · " + rec.days + " days");
  }
};

/* projections use her own timing once she has any */
Season.harvestFrom = function(cropId, startISO, kind, variety){
  const c = crop(cropId); if(!c || !startISO) return null;
  let d = parseISO(startISO); if(!d) return null;
  if(c.from === "transplant" && (kind === "indoor" || kind === "seed")){
    const s = c.start || {};
    const wk = (s.tp !== undefined && s.indoor !== undefined && s.tp !== null && s.indoor !== null) ? (s.tp - s.indoor) : 5;
    d = addDays(d, Math.round(wk * 7));
  }
  const e = Maturity.expected(cropId, variety);
  return addDays(d, e ? e.days : c.dtm);
};

/* logging a harvest against a planting teaches the app automatically */
(function hookHarvest(){
  const orig = Journal.saveHarvest;
  Journal.saveHarvest = function(id){
    const pid = $("#hv-plant") ? $("#hv-plant").value : "";
    const date = $("#hv-date") ? $("#hv-date").value : iso(today());
    orig.call(Journal, id);
    if(pid && !id) setTimeout(() => Maturity.noteHarvest(pid, date), 400);
  };
})();
</script>
<script>

  render(opts){

      if(fits && !fits.fits) h += '<div class="note w">⏳ Only ' + fits.left + ' days remain before your first frost and this needs ' + fits.needs + '. A planting started today probably will not finish outdoors.</div>';

    h += '<div class="sec"><h2>Check these numbers</h2></div><div class="card">';

        (c.vnote ? '<br><br>' + esc(c.vnote) : '') + '</div>'

    h += '<div class="list" style="margin-top:10px">' +

      '<button class="btn ghost grow" onclick="closeSheet();setTimeout(function(){Seeds.add({crop_id:\'' + id + '\',name:\'' + esc(c.n) + '\'})},250)">＋ Add seed</button>' +
      '<button class="btn grow" onclick="closeSheet();setTimeout(function(){Library.plantIt(\'' + id + '\')},250)">🪴 Plant it</button></div>';

  plantIt(id){

const SqlView = {
  render(){
    const box = $("#s-sql");
    const samples = [
      ["Seed packets by age", "SELECT name, variety, brand, packed_year,\n  (" + today().getFullYear() + " - CAST(packed_year AS INT)) AS age_years\nFROM seeds ORDER BY age_years DESC;"],
      ["Harvest totals by crop", "SELECT crop_id, ROUND(SUM(CAST(weight AS REAL)),2) AS lbs,\n  ROUND(SUM(CAST(value AS REAL)),2) AS value, COUNT(*) AS pickings\nFROM harvests GROUP BY crop_id ORDER BY lbs DESC;"],
      ["What is planted where", "SELECT b.name AS bed, p.crop_id, p.variety, p.qty, p.sown_on\nFROM plantings p JOIN beds b ON b.id = p.bed_id\nWHERE p.status != 'removed' ORDER BY b.name;"],
      ["Spend by category", "SELECT type, ROUND(SUM(CAST(cost AS REAL)),2) AS spent\nFROM journal WHERE cost IS NOT NULL GROUP BY type ORDER BY spent DESC;"],
      ["Diagnoses this year", "SELECT date, crop_id, result, confidence FROM diagnoses ORDER BY date DESC;"]
    ];
    let h = '';
    if(DB.engine !== "sqlite"){
      h += '<div class="note w">The SQLite engine loads from a CDN on first run and is not available right now (offline, or blocked). Your data is safe and fully readable — the app keeps its own encrypted copy — but queries need the engine. Reconnect and reopen the app.</div>';
    } else {
      h += '<div class="note g">Live SQLite database, rebuilt from your encrypted vault at launch. Reads and writes both work; changes made here are saved back.</div>';
    }
    h += '<div class="card" style="margin-top:12px"><label class="f">Query</label>' +
      '<textarea id="sq-q" style="font-family:ui-monospace,monospace;min-height:110px" spellcheck="false">SELECT name, variety, packed_year FROM seeds ORDER BY name;</textarea>' +
      '<button class="btn block" style="margin-top:10px" onclick="SqlView.run()">▶ Run query</button></div>';
    h += '<div class="sec"><h2>Examples</h2></div><div class="scroller">' +
      samples.map((s, i) => '<button class="chip" onclick="SqlView.sample(' + i + ')">' + esc(s[0]) + '</button>').join("") + '</div>';
    h += '<div id="sq-out" style="margin-top:12px"></div>';
    h += '<div class="sec"><h2>Schema</h2></div><div class="card"><table class="mini">' +
      Object.keys(SCHEMA).map(t => '<tr><td class="b">' + t + '</td><td class="tiny muted">' + SCHEMA[t].join(", ") + '</td></tr>').join("") +
      '</table></div>';
    box.innerHTML = h;
    SqlView._samples = samples;
  },
  sample(i){ $("#sq-q").value = SqlView._samples[i][1]; SqlView.run(); },
  run(){
    const q = $("#sq-q").value.trim(); const out = $("#sq-out");
    if(!q) return;
    try{
      const res = DB.query(q);
      DB.save();
      if(!res.length){ out.innerHTML = '<div class="note g">Statement ran. No rows returned.</div>'; return; }
      let h = "";
      res.forEach(r => {
        h += '<div class="card pad0" style="margin-bottom:12px;overflow:auto"><table class="mini" style="min-width:100%">' +
          '<tr>' + r.cols.map(c => '<th>' + esc(c) + '</th>').join("") + '</tr>' +
          r.rows.slice(0, 200).map(row => '<tr>' + row.map(v => '<td>' + esc(v === null ? "—" : v) + '</td>').join("") + '</tr>').join("") +
          '</table></div>';
        if(r.rows.length > 200) h += '<div class="tiny muted">Showing first 200 of ' + r.rows.length + ' rows.</div>';
      });
      out.innerHTML = h;
    }catch(e){
      out.innerHTML = '<div class="note d"><b>Query error.</b><br>' + esc(e.message || String(e)) + '</div>';
    }
  }
};

<script>
/* ============================================================
   WEATHER — daily & weekly detail + shareable PNG snapshots
   ============================================================ */
const Weather = {
  mode: "week", _failed: false, _loading: false,

  risks(){
    const w = APP.weather; if(!w || !w.daily) return [];
    const d = w.daily, out = [];
    let frost = null, hot = null, rain7 = 0, rainPast = 0, dry = 0;
    d.time.forEach((t, i) => {
      const dd = diffDays(today(), parseISO(t));
      const lo = num(d.temperature_2m_min[i], 99), hi = num(d.temperature_2m_max[i], 0), pr = num(d.precipitation_sum[i]);
      if(dd >= 0 && dd <= 6){
        if(lo <= 36 && !frost) frost = { d: t, t: lo };
        if(hi >= 90 && !hot) hot = { d: t, t: hi };
        rain7 += pr;
        if(pr < 0.02) dry++;
      }
      if(dd < 0 && dd >= -7) rainPast += pr;
    });
    if(frost) out.push({ k:"d", i:"🥶", t: Math.round(frost.t) + "°F on " + fmt(frost.d),
      m:"Cover tender crops — tomato, pepper, basil, squash, beans — or bring containers in. Water the soil beforehand; moist soil holds heat overnight." });
    if(hot) out.push({ k:"w", i:"🥵", t: Math.round(hot.t) + "°F on " + fmt(hot.d),
      m:"Tomato and pepper pollen goes sterile above about 90°F, so expect blossom drop. Shade cloth over the hottest hours, water deeply in the morning, and do not let anything wilt." });
    if(rain7 >= 0.5) out.push({ k:"i", i:"🌧️", t: (Math.round(rain7*100)/100) + '" of rain coming',
      m:"Hold off watering established beds. Wet foliage spreads blight and mildew — stay out of the beds while leaves are wet." });
    if(rain7 < 0.1 && dry >= 6) out.push({ k:"w", i:"🏜️", t:"Dry week ahead",
      m:"No meaningful rain forecast. Water deeply and less often rather than a little every day, and mulch to cut losses roughly in half." });
    if(rainPast > 0.25) out.push({ k:"g", i:"💧", t: (Math.round(rainPast*100)/100) + '" fell in the last week',
      m:"Already banked — subtract this from what your beds need." });
    return out;
  },

  render(){
    const box = $("#s-weather");
    const w = APP.weather;
    if(!DB.get("lat")){
      box.innerHTML = '<div class="card"><div class="note i">Set your location to see local weather.</div>' +
        '<button class="btn block" style="margin-top:10px" onclick="Onboard.open()">Set location</button></div>';
      return;
    }
    if(!w || !w.daily){
      /* fetch at most once per visit — never loop when the network is down */
      if(Weather._failed){
        box.innerHTML = '<div class="card"><div class="note w">Could not reach the weather service. ' +
          'Everything else in the app works offline — planting dates, seed bank, the plant doctor and your records are all on-device.</div>' +
          '<button class="btn block" style="margin-top:10px" onclick="Weather._failed=false;Weather.render()">Try again</button></div>';
        return;
      }
      box.innerHTML = '<div class="card center"><span class="spinner"></span> <span class="muted sm">Fetching weather…</span></div>';
      if(!Weather._loading){
        Weather._loading = true;
        getWeather(true).then(got => {
          Weather._loading = false;
          Weather._failed = !(got && got.daily);
          if(APP.tab === "weather") Weather.render();
        });
      }
      return;
    }
    const c = w.current || {}, d = w.daily;
    const todayIdx = d.time.indexOf(iso(today()));
    let h = '';

    h += '<div class="hero"><div class="row between">' +
      '<div><div class="lbl">' + esc(DB.get("locLabel") || "") + '</div>' +
      '<div style="font-size:2.6rem;font-weight:800;line-height:1">' + Math.round(num(c.temperature_2m)) + '°F</div>' +
      '<div class="sm" style="opacity:.94">' + esc(Live.wx(c.weather_code)[0]) + '</div></div>' +
      '<div style="font-size:3.2rem">' + Live.wx(c.weather_code)[1] + '</div></div>';
    if(todayIdx >= 0) h += '<div class="row" style="gap:14px;margin-top:10px;font-size:.8rem;opacity:.95">' +
      '<span>↑ ' + Math.round(num(d.temperature_2m_max[todayIdx])) + '°</span>' +
      '<span>↓ ' + Math.round(num(d.temperature_2m_min[todayIdx])) + '°</span>' +
      '<span>💧 ' + Math.round(num(c.relative_humidity_2m)) + '%</span>' +
      '<span>🌬️ ' + Math.round(num(c.wind_speed_10m)) + ' mph</span></div>';
    h += '</div>';

    h += '<div class="row" style="gap:8px;margin-top:12px">' +
      '<button class="btn grow" onclick="Weather.snapshot(\'today\')">📸 Snapshot today</button>' +
      '<button class="btn grow" onclick="Weather.snapshot(\'week\')">📸 This week</button></div>' +
      '<div class="tiny muted center" style="margin-top:6px">Saves a shareable image — or opens your share sheet on a phone.</div>';

    const risks = Weather.risks();
    if(risks.length){
      h += '<div class="sec"><h2>What it means for the garden</h2></div>';
      risks.forEach(r => h += '<div class="note ' + r.k + '" style="margin-bottom:8px">' + r.i + ' <b>' + esc(r.t) + '</b><br>' + esc(r.m) + '</div>');
    }

    h += '<div class="sec"><h2>Next 7 days</h2></div><div class="card pad0"><table class="mini" style="width:100%">' +
      '<tr><th>Day</th><th></th><th>High</th><th>Low</th><th>Rain</th></tr>';
    d.time.forEach((t, i) => {
      const dd = diffDays(today(), parseISO(t)); if(dd < 0 || dd > 6) return;
      const lo = num(d.temperature_2m_min[i]), hi = num(d.temperature_2m_max[i]), pr = num(d.precipitation_sum[i]);
      h += '<tr><td class="b">' + (dd === 0 ? "Today" : DOW[parseISO(t).getDay()] + " " + parseISO(t).getDate()) + '</td>' +
        '<td>' + Live.wx(d.weather_code[i])[1] + '</td>' +
        '<td>' + Math.round(hi) + '°' + (hi >= 90 ? ' 🥵' : '') + '</td>' +
        '<td' + (lo <= 36 ? ' style="color:var(--info);font-weight:700"' : '') + '>' + Math.round(lo) + '°' + (lo <= 32 ? ' ❄️' : lo <= 36 ? ' 🥶' : '') + '</td>' +
        '<td>' + (pr > 0.01 ? (Math.round(pr*100)/100) + '"' : '—') + '</td></tr>';
    });
    h += '</table></div>';

    h += '<div class="sec"><h2>Last 7 days</h2></div><div class="card pad0"><table class="mini" style="width:100%">' +
      '<tr><th>Day</th><th></th><th>High</th><th>Low</th><th>Rain</th></tr>';
    d.time.forEach((t, i) => {
      const dd = diffDays(today(), parseISO(t)); if(dd >= 0 || dd < -7) return;
      h += '<tr><td class="b">' + DOW[parseISO(t).getDay()] + " " + parseISO(t).getDate() + '</td>' +
        '<td>' + Live.wx(d.weather_code[i])[1] + '</td><td>' + Math.round(num(d.temperature_2m_max[i])) + '°</td>' +
        '<td>' + Math.round(num(d.temperature_2m_min[i])) + '°</td>' +
        '<td>' + (num(d.precipitation_sum[i]) > 0.01 ? (Math.round(num(d.precipitation_sum[i])*100)/100) + '"' : '—') + '</td></tr>';
    });
    h += '</table></div>';

    const beds = DB.all("beds");
    if(beds.length){
      h += '<div class="sec"><h2>Watering call</h2></div><div class="card pad0"><div class="list">';
      beds.forEach(b => {
        const r = Recommend.water(b.id, w);
        if(!r){ h += '<div class="item"><div class="av">🪴</div><div class="grow"><div class="b">' + esc(b.name) + '</div>' +
          '<div class="tiny muted">Nothing planted</div></div></div>'; return; }
        const label = r.verdict === "skip" ? "Skip — rain covers it" : r.verdict === "light" ? 'Light top-up, ~' + r.deficit + '"' : 'Water ' + r.deficit + '" this week';
        h += '<button class="item" onclick="Journal.quick(\'water\',\'' + b.id + '\')"><div class="av">' +
          (r.verdict === "skip" ? "✅" : "💧") + '</div><div class="grow"><div class="b">' + esc(b.name) + '</div>' +
          '<div class="tiny muted">' + esc(label) + ' · needs ' + r.need + '"/wk · ' + r.rain + '" rain</div></div><span class="go">›</span></button>';
      });
      h += '</div></div>';
    }

    if(todayIdx >= 0 && d.sunrise) h += '<div class="card" style="margin-top:12px"><div class="grid3">' +
      '<div class="stat"><span class="n">' + String(d.sunrise[todayIdx]).slice(11,16) + '</span><span class="l">sunrise</span></div>' +
      '<div class="stat"><span class="n">' + String(d.sunset[todayIdx]).slice(11,16) + '</span><span class="l">sunset</span></div>' +
      '<div class="stat"><span class="n">' + Math.round(num(d.uv_index_max[todayIdx])) + '</span><span class="l">UV index</span></div>' +
      '</div></div>';

    h += '<div class="tiny muted center" style="margin-top:14px">Live from Open-Meteo · updated ' +
      (APP.wxAt ? new Date(APP.wxAt).toLocaleTimeString([], {hour:"numeric", minute:"2-digit"}) : "—") +
      ' <button class="chip" style="margin-left:6px" onclick="getWeather(true).then(function(){Weather.render()})">↻ Refresh</button></div>';

    box.innerHTML = h;
  },

  /* ---------- canvas snapshot ---------- */
  snapshot(kind){
    const w = APP.weather; if(!w || !w.daily) return toast("No weather loaded");
    const d = w.daily, c = w.current || {};
    const W = 1080, H = kind === "today" ? 1080 : 1350;
    const cv = document.createElement("canvas"); cv.width = W; cv.height = H;
    const x = cv.getContext("2d");

    const g = x.createLinearGradient(0, 0, W, H);
    g.addColorStop(0, "#1f6f4a"); g.addColorStop(0.55, "#37a870"); g.addColorStop(1, "#5cc08a");
    x.fillStyle = g; x.fillRect(0, 0, W, H);
    x.fillStyle = "rgba(255,255,255,.10)"; x.beginPath(); x.arc(W - 60, -40, 300, 0, 7); x.fill();
    x.beginPath(); x.arc(-40, H + 40, 260, 0, 7); x.fill();

    const F = (s, wt) => (wt || "600") + " " + s + "px -apple-system, 'Segoe UI', Roboto, sans-serif";
    x.textBaseline = "alphabetic";

    x.fillStyle = "rgba(255,255,255,.86)"; x.font = F(30, "700");
    x.fillText("🌱 POCKET FERTILIZER", 60, 88);
    x.font = F(28, "500");
    x.fillText(esc0(DB.get("locLabel") || "") + "  ·  Zone " + (DB.get("zone") || "—"), 60, 132);
    x.fillText(fmtY(today()) + "  ·  " + DOW[today().getDay()], 60, 174);

    x.fillStyle = "#fff"; x.font = F(150, "800");
    x.fillText(Math.round(num(c.temperature_2m)) + "°", 60, 330);
    x.font = F(46, "700");
    x.fillText(Live.wx(c.weather_code)[1] + "  " + Live.wx(c.weather_code)[0], 60, 392);

    const ti = d.time.indexOf(iso(today()));
    x.font = F(30, "600"); x.fillStyle = "rgba(255,255,255,.92)";
    if(ti >= 0) x.fillText("High " + Math.round(num(d.temperature_2m_max[ti])) + "°   Low " + Math.round(num(d.temperature_2m_min[ti])) + "°" +
      "   Humidity " + Math.round(num(c.relative_humidity_2m)) + "%   Wind " + Math.round(num(c.wind_speed_10m)) + " mph", 60, 448);

    let y = 520;
    if(kind === "week"){
      x.fillStyle = "rgba(255,255,255,.14)";
      roundRect(x, 44, y, W - 88, 300, 28); x.fill();
      x.fillStyle = "rgba(255,255,255,.86)"; x.font = F(26, "700");
      x.fillText("THE WEEK AHEAD", 76, y + 52);
      const days = [];
      d.time.forEach((t, i) => { const dd = diffDays(today(), parseISO(t)); if(dd >= 0 && dd <= 6) days.push(i); });
      const colW = (W - 152) / Math.max(1, days.length);
      days.forEach((i, n) => {
        const cx = 76 + colW * n + colW / 2, t = parseISO(d.time[i]);
        const lo = num(d.temperature_2m_min[i]), hi = num(d.temperature_2m_max[i]), pr = num(d.precipitation_sum[i]);
        x.textAlign = "center";
        x.fillStyle = "rgba(255,255,255,.85)"; x.font = F(24, "700");
        x.fillText(n === 0 ? "TODAY" : DOW[t.getDay()].toUpperCase(), cx, y + 108);
        x.font = F(40, "600"); x.fillText(Live.wx(d.weather_code[i])[1], cx, y + 158);
        x.fillStyle = "#fff"; x.font = F(32, "800"); x.fillText(Math.round(hi) + "°", cx, y + 208);
        x.fillStyle = lo <= 36 ? "#bfe4ff" : "rgba(255,255,255,.72)"; x.font = F(28, "600");
        x.fillText(Math.round(lo) + "°", cx, y + 248);
        if(pr > 0.01){ x.fillStyle = "#cfe8ff"; x.font = F(22, "600"); x.fillText(Math.round(pr*100)/100 + '"', cx, y + 286); }
        x.textAlign = "left";
      });
      y += 348;
    }

    const risks = Weather.risks().slice(0, kind === "today" ? 2 : 3);
    if(risks.length){
      const cardH = 40 + risks.length * 118;
      x.fillStyle = "rgba(0,0,0,.20)";
      roundRect(x, 44, y, W - 88, cardH, 28); x.fill();
      let ry = y + 74;
      risks.forEach(r => {
        x.fillStyle = "#fff"; x.font = F(30, "800");
        x.fillText(r.i + "  " + esc0(r.t), 76, ry);
        x.fillStyle = "rgba(255,255,255,.85)"; x.font = F(24, "500");
        wrapText(x, esc0(r.m), 76, ry + 40, W - 152, 32, 2);
        ry += 118;
      });
      y += cardH + 24;
    }

    const left = Season.daysLeft();
    x.fillStyle = "rgba(255,255,255,.80)"; x.font = F(26, "600");
    if(left !== null && left > 0) x.fillText("🍂 " + left + " days until first frost (" + fmt(Season.firstFrost()) + ")", 60, Math.min(H - 60, y + 20));
    x.font = F(22, "500"); x.fillStyle = "rgba(255,255,255,.6)";
    x.fillText("Weather data: Open-Meteo", 60, H - 42);

    cv.toBlob(blob => {
      const file = new File([blob], "garden-weather-" + iso(today()) + ".png", { type:"image/png" });
      if(navigator.canShare && navigator.canShare({ files:[file] })){
        navigator.share({ files:[file], title:"Garden weather", text:"Weather for the garden — " + fmtY(today()) })
          .catch(() => download(file.name, blob));
      } else download(file.name, blob);
      toast("Snapshot ready 📸");
    }, "image/png");
  }
};

function roundRect(x, l, t, w, h, r){
  x.beginPath();
  x.moveTo(l + r, t); x.lineTo(l + w - r, t); x.quadraticCurveTo(l + w, t, l + w, t + r);
  x.lineTo(l + w, t + h - r); x.quadraticCurveTo(l + w, t + h, l + w - r, t + h);
  x.lineTo(l + r, t + h); x.quadraticCurveTo(l, t + h, l, t + h - r);
  x.lineTo(l, t + r); x.quadraticCurveTo(l, t, l + r, t); x.closePath();
}
function wrapText(x, text, l, t, maxW, lh, maxLines){
  const words = String(text).split(" "); let line = "", n = 0;
  for(let i = 0; i < words.length; i++){
    const test = line + words[i] + " ";
    if(x.measureText(test).width > maxW && line){
      x.fillText(line.trim(), l, t + n * lh); line = words[i] + " "; n++;
      if(n >= maxLines){ x.fillText(line.trim().slice(0, 60) + "…", l, t + n * lh); return; }
    } else line = test;
  }
  x.fillText(line.trim(), l, t + n * lh);
}
/* strip anything that is not plain text before it hits canvas */
function esc0(s){ return String(s === null || s === undefined ? "" : s).replace(/[\x00-\x1f\x7f]/g, " "); }

<script>
/* ============================================================
   ASSISTANT — Google Gemini, voice or text, wired to real actions
   ============================================================ */
const GEM_URL = "https://generativelanguage.googleapis.com/v1beta/models/";

const AI_TOOLS = [
  { name:"open_screen", description:"Open a screen in the app.",
    parameters:{ type:"OBJECT", properties:{ screen:{ type:"STRING",
      enum:["home","garden","seeds","calendar","doctor","weather","journal","recap","library","settings"] } }, required:["screen"] } },

  { name:"plant_crop", description:"Open a bed with a crop loaded and ready to place, so the gardener can tap squares to position it. Optionally auto-fill a number of empty squares first.",
    parameters:{ type:"OBJECT", properties:{
      bed:{ type:"STRING", description:"Bed or plot name, e.g. 'Plot A' or 'raised bed 1'." },
