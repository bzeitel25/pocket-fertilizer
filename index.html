      '<button class="btn ghost grow" id="vp-add">＋ Add manually</button>' +
      (DB.get("gemKey") ? '<button class="btn grow" id="vp-ai">✨ Look it up</button>' : '') + '</div>';
    if(!DB.get("gemKey")) h += '<div class="tiny muted" style="margin-top:8px">Connect the assistant in Settings and this can search the web for any variety and fill in the details.</div>';
    h += '<div id="vp-out" style="margin-top:12px"></div>';
    openSheet("Choose a variety", h);

    const draw = q => {
      const f = list.filter(v => !q || v.name.toLowerCase().indexOf(q) >= 0);
      let o = '<div class="card pad0"><div class="list">';
      o += '<button class="item" data-v=""><div class="av">—</div><div class="grow"><div class="b">No variety</div>' +
           '<div class="tiny muted">Just the crop</div></div></button>';
      if(!f.length) o += '<div class="empty sm">Nothing matches — add it manually or look it up.</div>';
      f.forEach(v => {
        o += '<button class="item" data-v="' + esc(v.name) + '"><div class="av">' + cropEmoji(cropId) + '</div>' +
          '<div class="grow"><div class="b">' + esc(v.name) + (v.source !== "reference" ? ' <span class="chip good tiny">yours</span>' : '') + '</div>' +
          '<div class="tiny muted">' + (v.dtm ? v.dtm + ' days · ' : '') + esc(v.habit || "") +
          (v.resistance ? ' · ' + esc(v.resistance) : '') + '</div>' +
          (v.notes ? '<div class="tiny muted" style="margin-top:2px">' + esc(v.notes) + '</div>' : '') +
          '</div><span class="go">›</span></button>';
      });
      o += '</div></div>';
      $("#vp-list").innerHTML = o;
      $$("#vp-list .item").forEach(el => el.onclick = () => onPick(el.dataset.v, Varieties.find(cropId, el.dataset.v)));
    };
    $("#vp-q").oninput = e => draw(e.target.value.toLowerCase().trim());
    $("#vp-add").onclick = () => Varieties.form(cropId, $("#vp-q").value.trim(), onPick);
    if($("#vp-ai")) $("#vp-ai").onclick = () => Varieties.lookup(cropId, $("#vp-q").value.trim(), onPick);
    draw("");
  },

  form(cropId, name, onPick, prefill){
    const p = prefill || {};
    openSheet("Add a variety",
      '<div class="field"><label class="f">Variety name</label><input type="text" id="vf-name" value="' + esc(p.name || name || "") + '"></div>' +
      '<div class="grid2" style="margin-top:12px">' +
      '<div><label class="f">Days to maturity</label><input type="number" id="vf-dtm" value="' + esc(p.dtm || "") + '"></div>' +
      '<div><label class="f">Habit / type</label><input type="text" id="vf-habit" value="' + esc(p.habit || "") + '" placeholder="Indeterminate"></div></div>' +
      '<div class="field"><label class="f">Disease resistance</label><input type="text" id="vf-res" value="' + esc(p.resistance || "") + '" placeholder="VFN"></div>' +
      '<div class="field"><label class="f">Notes</label><textarea id="vf-notes">' + esc(p.notes || "") + '</textarea></div>' +
      (p.source ? '<div class="note i" style="margin-top:10px">Filled in from a web search. Check it against your packet before trusting the numbers.</div>' : '') +
      '<a class="chip info" style="margin-top:10px" href="https://www.vegetables.cornell.edu/pest-management/disease-factsheets/disease-resistant-vegetable-varieties/" target="_blank" rel="noopener noreferrer">🔗 What the resistance codes mean (Cornell) ↗</a>' +
      '<button class="btn block" style="margin-top:14px" id="vf-save">Save variety</button>');
    $("#vf-save").onclick = () => {
      const n = $("#vf-name").value.trim();
      if(!n) return toast("Give it a name");
      Varieties.save({ crop_id: cropId, name: n, dtm: num($("#vf-dtm").value) || null,
        habit: $("#vf-habit").value.trim(), resistance: $("#vf-res").value.trim(),
        notes: $("#vf-notes").value.trim(), source: p.source || "manual" });
      toast("Variety saved");
      onPick(n, Varieties.find(cropId, n));
    };
  },

  /* ---------- assistant lookup ---------- */
  async lookup(cropId, name, onPick){
    const key = DB.get("gemKey");
    if(!key) return toast("Variety lookup uses Gemini — connect it in Settings");
    if(!name) return toast("Type the variety name first");
    const out = $("#vp-out");
    out.innerHTML = '<div class="row"><span class="spinner"></span><span class="sm muted">Searching for ' + esc(name) + '…</span></div>';
    try{
      const r = await fetch(GEM_URL + DB.get("gemModel", PROVIDERS.gemini.def) + ":generateContent?key=" + encodeURIComponent(key), {
        method:"POST", headers:{ "content-type":"application/json" },
        body: JSON.stringify({
          contents:[{ role:"user", parts:[{ text:
            "Look up the vegetable variety '" + name + "' of " + cropName(cropId) + ". " +
            "Return ONLY a JSON object with keys: name, dtm (days to maturity as a number), habit (e.g. Indeterminate, Bush, Determinate paste), " +
            "resistance (standard disease-resistance letter codes if the variety is known for them, else empty string), " +
            "notes (two short sentences a home gardener would want: flavour, growth habit, any quirk). " +
            "If you cannot find reliable information, return {\\\"error\\\":\\\"not found\\\"}. Do not invent numbers." }] }],
          tools:[{ google_search:{} }]
        })
      });
      if(!r.ok) throw new Error("HTTP " + r.status);
      const j = await r.json();
      const cand = (j.candidates || [])[0] || {};
      const txt = ((cand.content || {}).parts || []).map(p => p.text || "").join("");
      const m = txt.match(/\{[\s\S]*\}/);
      if(!m) throw new Error("No result");
      const d = JSON.parse(m[0]);
      if(d.error) throw new Error("Nothing reliable found for that name");
      const gm = cand.groundingMetadata || {};
      const srcs = (gm.groundingChunks || []).map(g => (g.web || {}).title).filter(Boolean).slice(0, 3);
      out.innerHTML = '<div class="note g"><b>' + esc(d.name || name) + '</b><br>' +
        (d.dtm ? d.dtm + ' days to maturity · ' : '') + esc(d.habit || "") +
        (d.resistance ? '<br>Resistance: ' + esc(d.resistance) : '') +
        (d.notes ? '<br><br>' + esc(d.notes) : '') +
        (srcs.length ? '<div class="tiny" style="margin-top:6px;opacity:.8">Sources: ' + esc(srcs.join(" · ")) + '</div>' : '') +
        '</div>' +
        '<div class="note w" style="margin-top:8px">From a web search, not a checked reference. Confirm against your seed packet.</div>' +
        '<button class="btn block" style="margin-top:10px" id="vp-use">Review and save</button>';
      $("#vp-use").onclick = () => Varieties.form(cropId, d.name || name, onPick,
        { name: d.name || name, dtm: d.dtm, habit: d.habit, resistance: d.resistance, notes: d.notes, source:"web search" });
    }catch(e){
      out.innerHTML = '<div class="note d">' + esc(e.message || "Lookup failed") + '. You can still add it manually.</div>';
    }
  }
};

/* wire the variety picker into the planting sheet */
Garden.pickVariety = function(plantingId){
  const p = DB.find("plantings", plantingId); if(!p) return;
  Varieties.pick(p.crop_id, (name, v) => {
    DB.update("plantings", plantingId, { variety: name || null, variety_id: v ? v.id : null });
    closeSheet();
    setTimeout(() => { Garden.plantingSheet(DB.find("plantings", plantingId)); Garden.render(); }, 220);
  });
};
</script>
<script>
/* ============================================================
   SEED BANK — inventory, viability, packet photos
   ============================================================ */
const Seeds = {
  q: "", filter: "all",

  viability(s){
    const c = crop(s.crop_id);
    const yrs = c && c.via ? c.via : 3;
    const packed = num(s.packed_year, 0);
    const yr = today().getFullYear();
    if(s.exp_date){
      const d = parseISO(s.exp_date);
      if(d && d < today()) return { level:"expired", age: packed ? yr - packed : null, pct: 20, yrs: yrs,
        msg:"Past the printed date — test before sowing." };
    }
    if(!packed) return { level:"unknown", age:null, pct:null, yrs:yrs, msg:"No packed year — add one to track viability." };
    const age = yr - packed, r = age / yrs;
    const base = num(s.germ_rate, 85);
    const pct = Math.round(clamp(base * Math.pow(0.72, Math.max(0, r * 1.4)), 5, 100));
    if(r < 0.4) return { level:"fresh",   age: age, pct: pct, yrs: yrs, msg:"Fresh — sow with confidence." };
    if(r < 0.85) return { level:"good",    age: age, pct: pct, yrs: yrs, msg:"Still strong. Sow normally." };
    if(r < 1.15) return { level:"fading", age: age, pct: pct, yrs: yrs, msg:"Getting old — sow thicker and use these first." };
    return { level:"expired", age: age, pct: pct, yrs: yrs, msg:"Past typical viability. Run a paper-towel test on 10 seeds before giving up bed space." };
  },
  badge(v){
    const m = { fresh:["good","Fresh"], good:["good","Good"], fading:["warn","Fading"], expired:["bad","Expired"], unknown:["","Unknown"] };
    const x = m[v.level] || m.unknown;
    return '<span class="chip ' + x[0] + ' tiny">' + x[1] + (v.pct !== null ? " · ~" + v.pct + "%" : "") + '</span>';
  },

  render(){
    const box = $("#s-seeds");
    let list = DB.all("seeds").slice();
    const q = Seeds.q.toLowerCase();
    if(q) list = list.filter(s => (s.name + " " + (s.variety||"") + " " + (s.brand||"") + " " + cropName(s.crop_id)).toLowerCase().indexOf(q) >= 0);
    if(Seeds.filter !== "all") list = list.filter(s => {
      const v = Seeds.viability(s);
      if(Seeds.filter === "expired") return v.level === "expired";
      if(Seeds.filter === "fading") return v.level === "fading";
      if(Seeds.filter === "sownow"){ const st = Season.status(s.crop_id); return st && st.inWindow; }
      return true;
    });
    list.sort((a,b) => (a.name || "").localeCompare(b.name || ""));

    const all = DB.all("seeds");
    const counts = { expired: 0, fading: 0, sownow: 0 };
    all.forEach(s => { const v = Seeds.viability(s);
      if(v.level === "expired") counts.expired++; if(v.level === "fading") counts.fading++;
      const st = Season.status(s.crop_id); if(st && st.inWindow) counts.sownow++; });

    let h = '';
    h += '<div class="card"><div class="grid3">' +
      '<div class="stat"><span class="n">' + all.length + '</span><span class="l">packets</span></div>' +
      '<div class="stat"><span class="n">' + counts.sownow + '</span><span class="l">sow now</span></div>' +
      '<div class="stat"><span class="n">' + counts.expired + '</span><span class="l">expired</span></div>' +
      '</div></div>';

    h += '<div class="row" style="gap:8px;margin-top:12px">' +
      '<button class="btn grow" onclick="Seeds.add()">＋ Add packet</button>' +
      '<button class="btn ghost" onclick="Seeds.germTest()">🧪 Germ test</button></div>';

    h += '<input type="search" id="sd-q" placeholder="Search your seed bank…" style="margin-top:12px" value="' + esc(Seeds.q) + '">';
    h += '<div class="scroller" style="margin-top:10px">' +
      ['all','sownow','fading','expired'].map(f => '<button class="chip ' + (Seeds.filter === f ? "on" : "") + '" onclick="Seeds.filter=\'' + f + '\';Seeds.render()">' +
        ({all:"All", sownow:"Sow now", fading:"Fading", expired:"Expired"})[f] + '</button>').join("") + '</div>';

    if(!all.length){
      h += '<div class="card" style="margin-top:12px"><div class="empty"><span class="e">🌰</span><div class="b">Your seed bank is empty</div>' +
        '<div class="tiny">Snap a photo of a packet or type it in. Every packet you add fills in your grow calendar automatically.</div></div>' +
        '<button class="btn block" onclick="Seeds.add()">Add my first packet</button></div>';
    } else if(!list.length){
      h += '<div class="card center muted sm" style="margin-top:12px">Nothing matches that filter.</div>';
    } else {
      h += '<div class="card pad0" style="margin-top:12px"><div class="list">';
      list.forEach(s => {
        const v = Seeds.viability(s);
        const st = Season.status(s.crop_id);
        const ph = Photos.url(s.photo_id);
        h += '<button class="item" onclick="Seeds.open(\'' + s.id + '\')">' +
          '<div class="av">' + (ph ? '<img src="' + ph + '" alt="">' : cropEmoji(s.crop_id)) + '</div>' +
          '<div class="grow"><div class="b truncate">' + esc(s.name) + (s.variety ? ' <span class="muted">· ' + esc(s.variety) + '</span>' : '') + '</div>' +
          '<div class="tiny muted truncate">' + esc(s.brand || "—") + (s.packed_year ? ' · packed ' + esc(s.packed_year) : '') +
            (s.qty ? ' · ' + esc(s.qty) + ' ' + esc(s.unit || "seeds") : '') + '</div>' +
          '<div class="row wrap" style="gap:4px;margin-top:4px">' + Seeds.badge(v) +
            (st && st.inWindow ? '<span class="chip info tiny">' + esc(st.w.label) + ' now</span>' : '') + '</div></div>' +
          '<span class="go">›</span></button>';
      });
      h += '</div></div>';
    }
    box.innerHTML = h;
    const qi = $("#sd-q");
    if(qi) qi.oninput = e => { Seeds.q = e.target.value; Seeds.render(); setTimeout(() => { const n = $("#sd-q"); if(n){ n.focus(); n.setSelectionRange(n.value.length, n.value.length); } }, 0); };
  },

  /* ---------- add / edit ---------- */
  add(prefill){
    Seeds.form(null, prefill);
  },
  open(id){ Seeds.form(DB.find("seeds", id)); },

  form(s, prefill){
    s = s || null;
    Seeds._editId = s ? s.id : null;
    const cur = Object.assign({}, s || {}, prefill || {});
    const yr = today().getFullYear();
    let h = '';

    h += '<div id="sd-photo">' + Seeds.photoBlock(cur.photo_id) + '</div>';
    h += '<div class="row" style="gap:8px;margin:10px 0">' +
      '<button class="btn ghost grow sm" onclick="Seeds.capture(true)">📷 Photograph packet</button>' +
      '<button class="btn ghost grow sm" onclick="Seeds.capture(false)">🖼️ Upload</button></div>';
    if(DB.get("aiKey")) h += '<button class="btn outline block sm" style="margin-bottom:12px" onclick="Seeds.readPacket()">✨ Read the packet with AI</button>';

    h += '<div class="field"><label class="f">Crop</label><div class="row" style="gap:8px">' +
      '<input type="text" id="sd-cropname" readonly value="' + esc(cur.crop_id ? cropName(cur.crop_id) : "") + '" placeholder="Pick a crop">' +
      '<button class="btn ghost sm" onclick="Seeds.pickCrop()">Choose</button></div>' +
      '<input type="hidden" id="sd-crop" value="' + esc(cur.crop_id || "") + '"></div>';
    h += '<div class="field"><label class="f">Packet name</label><input type="text" id="sd-name" value="' + esc(cur.name || "") + '" placeholder="Cherry Tomato"></div>';
    h += '<div class="grid2" style="margin-top:12px">' +
      '<div><label class="f">Variety</label><div class="row" style="gap:6px">' +
        '<input type="text" id="sd-var" value="' + esc(cur.variety || "") + '" placeholder="Sungold">' +
        (cur.crop_id ? '<button class="btn ghost sm" onclick="Seeds.pickVariety()">▾</button>' : '') + '</div></div>' +
      '<div><label class="f">Brand</label><input type="text" id="sd-brand" value="' + esc(cur.brand || "") + '" placeholder="Baker Creek"></div></div>';
    h += '<div class="grid2" style="margin-top:12px">' +
      '<div><label class="f">Quantity</label><input type="number" id="sd-qty" value="' + esc(cur.qty || "") + '" placeholder="50"></div>' +
      '<div><label class="f">Unit</label><select id="sd-unit">' + ["seeds","grams","oz","packets","cloves","slips"].map(u =>
        '<option' + (cur.unit === u ? " selected" : "") + '>' + u + '</option>').join("") + '</select></div></div>';
    h += '<div class="grid2" style="margin-top:12px">' +
      '<div><label class="f">Packed for year</label><input type="number" id="sd-packed" value="' + esc(cur.packed_year || yr) + '" min="1990" max="' + (yr+3) + '"></div>' +
      '<div><label class="f">Printed expiry</label><input type="date" id="sd-exp" value="' + esc(cur.exp_date || "") + '"></div></div>';
    h += '<div class="grid2" style="margin-top:12px">' +
      '<div><label class="f">Germination %</label><input type="number" id="sd-germ" value="' + esc(cur.germ_rate || "") + '" placeholder="85" min="1" max="100"></div>' +
      '<div><label class="f">Cost ($)</label><input type="number" id="sd-cost" step="0.01" value="' + esc(cur.cost || "") + '" placeholder="3.95"></div></div>';
    h += '<div class="field"><label class="f">Source / lot</label><input type="text" id="sd-source" value="' + esc(cur.source || "") + '" placeholder="Where you got it, lot number"></div>';
    h += '<div class="field"><label class="f">Notes</label><textarea id="sd-notes" placeholder="Saved from my own plants, gifted, etc.">' + esc(cur.notes || "") + '</textarea></div>';

    if(s){
      const v = Seeds.viability(s), c = crop(s.crop_id);
      h += '<div class="note ' + (v.level === "expired" ? "d" : v.level === "fading" ? "w" : "g") + '" style="margin-top:14px">' +
        '<b>' + (v.age !== null ? v.age + ' year' + (v.age === 1 ? "" : "s") + ' old' : 'Age unknown') + '.</b> ' + esc(v.msg) +
        (c ? ' ' + esc(c.n) + ' seed typically stays viable about ' + v.yrs + ' years.' : '') + '</div>';
      const ws = Season.windows(s.crop_id);
      if(ws.length){
        h += '<div class="note i" style="margin-top:8px"><b>Your sowing dates</b><br>' +
          ws.map(w => w.icon + ' ' + esc(w.label) + ': <b>' + fmt(w.date) + '</b>').join("<br>") + '</div>';
      }
      if(c) h += '<div class="note g" style="margin-top:8px"><b>Germination.</b> ' + c.depth + '" deep · ' +
        c.germ[0] + '–' + c.germ[1] + ' days · soil ' + c.soilF[0] + '–' + c.soilF[2] + '°F (best at ' + c.soilF[1] + '°F).</div>';
    }

    h += '<div class="row" style="gap:8px;margin-top:16px">' +
      (s ? '<button class="btn ghost" onclick="Seeds.del(\'' + s.id + '\')">Delete</button>' : '') +
      '<button class="btn grow" onclick="Seeds.save()">Save packet</button></div>';
    if(s) h += '<button class="btn ghost block" style="margin-top:8px" onclick="closeSheet();setTimeout(function(){Library.open(\'' + s.crop_id + '\')},250)">Growing guide →</button>';

    openSheet(s ? "Edit packet" : "Add seed packet", h);
    Seeds._photoId = cur.photo_id || null;
  },

  photoBlock(id){
    const u = Photos.url(id);
    return u ? '<img class="photo" src="' + u + '" alt="Seed packet" style="max-height:220px;object-fit:cover">'
             : '<div class="center muted sm" style="padding:22px;background:var(--surface-2);border-radius:var(--radius)">📷 No packet photo yet</div>';
  },

  capture(useCamera){
    const inp = useCamera ? $("#filepick-cam") : $("#filepick");
    inp.value = "";
    inp.onchange = async () => {
      const f = inp.files[0]; if(!f) return;
      try{
        const r = await shrinkImage(f, 900, 0.72);
        if(Seeds._photoId) Photos.drop(Seeds._photoId);
        Seeds._photoId = Photos.put(r.dataUrl, r.w, r.h);
        $("#sd-photo").innerHTML = Seeds.photoBlock(Seeds._photoId);
        toast("Photo attached");
      }catch(e){ toast("Could not read that image"); }
    };
    inp.click();
  },

  pickVariety(){
    const d = Seeds.readForm();
    if(!d.crop_id) return toast("Pick a crop first");
    Seeds._draft = d;
    const editId = Seeds._editId;
    Varieties.pick(d.crop_id, name => {
      closeSheet();
      setTimeout(() => {
        Seeds.form(editId ? DB.find("seeds", editId) : null,
          Object.assign({}, Seeds._draft, { variety: name || "" }));
      }, 220);
    });
  },

  pickCrop(){
    Seeds._draft = Seeds.readForm();          /* capture what is typed BEFORE the sheet swaps */
    const editId = Seeds._editId;
    Garden.cropPicker("Which crop is this?", id => {
      closeSheet();
      setTimeout(() => {
        const merged = Object.assign({}, Seeds._draft || {}, {
          crop_id: id, photo_id: Seeds._photoId,
          name: (Seeds._draft && Seeds._draft.name) || cropName(id)
        });
        Seeds.form(editId ? DB.find("seeds", editId) : null, merged);
      }, 230);
    });
  },

  readForm(){
    if(!$("#sd-name")) return {};
    return {
      crop_id: $("#sd-crop").value, name: $("#sd-name").value.trim(), variety: $("#sd-var").value.trim(),
      brand: $("#sd-brand").value.trim(), qty: $("#sd-qty").value, unit: $("#sd-unit").value,
      packed_year: $("#sd-packed").value, exp_date: $("#sd-exp").value, germ_rate: $("#sd-germ").value,
      cost: $("#sd-cost").value, source: $("#sd-source").value.trim(), notes: $("#sd-notes").value.trim(),
      photo_id: Seeds._photoId
    };
  },

  save(id){
    if(id === undefined) id = Seeds._editId;
    const d = Seeds.readForm();
    if(!d.name && !d.crop_id) return toast("Add a name or pick a crop");
    if(!d.name) d.name = cropName(d.crop_id);
    if(id) DB.update("seeds", id, d); else DB.insert("seeds", d);
    Cal.rebuild();
    closeSheet(); Seeds.render(); toast("Packet saved");
  },
  del(id){
    confirmSheet("Delete this packet?", "It is removed from your seed bank and its calendar entries go with it.", "Delete", () => {
      const s = DB.find("seeds", id); if(s && s.photo_id) Photos.drop(s.photo_id);
      DB.bulkRemove("events", e => e.seed_id === id);
      DB.remove("seeds", id); Seeds.render(); toast("Deleted");
    }, true);
  },

  germTest(){
    openSheet("Germination test",
      '<p class="muted sm" style="margin-top:0">The 10-seed paper towel test tells you in a week whether an old packet is worth bed space.</p>' +
      '<div class="note g"><b>How to run it</b><br>1. Count out 10 seeds.<br>2. Fold them into a damp paper towel, slide it into a zip bag.<br>' +
      '3. Keep it somewhere warm — on top of the fridge is perfect.<br>4. Check daily; count sprouts at the crop\'s max germination day.</div>' +
      '<div class="grid2" style="margin-top:14px">' +
      '<div><label class="f">Seeds tested</label><input type="number" id="gt-n" value="10"></div>' +
      '<div><label class="f">Sprouted</label><input type="number" id="gt-s" value="0"></div></div>' +
      '<button class="btn block" style="margin-top:12px" onclick="Seeds.germResult()">Calculate</button>' +
      '<div id="gt-out" style="margin-top:12px"></div>');
  },
  germResult(){
    const n = num($("#gt-n").value, 10), s = num($("#gt-s").value, 0);
    const pct = n ? Math.round(s / n * 100) : 0;
    let msg, cls;
    if(pct >= 80){ msg = "Excellent. Sow at normal density."; cls = "g"; }
    else if(pct >= 60){ msg = "Usable. Sow about 25% thicker than the packet says."; cls = "g"; }
    else if(pct >= 40){ msg = "Weak. Sow double, and don't give it your best bed space."; cls = "w"; }
    else if(pct >= 20){ msg = "Poor. Worth using only for greens you sow thickly anyway — or start them in a tray and transplant what comes up."; cls = "w"; }
    else { msg = "Effectively dead. Compost it and buy fresh."; cls = "d"; }
    $("#gt-out").innerHTML = '<div class="note ' + cls + '"><b>' + pct + '% germination.</b> ' + esc(msg) + '</div>';
  },

  /* ---------- optional AI packet reader ---------- */
  async readPacket(){
    const key = DB.get("aiKey"); if(!key) return toast("Add a Claude API key in Settings");
    if(!Seeds._photoId) return toast("Take a photo of the packet first");
    const p = DB.find("photos", Seeds._photoId);
    toast("Reading packet…");
    try{
      const body = {
        model: DB.get("claudeModel", "claude-sonnet-5"), max_tokens: 700,
        messages: [{ role: "user", content: [
          { type: "image", source: { type: "base64", media_type: p.mime, data: p.data } },
          { type: "text", text:
            "This is a photo of a seed packet. Return ONLY a JSON object, no prose, with keys: " +
            "name, variety, brand, qty (number of seeds or weight as a number), unit, packed_year (4-digit number), " +
            "exp_date (YYYY-MM-DD or empty), germ_rate (number 0-100 or empty), notes (planting instructions printed on the packet, condensed). " +
            "Use empty string for anything you cannot read. Do not guess." }
        ]}]
      };
      const r = await fetch("https://api.anthropic.com/v1/messages", {
        method: "POST",
        headers: { "content-type":"application/json", "x-api-key": key,
                   "anthropic-version":"2023-06-01", "anthropic-dangerous-direct-browser-access":"true" },
        body: JSON.stringify(body)
      });
      if(!r.ok) throw new Error("API " + r.status);
      const j = await r.json();
      const txt = (j.content || []).map(c => c.text || "").join("");
      const m = txt.match(/\{[\s\S]*\}/); if(!m) throw new Error("No JSON returned");
      const d = JSON.parse(m[0]);
      const setv = (sel, v) => { const el = $(sel); if(el && v !== "" && v !== null && v !== undefined) el.value = v; };
      setv("#sd-name", d.name); setv("#sd-var", d.variety); setv("#sd-brand", d.brand);
      setv("#sd-qty", d.qty); setv("#sd-packed", d.packed_year); setv("#sd-exp", d.exp_date);
      setv("#sd-germ", d.germ_rate); setv("#sd-notes", d.notes);
      if(!$("#sd-crop").value && d.name){
        const guess = CROPS.find(c => (d.name + " " + (d.variety||"")).toLowerCase().indexOf(c.n.toLowerCase().split(" ")[0]) >= 0);
        if(guess){ $("#sd-crop").value = guess.id; $("#sd-cropname").value = guess.n; }
      }
      toast("Packet read — check the fields");
    }catch(e){ toast("Couldn't read it: " + (e.message || "error")); }
  }
};

/* ============================================================
   GROW CALENDAR
   ============================================================ */
const EV = {
  indoor:    { c:"#9b6bd6", i:"🏠", n:"Start indoors" },
  transplant:{ c:"#2a8c5e", i:"🌱", n:"Transplant" },
  direct:    { c:"#f0a500", i:"🌰", n:"Direct sow" },
  fall:      { c:"#c96a2f", i:"🍂", n:"Fall sowing" },
  harvest:   { c:"#c9453c", i:"🧺", n:"Harvest window" },
  expiry:    { c:"#8b9a91", i:"⏳", n:"Seed expiry" },
  frost:     { c:"#2f6fb0", i:"❄️", n:"Frost date" },
  task:      { c:"#5c6b62", i:"📌", n:"Task" }
};

const Cal = {
  month: null,

  /* regenerate auto events from the seed bank, plantings and frost dates */
  rebuild(){
    const yr = today().getFullYear();
    if(!Season.lastFrost() || !Season.firstFrost()) return;
    const keep = {};

    const put = (key, o) => {
      keep[key] = 1;
      const ex = DB.all("events").find(e => e.auto === key);
      if(ex){ DB.update("events", ex.id, o); return ex; }
      return DB.insert("events", Object.assign({ auto: key, done: "0" }, o));
    };

    /* frost markers */
    put("frost:last:" + yr, { date: Season.lastFrostISO, type:"frost", title:"Average last spring frost" });
    put("frost:first:" + yr, { date: Season.firstFrostISO, type:"frost", title:"Average first fall frost" });

    /* one set of sowing events per crop you own seed for */
    const owned = {};
    DB.all("seeds").forEach(s => { if(s.crop_id) (owned[s.crop_id] = owned[s.crop_id] || []).push(s); });
    Object.keys(owned).forEach(cid => {
      const s0 = owned[cid][0];
      Season.windows(cid).forEach(w => {
        put("seed:" + cid + ":" + w.kind + ":" + (w.year || yr), {
          date: iso(w.date), type: w.kind, crop_id: cid, seed_id: s0.id,
          title: w.label + " " + cropName(cid), notes: w.note
        });
      });
      owned[cid].forEach(s => {
        const v = Seeds.viability(s);
        if(s.packed_year && v.yrs){
          const endYr = num(s.packed_year) + v.yrs;
          if(endYr >= yr && endYr <= yr + 1)
            put("exp:" + s.id, { date: endYr + "-01-15", type:"expiry", crop_id: cid, seed_id: s.id,
              title: s.name + " seed reaches typical viability limit", notes:"Sow it before this or run a germination test." });
        }
      });
    });

    /* harvest windows for real plantings */
    DB.where("plantings", p => p.status !== "removed" && p.sown_on).forEach(p => {
      const h = Season.harvestFrom(p.crop_id, p.sown_on, "seed");
      if(!h) return;
      put("harv:" + p.id, { date: iso(h), type:"harvest", crop_id: p.crop_id, bed_id: p.bed_id, planting_id: p.id,
        title: "First harvest: " + cropName(p.crop_id), notes:"Roughly " + crop(p.crop_id).dtm + " days from planting." });
    });

    /* prune stale auto events */
    DB.bulkRemove("events", e => e.auto && !keep[e.auto] && e.done !== "1");
  },

  forPlanting(p){ if(p) Cal.rebuild(); },

  render(){
    const box = $("#s-calendar");
    if(!Cal.month){ const t = today(); Cal.month = new Date(t.getFullYear(), t.getMonth(), 1); }
    const m = Cal.month;
    const evs = DB.all("events");
    const byDate = {};
    evs.forEach(e => { if(!e.date) return; (byDate[e.date] = byDate[e.date] || []).push(e); });

    let h = '';
    if(!Season.lastFrost()){
      h += '<div class="card"><div class="note i">Set your location and the calendar builds itself from your frost dates and seed bank.</div>' +
        '<button class="btn block" style="margin-top:10px" onclick="Onboard.open()">Set location</button></div>';
      box.innerHTML = h; return;
    }

    h += '<div class="card"><div class="row between" style="margin-bottom:10px">' +
      '<button class="iconbtn" onclick="Cal.shift(-1)">‹</button>' +
      '<div class="b">' + MONF[m.getMonth()] + ' ' + m.getFullYear() + '</div>' +
      '<button class="iconbtn" onclick="Cal.shift(1)">›</button></div>';

    h += '<div class="cal">';
    DOW.forEach(d => h += '<div class="dow">' + d[0] + '</div>');
    const first = new Date(m.getFullYear(), m.getMonth(), 1);
    const start = addDays(first, -first.getDay());
    for(let i = 0; i < 42; i++){
      const d = addDays(start, i), k = iso(d);
      const out = d.getMonth() !== m.getMonth();
      const list = byDate[k] || [];
      const types = list.map(e => e.type).filter((v, ix, a) => a.indexOf(v) === ix).slice(0, 3);
      h += '<button class="d ' + (out ? "out" : "") + ' ' + (k === iso(today()) ? "today" : "") + '" onclick="Cal.day(\'' + k + '\')">' +
        '<span>' + d.getDate() + '</span><span class="dots">' +
        types.map(t => '<span class="dot" style="background:' + (EV[t] ? EV[t].c : "#888") + '"></span>').join("") +
        '</span></button>';
    }
    h += '</div>';
    h += '<div class="row wrap tiny muted" style="gap:8px;margin-top:10px">' +
      Object.keys(EV).map(k => '<span class="row" style="gap:4px"><span class="dot" style="width:6px;height:6px;border-radius:50%;background:' + EV[k].c + ';display:inline-block"></span>' + EV[k].n + '</span>').join("") +
      '</div></div>';

    /* upcoming list */
    const upcoming = evs.filter(e => e.date && diffDays(today(), parseISO(e.date)) >= -14)
      .sort((a,b) => a.date < b.date ? -1 : 1).slice(0, 40);
    h += '<div class="sec"><h2>What is next</h2><button class="tiny b" onclick="Cal.addTask()">＋ Task</button></div>';
    if(!upcoming.length) h += '<div class="card center muted sm">Nothing scheduled yet. Add packets to your seed bank.</div>';
    else {
      h += '<div class="card"><div class="tl">';
      let lastMonth = null;
      upcoming.forEach(e => {
        const d = parseISO(e.date), mk = d.getFullYear() + "-" + d.getMonth();
        if(mk !== lastMonth){ lastMonth = mk;
          h += '<div class="tiny b muted" style="margin:8px 0 2px;text-transform:uppercase;letter-spacing:.06em">' + MONF[d.getMonth()] + '</div>'; }
        const late = diffDays(today(), d) < 0 && e.done !== "1";
        h += '<div class="ev"><button class="row" style="width:100%;text-align:left;gap:10px" onclick="Cal.openEvent(\'' + e.id + '\')">' +
          '<span style="font-size:1.2rem">' + (EV[e.type] ? EV[e.type].i : "📌") + '</span>' +
          '<span class="grow"><span class="b" style="display:block' + (e.done === "1" ? ";opacity:.5;text-decoration:line-through" : "") + '">' + esc(e.title) + '</span>' +
          '<span class="tiny ' + (late ? "" : "muted") + '"' + (late ? ' style="color:var(--danger)"' : '') + '>' + fmt(d) + ' · ' + relDay(d) + (late ? ' · overdue' : '') + '</span></span>' +
          '<span class="go">›</span></button></div>';
      });
      h += '</div></div>';
    }
    box.innerHTML = h;
  },

  shift(n){ Cal.month = new Date(Cal.month.getFullYear(), Cal.month.getMonth() + n, 1); Cal.render(); },

  day(k){
    const list = DB.where("events", e => e.date === k).sort((a,b) => (a.type||"").localeCompare(b.type||""));
    let h = '<div class="b" style="margin-bottom:10px">' + fmtY(k) + '</div>';
    if(!list.length) h += '<div class="empty sm">Nothing scheduled.</div>';
    else { h += '<div class="list">';
      list.forEach(e => h += '<button class="item" onclick="Cal.openEvent(\'' + e.id + '\')"><div class="av">' +
        (EV[e.type] ? EV[e.type].i : "📌") + '</div><div class="grow"><div class="b">' + esc(e.title) + '</div>' +
        '<div class="tiny muted">' + esc(EV[e.type] ? EV[e.type].n : e.type) + (e.done === "1" ? " · done" : "") + '</div></div><span class="go">›</span></button>');
      h += '</div>'; }
    h += '<button class="btn block ghost" style="margin-top:12px" onclick="Cal.addTask(\'' + k + '\')">＋ Add a task on this day</button>';
    openSheet(fmt(k), h);
  },

  openEvent(id){
    const e = DB.find("events", id); if(!e) return;
    const c = e.crop_id ? crop(e.crop_id) : null;
    let h = '<div class="row" style="gap:12px;margin-bottom:10px"><div style="font-size:2.2rem">' + (EV[e.type] ? EV[e.type].i : "📌") + '</div>' +
      '<div class="grow"><div class="b" style="font-size:1.05rem">' + esc(e.title) + '</div>' +
      '<div class="tiny muted">' + fmtY(e.date) + ' · ' + relDay(e.date) + '</div></div></div>';
    if(e.notes) h += '<div class="note i">' + esc(e.notes) + '</div>';
    if(c){
      h += '<div class="note g" style="margin-top:8px"><b>' + esc(c.n) + ' at a glance.</b><br>' +
        'Sow ' + c.depth + '" deep · germinates in ' + c.germ[0] + '–' + c.germ[1] + ' days at ' + c.soilF[1] + '°F<br>' +
        'Space ' + c.sp + '" apart · ' + c.sun + 'h sun · ' + c.water + '"/week · ' + c.dtm + ' days to maturity</div>';
      if(e.type === "indoor" || e.type === "direct" || e.type === "fall")
        h += '<div class="note w" style="margin-top:8px"><b>Tip.</b> ' + esc(c.tips) + '</div>';
    }
    h += '<div class="row" style="gap:8px;margin-top:14px">';
    h += '<button class="btn ' + (e.done === "1" ? "ghost" : "") + ' grow" onclick="Cal.toggleDone(\'' + e.id + '\')">' +
      (e.done === "1" ? "Mark not done" : "✓ Mark done") + '</button>';
    if(c) h += '<button class="btn ghost" onclick="closeSheet();setTimeout(function(){Library.open(\'' + c.id + '\')},250)">Guide</button>';
    h += '</div>';
    if(!e.auto) h += '<button class="btn ghost block danger" style="margin-top:8px" onclick="DB.remove(\'events\',\'' + e.id + '\');closeSheet();Cal.render()">Delete task</button>';
    openSheet("Calendar entry", h);
  },
  toggleDone(id){
    const e = DB.find("events", id);
    DB.update("events", id, { done: e.done === "1" ? "0" : "1" });
    closeSheet(); Cal.render(); refresh();
    if(e.done !== "1") toast("Nice — logged as done");
  },

  addTask(dateISO){
    openSheet("New task",
      '<div class="field"><label class="f">What needs doing?</label><input type="text" id="tk-title" placeholder="Side-dress the tomatoes"></div>' +
      '<div class="field"><label class="f">Date</label><input type="date" id="tk-date" value="' + esc(dateISO || iso(today())) + '"></div>' +
      '<div class="field"><label class="f">Notes</label><textarea id="tk-notes"></textarea></div>' +
      '<button class="btn block" style="margin-top:14px" onclick="Cal.saveTask()">Add to calendar</button>');
    setTimeout(() => $("#tk-title").focus(), 300);
  },
  saveTask(){
    const t = $("#tk-title").value.trim(); if(!t) return toast("Give it a title");
    DB.insert("events", { title: t, date: $("#tk-date").value, notes: $("#tk-notes").value.trim(), type:"task", done:"0" });
    closeSheet(); Cal.render(); toast("Task added");
  }
};
</script>
<script>

const CONDITIONS = [
/* --- nutrients --- */
{id:"n-def",n:"Nitrogen deficiency",k:"nutrient",sev:2,
 tags:{"yellow-old":3,"yellow-whole":2,"stunted":2,"pale":1},
 quick:"Classic pattern: the oldest, lowest leaves go uniformly yellow first while new growth stays green. Nitrogen is mobile, so the plant robs old leaves to feed new ones.",
 treat:["Fish emulsion or blood meal now — liquid feeds act within days.","Side-dress with finished compost or aged manure.","For a fast fix on greens, dilute fish emulsion 1 tbsp/gallon as a foliar spray."],
 prev:["Compost every bed at the start of the season.","Heavy feeders (corn, brassicas, tomatoes, squash) want a side-dressing mid-season.","Mulch with straw, not fresh wood chips — raw wood ties up nitrogen."]},
{id:"k-def",n:"Potassium deficiency",k:"nutrient",sev:2,
 tags:{"edges-brown":3,"yellow-old":2,"spots-brown":1,"misshapen-fruit":2},
 quick:"Browning and scorching that starts at the leaf margins of older leaves, working inward. Fruit sizes poorly and ripens unevenly.",
 treat:["Kelp meal, greensand or sulphate of potash worked into the top inch.","Wood ash in small amounts if your soil is not already alkaline.","Banana-peel compost is folklore-level slow — use a real amendment if the plant is fruiting."],
 prev:["Test soil every 2–3 years.","Sandy soils leach potassium fast — feed little and often."]},
{id:"p-def",n:"Phosphorus deficiency",k:"nutrient",sev:2,
 tags:{"purple-tint":3,"stunted":2,"no-set":1},
 quick:"Purple or reddish undersides and stems with stunted growth. Often it is not a shortage at all — cold soil simply stops roots taking phosphorus up.",
 treat:["If soil is under 60°F, wait and warm it — this usually fixes itself.","Bone meal or rock phosphate worked in near the roots.","Mycorrhizal inoculant at transplant improves uptake dramatically."],
 prev:["Do not transplant heat-lovers into cold soil.","Keep pH between 6.0 and 7.0 — phosphorus locks up outside that band."]},
{id:"mg-def",n:"Magnesium deficiency",k:"nutrient",sev:1,
 tags:{"yellow-veins":4,"yellow-old":2,"container":1},
 quick:"Yellowing between the veins of older leaves while the veins themselves stay green — a herringbone look. Common in containers and after heavy potassium feeding.",
 treat:["1 tbsp Epsom salt per gallon as a foliar spray; repeat in 2 weeks.","Dolomitic lime if your soil is also acidic."],
 prev:["Do not overdo potassium — it competes with magnesium.","Refresh container mix each year."]},
{id:"fe-def",n:"Iron chlorosis",k:"nutrient",sev:1,
 tags:{"yellow-new":4,"yellow-veins":3,"soil-soggy":1},
 quick:"Yellowing between veins on the NEWEST leaves. Iron is immobile, so deficiency shows up in new growth. Usually a pH problem, not a shortage.",
 treat:["Chelated iron as a foliar spray for a quick green-up.","Elemental sulphur to lower pH over time if soil is alkaline.","Improve drainage — waterlogged roots cannot take up iron."],

{id:"ca-ber",n:"Blossom end rot (calcium)",k:"nutrient",sev:2,
 crops:["tomato","pepper","hotpepper","eggplant","zucchini","wintersquash","watermelon"],

 prev:["Consistent moisture, especially in containers and during heat.","Do not over-fertilize with nitrogen or potassium — both block calcium uptake.","Wide, deep containers hold moisture more evenly than narrow ones."]},

{id:"sunscald",n:"Sunscald",k:"environment",sev:1,

{id:"frost",n:"Frost or cold damage",k:"environment",sev:2,

{id:"transplant-shock",n:"Transplant shock",k:"culture",sev:1,
 tags:{"new-transplant":5,"wilting":3,"stunted":2,"yellow-old":1,"purple-tint":1},
 quick:"Wilting and a growth stall in the first week or two after planting out. Roots have been disturbed and cannot yet supply the leaves.",

{id:"heat-stress",n:"Heat stress / blossom drop",k:"environment",sev:1,
 tags:{"no-set":4,"recent-heat":4,"curl-up":2,"wilting":1,"bolting":2},

 treat:["Shade cloth over the hottest hours.","Keep water steady — do not let plants wilt.","Wait it out; the plant sets again when nights cool."],
 prev:["Choose heat-set varieties in hot climates.","Mulch heavily and water deeply in the morning.","Time the main planting so flowering misses your hottest weeks."]},
{id:"bolt",n:"Bolting",k:"culture",sev:1,
 tags:{"bolting":6,"recent-heat":3,"low-light":1},
 quick:"The plant switches to making seed — a flower stalk shoots up and leaves turn bitter. Triggered by heat, lengthening days, or stress in cool-season crops.",
 treat:["Harvest what is left immediately; it only gets more bitter.","Let one plant flower for the pollinators and save the seed.","Cilantro seed is coriander — worth keeping."],
 prev:["Plant cool-season crops for spring and fall, not summer.","Bolt-resistant varieties.","Afternoon shade and steady moisture buy you weeks."]},
{id:"poor-poll",n:"Poor pollination",k:"culture",sev:1,
 crops:["zucchini","cucumber","wintersquash","pumpkin","melon","watermelon","corn","tomato"],
 tags:{"no-set":4,"misshapen-fruit":4,"fruit-rot":2},
 quick:"Fruit starts, then yellows and shrivels at the tip, or grows lopsided. Squash and cucumbers need bees to move pollen from male to female flowers; corn needs wind and a block planting.",
 treat:["Hand-pollinate at dawn: pick a male flower, strip the petals, dab pollen onto the female's stigma.","Tomatoes are self-fertile — flick the flower trusses or use an electric toothbrush on the stem.","Plant borage, calendula, alyssum and let some herbs flower."],
 prev:["Never spray insecticide on open flowers.","Plant corn in blocks of at least 4×4, not single rows.","Keep flowering companions in every bed."]},

const Doctor = {
  photoId: null, analysis: null, picked: {}, stream: null,

  render(){
    const box = $("#s-doctor");
    const hist = DB.all("diagnoses").sort((a,b) => (b.date || "").localeCompare(a.date || ""));
    let h = '';

    h += '<div class="card"><div class="row between" style="margin-bottom:10px"><div><div class="b">Scan a plant</div>' +
      '<div class="tiny muted">Photograph a leaf, then answer a few questions.</div></div><div style="font-size:2rem">🔬</div></div>' +
      '<div id="dc-cam"></div>' +
      '<div class="row" style="gap:8px;margin-top:10px">' +
        '<button class="btn grow" onclick="Doctor.startCamera()">📷 Open camera</button>' +
        '<button class="btn ghost grow" onclick="Doctor.pick(true)">Snapshot</button>' +
        '<button class="btn ghost" onclick="Doctor.pick(false)">🖼️</button></div>' +
      '<button class="btn outline block" style="margin-top:10px" onclick="Doctor.triage()">Skip the photo — describe symptoms</button>' +
      '</div>';

    h += '<div class="note i" style="margin-top:12px"><b>How this works.</b> The app measures colour and pattern in your photo on-device, then combines that with your answers against ' +
      CONDITIONS.length + ' known problems. Nothing is uploaded unless you turn on AI diagnosis in Settings.</div>';

    h += '<div class="sec"><h2>Diagnosis history</h2><span class="tiny muted">' + hist.length + '</span></div>';
    if(!hist.length) h += '<div class="card center muted sm">No scans yet.</div>';
    else {
      h += '<div class="card pad0"><div class="list">';
      hist.slice(0, 25).forEach(d => {
        const u = Photos.url(d.photo_id);
        h += '<button class="item" onclick="Doctor.openHistory(\'' + d.id + '\')">' +
          '<div class="av">' + (u ? '<img src="' + u + '">' : "🔬") + '</div>' +
          '<div class="grow"><div class="b truncate">' + esc(d.result || "Unresolved") + '</div>' +
          '<div class="tiny muted">' + fmt(d.date) + (d.crop_id ? ' · ' + esc(cropName(d.crop_id)) : '') +
          (d.confidence ? ' · ' + esc(d.confidence) + '% match' : '') + '</div></div><span class="go">›</span></button>';
      });
      h += '</div></div>';
    }
    box.innerHTML = h;
  },

  /* ---------- camera ---------- */
  async startCamera(){
    const wrap = $("#dc-cam");
    if(!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia){
      toast("Live camera needs https — using your camera app instead"); return Doctor.pick(true);
    }
    try{
      Doctor.stopCamera();
      Doctor.stream = await navigator.mediaDevices.getUserMedia({ video:{ facingMode:{ ideal:"environment" }, width:{ ideal:1280 } }, audio:false });
      wrap.innerHTML = '<video id="camfeed" playsinline autoplay muted></video>' +
        '<button class="btn block" style="margin-top:8px" onclick="Doctor.snap()">◉ Capture</button>' +
        '<button class="btn ghost block sm" style="margin-top:6px" onclick="Doctor.stopCamera();Doctor.render()">Close camera</button>';
      const v = $("#camfeed"); v.srcObject = Doctor.stream; await v.play();
    }catch(e){
      toast("Camera blocked — using your photo library"); Doctor.pick(true);
    }
  },
  stopCamera(){ if(Doctor.stream){ Doctor.stream.getTracks().forEach(t => t.stop()); Doctor.stream = null; } },
  snap(){
    const v = $("#camfeed"); if(!v) return;
    const s = Math.min(1, 900 / Math.max(v.videoWidth, v.videoHeight));
    const c = document.createElement("canvas");
    c.width = Math.round(v.videoWidth * s); c.height = Math.round(v.videoHeight * s);
    c.getContext("2d").drawImage(v, 0, 0, c.width, c.height);
    Doctor.stopCamera();
    Doctor.gotImage(c.toDataURL("image/jpeg", 0.78), c);
  },
  pick(useCamera){
    const inp = useCamera ? $("#filepick-cam") : $("#filepick");
    inp.value = "";
    inp.onchange = async () => {
      const f = inp.files[0]; if(!f) return;
      try{ const r = await shrinkImage(f, 900, 0.78); Doctor.gotImage(r.dataUrl, r.canvas); }
      catch(e){ toast("Could not read that image"); }
    };
    inp.click();
  },
  gotImage(dataUrl, canvas){
    if(Doctor.photoId) Photos.drop(Doctor.photoId);
    Doctor.photoId = Photos.put(dataUrl, canvas.width, canvas.height);
    Doctor.analysis = Doctor.analyze(canvas);
    Doctor.triage();
  },

  /* ---------- on-device image analysis ---------- */
  analyze(canvas){
    const W = 180, H = Math.max(1, Math.round(canvas.height / canvas.width * W));
    const c = document.createElement("canvas"); c.width = W; c.height = H;
    const ctx = c.getContext("2d"); ctx.drawImage(canvas, 0, 0, W, H);
    let d; try{ d = ctx.getImageData(0, 0, W, H).data; }catch(e){ return null; }
    let leaf = 0, green = 0, yellow = 0, brown = 0, white = 0, dark = 0, edgeBrown = 0, edgeTot = 0;
    let sumV = 0, sumSat = 0;
    for(let y = 0; y < H; y++) for(let x = 0; x < W; x++){
      const i = (y * W + x) * 4, r = d[i], g = d[i+1], b = d[i+2];
      const mx = Math.max(r,g,b), mn = Math.min(r,g,b), v = mx / 255, sat = mx ? (mx - mn) / mx : 0;
      const isEdge = (x < W*0.12 || x > W*0.88 || y < H*0.12 || y > H*0.88);
      const isGreen = (g > r + 8 && g > b + 8);
      const isYellow = (r > 110 && g > 110 && b < g - 35 && !isGreen);
      const isBrown = (r > g && g >= b && v < 0.62 && sat > 0.18);
      const isWhite = (sat < 0.14 && v > 0.72);
      const isDark = (v < 0.20);
      if(isGreen || isYellow || isBrown){ leaf++; sumV += v; sumSat += sat;
        if(isGreen) green++; else if(isYellow) yellow++; else brown++;
        if(isEdge){ edgeTot++; if(isBrown || isYellow) edgeBrown++; }
      } else if(isWhite) white++;
      else if(isDark) dark++;
    }
    const tot = W * H;
    const pct = n => Math.round(n / Math.max(1, leaf) * 100);
    return {
      leafCoverage: Math.round(leaf / tot * 100),
      green: pct(green), yellow: pct(yellow), brown: pct(brown),
      whitish: Math.round(white / tot * 100), dark: Math.round(dark / tot * 100),
      edgeBrown: edgeTot ? Math.round(edgeBrown / edgeTot * 100) : 0,
      vigor: leaf ? Math.round(sumSat / leaf * 100) : 0,
      brightness: leaf ? Math.round(sumV / leaf * 100) : 0
    };
  },
  autoTags(a){
    const t = {};
    if(!a) return t;
    if(a.yellow > 28) t["yellow-whole"] = 1;
    if(a.brown > 18) t["spots-brown"] = 1;
    if(a.edgeBrown > 42 && a.brown > 8) t["edges-brown"] = 1;
    if(a.whitish > 14) t["white-powder"] = 1;
    if(a.dark > 12 && a.brown > 6) t["spots-black"] = 1;
    if(a.green < 45 && a.yellow > 20) t["pale"] = 1;
    return t;
  },

  /* ---------- triage sheet ---------- */
  triage(){
    Doctor.picked = Object.assign({}, Doctor.autoTags(Doctor.analysis));
    const a = Doctor.analysis;
    let h = '';
    if(Doctor.photoId) h += '<img class="photo" src="' + Photos.url(Doctor.photoId) + '" style="max-height:230px;object-fit:cover;margin-bottom:10px">';
    if(a){
      h += '<div class="note i" style="margin-bottom:12px"><b>Image reading.</b> ' +
        'Healthy green ' + a.green + '% · yellowing ' + a.yellow + '% · browning ' + a.brown + '%' +
        (a.whitish > 8 ? ' · whitish film ' + a.whitish + '%' : '') +
        (a.edgeBrown > 35 ? '<br>Damage is concentrated at the leaf margins.' : '') +
        (a.green > 78 && a.brown < 6 ? '<br>Foliage colour looks healthy — if something is wrong it may be at the root, the fruit, or a pest.' : '') +
        '<br><span class="tiny">Colour analysis only. It cannot identify a species or a pathogen — your answers below do the real work.</span></div>';
    }
    h += '<div class="field"><label class="f">Which plant?</label><div class="row" style="gap:8px">' +
      '<select id="dx-plant"><option value="">— not specified —</option>' +
      DB.where("plantings", p => p.status !== "removed").map(p => {
        const b = DB.find("beds", p.bed_id);
        return '<option value="' + p.id + '">' + esc(cropName(p.crop_id)) + ' · ' + esc(b ? b.name : "?") + ' (r' + (num(p.y)+1) + 'c' + (num(p.x)+1) + ')</option>';
      }).join("") + '</select></div></div>';
    h += '<div class="field"><label class="f">…or just the crop</label><select id="dx-crop"><option value="">— not specified —</option>' +
      CROPS.map(c => '<option value="' + c.id + '">' + esc(c.n) + '</option>').join("") + '</select></div>';

    h += '<p class="tiny muted" style="margin:14px 0 6px">Tick everything you can see. The more you tick, the sharper the answer.</p>';
    SYMPTOMS.forEach(gr => {
      h += '<div class="b tiny muted" style="margin:12px 0 6px;text-transform:uppercase;letter-spacing:.06em">' + esc(gr.g) + '</div><div class="row wrap" style="gap:6px">';
      gr.items.forEach(it => h += '<button class="chip sym ' + (Doctor.picked[it[0]] ? "on" : "") + '" data-s="' + it[0] + '">' + esc(it[1]) + '</button>');
      h += '</div>';
    });
    h += '<button class="btn block" style="margin-top:18px" onclick="Doctor.diagnose()">Diagnose</button>';
    if(DB.get("aiKey")) h += '<button class="btn outline block" style="margin-top:8px" onclick="Doctor.aiDiagnose()">✨ Also ask Claude to look at the photo</button>';
    openSheet("What are you seeing?", h, () => Doctor.stopCamera());
    $$("#sheet-body .chip.sym").forEach(el => el.onclick = () => {
      const k = el.dataset.s;
      if(Doctor.picked[k]) delete Doctor.picked[k]; else Doctor.picked[k] = 1;
      el.classList.toggle("on"); haptic();
    });
  },

  /* ---------- rules engine ---------- */
  score(){
    const picked = Doctor.picked;
    const cropId = ($("#dx-crop") ? $("#dx-crop").value : "") ||
      (($("#dx-plant") && $("#dx-plant").value) ? (DB.find("plantings", $("#dx-plant").value) || {}).crop_id : "");
    const keys = Object.keys(picked);
    const out = CONDITIONS.map(c => {
      let hit = 0, max = 0, matched = [];
      Object.keys(c.tags).forEach(t => { max += c.tags[t]; });
      keys.forEach(k => { if(c.tags[k]){ hit += c.tags[k]; matched.push(k); } });
      let conf = max ? (hit / Math.max(max * 0.55, 1)) * 100 : 0;
      if(c.crops && cropId){ conf = c.crops.indexOf(cropId) >= 0 ? conf * 1.25 : conf * 0.55; }
      if(matched.length === 1 && keys.length > 2) conf *= 0.7;
      conf = Math.round(clamp(conf, 0, 97));
      return { c: c, conf: conf, matched: matched, hits: matched.length };
    }).filter(r => r.conf > 12).sort((a,b) => b.conf - a.conf);
    return { list: out, cropId: cropId };
  },

  diagnose(){
    const keys = Object.keys(Doctor.picked);
    if(!keys.length) return toast("Tick at least one symptom");
    const res = Doctor.score();
    const top = res.list.slice(0, 4);
    const plantingId = $("#dx-plant") ? $("#dx-plant").value : "";
    let h = '';
    if(Doctor.photoId) h += '<img class="photo" src="' + Photos.url(Doctor.photoId) + '" style="max-height:180px;object-fit:cover;margin-bottom:12px">';

    if(!top.length){
      h += '<div class="note w">Nothing in the knowledge base matches that combination well. Try adding a couple more observations, or photograph the underside of a leaf and the base of the stem.</div>';
    }
    top.forEach((r, i) => {
      const c = r.c;
      const cls = c.sev >= 3 ? "d" : c.sev === 2 ? "w" : "g";
      h += '<div class="card" style="margin-bottom:12px">';
      h += '<div class="row between"><div class="grow"><div class="b" style="font-size:1.05rem">' + (i === 0 ? "Most likely: " : "") + esc(c.n) + '</div>' +
        '<div class="tiny muted">' + esc(({nutrient:"Nutrient", disease:"Disease", pest:"Pest", environment:"Environment", culture:"Growing practice"})[c.k]) +
        ' · ' + (c.sev >= 3 ? "act now" : c.sev === 2 ? "treat soon" : "minor") + '</div></div>' +
        '<div class="stat" style="text-align:right"><span class="n">' + r.conf + '%</span><span class="l">match</span></div></div>';
      h += '<div class="bar-track" style="margin:8px 0"><div class="bar-fill" style="width:' + r.conf + '%;background:' +
        (c.sev >= 3 ? "var(--danger)" : c.sev === 2 ? "var(--warn)" : "var(--green-600)") + '"></div></div>';
      h += '<p class="sm" style="margin:8px 0">' + esc(c.quick) + '</p>';
      h += '<div class="note ' + cls + '"><b>What to do now</b><ul style="margin:6px 0 0;padding-left:18px">' +
        c.treat.map(t => '<li style="margin-bottom:4px">' + esc(t) + '</li>').join("") + '</ul></div>';
      h += '<details style="margin-top:8px"><summary class="sm b" style="cursor:pointer">Stop it happening again</summary>' +
        '<ul class="sm" style="margin:8px 0 0;padding-left:18px">' + c.prev.map(t => '<li style="margin-bottom:4px">' + esc(t) + '</li>').join("") + '</ul></details>';
      if(CLAIM_NOTES[c.id]) h += '<div class="note i" style="margin-top:8px"><b>Worth knowing.</b> ' + esc(CLAIM_NOTES[c.id]) + '</div>';
      if(c.src && c.src.length) h += '<div style="margin-top:10px">' + c.src.map(s =>
        '<a class="chip info" style="margin:0 6px 6px 0" href="' + esc(s[1]) + '" target="_blank" rel="noopener noreferrer">🔗 ' + esc(s[0]) + ' ↗</a>').join("") + '</div>';
      h += '</div>';
    });

    if(top.length > 1 && top[0].conf - top[1].conf < 12)
      h += '<div class="note i">Top two are close. Look for the distinguishing sign: ' +
        esc(top[0].c.n) + ' vs ' + esc(top[1].c.n) + ' — check leaf undersides, the stem base, and whether new or old growth is affected first.</div>';

    h += '<div class="note w" style="margin-top:12px">This is pattern-matching against a symptom library, not a lab test. Each diagnosis links to the extension service that published the guidance, so you can check it directly. For anything that could spread — late blight, bacterial wilt, a virus — get a real identification.</div>' +
      '<a class="btn ghost block" style="margin-top:8px" href="https://ask.extension.org/" target="_blank" rel="noopener noreferrer">Ask your local extension office ↗</a>';

    h += '<button class="btn block" style="margin-top:14px" onclick="Doctor.saveDx(\'' + (top[0] ? top[0].c.id : "") + '\',' + (top[0] ? top[0].conf : 0) + ',\'' + esc(plantingId) + '\')">Save to plant history</button>';
    h += '<button class="btn ghost block" style="margin-top:8px" onclick="Doctor.triage()">← Change my answers</button>';
    openSheet("Diagnosis", h);
  },

  saveDx(condId, conf, plantingId){
    const c = CONDITIONS.find(x => x.id === condId);
    const p = plantingId ? DB.find("plantings", plantingId) : null;
    const cropId = ($("#dx-crop") ? $("#dx-crop").value : "") || (p ? p.crop_id : null);
    DB.insert("diagnoses", {
      date: iso(today()), photo_id: Doctor.photoId, planting_id: plantingId || null,
      bed_id: p ? p.bed_id : null, crop_id: cropId,
      symptoms: Object.keys(Doctor.picked).join(","), result: c ? c.n : "Unresolved",
      confidence: conf, treatment: c ? c.treat.join(" | ") : "", source: "rules"
    });
    Doctor.photoId = null; Doctor.analysis = null; Doctor.picked = {};
    closeSheet(); Doctor.render(); toast("Saved to plant history");
  },

  openHistory(id){
    const d = DB.find("diagnoses", id); if(!d) return;
    const u = Photos.url(d.photo_id);
    const c = CONDITIONS.find(x => x.n === d.result);
    let h = '';
    if(u) h += '<img class="photo" src="' + u + '" style="max-height:240px;object-fit:cover;margin-bottom:12px">';
    h += '<div class="b" style="font-size:1.1rem">' + esc(d.result) + '</div>' +
      '<div class="tiny muted">' + fmtY(d.date) + (d.crop_id ? ' · ' + esc(cropName(d.crop_id)) : '') +
      (d.confidence ? ' · ' + esc(d.confidence) + '% match' : '') + ' · ' + esc(d.source === "ai" ? "AI vision" : "symptom rules") + '</div>';
    if(d.treatment) h += '<div class="note g" style="margin-top:12px"><b>Treatment given</b><ul style="margin:6px 0 0;padding-left:18px">' +
      d.treatment.split(" | ").map(t => '<li style="margin-bottom:4px">' + esc(t) + '</li>').join("") + '</ul></div>';
    if(d.notes) h += '<div class="note i" style="margin-top:8px">' + esc(d.notes) + '</div>';
    if(c) h += '<details style="margin-top:10px"><summary class="sm b">Prevention</summary><ul class="sm" style="padding-left:18px">' +
      c.prev.map(t => '<li>' + esc(t) + '</li>').join("") + '</ul></details>';
    h += '<button class="btn ghost block danger" style="margin-top:14px" onclick="Photos.drop(\'' + (d.photo_id||"") + '\');DB.remove(\'diagnoses\',\'' + d.id + '\');closeSheet();Doctor.render()">Delete this record</button>';
    openSheet("Scan record", h);
  },

  /* ---------- optional AI vision ---------- */
  async aiDiagnose(){
    const key = DB.get("aiKey"); if(!key) return toast("Add a Claude API key in Settings");
    if(!Doctor.photoId) return toast("Take a photo first");
    const p = DB.find("photos", Doctor.photoId);
    const cropId = $("#dx-crop") ? $("#dx-crop").value : "";
    const syms = Object.keys(Doctor.picked).join(", ");
    toast("Asking Claude…");
    try{
      const r = await fetch("https://api.anthropic.com/v1/messages", {
        method:"POST",
        headers:{ "content-type":"application/json", "x-api-key": key,
                  "anthropic-version":"2023-06-01", "anthropic-dangerous-direct-browser-access":"true" },
        body: JSON.stringify({
          model: DB.get("claudeModel", "claude-sonnet-5"), max_tokens: 900,
          messages:[{ role:"user", content:[
            { type:"image", source:{ type:"base64", media_type: p.mime, data: p.data } },
            { type:"text", text:
              "You are a plant pathologist helping a home gardener." +
              (cropId ? " The crop is " + cropName(cropId) + "." : "") +
              (syms ? " They report: " + syms + "." : "") +
              " Give: 1) the most likely diagnosis with a confidence percentage, 2) two alternatives worth ruling out and how to tell them apart, " +
              "3) what to do in the next 48 hours, 4) prevention. Be concrete and brief. If the photo is too unclear to judge, say so plainly." }
          ]}]
        })
      });
      if(!r.ok) throw new Error("API " + r.status);
      const j = await r.json();
      const txt = (j.content || []).map(c => c.text || "").join("").trim();
      const html = esc(txt).replace(/\n\n/g, "</p><p>").replace(/\n/g, "<br>");
      openSheet("AI diagnosis",
        (Doctor.photoId ? '<img class="photo" src="' + Photos.url(Doctor.photoId) + '" style="max-height:200px;object-fit:cover;margin-bottom:12px">' : '') +
        '<div class="sm"><p>' + html + '</p></div>' +
        '<div class="note w" style="margin-top:12px">AI vision can be confidently wrong about plant disease. Cross-check against the symptom diagnosis before you spray anything.</div>' +
        '<button class="btn block" style="margin-top:12px" id="ai-save">Save to plant history</button>' +
        '<button class="btn ghost block" style="margin-top:8px" onclick="Doctor.triage()">← Back to symptoms</button>');
      $("#ai-save").onclick = () => {
        DB.insert("diagnoses", { date: iso(today()), photo_id: Doctor.photoId, crop_id: cropId || null,
          symptoms: syms, result: txt.split("\n")[0].slice(0, 90), treatment: "", notes: txt, source:"ai" });
        Doctor.photoId = null; Doctor.picked = {}; closeSheet(); Doctor.render(); toast("Saved");
      };
    }catch(e){ toast("AI request failed: " + (e.message || "error")); }
  }
};
</script>
