<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Pocket Fertilizer</title>
<!-- ============================================================
     A SAFETY NET, NOT THE APP.

     The app lives in docs/, because GitHub Pages can serve a repo
     subfolder and that is what lets src/ live in the same repo and
     be version controlled.

     If Pages is set to "main / docs" this file is never served and
     does nothing. If Pages is pointed at the repo root instead —
     which is the default, and what it reverted to once — the root
     has no index.html, so Jekyll quietly renders README.md and the
     site looks like the app has been deleted. It has not. This
     forwards to the real thing so that failure is survivable.
     ============================================================ -->
<link rel="canonical" href="https://bzeitel25.github.io/pocket-fertilizer/docs/">
<meta http-equiv="refresh" content="0; url=./docs/">
<script>location.replace("./docs/" + location.search + location.hash);</script>
<style>
  body{font:16px/1.5 -apple-system,"Segoe UI",Roboto,sans-serif;background:#f6f8f5;color:#16211c;
       display:grid;place-items:center;min-height:100vh;margin:0;padding:24px;text-align:center}
  a{color:#1f6f4a;font-weight:700}
</style>
</head>
<body>
  <div>
    <div style="font-size:3rem">🌱</div>
    <h1 style="margin:.4em 0">Pocket Fertilizer</h1>
    <p>Taking you to the app…</p>
    <p><a href="./docs/">Open Pocket Fertilizer</a></p>
  </div>
</body>
</html>
