<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1">
<meta name="theme-color" content="#1f6f4a">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="mobile-web-app-capable" content="yes">
<meta name="referrer" content="no-referrer">
<title>Pocket Fertilizer</title>
<meta name="description" content="Garden planner, seed bank, grow calendar, plant doctor and a voice assistant. Offline first, encrypted on device.">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<meta name="apple-mobile-web-app-title" content="Pocket Fert">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ctext y='.9em' font-size='90'%3E%F0%9F%8C%B1%3C/text%3E%3C/svg%3E">
<style>
:root{
  --green-900:#0f3b28; --green-800:#165236; --green-700:#1f6f4a; --green-600:#2a8c5e;
  --green-500:#37a870; --green-300:#8fd9b6; --green-100:#e3f5ec;
  --earth:#8a6a4f; --earth-l:#c9ab8c;
  --sun:#f0a500; --sun-l:#ffd98a;
  --danger:#c9453c; --danger-l:#fde3e1;
  --warn:#d98324; --warn-l:#fdf0dd;
  --info:#2f6fb0; --info-l:#e3eefb;
  --bg:#f6f8f5; --surface:#ffffff; --surface-2:#f0f3ef; --line:#e2e7e0;
  --text:#16211c; --text-2:#5c6b62; --text-3:#8b9a91;
  --radius:16px; --radius-sm:10px; --radius-lg:24px;
  --shadow:0 1px 2px rgba(16,32,24,.06),0 8px 24px rgba(16,32,24,.06);
  --shadow-lg:0 8px 40px rgba(16,32,24,.18);
  --nav-h:64px;
  --safe-b:env(safe-area-inset-bottom,0px);
  --safe-t:env(safe-area-inset-top,0px);
  --ff:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;
}
html[data-theme="dark"]{
  --bg:#0e1512; --surface:#161f1a; --surface-2:#1d2822; --line:#2a3730;
  --text:#e8f0ea; --text-2:#9db0a5; --text-3:#6f8378;
  --green-100:#163024; --green-300:#4fbf8b; --danger-l:#3a1c1a; --warn-l:#3a2a15; --info-l:#152a3f;
  --shadow:0 1px 2px rgba(0,0,0,.4),0 8px 24px rgba(0,0,0,.35);
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0;height:100%}
body{
  font-family:var(--ff); background:var(--bg); color:var(--text);
  font-size:16px; line-height:1.45; overscroll-behavior-y:none;
  -webkit-font-smoothing:antialiased;
}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer;border:0;background:none}
a{color:var(--green-700);text-decoration:none}
h1,h2,h3,h4{margin:0;line-height:1.2;letter-spacing:-.02em}
h1{font-size:1.5rem;font-weight:700}
h2{font-size:1.15rem;font-weight:700}
h3{font-size:1rem;font-weight:650}
.muted{color:var(--text-2)}
.tiny{font-size:.75rem}
.sm{font-size:.85rem}
.b{font-weight:650}
.center{text-align:center}
.hide{display:none !important}
.row{display:flex;align-items:center;gap:10px}
.row.wrap{flex-wrap:wrap}
.between{justify-content:space-between}
.grow{flex:1;min-width:0}
.stack{display:flex;flex-direction:column;gap:12px}
.stack.sm{gap:8px}
.truncate{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}

#app{max-width:520px;margin:0 auto;min-height:100%;display:flex;flex-direction:column;position:relative;background:var(--bg)}
@media(min-width:560px){#app{box-shadow:0 0 0 1px var(--line)}}
header.appbar{
  position:sticky;top:0;z-index:40;padding:calc(var(--safe-t) + 10px) 16px 10px;
  background:var(--bg);
}
header.appbar .bar{display:flex;align-items:center;gap:10px;min-height:36px}
header.appbar .title{font-size:1.35rem;font-weight:750;letter-spacing:-.03em}
header.appbar .sub{font-size:.72rem;color:var(--text-2);margin-top:-2px}
.iconbtn{
  width:38px;height:38px;border-radius:12px;display:grid;place-items:center;
  background:var(--surface-2);color:var(--text);font-size:1.05rem;flex:0 0 auto;
  transition:transform .12s ease, background .12s ease;
}
.iconbtn:active{transform:scale(.92)}
main{flex:1;padding:4px 16px calc(var(--nav-h) + var(--safe-b) + 28px)}
.screen{display:none;animation:fade .22s ease}
.screen.active{display:block}
@keyframes fade{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}

nav.tabs{
  position:fixed;bottom:0;left:0;right:0;z-index:50;
  max-width:520px;margin:0 auto;
  padding:6px 4px calc(6px + var(--safe-b));
  background:var(--surface);
  border-top:1px solid var(--line);
  display:grid;grid-template-columns:repeat(6,1fr);gap:1px;
}
nav.tabs button{
  display:flex;flex-direction:column;align-items:center;gap:1px;
  padding:6px 1px;border-radius:11px;color:var(--text-3);font-size:.55rem;font-weight:600;
  transition:color .15s ease,background .15s ease;letter-spacing:-.01em;
}
nav.tabs button .ic{font-size:1.18rem;line-height:1.15;filter:grayscale(1) opacity(.65);transition:filter .15s}
nav.tabs button[data-tab="assist"]{color:var(--green-600)}
nav.tabs button[data-tab="assist"] .ic{filter:none}
nav.tabs button[data-tab="assist"]:not(.on){background:var(--green-100)}

/* ---- assistant ---- */
.bub{max-width:82%;padding:10px 13px;border-radius:16px;font-size:.9rem;line-height:1.45;word-wrap:break-word}
.bub.me{background:var(--green-700);color:#fff;border-bottom-right-radius:5px}
.bub.ai{background:var(--surface);border:1px solid var(--line);border-bottom-left-radius:5px;box-shadow:var(--shadow)}
.asbar{
  position:sticky;bottom:calc(var(--nav-h) + var(--safe-b) + 6px);z-index:20;
  display:flex;gap:7px;align-items:center;padding:7px;border-radius:16px;
  background:var(--surface);border:1px solid var(--line);box-shadow:var(--shadow);margin-top:10px;
}
.asbar input{border:0;background:transparent;padding:6px 2px;flex:1;min-width:0}
.asbar input:focus{box-shadow:none}
.asbar .iconbtn.send{background:var(--green-700);color:#fff;width:36px;height:36px;font-size:1.1rem;font-weight:700}
.asbar .iconbtn.mic-on{background:var(--danger);color:#fff;animation:pulse 1.1s ease-in-out infinite}
@keyframes pulse{0%,100%{transform:scale(1)}50%{transform:scale(1.12)}}
nav.tabs button.on{color:var(--green-700);background:var(--green-100)}
nav.tabs button.on .ic{filter:none}
html[data-theme="dark"] nav.tabs button.on{color:var(--green-300)}

.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);padding:14px;box-shadow:var(--shadow)}
.card.pad0{padding:0;overflow:hidden}
.card + .card{margin-top:12px}
.sec{margin:20px 0 10px;display:flex;align-items:baseline;justify-content:space-between;gap:8px}
.sec h2{font-size:.95rem;text-transform:uppercase;letter-spacing:.06em;color:var(--text-2);font-weight:700}
.hero{
  border-radius:var(--radius-lg);padding:16px;color:#fff;
  background:linear-gradient(135deg,#1f6f4a,#37a870 60%,#5cc08a);
  box-shadow:var(--shadow);position:relative;overflow:hidden;
}
.hero:after{content:"";position:absolute;right:-30px;top:-40px;width:160px;height:160px;border-radius:50%;background:rgba(255,255,255,.12)}
.hero .lbl{font-size:.7rem;text-transform:uppercase;letter-spacing:.1em;opacity:.85}
.stat{display:flex;flex-direction:column}
.stat .n{font-size:1.5rem;font-weight:750;letter-spacing:-.03em}
.stat .l{font-size:.68rem;text-transform:uppercase;letter-spacing:.06em;color:var(--text-2);font-weight:600}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}

.btn{
  display:inline-flex;align-items:center;justify-content:center;gap:7px;
  padding:11px 16px;border-radius:12px;font-weight:650;font-size:.92rem;
  background:var(--green-700);color:#fff;transition:transform .12s,filter .12s;
  border:1px solid transparent;
}
.btn:active{transform:scale(.97);filter:brightness(.95)}
.btn.block{display:flex;width:100%}
.btn.ghost{background:var(--surface-2);color:var(--text);border-color:var(--line)}
.btn.outline{background:transparent;color:var(--green-700);border-color:var(--green-700)}
.btn.danger{background:var(--danger)}
.btn.warn{background:var(--warn)}
.btn.sm{padding:7px 11px;font-size:.8rem;border-radius:10px}
.btn.xs{padding:5px 9px;font-size:.72rem;border-radius:9px}
.btn[disabled]{opacity:.45;pointer-events:none}
.chip{
  display:inline-flex;align-items:center;gap:5px;padding:5px 10px;border-radius:999px;
  background:var(--surface-2);border:1px solid var(--line);font-size:.75rem;font-weight:600;color:var(--text-2);
}
.chip.on{background:var(--green-700);border-color:var(--green-700);color:#fff}
.chip.good{background:var(--green-100);color:var(--green-700);border-color:transparent}
.chip.bad{background:var(--danger-l);color:var(--danger);border-color:transparent}
.chip.warn{background:var(--warn-l);color:var(--warn);border-color:transparent}
.chip.info{background:var(--info-l);color:var(--info);border-color:transparent}
html[data-theme="dark"] .chip.good{color:var(--green-300)}
.scroller{display:flex;gap:8px;overflow-x:auto;padding:2px 16px 6px;margin:0 -16px;scrollbar-width:none}
.scroller::-webkit-scrollbar{display:none}
.scroller > *{flex:0 0 auto}

label.f{display:block;font-size:.72rem;font-weight:700;text-transform:uppercase;letter-spacing:.05em;color:var(--text-2);margin-bottom:5px}
input[type=text],input[type=number],input[type=date],input[type=password],input[type=search],select,textarea{
  width:100%;padding:11px 12px;border-radius:12px;border:1px solid var(--line);
  background:var(--surface);color:var(--text);outline:none;transition:border-color .15s,box-shadow .15s;
  font-size:16px;
}
input:focus,select:focus,textarea:focus{border-color:var(--green-500);box-shadow:0 0 0 3px var(--green-100)}
textarea{min-height:80px;resize:vertical}
.field + .field{margin-top:12px}
.switch{position:relative;width:46px;height:28px;border-radius:999px;background:var(--line);transition:background .18s;flex:0 0 auto}
.switch:after{content:"";position:absolute;top:3px;left:3px;width:22px;height:22px;border-radius:50%;background:#fff;transition:transform .18s;box-shadow:0 1px 3px rgba(0,0,0,.25)}
.switch.on{background:var(--green-600)}
.switch.on:after{transform:translateX(18px)}
.seg{display:flex;background:var(--surface-2);border-radius:12px;padding:3px;gap:2px;border:1px solid var(--line)}
.seg button{flex:1;padding:8px 4px;border-radius:9px;font-size:.8rem;font-weight:650;color:var(--text-2)}
.seg button.on{background:var(--surface);color:var(--text);box-shadow:var(--shadow)}
.stepper{display:flex;align-items:center;gap:8px}
.stepper button{width:34px;height:34px;border-radius:10px;background:var(--surface-2);border:1px solid var(--line);font-size:1.1rem;font-weight:700;display:grid;place-items:center}
.stepper .v{min-width:34px;text-align:center;font-weight:700}

.list{display:flex;flex-direction:column}
.item{display:flex;align-items:center;gap:12px;padding:12px 14px;border-bottom:1px solid var(--line);background:var(--surface);width:100%;text-align:left}
.item:last-child{border-bottom:0}
.item .av{width:42px;height:42px;border-radius:12px;display:grid;place-items:center;font-size:1.35rem;background:var(--surface-2);flex:0 0 auto;overflow:hidden}
.item .av img{width:100%;height:100%;object-fit:cover}
.item .go{color:var(--text-3);font-size:1.1rem}

.scrim{position:fixed;inset:0;background:rgba(10,20,15,.5);z-index:60;opacity:0;pointer-events:none;transition:opacity .2s}
.scrim.on{opacity:1;pointer-events:auto}
.sheet{
  position:fixed;left:0;right:0;bottom:0;z-index:61;max-width:520px;margin:0 auto;
  background:var(--surface);border-radius:24px 24px 0 0;box-shadow:var(--shadow-lg);
  transform:translateY(102%);transition:transform .26s cubic-bezier(.32,.72,0,1);
  max-height:92vh;display:flex;flex-direction:column;
}
.sheet.on{transform:none}
.sheet .grab{width:38px;height:4px;border-radius:2px;background:var(--line);margin:10px auto 4px;flex:0 0 auto}
.sheet .shead{padding:6px 18px 10px;display:flex;align-items:center;gap:10px;border-bottom:1px solid var(--line)}
.sheet .sbody{padding:16px 18px calc(20px + var(--safe-b));overflow-y:auto;-webkit-overflow-scrolling:touch}
.toast{
  position:fixed;left:50%;bottom:calc(var(--nav-h) + var(--safe-b) + 16px);transform:translate(-50%,20px);
  background:var(--text);color:var(--bg);padding:10px 16px;border-radius:999px;font-size:.85rem;font-weight:600;
  z-index:90;opacity:0;pointer-events:none;transition:.24s;max-width:90vw;text-align:center;
}
.toast.on{opacity:1;transform:translate(-50%,0)}

.bedwrap{overflow:auto;padding:6px;background:var(--surface-2);border-radius:var(--radius);border:1px solid var(--line)}
.bed{display:grid;gap:3px;margin:0 auto;width:max-content;
  background:linear-gradient(135deg,#6b4f38,#8a6a4f);padding:6px;border-radius:10px;
  box-shadow:inset 0 0 0 3px rgba(0,0,0,.12);
}
.cell{
  width:var(--cs,46px);height:var(--cs,46px);border-radius:7px;
  background:#3d2c1e;display:grid;place-items:center;position:relative;
  font-size:calc(var(--cs,46px) * .5);line-height:1;
  box-shadow:inset 0 1px 0 rgba(255,255,255,.06);
  transition:transform .1s;
}
.cell:active{transform:scale(.9)}
.cell.filled{background:radial-gradient(circle at 50% 35%,#4a3625,#2c1f14)}
.cell.sel{outline:3px solid var(--sun);outline-offset:-3px;z-index:2}
.cell .qty{position:absolute;bottom:1px;right:2px;font-size:9px;background:rgba(0,0,0,.55);color:#fff;border-radius:4px;padding:0 3px;font-weight:700}
.cell .warnflag{position:absolute;top:0;left:2px;font-size:10px}
.cell .one{position:absolute;bottom:2px;left:0;right:0;text-align:center;font-size:9px;
  color:rgba(255,255,255,.82);font-weight:700;letter-spacing:.02em;text-transform:uppercase}
.cell .grip{position:absolute;right:-6px;bottom:-6px;width:22px;height:22px;border-radius:50%;
  background:var(--sun);border:2px solid #fff;box-shadow:0 2px 6px rgba(0,0,0,.35);cursor:nwse-resize;
  touch-action:none;z-index:5}
.cell .grip:after{content:"⤢";position:absolute;inset:0;display:grid;place-items:center;font-size:11px;color:#4a3200}
.bed{align-items:start;justify-items:start}
.bedtitle{display:flex;align-items:center;gap:8px;justify-content:space-between;margin-bottom:8px}

.cal{display:grid;grid-template-columns:repeat(7,1fr);gap:3px}
.cal .dow{font-size:.6rem;text-align:center;color:var(--text-3);font-weight:700;text-transform:uppercase;padding-bottom:2px}
.cal .d{aspect-ratio:1;border-radius:9px;background:var(--surface-2);display:flex;flex-direction:column;align-items:center;justify-content:center;font-size:.72rem;position:relative;border:1px solid transparent}
.cal .d.out{opacity:.28}
.cal .d.today{border-color:var(--green-600);font-weight:800;color:var(--green-700)}
.cal .d .dots{display:flex;gap:2px;margin-top:2px;height:5px}
.cal .d .dot{width:5px;height:5px;border-radius:50%}
.tl{position:relative;padding-left:22px}
.tl:before{content:"";position:absolute;left:7px;top:6px;bottom:6px;width:2px;background:var(--line)}
.tl .ev{position:relative;padding:8px 0}
.tl .ev:before{content:"";position:absolute;left:-19px;top:14px;width:10px;height:10px;border-radius:50%;background:var(--green-600);box-shadow:0 0 0 3px var(--bg)}

.bar-track{height:8px;border-radius:999px;background:var(--surface-2);overflow:hidden}
.bar-fill{height:100%;border-radius:999px;background:var(--green-600);transition:width .4s}
.note{padding:11px 13px;border-radius:12px;font-size:.82rem;line-height:1.45}
.note.i{background:var(--info-l);color:var(--info)}
.note.w{background:var(--warn-l);color:var(--warn)}
.note.d{background:var(--danger-l);color:var(--danger)}
.note.g{background:var(--green-100);color:var(--green-700)}
html[data-theme="dark"] .note.g{color:var(--green-300)}
html[data-theme="dark"] .note.i{color:#8fbdf0}
html[data-theme="dark"] .note.w{color:#f0c27a}
html[data-theme="dark"] .note.d{color:#f0a6a0}
.empty{text-align:center;padding:32px 16px;color:var(--text-2)}
.empty .e{font-size:2.6rem;opacity:.5;display:block;margin-bottom:8px}
.photo{width:100%;border-radius:var(--radius);display:block;background:var(--surface-2)}
video#camfeed{width:100%;border-radius:var(--radius);background:#000;display:block;aspect-ratio:3/4;object-fit:cover}
.spinner{width:18px;height:18px;border-radius:50%;border:2.5px solid var(--line);border-top-color:var(--green-600);animation:spin .7s linear infinite;display:inline-block;vertical-align:-3px}
@keyframes spin{to{transform:rotate(360deg)}}
table.mini{width:100%;border-collapse:collapse;font-size:.82rem}
table.mini th{text-align:left;font-size:.65rem;text-transform:uppercase;letter-spacing:.05em;color:var(--text-3);padding:6px 6px;border-bottom:1px solid var(--line)}
table.mini td{padding:8px 6px;border-bottom:1px solid var(--line)}
table.mini tr:last-child td{border-bottom:0}
code,pre{font-family:ui-monospace,SFMono-Regular,Menlo,monospace;font-size:.8rem}
pre{background:var(--surface-2);padding:12px;border-radius:12px;overflow:auto;margin:0}
.lock-screen{position:fixed;inset:0;z-index:100;background:linear-gradient(160deg,#165236,#37a870);display:flex;align-items:center;justify-content:center;padding:24px}
.lock-card{background:var(--surface);border-radius:24px;padding:24px;width:100%;max-width:380px;box-shadow:var(--shadow-lg)}
.swatch{width:14px;height:14px;border-radius:4px;flex:0 0 auto}
.ibtn{width:19px;height:19px;border-radius:50%;background:var(--surface-2);border:1px solid var(--line);
  color:var(--text-2);font-size:11px;font-weight:700;font-style:italic;line-height:1;display:inline-grid;
  place-items:center;flex:0 0 auto;font-family:Georgia,serif}
.ibtn:active{transform:scale(.9)}
#coach{position:sticky;top:calc(var(--safe-t) + 56px);z-index:45;max-width:520px;margin:0 auto;padding:0 16px}
#coach:empty{display:none}
.coach-card{background:var(--green-100);border:1px solid var(--green-300);border-radius:14px;padding:11px 12px;
  box-shadow:var(--shadow);animation:fade .2s ease}
html[data-theme="dark"] .coach-card{background:var(--green-100);border-color:var(--green-600)}
.coach-x{background:transparent;color:var(--text-2);font-size:1rem;line-height:1;padding:2px 4px;flex:0 0 auto}
</style>
</head>
<body>

<div id="app">
  <header class="appbar">
    <div class="bar">
      <div class="grow">
        <div class="title" id="scr-title">Pocket Fertilizer</div>
        <div class="sub" id="scr-sub">Loading…</div>
      </div>
      <button class="iconbtn" id="btn-theme" title="Toggle theme">◐</button>
      <button class="iconbtn" id="btn-more" title="Menu">☰</button>
    </div>
  </header>

  <div id="coach"></div>
  <main>
    <section class="screen active" id="s-home"></section>
    <section class="screen" id="s-garden"></section>
    <section class="screen" id="s-seeds"></section>
    <section class="screen" id="s-calendar"></section>
    <section class="screen" id="s-doctor"></section>
    <section class="screen" id="s-weather"></section>
    <section class="screen" id="s-assist"></section>
    <section class="screen" id="s-sources"></section>
    <section class="screen" id="s-help"></section>
    <section class="screen" id="s-journal"></section>
    <section class="screen" id="s-recap"></section>
    <section class="screen" id="s-library"></section>
    <section class="screen" id="s-settings"></section>
    <section class="screen" id="s-sql"></section>
  </main>

  <nav class="tabs">
    <button data-tab="home"><span class="ic">🏡</span><span>Home</span></button>
    <button data-tab="garden"><span class="ic">🪴</span><span>Garden</span></button>
    <button data-tab="seeds"><span class="ic">🌰</span><span>Seeds</span></button>
    <button data-tab="calendar"><span class="ic">🗓️</span><span>Calendar</span></button>
    <button data-tab="doctor"><span class="ic">🔬</span><span>Doctor</span></button>
    <button data-tab="assist"><span class="ic">✨</span><span>Ask</span></button>
  </nav>
</div>

<div class="scrim" id="scrim"></div>
<div class="sheet" id="sheet">
  <div class="grab"></div>
  <div class="shead">
    <h2 class="grow truncate" id="sheet-title">—</h2>
    <button class="iconbtn" id="sheet-close">✕</button>
  </div>
  <div class="sbody" id="sheet-body"></div>
</div>

<script>
/* ============================================================
   POCKET FERTILIZER — core: utilities, crypto, encrypted SQLite
   ============================================================ */
"use strict";

/* ---------- tiny DOM utils ---------- */
const $  = (s, r) => (r || document).querySelector(s);
const $$ = (s, r) => Array.prototype.slice.call((r || document).querySelectorAll(s));
const esc = s => String(s === null || s === undefined ? "" : s)
  .replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;")
  .replace(/"/g,"&quot;").replace(/'/g,"&#39;");
const uid = () => Date.now().toString(36) + Math.random().toString(36).slice(2, 8);
const clamp = (n, a, b) => Math.max(a, Math.min(b, n));
const num = (v, d) => { const n = parseFloat(v); return isFinite(n) ? n : (d || 0); };

/* ---------- dates ---------- */
const DAY = 86400000;
function today(){ const d = new Date(); d.setHours(0,0,0,0); return d; }
function iso(d){ if(!d) return ""; const x = (d instanceof Date) ? d : new Date(d);
  return x.getFullYear() + "-" + String(x.getMonth()+1).padStart(2,"0") + "-" + String(x.getDate()).padStart(2,"0"); }
function parseISO(s){ if(!s) return null; const p = String(s).split("-");
  if(p.length < 3) return null; const d = new Date(+p[0], +p[1]-1, +p[2]); d.setHours(0,0,0,0); return d; }
function addDays(d, n){ const x = new Date(d instanceof Date ? d.getTime() : parseISO(d).getTime()); x.setDate(x.getDate()+n); x.setHours(0,0,0,0); return x; }
function diffDays(a, b){ const A = a instanceof Date ? a : parseISO(a), B = b instanceof Date ? b : parseISO(b);
  return Math.round((B - A) / DAY); }
const MON = ["Jan","Feb","Mar","Apr","May","Jun","Jul","Aug","Sep","Oct","Nov","Dec"];
const MONF = ["January","February","March","April","May","June","July","August","September","October","November","December"];
const DOW = ["Sun","Mon","Tue","Wed","Thu","Fri","Sat"];
function fmt(d){ const x = d instanceof Date ? d : parseISO(d); if(!x) return "—";
  return MON[x.getMonth()] + " " + x.getDate(); }
function fmtY(d){ const x = d instanceof Date ? d : parseISO(d); if(!x) return "—";
  return MON[x.getMonth()] + " " + x.getDate() + ", " + x.getFullYear(); }
function relDay(d){ const n = diffDays(today(), d instanceof Date ? d : parseISO(d));
  if(n === 0) return "today"; if(n === 1) return "tomorrow"; if(n === -1) return "yesterday";
  if(n > 0) return "in " + n + " days"; return Math.abs(n) + " days ago"; }

/* ---------- UI helpers ---------- */

/* ============================================================
   CRYPTO — WebCrypto AES-256-GCM, PBKDF2-SHA256 key derivation
   ============================================================ */
const Crypto = (() => {
  const subtle = (window.crypto && window.crypto.subtle) ? window.crypto.subtle : null;
  const ITER = 310000;
  const enc = new TextEncoder(), dec = new TextDecoder();

  function rand(n){ const a = new Uint8Array(n); (window.crypto || {}).getRandomValues
      ? window.crypto.getRandomValues(a) : a.forEach((_, i) => a[i] = Math.floor(Math.random()*256)); return a; }
  function b64(bytes){ let s = ""; const b = new Uint8Array(bytes);
    for(let i=0;i<b.length;i+=0x8000) s += String.fromCharCode.apply(null, b.subarray(i, i+0x8000));
    return btoa(s); }
  function unb64(str){ const s = atob(str); const a = new Uint8Array(s.length);
    for(let i=0;i<s.length;i++) a[i] = s.charCodeAt(i); return a; }

  async function importRaw(bytes){
    return subtle.importKey("raw", bytes, {name:"AES-GCM"}, true, ["encrypt","decrypt"]);
  }
  async function deriveKEK(pass, salt){
    const base = await subtle.importKey("raw", enc.encode(pass), "PBKDF2", false, ["deriveKey"]);
    return subtle.deriveKey({name:"PBKDF2", salt: salt, iterations: ITER, hash:"SHA-256"},
      base, {name:"AES-GCM", length:256}, false, ["encrypt","decrypt"]);
  }
  async function encryptWith(key, bytes){
    const iv = rand(12);
    const ct = await subtle.encrypt({name:"AES-GCM", iv: iv}, key, bytes);
    const out = new Uint8Array(12 + ct.byteLength);
    out.set(iv, 0); out.set(new Uint8Array(ct), 12);
    return out;
  }
  async function decryptWith(key, bytes){
    const b = new Uint8Array(bytes);
    const pt = await subtle.decrypt({name:"AES-GCM", iv: b.slice(0,12)}, key, b.slice(12));
    return new Uint8Array(pt);
  }
  return {
    available: !!subtle, rand, b64, unb64, importRaw, deriveKEK, encryptWith, decryptWith,
    ITER, enc, dec,
    async newDEK(){ return importRaw(rand(32)); },
    async exportKey(k){ return new Uint8Array(await subtle.exportKey("raw", k)); }
  };
})();

/* ============================================================
   VAULT — key management (device key or passphrase-wrapped key)
   ============================================================ */
const Vault = (() => {
  const META = "pf.vault.v1";
  let DEK = null, meta = null;

  function readMeta(){ try{ return JSON.parse(localStorage.getItem(META) || "null"); }catch(e){ return null; } }
  function writeMeta(m){ meta = m; localStorage.setItem(META, JSON.stringify(m)); }

  async function initDevice(){
    const raw = Crypto.rand(32);
    DEK = await Crypto.importRaw(raw);
    writeMeta({ mode:"device", dek: Crypto.b64(raw), created: Date.now(), iter: Crypto.ITER });
    return DEK;
  }
  async function unlockDevice(m){ DEK = await Crypto.importRaw(Crypto.unb64(m.dek)); return DEK; }

  async function unlockPass(m, pass){
    const kek = await Crypto.deriveKEK(pass, Crypto.unb64(m.salt));
    const raw = await Crypto.decryptWith(kek, Crypto.unb64(m.wrapped)); // throws on wrong pass
    DEK = await Crypto.importRaw(raw);
    return DEK;
  }
  async function setPassphrase(pass){
    if(!DEK) throw new Error("locked");
    const raw = await Crypto.exportKey(DEK);
    const salt = Crypto.rand(16);
    const kek = await Crypto.deriveKEK(pass, salt);
    const wrapped = await Crypto.encryptWith(kek, raw);
    writeMeta({ mode:"pass", salt: Crypto.b64(salt), wrapped: Crypto.b64(wrapped),
                created: (meta && meta.created) || Date.now(), iter: Crypto.ITER });
  }
  async function removePassphrase(){
    if(!DEK) throw new Error("locked");
    const raw = await Crypto.exportKey(DEK);
    writeMeta({ mode:"device", dek: Crypto.b64(raw), created:(meta && meta.created) || Date.now(), iter: Crypto.ITER });
  }
  return {
    get meta(){ return meta || (meta = readMeta()); },
    get mode(){ const m = meta || readMeta(); return m ? m.mode : null; },
    get unlocked(){ return !!DEK; },
    exists(){ return !!readMeta(); },
    initDevice, unlockDevice, unlockPass, setPassphrase, removePassphrase,
    async encrypt(bytes){ return Crypto.encryptWith(DEK, bytes); },
    async decrypt(bytes){ return Crypto.decryptWith(DEK, bytes); },
    load(){ meta = readMeta(); return meta; },
    wipe(){ localStorage.removeItem(META); DEK = null; meta = null; }
  };
})();

/* ============================================================
   BLOB STORE — IndexedDB with localStorage fallback
   ============================================================ */
const Blobs = (() => {
  const DBN = "pocket_fertilizer", STORE = "kv";
  let idb = null, ready = false;
  function open(){
    return new Promise(res => {
      if(!window.indexedDB) return res(null);
      let req;
      try{ req = indexedDB.open(DBN, 1); }catch(e){ return res(null); }
      req.onupgradeneeded = () => { try{ req.result.createObjectStore(STORE); }catch(e){} };
      req.onsuccess = () => res(req.result);
      req.onerror = () => res(null);
      setTimeout(() => res(null), 2500);
    });
  }
  async function init(){ if(ready) return; idb = await open(); ready = true; }
  async function get(k){
    await init();
    if(idb) return new Promise(res => {
      try{ const r = idb.transaction(STORE,"readonly").objectStore(STORE).get(k);
        r.onsuccess = () => res(r.result || null); r.onerror = () => res(null);
      }catch(e){ res(null); }
    });
    const s = localStorage.getItem("pf.blob." + k);
    return s ? Crypto.unb64(s) : null;
  }
  async function set(k, bytes){
    await init();
    if(idb) return new Promise((res, rej) => {
      try{ const t = idb.transaction(STORE,"readwrite"); t.objectStore(STORE).put(bytes, k);
        t.oncomplete = () => res(true); t.onerror = () => rej(t.error);
      }catch(e){ rej(e); }
    });
    localStorage.setItem("pf.blob." + k, Crypto.b64(bytes)); return true;
  }
  async function del(k){ await init(); if(idb){ try{ idb.transaction(STORE,"readwrite").objectStore(STORE).delete(k); }catch(e){} }
    localStorage.removeItem("pf.blob." + k); }
  return { get, set, del, get backend(){ return idb ? "IndexedDB" : "localStorage"; } };
})();
</script>
<script>
/* ============================================================
   DB — SQLite (sql.js / WASM) mirrored from an encrypted JSON vault
   Vault JSON is the source of truth on disk (always available,
   always AES-GCM encrypted). SQLite is rebuilt from it at open so
   every table is queryable/exportable as a real .sqlite file.
   ============================================================ */
const SCHEMA = {
  plots:      ["id","name","notes","created"],
  beds:       ["id","plot_id","name","cols","rows","cell_in","sun_hours","sun_exposure","soil","irrigation","notes","created"],
  plantings:  ["id","bed_id","x","y","w","h","span_mode","crop_id","variety","variety_id","seed_id","qty","status","sown_on","transplant_on","harvest_from","harvest_to","removed_on","notes","created"],
  varieties:  ["id","crop_id","name","dtm","habit","resistance","spacing_in","notes","source","created"],
  maturity:   ["id","crop_id","variety","days","sown_on","harvested_on","planting_id","bed_id","note","created"],
  seeds:      ["id","crop_id","name","variety","brand","lot","qty","unit","packed_year","exp_date","germ_rate","cost","photo_id","source","notes","created"],
  events:     ["id","date","type","title","crop_id","seed_id","bed_id","planting_id","notes","done","auto","created"],
  journal:    ["id","date","type","bed_id","planting_id","crop_id","amount","unit","cost","minutes","product","notes","photo_id","created"],
  harvests:   ["id","date","planting_id","bed_id","crop_id","weight","unit","count","value","notes","created"],
  diagnoses:  ["id","date","planting_id","bed_id","crop_id","photo_id","symptoms","result","confidence","treatment","source","notes","created"],
  observations:["id","date","bed_id","ph","moisture","soil_temp","air_temp","rain_in","notes","created"],
  photos:     ["id","created","mime","w","h","data"],
  settings:   ["key","value"]
};
const SQLJS_VER = "1.10.3";
const SQLJS_CDN = "https://cdnjs.cloudflare.com/ajax/libs/sql.js/" + SQLJS_VER + "/";

const DB = (() => {
  const cache = {}; Object.keys(SCHEMA).forEach(t => cache[t] = []);
  let settings = {};
  let sql = null, sdb = null, engine = "memory", saveT = null, dirty = false, loaded = false;

  /* ---- sql.js bootstrap (optional, non-blocking) ---- */
  function loadScript(src){
    return new Promise((res, rej) => {
      const s = document.createElement("script");
      s.src = src; s.async = true; s.crossOrigin = "anonymous";
      s.onload = res; s.onerror = () => rej(new Error("cdn"));
      document.head.appendChild(s);
      setTimeout(() => rej(new Error("timeout")), 12000);
    });
  }
  async function initSqlite(){
    try{
      if(!window.initSqlJs) await loadScript(SQLJS_CDN + "sql-wasm.js");
      sql = await window.initSqlJs({ locateFile: f => SQLJS_CDN + f });
      sdb = new sql.Database();
      createSchema();
      engine = "sqlite";
      return true;
    }catch(e){ engine = "memory"; return false; }
  }
  function createSchema(){
    Object.keys(SCHEMA).forEach(t => {
      const cols = SCHEMA[t].map(c => '"' + c + '"' + (c === "id" || c === "key" ? " TEXT PRIMARY KEY" : " TEXT")).join(", ");
      sdb.run('CREATE TABLE IF NOT EXISTS "' + t + '" (' + cols + ');');
    });
    sdb.run('CREATE INDEX IF NOT EXISTS ix_plantings_bed ON plantings(bed_id);');
    sdb.run('CREATE INDEX IF NOT EXISTS ix_events_date ON events(date);');
    sdb.run('CREATE INDEX IF NOT EXISTS ix_harvests_crop ON harvests(crop_id);');
    sdb.run('CREATE INDEX IF NOT EXISTS ix_seeds_crop ON seeds(crop_id);');
  }
  function hydrateSqlite(){
    if(engine !== "sqlite") return;
    try{
      sdb.run("BEGIN;");
      Object.keys(SCHEMA).forEach(t => {
        sdb.run('DELETE FROM "' + t + '";');
        const cols = SCHEMA[t];
        const stmt = sdb.prepare('INSERT INTO "' + t + '" VALUES (' + cols.map(() => "?").join(",") + ');');
        cache[t].forEach(r => { stmt.run(cols.map(c => r[c] === undefined || r[c] === null ? null : String(r[c]))); });
        stmt.free();
      });
      const st = sdb.prepare('INSERT INTO settings VALUES (?,?);');
      Object.keys(settings).forEach(k => st.run([k, JSON.stringify(settings[k])]));
      st.free();
      sdb.run("COMMIT;");
    }catch(e){ try{ sdb.run("ROLLBACK;"); }catch(e2){} }
  }
  function sqlWrite(op, table, row, id){
    if(engine !== "sqlite") return;
    try{
      const cols = SCHEMA[table];
      if(op === "insert"){
        const stmt = sdb.prepare('INSERT OR REPLACE INTO "' + table + '" VALUES (' + cols.map(() => "?").join(",") + ');');
        stmt.run(cols.map(c => row[c] === undefined || row[c] === null ? null : String(row[c]))); stmt.free();
      } else if(op === "delete"){
        const key = table === "settings" ? "key" : "id";
        const stmt = sdb.prepare('DELETE FROM "' + table + '" WHERE ' + key + ' = ?;');
        stmt.run([String(id)]); stmt.free();
      }
    }catch(e){ console.warn("sql write", e); }
  }

  /* ---- persistence (encrypted JSON vault) ---- */
  function serialize(){
    return JSON.stringify({ v: 1, saved: Date.now(), settings: settings, tables: cache });
  }
  async function persist(){
    if(!Vault.unlocked) return;
    const bytes = Crypto.enc.encode(serialize());
    const ct = await Vault.encrypt(bytes);
    try{ await Blobs.set("vault", ct); dirty = false; }
    catch(e){ toast("⚠️ Storage full — export a backup"); console.error(e); }
  }
  function save(){ dirty = true; clearTimeout(saveT); saveT = setTimeout(persist, 350); }
  async function flush(){ clearTimeout(saveT); if(dirty) await persist(); }

  async function load(){
    const ct = await Blobs.get("vault");
    if(ct){
      const pt = await Vault.decrypt(ct);            // throws if key is wrong
      const obj = JSON.parse(Crypto.dec.decode(pt));
      settings = obj.settings || {};
      Object.keys(SCHEMA).forEach(t => cache[t] = (obj.tables && obj.tables[t]) || []);
    }
    loaded = true;
  }

  /* ---- repository API ---- */
  const api = {
    get engine(){ return engine; },
    get backend(){ return Blobs.backend; },
    get loaded(){ return loaded; },
    all: t => cache[t] || [],
    find: (t, id) => (cache[t] || []).find(r => r.id === id) || null,
    where: (t, fn) => (cache[t] || []).filter(fn),
    count: t => (cache[t] || []).length,

    insert(t, obj){
      const row = Object.assign({ id: uid(), created: new Date().toISOString() }, obj);
      SCHEMA[t].forEach(c => { if(!(c in row)) row[c] = null; });
      cache[t].push(row); sqlWrite("insert", t, row); save();
      return row;
    },
    update(t, id, patch){
      const row = api.find(t, id); if(!row) return null;
      Object.assign(row, patch); sqlWrite("insert", t, row); save();
      return row;
    },
    remove(t, id){
      const i = cache[t].findIndex(r => r.id === id); if(i < 0) return false;
      cache[t].splice(i, 1); sqlWrite("delete", t, null, id); save();
      return true;
    },
    bulkRemove(t, fn){
      const gone = cache[t].filter(fn);
      gone.forEach(r => api.remove(t, r.id));
      return gone.length;
    },

    /* settings */
    get(k, d){ return (k in settings) ? settings[k] : d; },
    set(k, v){
      settings[k] = v;
      if(engine === "sqlite"){ sqlWrite("delete", "settings", null, k); sqlWrite("insert", "settings", {key:k, value:JSON.stringify(v)}); }
      save(); return v;
    },
    get settings(){ return settings; },

    /* raw SQL (read/write) for the built-in console */
    query(q){
      if(engine !== "sqlite") throw new Error("SQL engine unavailable offline — showing cached data only.");
      const res = sdb.exec(q);
      return res.map(r => ({ cols: r.columns, rows: r.values }));
    },
    exportSqlite(){
      if(engine !== "sqlite") return null;
      hydrateSqlite();
      return sdb.export();
    },
    exportJSON(){ return serialize(); },
    async importJSON(text){
      const obj = JSON.parse(text);
      if(!obj || !obj.tables) throw new Error("Not a Pocket Fertilizer backup");
      settings = obj.settings || {};
      Object.keys(SCHEMA).forEach(t => cache[t] = obj.tables[t] || []);
      hydrateSqlite(); await persist();
    },
    async wipeAll(){
      Object.keys(SCHEMA).forEach(t => cache[t] = []);
      settings = {}; hydrateSqlite(); await persist();
    },
    initSqlite, hydrateSqlite, load, save, flush, persist
  };
  return api;
})();

/* ---------- photos (stored inside the encrypted vault) ---------- */
const Photos = {
  put(dataUrl, w, h){
    const m = /^data:([^;]+);base64,(.*)$/.exec(dataUrl || "");
    if(!m) return null;
    return DB.insert("photos", { mime: m[1], data: m[2], w: w || null, h: h || null }).id;
  },
  url(id){
    if(!id) return null;
    const p = DB.find("photos", id);
    return p ? "data:" + p.mime + ";base64," + p.data : null;
  },
  drop(id){ if(id) DB.remove("photos", id); },
  bytes(){ return DB.all("photos").reduce((a, p) => a + (p.data ? p.data.length * 0.75 : 0), 0); }
};

/* ---------- image downscaling (keeps the vault small) ---------- */
function shrinkImage(file, maxPx, quality){
  return new Promise((res, rej) => {
    const fr = new FileReader();
    fr.onload = () => {
      const img = new Image();
      img.onload = () => {
        const s = Math.min(1, (maxPx || 900) / Math.max(img.width, img.height));
        const w = Math.round(img.width * s), h = Math.round(img.height * s);
        const c = document.createElement("canvas"); c.width = w; c.height = h;
        c.getContext("2d").drawImage(img, 0, 0, w, h);
        res({ dataUrl: c.toDataURL("image/jpeg", quality || 0.72), w: w, h: h, canvas: c });
      };
      img.onerror = () => rej(new Error("bad image"));
      img.src = fr.result;
    };
    fr.onerror = () => rej(new Error("read failed"));
    fr.readAsDataURL(file);
  });
}

/* ---------- companion logic ---------- */
function pairRating(aId, bId){
  const a = CROP[aId], b = CROP[bId];
  if(!a || !b) return { score: 0, label: "unknown", why: "" };
  if(aId === bId) return { score: 0, label: "same", why: "Same crop" };
  const aFoe = (a.foes || []).indexOf(bId) >= 0, bFoe = (b.foes || []).indexOf(aId) >= 0;
  const aFam = (a.foes || []).indexOf(b.fam) >= 0;
  if(aFoe || bFoe || aFam) return { score: -2, label: "avoid", why: a.n + " and " + b.n + " compete or share pests/diseases." };
  const aC = (a.comp || []).indexOf(bId) >= 0, bC = (b.comp || []).indexOf(aId) >= 0;
  if(aC && bC) return { score: 2, label: "great", why: "Classic companions — both sides benefit." };
  if(aC || bC) return { score: 1, label: "good", why: (aC ? b.n + " helps " + a.n : a.n + " helps " + b.n) + "." };
  if(a.fam === b.fam) return { score: -1, label: "caution", why: "Same family (" + FAMILY[a.fam].n + ") — shares pests and depletes the same nutrients. Fine together, but rotate them as a group." };
  return { score: 0, label: "neutral", why: "No known interaction — safe to plant together." };
}
function companionsFor(id){
  const c = CROP[id]; if(!c) return { good: [], bad: [] };
  const good = (c.comp || []).filter(x => CROP[x]);
  CROPS.forEach(o => { if(o.id !== id && (o.comp || []).indexOf(id) >= 0 && good.indexOf(o.id) < 0) good.push(o.id); });
  const bad = (c.foes || []).filter(x => CROP[x]);
  CROPS.forEach(o => { if(o.id !== id && (o.foes || []).indexOf(id) >= 0 && bad.indexOf(o.id) < 0) bad.push(o.id); });
  return { good: good, bad: bad };
}

<script>
/* ============================================================
   LIVE DATA — all free, no API key, CORS-enabled
     phzmapi.org ............ USDA hardiness zone by US ZIP
     open-meteo geocoding ... place -> lat/lon (worldwide)
     open-meteo archive ..... 10y daily lows -> real frost dates
     open-meteo forecast .... 7-day weather, rain, frost alerts
     wikipedia REST ......... live plant reference lookups
   Every call degrades gracefully to offline defaults.
   ============================================================ */
const ZONE_FROST = {
  "2":["06-01","08-30"], "3":["05-25","09-10"], "4":["05-18","09-21"], "5":["05-08","10-05"],
  "6":["04-25","10-17"], "7":["04-08","11-02"], "8":["03-24","11-18"], "9":["02-20","12-10"],
  "10":["01-20","12-26"], "11":["01-01","12-31"], "12":["01-01","12-31"], "13":["01-01","12-31"]
};

const Live = (() => {
  const TO = 12000;
  function jget(url){
    const ctl = ("AbortController" in window) ? new AbortController() : null;
    const t = setTimeout(() => { if(ctl) ctl.abort(); }, TO);
    return fetch(url, { signal: ctl ? ctl.signal : undefined, referrerPolicy:"no-referrer", credentials:"omit", mode:"cors" })
      .then(r => { if(!r.ok) throw new Error("HTTP " + r.status); return r.json(); })
      .finally(() => clearTimeout(t));
  }

  /* ---- location ---- */
  async function byZip(zip){
    const z = String(zip).trim();
    if(/^\d{5}$/.test(z)){
      try{
        const d = await jget("https://phzmapi.org/" + z + ".json");
        return { zip: z, zone: d.zone, lat: parseFloat(d.coordinates.lat), lon: parseFloat(d.coordinates.lon),
                 label: "ZIP " + z, tempRange: d.temperature_range, src: "phzmapi" };
      }catch(e){ /* fall through to place search */ }
    }
    const g = await jget("https://geocoding-api.open-meteo.com/v1/search?count=1&format=json&language=en&name=" + encodeURIComponent(z));
    if(!g.results || !g.results.length) throw new Error("Couldn't find that place");
    const r = g.results[0];
    return { zip: null, zone: null, lat: r.latitude, lon: r.longitude,
             label: [r.name, r.admin1, r.country_code].filter(Boolean).join(", "), src: "open-meteo" };
  }
  async function byGPS(){
    const p = await new Promise((res, rej) => {
      if(!navigator.geolocation) return rej(new Error("No GPS"));
      navigator.geolocation.getCurrentPosition(res, rej, { timeout: 10000, maximumAge: 600000 });
    });
    return { zip: null, zone: null, lat: p.coords.latitude, lon: p.coords.longitude, label: "Current location", src: "gps" };
  }

  /* ---- frost dates from 10 years of real daily lows ---- */
  async function frostDates(lat, lon){
    const end = new Date(); end.setDate(end.getDate() - 5);
    const y = end.getFullYear();
    const start = new Date(y - 10, 0, 1);
    const url = "https://archive-api.open-meteo.com/v1/archive?latitude=" + lat.toFixed(3) + "&longitude=" + lon.toFixed(3) +
      "&start_date=" + iso(start) + "&end_date=" + iso(end) +
      "&daily=temperature_2m_min&temperature_unit=fahrenheit&timezone=auto";
    const d = await jget(url);
    const days = d.daily.time, mins = d.daily.temperature_2m_min;
    const lastByYear = {}, firstByYear = {}, coldByYear = {};
    for(let i = 0; i < days.length; i++){
      const t = mins[i]; if(t === null || t === undefined) continue;
      const dt = parseISO(days[i]); const yr = dt.getFullYear();
      const doy = Math.round((dt - new Date(yr, 0, 1)) / DAY);
      if(coldByYear[yr] === undefined || t < coldByYear[yr]) coldByYear[yr] = t;
      if(t <= 32){
        if(doy < 200){ if(lastByYear[yr] === undefined || doy > lastByYear[yr]) lastByYear[yr] = doy; }
        else { if(firstByYear[yr] === undefined || doy < firstByYear[yr]) firstByYear[yr] = doy; }
      }
    }
    const med = o => { const v = Object.keys(o).map(k => o[k]).sort((a,b) => a-b);
      return v.length ? v[Math.floor(v.length/2)] : null; };
    const lastDoy = med(lastByYear), firstDoy = med(firstByYear);
    const avgLow = (() => { const v = Object.keys(coldByYear).map(k => coldByYear[k]);
      return v.length ? v.reduce((a,b) => a+b, 0) / v.length : null; })();
    const yr = today().getFullYear();
    const mmdd = doy => doy === null ? null : iso(addDays(new Date(yr, 0, 1), doy)).slice(5);
    return {
      lastFrost: mmdd(lastDoy), firstFrost: mmdd(firstDoy),
      season: (lastDoy !== null && firstDoy !== null) ? (firstDoy - lastDoy) : null,
      avgAnnualLow: avgLow === null ? null : Math.round(avgLow),
      zoneFromLow: avgLow === null ? null : zoneFromLow(avgLow),
      years: Object.keys(coldByYear).length, src: "open-meteo archive (10-yr median)"
    };
  }
  function zoneFromLow(f){
    const z = Math.floor((f + 60) / 10) + 1;
    const half = ((f + 60) % 10) >= 5 ? "b" : "a";
    return clamp(z, 1, 13) + half;
  }

  /* ---- forecast ---- */
  async function forecast(lat, lon){
    const url = "https://api.open-meteo.com/v1/forecast?latitude=" + lat.toFixed(3) + "&longitude=" + lon.toFixed(3) +
      "&current=temperature_2m,relative_humidity_2m,precipitation,weather_code,wind_speed_10m" +
      "&daily=weather_code,temperature_2m_max,temperature_2m_min,precipitation_sum,et0_fao_evapotranspiration,sunrise,sunset,uv_index_max" +
      "&past_days=7&forecast_days=7&temperature_unit=fahrenheit&precipitation_unit=inch&wind_speed_unit=mph&timezone=auto";
    return jget(url);
  }
  const WMO = {0:["Clear","☀️"],1:["Mostly clear","🌤️"],2:["Partly cloudy","⛅"],3:["Overcast","☁️"],
    45:["Fog","🌫️"],48:["Rime fog","🌫️"],51:["Light drizzle","🌦️"],53:["Drizzle","🌦️"],55:["Heavy drizzle","🌦️"],
    61:["Light rain","🌧️"],63:["Rain","🌧️"],65:["Heavy rain","🌧️"],66:["Freezing rain","🌨️"],67:["Freezing rain","🌨️"],
    71:["Light snow","🌨️"],73:["Snow","❄️"],75:["Heavy snow","❄️"],77:["Snow grains","❄️"],
    80:["Showers","🌦️"],81:["Showers","🌧️"],82:["Violent showers","⛈️"],85:["Snow showers","🌨️"],86:["Snow showers","❄️"],
    95:["Thunderstorm","⛈️"],96:["Thunderstorm + hail","⛈️"],99:["Severe thunderstorm","⛈️"]};
  function wx(code){ return WMO[code] || ["—","🌡️"]; }

  /* ---- wikipedia ---- */
  async function wiki(term){
    const s = await jget("https://en.wikipedia.org/w/api.php?action=query&list=search&srlimit=1&format=json&origin=*&srsearch=" +
      encodeURIComponent(term));
    const hit = s.query && s.query.search && s.query.search[0];
    if(!hit) throw new Error("No article found");
    const sum = await jget("https://en.wikipedia.org/api/rest_v1/page/summary/" + encodeURIComponent(hit.title.replace(/ /g,"_")));
    return { title: sum.title, extract: sum.extract,
             thumb: sum.thumbnail ? sum.thumbnail.source : null,
             url: (sum.content_urls && sum.content_urls.desktop) ? sum.content_urls.desktop.page : null };
  }
  return { byZip, byGPS, frostDates, forecast, wiki, wx, zoneFromLow, jget };
})();

/* ============================================================
   SEASON MATH — frost dates -> real planting dates
   ============================================================ */
const Season = {
  get zone(){ return DB.get("zone", null); },
  get lastFrostISO(){
    const md = DB.get("lastFrost", null); if(!md) return null;
    return today().getFullYear() + "-" + md;
  },
  get firstFrostISO(){
    const md = DB.get("firstFrost", null); if(!md) return null;
    return today().getFullYear() + "-" + md;
  },
  fallbackFrom(zone){
    const z = String(zone || "6").replace(/[ab]/i, "");
    return ZONE_FROST[z] || ZONE_FROST["6"];
  },
  lastFrost(){ const s = Season.lastFrostISO; return s ? parseISO(s) : null; },
  firstFrost(){ const s = Season.firstFrostISO; return s ? parseISO(s) : null; },
  seasonDays(){ const a = Season.lastFrost(), b = Season.firstFrost(); return (a && b) ? diffDays(a, b) : null; },

  /* every sow/plant window for a crop, as real dates this year */
  windows(cropId){
    const c = crop(cropId); if(!c) return [];
    const LF = Season.lastFrost(), FF = Season.firstFrost();
    if(!LF || !FF) return [];
    const w = [], s = c.start || {};
    const W = n => addDays(LF, Math.round(n * 7));
    if(s.indoor !== undefined && s.indoor !== null)
      w.push({ kind:"indoor", label:"Start indoors", date: W(s.indoor), icon:"🏠",
               window: 14, note:"Sow in trays " + Math.abs(s.indoor) + " weeks " + (s.indoor < 0 ? "before" : "after") + " last frost." });
    if(s.tp !== undefined && s.tp !== null)
      w.push({ kind:"transplant", label:"Transplant out", date: W(s.tp), icon:"🌱",
               window: 21, note: s.tp < 0 ? "Goes out before last frost — it takes light cold." : "Wait until frost risk is gone." });
    if(s.direct !== undefined && s.direct !== null)
      w.push({ kind:"direct", label:"Direct sow", date: W(s.direct), icon:"🌰", window: 21, note:"Sow straight into the bed." });
    if(s.fall !== undefined && s.fall !== null && s.fall !== 0 && !s.fallPlant){
      const d = addDays(FF, Math.round(s.fall * 7));
      w.push({ kind:"fall", label:"Fall sowing", date: d, icon:"🍂", window: 14,
               note:"Sow " + Math.abs(s.fall) + " weeks before first frost for a fall harvest." });
    }
    if(s.fallPlant !== undefined && s.fallPlant !== null){
      const d = addDays(FF, Math.round(s.fallPlant * 7));
      w.push({ kind:"fall", label:"Plant in fall", date: d, icon:"🍂", window: 21,
               note:"Overwinters — plant " + Math.abs(s.fallPlant) + " weeks before first frost." });
    }
    return w;
  },

  /* is this crop plantable within N days of today? */
  status(cropId, slack){
    const sl = slack === undefined ? 12 : slack;
    const ws = Season.windows(cropId), t = today();
    let best = null;
    ws.forEach(w => {
      const from = addDays(w.date, -sl), to = addDays(w.date, w.window);
      const inWin = t >= from && t <= to;
      const days = diffDays(t, w.date);
      const cand = { w: w, inWindow: inWin, days: days, soon: days > 0 && days <= 30 };
      if(inWin && (!best || !best.inWindow)) best = cand;
      else if(!best) best = cand;
      else if(!best.inWindow && Math.abs(days) < Math.abs(best.days)) best = cand;
    });
    return best;
  },

  /* projected harvest from a sow/transplant date */
  harvestFrom(cropId, startISO, kind){
    const c = crop(cropId); if(!c || !startISO) return null;
    let d = parseISO(startISO); if(!d) return null;
    if(c.from === "transplant" && (kind === "indoor" || kind === "seed")){
      const s = c.start || {};
      const wk = (s.tp !== undefined && s.indoor !== undefined && s.tp !== null && s.indoor !== null) ? (s.tp - s.indoor) : 5;
      d = addDays(d, Math.round(wk * 7));
    }
    return addDays(d, c.dtm);
  },

  /* days until the first fall frost closes the window */
  daysLeft(){ const ff = Season.firstFrost(); return ff ? diffDays(today(), ff) : null; },

  /* can this crop still finish before frost if started today? */
  stillFits(cropId){
    const c = crop(cropId), left = Season.daysLeft();
    if(!c || left === null) return null;
    return { fits: left >= c.dtm + 7, left: left, needs: c.dtm };
  }
};

/* ============================================================
   RECOMMENDATION ENGINE
   ============================================================ */
const Recommend = {
  /* what should go in the ground right now */
  now(opts){
    const o = opts || {};
    const bed = o.bedId ? DB.find("beds", o.bedId) : null;
    const sunHours = o.sun !== undefined ? o.sun : (bed ? num(bed.sun_hours, 8) : 8);
    const occupants = bed ? DB.where("plantings", p => p.bed_id === bed.id && p.status !== "removed").map(p => p.crop_id) : [];
    const recentFams = bed ? Recommend.recentFamilies(bed.id) : {};
    const stock = {}; DB.all("seeds").forEach(s => { if(s.crop_id) stock[s.crop_id] = (stock[s.crop_id] || 0) + 1; });

    const out = [];
    CROPS.forEach(c => {
      const st = Season.status(c.id, o.slack === undefined ? 10 : o.slack);
      if(!st || !st.inWindow) return;
      let score = 50; const why = [], warn = [];
      why.push(st.w.icon + " " + st.w.label + " window is open " + (st.days === 0 ? "today" : (st.days > 0 ? "(peak " + relDay(st.w.date) + ")" : "(opened " + relDay(st.w.date) + ")")));

      if(sunHours >= c.sun){ score += 12; }
      else if(sunHours >= c.sun - 2){ score -= 8; warn.push("Wants " + c.sun + "h sun, this spot gets " + sunHours + "h — expect a lighter crop."); }
      else { score -= 30; warn.push("Needs " + c.sun + "h of sun; " + sunHours + "h is not enough."); }

      const fits = Season.stillFits(c.id);
      if(fits && !fits.fits && st.w.kind !== "fall" && st.w.kind !== "indoor"){
        score -= 25; warn.push("Needs " + fits.needs + " days and only " + fits.left + " remain before first frost.");
      }

      let comp = 0;
      occupants.forEach(oc => {
        const r = pairRating(c.id, oc);
        if(r.score >= 2){ comp += 8; why.push("💚 Great next to your " + cropName(oc)); }
        else if(r.score === 1){ comp += 4; why.push("🙂 Pairs well with your " + cropName(oc)); }
        else if(r.score <= -2){ comp -= 16; warn.push("⚠️ Keep away from your " + cropName(oc) + " — " + r.why); }
        else if(r.score === -1){ comp -= 5; warn.push("Same family as your " + cropName(oc) + "."); }
      });
      score += clamp(comp, -30, 24);

      if(recentFams[c.fam]){ score -= 14; warn.push("A " + FAMILY[c.fam].n.toLowerCase() + " grew here " + recentFams[c.fam] + " — rotate if you can."); }
      if(stock[c.id]){ score += 10; why.push("🌰 You already have seed for this"); }

      out.push({ crop: c, score: score, window: st.w, days: st.days, why: why, warn: warn, hasSeed: !!stock[c.id] });
    });
    return out.sort((a, b) => b.score - a.score);
  },

  recentFamilies(bedId){
    const out = {}, cut = addDays(today(), -730);
    DB.where("plantings", p => p.bed_id === bedId).forEach(p => {
      const c = crop(p.crop_id); if(!c) return;
      const d = parseISO(p.sown_on || p.created && p.created.slice(0,10));
      if(d && d >= cut) out[c.fam] = (d.getFullYear() === today().getFullYear() ? "this season" : "last season");
    });
    return out;
  },

  /* best companions for what's already in a bed */
  forBed(bedId){
    const occ = DB.where("plantings", p => p.bed_id === bedId && p.status !== "removed").map(p => p.crop_id);
    if(!occ.length) return [];
    const tally = {};
    occ.forEach(id => {
      const cc = companionsFor(id);
      cc.good.forEach(g => { if(occ.indexOf(g) < 0) tally[g] = (tally[g] || 0) + 1; });
    });
    return Object.keys(tally).map(id => ({ id: id, n: tally[id] })).sort((a,b) => b.n - a.n).slice(0, 8);
  },

  /* conflicts currently planted in a bed */
  conflicts(bedId){
    const ps = DB.where("plantings", p => p.bed_id === bedId && p.status !== "removed");
    const out = [];
    for(let i = 0; i < ps.length; i++) for(let j = i + 1; j < ps.length; j++){
      if(ps[i].crop_id === ps[j].crop_id) continue;
      const r = pairRating(ps[i].crop_id, ps[j].crop_id);
      if(r.score <= -2){
        const dist = Math.abs(num(ps[i].x) - num(ps[j].x)) + Math.abs(num(ps[i].y) - num(ps[j].y));
        if(dist <= 4) out.push({ a: ps[i], b: ps[j], why: r.why, dist: dist });
      }
    }
    return out;
  },

  /* watering call for a bed, from crop needs + real rainfall */
  water(bedId, weather){
    const ps = DB.where("plantings", p => p.bed_id === bedId && p.status !== "removed");
    if(!ps.length) return null;
    let need = 0;
    ps.forEach(p => { const c = crop(p.crop_id); if(c) need = Math.max(need, c.water); });
    let rain = 0;
    if(weather && weather.daily){
      const t = iso(today());
      weather.daily.time.forEach((d, i) => {
        const dd = diffDays(parseISO(d), today());
        if(dd >= 0 && dd < 7) rain += num(weather.daily.precipitation_sum[i]);
      });
    }
    const logged = DB.where("journal", j => j.bed_id === bedId && j.type === "water" && diffDays(parseISO(j.date), today()) < 7)
      .reduce((a, j) => a + num(j.amount), 0);
    const deficit = need - rain - logged;
    return { need: need, rain: Math.round(rain * 100) / 100, logged: Math.round(logged * 100) / 100,
             deficit: Math.round(deficit * 100) / 100,
             verdict: deficit <= 0.05 ? "skip" : (deficit < 0.5 ? "light" : "water") };
  }
};

<script>
/* ============================================================

const APP = { tab: "home", weather: null, wxAt: 0, bedId: null, plotId: null, month: null, dx: null };

const TABS = {

function go(tab, opts){
  APP.tab = tab;
  $$(".screen").forEach(s => s.classList.remove("active"));
  const el = $("#s-" + tab); if(el) el.classList.add("active");
  $$("nav.tabs button").forEach(b => b.classList.toggle("on", b.dataset.tab === tab));
  const meta = TABS[tab] || TABS.home;
  $("#scr-title").textContent = meta.t;
  $("#scr-sub").textContent = meta.s;
  window.scrollTo(0, 0);
  render(tab, opts);
}
function render(tab, opts){
  const fn = ({ home: Home, garden: Garden, seeds: Seeds, calendar: Cal, doctor: Doctor,
                weather: Weather, assist: Assist, sources: Sources, help: Help,
                journal: Journal, recap: Recap, library: Library, settings: Settings, sql: SqlView })[tab];
  if(fn && fn.render) fn.render(opts);
}
function refresh(){ render(APP.tab); }

/* ---------- weather cache ---------- */
async function getWeather(force){
  const lat = DB.get("lat"), lon = DB.get("lon");
  if(!lat || !lon) return null;
  if(!force && APP.weather && Date.now() - APP.wxAt < 30 * 60 * 1000) return APP.weather;
  try{
    APP.weather = await Live.forecast(lat, lon);
    APP.wxAt = Date.now();
    DB.set("wxCache", { at: Date.now(), data: APP.weather });
  }catch(e){
    const c = DB.get("wxCache");
    if(c && c.data){ APP.weather = c.data; APP.wxAt = c.at; }
  }
  return APP.weather;
}

const Onboard = {
  open(){
    openSheet("Where do you garden?",
      '<p class="muted sm" style="margin-top:0">Your ZIP unlocks your USDA zone, ten-year median frost dates, and live weather. Nothing leaves your device except the lookup itself.</p>' +
      '<div class="field"><label class="f">US ZIP code or place name</label>' +
      '<input type="text" id="ob-zip" placeholder="97202 or Portland, Oregon" autocomplete="postal-code"></div>' +
      '<div class="row" style="margin-top:12px;gap:8px">' +
        '<button class="btn grow" id="ob-go">Look it up</button>' +
        '<button class="btn ghost" id="ob-gps" title="Use GPS">📍</button>' +
      '</div>' +
      '<div id="ob-out" style="margin-top:14px"></div>');
    $("#ob-go").onclick = () => Onboard.lookup($("#ob-zip").value);
    $("#ob-gps").onclick = () => Onboard.lookup(null, true);
    $("#ob-zip").addEventListener("keydown", e => { if(e.key === "Enter") Onboard.lookup($("#ob-zip").value); });
    const z = DB.get("zip"); if(z) $("#ob-zip").value = z;
  },

  async lookup(q, gps){
    const out = $("#ob-out");
    if(!gps && !String(q || "").trim()){ out.innerHTML = '<div class="note d">Enter a ZIP or a place name.</div>'; return; }
    out.innerHTML = '<div class="row"><span class="spinner"></span><span class="sm muted">Finding your zone…</span></div>';
    let loc;
    try{ loc = gps ? await Live.byGPS() : await Live.byZip(q); }
    catch(e){ out.innerHTML = '<div class="note d">' + esc(e.message || "Lookup failed") + '. Check your connection, or set frost dates manually in Settings.</div>'; return; }

    out.innerHTML = '<div class="row"><span class="spinner"></span><span class="sm muted">Reading 10 years of local frost history…</span></div>';
    let fr = null;
    try{ fr = await Live.frostDates(loc.lat, loc.lon); }catch(e){ /* fallback below */ }

    const zone = loc.zone || (fr && fr.zoneFromLow) || "6b";
    let lastF, firstF, src;
    if(fr && fr.lastFrost && fr.firstFrost){ lastF = fr.lastFrost; firstF = fr.firstFrost; src = fr.src; }
    else { const f = Season.fallbackFrom(zone); lastF = f[0]; firstF = f[1]; src = "zone average (offline estimate)"; }

    DB.set("zip", loc.zip || String(q || "").trim());
    DB.set("locLabel", loc.label);
    DB.set("lat", loc.lat); DB.set("lon", loc.lon);
    DB.set("zone", zone);
    DB.set("lastFrost", lastF); DB.set("firstFrost", firstF);
    DB.set("frostSrc", src);
    if(fr && fr.avgAnnualLow !== null && fr.avgAnnualLow !== undefined) DB.set("avgLow", fr.avgAnnualLow);
    DB.set("onboarded", true);

    const yr = today().getFullYear();
    out.innerHTML =
      '<div class="note g"><div class="b" style="font-size:1rem">Zone ' + esc(zone) + ' · ' + esc(loc.label) + '</div>' +
      '<div style="margin-top:6px">❄️ Last spring frost <b>' + fmt(yr + "-" + lastF) + '</b><br>' +
      '🍂 First fall frost <b>' + fmt(yr + "-" + firstF) + '</b><br>' +
      '🌱 Growing season <b>' + diffDays(parseISO(yr + "-" + lastF), parseISO(yr + "-" + firstF)) + ' days</b></div>' +
      '<div class="tiny" style="margin-top:6px;opacity:.8">Source: ' + esc(src) + (fr && fr.avgAnnualLow !== null && fr.avgAnnualLow !== undefined ? ' · avg annual low ' + fr.avgAnnualLow + '°F' : '') + '</div></div>' +
      '<button class="btn block" style="margin-top:12px" onclick="closeSheet();Cal.rebuild();refresh();toast(\'Location saved\')">Use these dates</button>' +
      '<button class="btn ghost block" style="margin-top:8px" onclick="closeSheet();go(\'settings\')">Adjust manually</button>';
    await getWeather(true);
  }
};
