/* ============================================================
   THE GARDEN MAP — real outlines, and beds that snap together
   ============================================================ */
Gmap.bedFeet = function(b){ return Geom.footprintFt(b); };

/* every corner of everything else, as somewhere this bed could latch on */
Gmap.snapTargets = function(plotId, exceptId){
  const out = [];
  Gmap.items(plotId).forEach(i => {
    if(i.id === exceptId || i.x === null || i.y === null) return;
    if(i.kind === "bed"){
      Geom.cornersFt(i.row).forEach(c => out.push(c));
    } else {
      out.push([i.x, i.y], [i.x + i.size.w, i.y], [i.x, i.y + i.size.h], [i.x + i.size.w, i.y + i.size.h]);
    }
  });
  return out;
};

/* offset that lands one of this item's corners exactly on one of theirs */
Gmap.snapOffset = function(item, nx, ny, targets, tol){
  const dx = nx - item.x, dy = ny - item.y;
  let mine;
  if(item.kind === "bed"){
    mine = Geom.cornersFt(item.row).map(c => [c[0] + dx, c[1] + dy]);
  } else {
    mine = [[nx, ny], [nx + item.size.w, ny], [nx, ny + item.size.h], [nx + item.size.w, ny + item.size.h]];
  }
  let best = null, bd = tol === undefined ? 0.45 : tol;
  mine.forEach(m => {
    const t = Geom.nearest(m[0], m[1], targets, bd);
    if(!t) return;
    const d = Math.hypot(t[0] - m[0], t[1] - m[1]);
    if(d < bd){ bd = d; best = [t[0] - m[0], t[1] - m[1]]; }
  });
  return best;
};

Gmap.dragStart = function(ev, el){
  if(!Gmap.arrange) return;
  ev.preventDefault();
  const id = el.dataset.id, kind = el.dataset.kind;
  const table = kind === "bed" ? "beds" : "mapitems";
  const row = DB.find(table, id); if(!row) return;
  const plotId = APP.plotId && DB.find("plots", APP.plotId) ? APP.plotId : null;
  const item = Gmap.items(plotId).find(i => i.id === id); if(!item) return;
  const targets = Gmap.snapTargets(plotId, id);
  const ppf = Gmap._ppf;
  const sx = ev.clientX, sy = ev.clientY;
  const ox = num(row.mx, 0), oy = num(row.my, 0);
  el._moved = false;
  let snapped = false;

  const move = e => {
    const dxf = (e.clientX - sx) / ppf, dyf = (e.clientY - sy) / ppf;
    if(Math.abs(e.clientX - sx) > 4 || Math.abs(e.clientY - sy) > 4) el._moved = true;
    let nx = Math.max(0, Math.round((ox + dxf) * 4) / 4);
    let ny = Math.max(0, Math.round((oy + dyf) * 4) / 4);
    const off = Gmap.snapOffset(Object.assign({}, item, { x: ox, y: oy }), nx, ny, targets);
    if(off){ nx = Math.max(0, nx + off[0]); ny = Math.max(0, ny + off[1]);
      if(!snapped){ snapped = true; haptic(); }
      el.classList.add("snapped");
    } else { snapped = false; el.classList.remove("snapped"); }
    el.style.left = Math.round(nx * ppf) + "px";
    el.style.top = Math.round(ny * ppf) + "px";
    el._nx = nx; el._ny = ny;
  };
  const up = () => {
    window.removeEventListener("pointermove", move);
    window.removeEventListener("pointerup", up);
    el.classList.remove("snapped");
    if(el._moved && el._nx !== undefined){
      DB.update(table, id, { mx: el._nx, my: el._ny });
      Gmap.sel = id; haptic(); Garden.render();
      if(snapped) toast("Snapped corner to corner");
    }
  };
  window.addEventListener("pointermove", move);
  window.addEventListener("pointerup", up);
};

/* ============================================================
   MAKING AND RESIZING A BED
   ============================================================ */
Garden.newBed = function(){
  const plots = DB.all("plots");
  let h = '<div class="field"><label class="f">Bed name</label><input type="text" id="nb-name" placeholder="Raised bed 1"></div>';
  h += '<div class="tiny b muted" style="text-transform:uppercase;letter-spacing:.06em;margin:14px 0 6px">Outline</div>';
  h += '<div class="shapegrid">';
  Object.keys(Geom.SHAPES).forEach((k, i) => {
    if(k === "poly") return;
    const s = Geom.SHAPES[k];
    h += '<button class="' + (i === 0 ? "on" : "") + '" data-shape="' + k + '">' +
      '<div class="g">' + s.e + '</div><div class="n">' + esc(s.n) + '</div></button>';
  });
  h += '</div>';
  h += '<div class="grid2" style="margin-top:14px">' +
    '<div><label class="f">Width (feet)</label><input type="number" id="nb-w" value="4" min="1" max="40" step="0.5"></div>' +
    '<div><label class="f">Depth (feet)</label><input type="number" id="nb-h" value="8" min="1" max="40" step="0.5"></div></div>';
  h += '<div class="grid2" style="margin-top:12px">' +
    '<div><label class="f">Direct sun (hrs)</label><input type="number" id="nb-sun" value="8" min="0" max="16"></div>' +
    '<div><label class="f">Square size (in)</label><input type="number" id="nb-cell" value="12" min="3" max="48"></div></div>';
  if(plots.length) h += '<div class="field"><label class="f">Plot</label><select id="nb-plot"><option value="">— none —</option>' +
    plots.map(p => '<option value="' + p.id + '"' + (APP.plotId === p.id ? " selected" : "") + '>' + esc(p.name) + '</option>').join("") + '</select></div>';
  h += '<div class="note i" style="margin-top:12px">Plants go anywhere inside the outline — no grid unless you ask for one. The square size only sets the optional overlay, and how far plants jump when you snap them to it.</div>';
  h += '<button class="btn block" style="margin-top:14px" onclick="Garden.saveNewBed()">Create bed</button>';
  openSheet("New bed", h);
  $$("#sheet-body .shapegrid button").forEach(b => b.onclick = () =>
    $$("#sheet-body .shapegrid button").forEach(x => x.classList.toggle("on", x === b)));
  setTimeout(() => { const el = $("#nb-name"); if(el) el.focus(); }, 300);
};

Garden.saveNewBed = function(){
  const sel = $("#sheet-body .shapegrid button.on");
  const shape = sel ? sel.dataset.shape : "rect";
  const cell = clamp(num(($("#nb-cell") || {}).value, 12), 3, 48);
  const wIn = Math.round(clamp(num(($("#nb-w") || {}).value, 4), 1, 40) * 12);
  const hIn = Math.round(clamp(num(($("#nb-h") || {}).value, 8), 1, 40) * 12);
  const b = DB.insert("beds", {
    name: (($("#nb-name") || {}).value || "").trim() || ("Bed " + (DB.count("beds") + 1)),
    shape: shape, w_in: wIn, h_in: hIn, cell_in: cell, grid_on: 0, snap_in: 0,
    cols: Math.max(1, Math.round(wIn / cell)), rows: Math.max(1, Math.round(hIn / cell)),
    sun_hours: num(($("#nb-sun") || {}).value, 8),
    plot_id: (($("#nb-plot") || {}).value) || APP.plotId || null
  });
  closeSheet(); Garden.open(b.id);
  toast("Bed created — tap the soil to plant");
};

/* the old cols/rows resize still works; it just moves the outline */
Garden.resize = function(dc, dr){
  const b = Geom.bed(DB.find("beds", APP.bedId)); if(!b) return;
  const cell = Garden.cell(b);
  const cols = clamp(num(b.cols, 4) + num(dc, 0), 1, 40);
  const rows = clamp(num(b.rows, 4) + num(dr, 0), 1, 40);
  DB.update("beds", b.id, { cols: cols, rows: rows, w_in: cols * cell, h_in: rows * cell });
  const bb = DB.find("beds", b.id);
  let moved = 0;
  Geom.live(b.id).forEach(p => {
    const fit = Geom.clampInto(Geom.bed(bb), Geom.PX(p), Geom.PY(p), Math.min(Geom.RR(p), 2));
    if(fit.clamped || fit.tight){
      DB.update("plantings", p.id, { px: Math.round(fit.x*10)/10, py: Math.round(fit.y*10)/10 });
      moved++;
    }
  });
  Garden.render();
  if(moved) toast(moved + " plant" + (moved > 1 ? "s" : "") + " moved back inside");
};

/* a way into the shape sheet from bed settings */
(function shapeInMenu(){
  const orig = Garden.bedMenu.bind(Garden);
  Garden.bedMenu = function(){
    orig();
    const body = $("#sheet-body"); if(!body || !APP.bedId) return;
    body.insertAdjacentHTML("afterbegin",
      '<button class="btn ghost block" style="margin-bottom:12px" onclick="closeSheet();setTimeout(function(){Shape.open(\'' +
      APP.bedId + '\')},250)">◈ Shape and size</button>');
  };
})();

/* draw the bed's real outline on the map rather than a stand-in box */
(function shapedMap(){
  const orig = Gmap.render.bind(Gmap);
  Gmap.render = function(){
    orig();
    $$("#mapplot .mapbed").forEach(el => {
      const b = DB.find("beds", el.dataset.id); if(!b) return;
      const bb = Geom.bed(b);
      const rot = num(bb.rot) === 90;
      const w = rot ? Geom.H(bb) : Geom.W(bb), h = rot ? Geom.W(bb) : Geom.H(bb);
      const s = Geom.shape(bb);
      let inner;
      if(Geom.isRound(s)) inner = '<ellipse cx="50" cy="50" rx="50" ry="50" fill="#8a6a4f" stroke="#5d4634" stroke-width="2"/>';
      else {
        const pts = Geom.pts(bb).map(p => {
          let x = p[0] / Geom.W(bb) * 100, y = p[1] / Geom.H(bb) * 100;
          if(rot){ const t = x; x = 100 - y; y = t; }
          return (Math.round(x*10)/10) + " " + (Math.round(y*10)/10);
        });
        inner = '<path d="M' + pts.join("L") + 'Z" fill="#8a6a4f" stroke="#5d4634" stroke-width="2"/>';
      }
      el.insertAdjacentHTML("afterbegin",
        '<svg class="mapshape" viewBox="0 0 100 100" preserveAspectRatio="none" ' +
        'style="position:absolute;inset:0;width:100%;height:100%;z-index:-1">' + inner + '</svg>');
    });
    Gmap.bind();
  };
})();
</script>

<script>
/* ============================================================
   GROWTH HABIT — how big it actually gets

   The canvas draws two circles per plant, so it needs two numbers
   the crop table never carried: how wide the mature foliage spreads,
   and how tall the plant stands. Guessing them would have made a
   very convincing-looking picture of nothing.

   The default is derived, not invented: in-row spacing IS a spread
   figure. Extension services set spacing from how wide the plant
   gets, so canopy diameter ≈ recommended spacing is a sound baseline
   for anything that behaves itself.

   It is wrong in one direction and badly so: sprawlers. A cucumber
   is spaced 12″ in the row and then runs two to three feet either
   side of it. Those crops, and the tall ones that decide who gets
   shaded, are corrected here against sources read on the
   publisher's own site — the same corrections-layer pattern
   p5b_sources.js uses for the crop table.

   Where no source states a figure, none is invented. The crop falls
   back to the derived rule and says so.
   ============================================================ */

/* the flower and herb pages are already loaded by p5c; reuse them rather than
   citing the same page twice under two names */
const HABIT_SRC = Object.assign({}, typeof GARDEN_SRC === "undefined" ? {} : GARDEN_SRC, {
  ilTomato: {
    n:"Tomato — Hort Answers", org:"University of Illinois Extension",
    url:"https://web.extension.illinois.edu/hortanswers/plantdetail.cfm?PlantID=294&PlantTypeID=9",
    what:"“Most modern determinate tomatoes easily grow 3 to 4 feet tall and indeterminates … easily reaching at least 6 feet.” Spacing: dwarf 12″, staked 15–24″, trellised or ground bed 24–36″, vigorous indeterminates 4 ft."
  },
  umnCuke: {
    n:"Growing cucumbers in home gardens", org:"University of Minnesota Extension",
    url:"https://extension.umn.edu/vegetables/growing-cucumbers",
    what:"Vining types need “about two or three feet of space on either side of the row for the vines to spread”; 5–6 ft between hills. Trellises of 3–4 ft let rows be spaced closer."
  },
  umnSquash: {
    n:"Growing pumpkins and winter squash in home gardens", org:"University of Minnesota Extension",
    url:"https://extension.umn.edu/vegetables/pumpkins-and-winter-squash",
    what:"Bush or short-vined 2–3 ft apart in rows 3–5 ft; large-vined 3–5 ft apart in rows 6–8 ft. Roots spread about as far as the vines."
  },
  umnSummer: {
    n:"Growing summer squash and zucchini in home gardens", org:"University of Minnesota Extension",
    url:"https://extension.umn.edu/vegetables/growing-summer-squash-and-zucchini",
    what:"Bush-type plants that “do not spread like the plants of fall and winter squash and pumpkin”; mounds 4 ft apart, or single plants 24–36″ apart."
  },
  ilWatermelon: {
    n:"Watermelon — Home Vegetable Gardening", org:"University of Illinois Extension",
    url:"https://extension.illinois.edu/gardening/watermelon",
    what:"Hills 6 ft apart with 7–10 ft between rows; alternatively plants 5–6 ft apart in rows 6–8 ft apart."
  },
  ilMuskmelon: {
    n:"Muskmelon — Home Vegetable Gardening", org:"University of Illinois Extension",
    url:"https://extension.illinois.edu/gardening/muskmelon",
    what:"Thin to 18–24″ apart in the row, rows at least 5 ft apart."
  },
  ilOkra: {
    n:"Okra — Home Vegetable Gardening", org:"University of Illinois Extension",
    url:"https://extension.illinois.edu/gardening/okra",
    what:"Plants grow 3 to 6 ft or more; dwarf basal-branching types such as Annie Oakley 2½–5 ft."
  },
  ilBrussels: {
    n:"Brussels Sprouts — Home Vegetable Gardening", org:"University of Illinois Extension",
    url:"https://extension.illinois.edu/gardening/brussels-sprouts",
    what:"Plants reach 24–36″ in height, and are set 24″ apart in rows 30–36″ apart."
  },
  umnBeans: {
    n:"Growing beans in home gardens", org:"University of Minnesota Extension",
    url:"https://extension.umn.edu/vegetables/growing-beans",
    what:"Pole beans are twining vines growing up to six feet and sometimes taller, and must be supported."
  },
  hgicPepper: {
    n:"Pepper (HGIC 1323)", org:"Clemson Cooperative Extension",
    url:"https://hgic.clemson.edu/factsheet/pepper/",
    what:"Peppers grow more slowly and are smaller than most tomato plants; set transplants 18–24″ apart in the row, or 14–18″ apart in all directions in beds."
  },
  ilCorn: {
    n:"Sweet corn — Hort Answers", org:"University of Illinois Extension",
    url:"https://web.extension.illinois.edu/hortanswers/plantdetail.cfm?PlantID=289&PlantTypeID=9",
    what:"Kernels 9–12″ apart in the row, 30–36″ between rows; side-dress when plants are 12–18″ tall. The page gives no mature height, so the figure used here is an estimate."
  }
});

/* spread is the mature FOLIAGE DIAMETER in inches; height is the mature
   height in inches. `est:true` means the source does not state that figure
   and the app is estimating it — those are shown as estimates in the UI. */
const HABIT = {
  /* --- sprawlers: the whole reason this layer exists --- */
  cucumber:     { spread: 60, height: 16, src:"umnCuke",
                  note:"Unsupported vines run 2–3 ft either side of the row. On a trellis they take barely more than their 12″ spacing — drag the ring in if yours are climbing." },
  zucchini:     { spread: 42, height: 26, src:"umnSummer", estHeight:true,
                  note:"A bush, not a vine — big leaves on a compact plant. Mounds are set 4 ft apart." },
  wintersquash: { spread: 84, height: 16, src:"umnSquash", estHeight:true,
                  note:"Large-vined types are planted 3–5 ft apart in rows 6–8 ft apart, and the roots reach about as far as the vines." },
  pumpkin:      { spread: 96, height: 16, src:"umnSquash", estHeight:true,
                  note:"Needs 6–8 ft between mounds. This is the plant most likely to swallow a small bed." },
  watermelon:   { spread: 84, height: 14, src:"ilWatermelon", estHeight:true,
                  note:"Hills 6 ft apart, 7–10 ft between rows." },
  melon:        { spread: 60, height: 14, src:"ilMuskmelon", estHeight:true,
                  note:"Thinned to 18–24″ in the row with rows 5 ft apart." },

  /* --- the tall ones, which decide who gets shaded --- */
  tomato:       { spread: 30, height: 60, src:"ilTomato",
                  note:"Determinates 3–4 ft, indeterminates 6 ft and upward. 60″ splits the two; a caged indeterminate will beat it." },
  pepper:       { spread: 20, height: 30, src:"hgicPepper", estHeight:true,
                  note:"Smaller than a tomato; set 18–24″ apart in the row." },
  okra:         { spread: 24, height: 60, src:"ilOkra", estSpread:true,
                  note:"3–6 ft or more, so it shades whatever stands north of it. Dwarf types 2½–5 ft." },
  brussels:     { spread: 24, height: 30, src:"ilBrussels", estSpread:true,
                  note:"24–36″ tall by harvest, and top-heavy with it — give it firm ground and room to reach." },
  polebean:     { spread: 12, height: 72, src:"umnBeans", estSpread:true,
                  note:"Twining to 6 ft and often taller. Narrow, but it casts a long shadow." },
  corn:         { spread: 14, height: 78, src:"ilCorn", estHeight:true,
                  note:"Extension guides give spacing (9–12″ in rows 30–36″ apart) but not a mature height; 6½ ft is a working estimate for a full-season variety." },

  /* --- flowers, tea and the beneficial-insect plants --- */
  lavender:     { spread: 30, height: 24, src:"usuLavender",
                  note:"English lavender makes 1–2 ft tall and 2–3 ft wide. Wider than it is high, which is why 18–24″ spacing looks generous and is not." },
  anisehyssop:  { spread: 24, height: 36, src:"wiscHyssop",
                  note:"Upright clumps 2–4 ft tall and 1–3 ft across." },
  yarrow:       { spread: 24, height: 24, src:"hgicYarrow",
                  note:"1–3 ft tall and about as wide, spaced 12–18″. It will keep going past that by rhizome if you let it." },
  alyssum:      { spread: 12, height: 6, src:"hgicAlyssum",
                  note:"Only 3–6″ high from seed but spreading a foot or more — it fills an edge without taking headroom off anything." },
  zinnia:       { spread: 12, height: 30, src:"hgicZinnia",
                  note:"8″ to 4 ft by cultivar. This is the common 2–3 ft sort, thinned to a foot apart." },
  lemonbalm:    { spread: 24, height: 24, src:"usuBalm", estSpread:true,
                  note:"10–24″ tall. Spread follows its 18″ spacing; left to seed it covers considerably more." },
  chamomile:    { spread: 12, height: 30, src:"ncsuToolbox", estSpread:true,
                  note:"13–30″ tall. The source gives height but not width." },
  beebalm:      { spread: 24, height: 36, src:"ncsuToolbox", estSpread:true,
                  note:"2–4 ft tall. Some kinds run at the root and will exceed any spread figure given for them." },
  echinacea:    { spread: 24, height: 42, src:"ncsuToolbox", estSpread:true,
                  note:"3–4 ft tall. Plan for the second year — from seed it usually roots the first and flowers the next." },
  cosmos:       { spread: 18, height: 48, src:"ilFlowers", estSpread:true,
                  note:"1–6 ft depending on the sort. Tall enough to shade a bed, so put it on the north side." },
  cornflower:   { spread: 10, height: 24, src:"ncsuToolbox", estSpread:true,
                  note:"1–3 ft. Narrow and upright — it slots between things." },
  phacelia:     { spread: 12, height: 30, src:"ncsuToolbox", estSpread:true, estHeight:true,
                  note:"Sown broadcast as a strip rather than spaced as individuals; the figures here describe one plant in a bed." }
};

/* Everything else derives from the crop table's own spacing figure, which is
   already reconciled against primary sources in p5b_sources.js. A handful of
   growth habits genuinely sit either side of "as wide as it is spaced":
   alliums are narrow uprights, herbs and brassicas bush out past theirs. */
const SPREAD_FAM = {
  allium: 0.72, poaceae: 0.85, apiaceae: 0.95, aster: 1.05, chenopod: 1.10,
  brassica: 1.15, lamiaceae: 1.20, legume: 1.05, solanaceae: 1.10,
  cucurbit: 1.60, tropaeolaceae: 1.40, boraginaceae: 1.30, convolvulaceae: 1.80
};

const Habit = {
  SRC: HABIT_SRC, TABLE: HABIT, FAM: SPREAD_FAM,

  row(cropId){ return HABIT[cropId] || null; },

  /* mature foliage diameter in inches, for one plant */
  spread(cropId){
    const h = HABIT[cropId];
    if(h && h.spread) return h.spread;
    const c = crop(cropId);
    if(!c) return 12;
    return Math.round(num(c.sp, 12) * (SPREAD_FAM[c.fam] || 1.05));
  },
  height(cropId){
    const h = HABIT[cropId];
    if(h && h.height) return h.height;
    return Geom.HEIGHT_FALLBACK(cropId);
  },
  /* where each figure came from, so the UI never states an estimate as fact */
  provenance(cropId){
    const h = HABIT[cropId];
    const c = crop(cropId);
    if(!h) return {
      spread: { value: Habit.spread(cropId), derived: true,
        how: "Derived from the " + (c ? num(c.sp, 12) : 12) + "″ spacing this crop is given, adjusted for growth habit." },
      height: { value: Habit.height(cropId), derived: true,
        how: "Estimated from growth habit. No extension source consulted states a mature height for this crop." },
      src: null
    };
    const s = HABIT_SRC[h.src];
    return {
      spread: { value: h.spread, derived: !!h.estSpread,
        how: h.estSpread ? "Estimated; the source below gives height rather than spread." : "From the source below." },
      height: { value: h.height, derived: !!h.estHeight,
        how: h.estHeight ? "Estimated; the source below gives spacing rather than a mature height." : "From the source below." },
      note: h.note, src: s || null
    };
  }
};

/* ---- fold the sourced figures into the geometry ---- */
Geom.HEIGHT_FALLBACK = function(cropId){
  if(Geom.HEIGHT[cropId] !== undefined) return Geom.HEIGHT[cropId];
  const c = crop(cropId);
  return (c && ({ poaceae:72, solanaceae:36, legume:26, cucurbit:16, brassica:24,
                  aster:12, apiaceae:14, allium:18, chenopod:16, lamiaceae:18 })[c.fam]) || 18;
};
Geom.canopyR = function(cropId, qty){
  /* the spread is for one plant; a clump of several needs the area to scale */
  const one = Habit.spread(cropId) / 2;
  return Math.round(one * Math.sqrt(Math.max(1, num(qty, 1))) * 10) / 10;
};
Geom.height = function(cropId){ return Habit.height(cropId); };
/* isTall closed over p8j's own height table, so every sourced height above was
   being ignored by the shading check — a four-foot cosmos read as a twelve-inch
   aster and shaded nothing. Rebind it to the same figure the rest of the app
   shows. */
Geom.isTall = function(cropId){ return Habit.height(cropId) >= 44; };
/* how many plants a patch of this radius really holds. It used psf, which is
   the square-foot-gardening density and does NOT match the in-row spacing the
   canvas measures root zones with — lettuce is 4/sq ft on a 6in grid but 8in
   apart in a row. One basis, and it is the spacing. */
Geom.fitsIn = function(cropId, r){
  const c = crop(cropId); if(!c) return 1;
  const sp = Math.max(1, num(c.sp, 12));
  /* the exact inverse of rootR, which sets a clump of N at (sp/2)*sqrt(N) —
     so asking how many fit in that radius gives N back, not N times pi/4 */
  return Math.max(1, Math.round((2 * r / sp) * (2 * r / sp)));
};

/* ---- and surface the provenance where the number is shown ---- */
(function habitInSheet(){
  const orig = Garden.plantingSheet.bind(Garden);
  Garden.plantingSheet = function(p){
    orig(p);
    if(!p) return;
    const body = $("#sheet-body"); if(!body) return;
    const pr = Habit.provenance(p.crop_id);
    let h = '<div class="card" style="margin-top:12px"><div class="tiny b muted" style="text-transform:uppercase;letter-spacing:.06em;margin-bottom:8px">Where these sizes come from</div>';
    h += '<div class="tiny"><b>Spread ' + pr.spread.value + '″</b>' +
      (pr.spread.derived ? ' <span class="chip warn tiny">estimate</span>' : '') + '<br>' + esc(pr.spread.how) + '</div>';
    h += '<div class="tiny" style="margin-top:8px"><b>Height ' + pr.height.value + '″</b>' +
      (pr.height.derived ? ' <span class="chip warn tiny">estimate</span>' : '') + '<br>' + esc(pr.height.how) + '</div>';
    if(pr.note) h += '<div class="note i" style="margin-top:10px">' + esc(pr.note) + '</div>';
    if(pr.src) h += '<div class="tiny muted" style="margin-top:8px">' + esc(pr.src.org) + ' — <a href="' +
      esc(pr.src.url) + '" target="_blank" rel="noopener noreferrer">' + esc(pr.src.n) + ' ↗</a></div>';
    h += '<div class="tiny muted" style="margin-top:8px">Whatever the book says, your own garden outranks it — resize the plant and the app remembers.</div></div>';
    const anchor = '<div class="grid2" style="margin-top:16px">';
    if(body.innerHTML.indexOf(anchor) >= 0) body.innerHTML = body.innerHTML.replace(anchor, h + anchor);
    else body.insertAdjacentHTML("beforeend", h);
  };
})();
</script>

<script>
/* ============================================================
   ZOOMING THE BED

   A forty-foot plot drawn to fit a phone screen renders a radish
   about two pixels across. You cannot drag it, you cannot hit its
   handle, and you certainly cannot tell it from the beetroot beside
   it. Everything else on this screen is measured honestly in inches;
   without a magnifier that honesty is what makes small plants
   unusable on a big plot.

   The whole feature is one idea: ZOOM IS A VIEWBOX CHANGE.

   Canvas.toIn reads the live viewBox attribute off the element every
   time it converts a touch into garden inches, so shrinking the
   viewBox magnifies the picture AND every gesture in the app follows
   correctly with no further work — tap, press-and-hold drag, the
   resize handle, the details button. A CSS transform would have
   looked identical and broken all four, because none of them would
   have known the picture had moved.

   Two gestures:
   · pinch and spread with two fingers, anchored so the point of
     garden between your fingers stays between your fingers;
   · once magnified, one finger on bare soil pans.

   And because a mouse has no pinch, ctrl+wheel and a pair of buttons
   do the same thing.
   ============================================================ */

const Zoom = {
  MAX: 8,
  z: 1,
  cx: null, cy: null,        /* centre of the view, in garden inches */

  pointers: {},
  n: 0,
  pinch: null,
  pan: null,

  pinching(){ return Zoom.n >= 2; },
  active(){ return Zoom.z > 1.001; },
  reset(){ Zoom.z = 1; Zoom.cx = null; Zoom.cy = null; Zoom.pinch = null; Zoom.pan = null; },

  /* ---------- the viewBox ----------
     Returns null at 1×, and the caller then emits exactly the string it
     always emitted. That matters: the test suite asserts the unzoomed
     viewBox literally, and a bed at rest should render byte for byte as
     it did before this file existed. */
  viewBox(bed, P){
    if(!Zoom.active()) return null;
    const W = Geom.W(bed), H = Geom.H(bed);
    const fw = W + P * 2, fh = H + P * 2;
    const z = clamp(Zoom.z, 1, Zoom.MAX);
    const vw = fw / z, vh = fh / z;
    const cx = Zoom.cx === null ? W / 2 : Zoom.cx;
    const cy = Zoom.cy === null ? H / 2 : Zoom.cy;
    const vx = clamp(cx - vw / 2, -P, -P + fw - vw);
    const vy = clamp(cy - vh / 2, -P, -P + fh - vh);
    return (Math.round(vx*100)/100) + ' ' + (Math.round(vy*100)/100) + ' ' +
           (Math.round(vw*100)/100) + ' ' + (Math.round(vh*100)/100);
  },

  /* text and badges are drawn in inches, so at 4× they would render four
     times larger on screen. Maps do not do that and neither should this —
     a label is a label at any magnification. */
  textScale(){ return Zoom.active() ? 1 / clamp(Zoom.z, 1, Zoom.MAX) : 1; },

  /* push the current view onto the live element without a re-render;
     a gesture at 60fps must not rebuild the DOM */
  paint(){
    const svg = $("#pcanvas"); if(!svg) return;
    const bed = Geom.bed(DB.find("beds", APP.bedId)); if(!bed) return;
    const vb = Zoom.viewBox(bed, Canvas.PAD);
    if(vb) svg.setAttribute("viewBox", vb);
    else svg.setAttribute("viewBox", (-Canvas.PAD) + ' ' + (-Canvas.PAD) + ' ' +
      (Geom.W(bed) + Canvas.PAD*2) + ' ' + (Geom.H(bed) + Canvas.PAD*2));
    svg.classList.toggle("zoomed", Zoom.active());
    const tag = $("#zoomtag");
    if(tag) tag.textContent = Math.round(clamp(Zoom.z, 1, Zoom.MAX) * 100) + "%";
    if(tag) tag.style.display = Zoom.active() ? "" : "none";
  },

  /* ---------- setting the level, about a fixed screen point ----------
     `anchor` is a client point that should keep showing the same soil. */
  to(z, anchor){
    const svg = $("#pcanvas");
    const bed = Geom.bed(DB.find("beds", APP.bedId)); if(!bed) return;
    const W = Geom.W(bed), H = Geom.H(bed), P = Canvas.PAD;
    const fw = W + P*2, fh = H + P*2;
    const before = (svg && anchor) ? Canvas.toIn(svg, anchor.x, anchor.y) : null;
    Zoom.z = clamp(num(z, 1), 1, Zoom.MAX);
    if(!Zoom.active()){ Zoom.cx = null; Zoom.cy = null; Zoom.paint(); return; }
    if(Zoom.cx === null){ Zoom.cx = W/2; Zoom.cy = H/2; }
    if(before && svg){
      /* keep `before` under the same fraction of the box it was under */
      const r = svg.getBoundingClientRect();
      const fx = r.width ? (anchor.x - r.left) / r.width : 0.5;
      const fy = r.height ? (anchor.y - r.top) / r.height : 0.5;
      const vw = fw / Zoom.z, vh = fh / Zoom.z;
      Zoom.cx = before.x - (fx - 0.5) * vw;
      Zoom.cy = before.y - (fy - 0.5) * vh;
    }
    Zoom.paint();
  },

  by(mult){
    const svg = $("#pcanvas");
    let anchor = null;
    if(svg){ const r = svg.getBoundingClientRect(); anchor = { x: r.left + r.width/2, y: r.top + r.height/2 }; }
    Zoom.to(Zoom.z * mult, anchor);
  },
  in(){ Zoom.by(1.6); haptic(); },
  out(){ Zoom.by(1/1.6); haptic(); },
  fit(){ Zoom.reset(); Zoom.paint(); Garden.repaint(); toast("Whole bed"); },

  /* ---------- gestures ---------- */
  bind(svg){
    if(!svg || svg._zbound) return;
    svg._zbound = true;
    svg.addEventListener("pointerdown", Zoom.down, true);
    svg.addEventListener("wheel", Zoom.wheel, { passive: false });
    Zoom.paint();
  },

  down(ev){
    Zoom.pointers[ev.pointerId] = { x: ev.clientX, y: ev.clientY };
    Zoom.n = Object.keys(Zoom.pointers).length;
    window.addEventListener("pointermove", Zoom.move, { passive: false });
    window.addEventListener("pointerup", Zoom.up);
    window.addEventListener("pointercancel", Zoom.up);

    if(Zoom.n === 2){
      /* a pinch has begun. Whatever single-finger gesture was running is
         no longer what the gardener means — call it off rather than fling
         the plant across the bed while she zooms. */
      if(CanvasDrag.abort){ const a = CanvasDrag.abort; CanvasDrag.abort = null; try{ a(); }catch(e){} }
      Zoom.pan = null;
      const ids = Object.keys(Zoom.pointers);
      const a = Zoom.pointers[ids[0]], b = Zoom.pointers[ids[1]];
      Zoom.pinch = { d0: Math.max(1, Math.hypot(a.x - b.x, a.y - b.y)), z0: Zoom.z };
      return;
    }

    /* one finger on bare soil, already magnified, is a pan */
    if(Zoom.n === 1 && Zoom.active()){
      const onPlant = ev.target && ev.target.closest &&
        (ev.target.closest(".pl") || ev.target.closest("[data-grip]") || ev.target.closest("[data-menu]"));
      if(!onPlant && !Garden.paint && !Garden.erase && !Garden.clip){
        const svg = $("#pcanvas");
        const g = svg ? Canvas.toIn(svg, ev.clientX, ev.clientY) : null;
        Zoom.pan = g ? { gx: g.x, gy: g.y, cx: Zoom.cx, cy: Zoom.cy, moved: 0,
                         sx: ev.clientX, sy: ev.clientY } : null;
      }
    }
  },

  move(ev){
    if(Zoom.pointers[ev.pointerId]) Zoom.pointers[ev.pointerId] = { x: ev.clientX, y: ev.clientY };

    if(Zoom.n >= 2 && Zoom.pinch){
      if(ev.cancelable) ev.preventDefault();
      const ids = Object.keys(Zoom.pointers);
      const a = Zoom.pointers[ids[0]], b = Zoom.pointers[ids[1]];
      if(!a || !b) return;
      const d = Math.max(1, Math.hypot(a.x - b.x, a.y - b.y));
      const mid = { x: (a.x + b.x) / 2, y: (a.y + b.y) / 2 };
      Zoom.to(Zoom.pinch.z0 * (d / Zoom.pinch.d0), mid);
      return;
    }

    if(Zoom.n === 1 && Zoom.pan){
      const svg = $("#pcanvas"); if(!svg) return;
      Zoom.pan.moved = Math.max(Zoom.pan.moved,
        Math.abs(ev.clientX - Zoom.pan.sx), Math.abs(ev.clientY - Zoom.pan.sy));
      if(Zoom.pan.moved < 6) return;
      if(ev.cancelable) ev.preventDefault();
      const now = Canvas.toIn(svg, ev.clientX, ev.clientY);
      Zoom.cx = num(Zoom.pan.cx, 0) - (now.x - Zoom.pan.gx);
      Zoom.cy = num(Zoom.pan.cy, 0) - (now.y - Zoom.pan.gy);
      Zoom.paint();
    }
  },

  up(ev){
    delete Zoom.pointers[ev.pointerId];
    Zoom.n = Object.keys(Zoom.pointers).length;
    if(Zoom.n < 2 && Zoom.pinch){
      Zoom.pinch = null;
      /* one redraw at the end: labels and badges are sized against the zoom */
      Garden.repaint();
      haptic();
    }
    if(Zoom.n === 0){
      Zoom.pan = null;
      window.removeEventListener("pointermove", Zoom.move);
      window.removeEventListener("pointerup", Zoom.up);
      window.removeEventListener("pointercancel", Zoom.up);
    }
  },

  /* a mouse has no pinch */
  wheel(ev){
    if(!ev.ctrlKey && !ev.metaKey) return;
    ev.preventDefault();
    Zoom.to(Zoom.z * (ev.deltaY < 0 ? 1.12 : 1/1.12), { x: ev.clientX, y: ev.clientY });
    clearTimeout(Zoom._wt);
    Zoom._wt = setTimeout(() => Garden.repaint(), 220);
  },

  /* the toolbar control */
  chip(){
    return '<button class="chip' + (Zoom.active() ? " on" : "") + '" onclick="Zoom.in()">🔍 Zoom</button>' +
      (Zoom.active()
        ? '<button class="chip" onclick="Zoom.out()">− Out</button>' +
          '<button class="chip" onclick="Zoom.fit()">⤢ Whole bed</button>'
        : '');
  }
};

/* bind the zoom listeners wherever the drag listeners are bound — one
   canvas, one place that knows when it has been rebuilt */
(function(){
  const orig = CanvasDrag.bind;
  CanvasDrag.bind = function(){
    orig.apply(CanvasDrag, arguments);
    Zoom.bind($("#pcanvas"));
  };
})();

/* leaving a bed must leave its magnification behind, or the next bed opens
   zoomed into a corner of somewhere else */
(function(){
  const back = Garden.back;
  Garden.back = function(){ Zoom.reset(); return back.apply(Garden, arguments); };
  const open = Garden.open;
  if(typeof open === "function")
    Garden.open = function(){ Zoom.reset(); return open.apply(Garden, arguments); };
})();
</script>

<script>
/* ============================================================
   UNDO

   Until now the bed was the one screen in this app you had to be
   careful on. Removing a plant took one tap with no confirmation
   and no way back, and re-creating it meant remembering the variety,
   the packet it came from, the date it went in, the size you had
   dragged it to and where it stood. People edit timidly when a
   mistake is expensive, and a plan you are afraid to change is not
   really a plan.

   The saving grace is that a removal here has always been a SOFT
   delete — `status` goes to "removed" and the row stays whole. So
   putting one back is a matter of clearing two fields, and the plant
   comes back as itself rather than as a fresh copy that lost half of
   what you knew about it.

   The stack holds the PREVIOUS values of whatever changed. Every
   entry is a list of patches, so one entry can cover eight plants
   moved together as easily as one removed.
   ============================================================ */

const Undo = {
  LIMIT: 40,
  stack: [],

  /* rows: [{ id, ...fields as they were before }]  or  { id, created:true }
     for something that did not exist yet and should be removed again. */
  push(kind, label, rows){
    if(!rows || !rows.length) return;
    Undo.stack.push({ kind: kind, label: label || "Change", rows: rows, at: Date.now() });
    if(Undo.stack.length > Undo.LIMIT) Undo.stack.shift();
    Undo.paint();
  },

  can(){ return Undo.stack.length > 0; },
  peek(){ return Undo.stack.length ? Undo.stack[Undo.stack.length - 1] : null; },
  clear(){ Undo.stack = []; Undo.paint(); },

  /* what the button should say — "Undo remove" is less use than the name
     of the thing you are about to get back */
  label(){
    const e = Undo.peek();
    return e ? e.label : "";
  },

  go(){
    const e = Undo.stack.pop();
    if(!e){ toast("Nothing to undo"); return; }
    let gone = 0;
    e.rows.forEach(r => {
      if(!r || !r.id) return;
      const row = DB.find("plantings", r.id);
      if(!row){ gone++; return; }
      if(r.created){
        /* it never existed before this action — take it away completely,
           along with the calendar entries it generated */
        DB.bulkRemove("events", ev => ev.planting_id === r.id);
        DB.remove("plantings", r.id);
        return;
      }
      const patch = {};
      Object.keys(r).forEach(k => { if(k !== "id") patch[k] = r[k]; });
      DB.update("plantings", r.id, patch);
    });
    /* a restored planting wants its sowing and harvest dates back on the
       calendar; rebuild rather than try to reconstruct which ones went */
    if(typeof Cal !== "undefined" && Cal.rebuild) Cal.rebuild();
    Garden.sel = null;
    if(typeof Sel !== "undefined") Sel.clear(true);
    haptic();
    Garden.render();
    toast(gone === e.rows.length ? "Nothing left to put back" : "Undone — " + e.label.toLowerCase());
  },

  /* the chip in the bed toolbar */
  chip(){
    if(!Undo.can()) return "";
    return '<button class="chip" id="undochip" onclick="Undo.go()" title="' + esc(Undo.label()) +
      '">↩︎ Undo</button>';
  },
  paint(){
    const box = $(".cvbar"); if(!box) return;
    const ex = $("#undochip");
    if(!Undo.can()){ if(ex) ex.remove(); return; }
    if(ex){ ex.title = Undo.label(); return; }
    const b = document.createElement("button");
    b.className = "chip"; b.id = "undochip"; b.textContent = "↩︎ Undo";
    b.title = Undo.label(); b.onclick = Undo.go;
    box.appendChild(b);
  }
};

/* ---------- the other places a change happens ---------- */

/* the sliders and the steppers in the planting sheet */
(function(){
  const orig = Garden.resizeBy;
  Garden.resizeBy = function(id, dw, dh){
    const p = Geom.plant(DB.find("plantings", id));
    if(p) Undo.push("resize", "Resized " + cropName(p.crop_id),
      [{ id: id, rc: Geom.RC(p), rr: Geom.RR(p) }]);
    return orig.apply(Garden, arguments);
  };
})();

/* clearing a whole bed is the most expensive single tap in the app */
(function(){
  const orig = Garden.clearBed;
  Garden.clearBed = function(){
    const live = DB.where("plantings", p => p.bed_id === APP.bedId && p.status !== "removed");
    if(live.length) Undo.push("clear", "Cleared " + live.length + " plant" + (live.length === 1 ? "" : "s"),
      live.map(p => ({ id: p.id, status: p.status || "planned", removed_on: p.removed_on || null })));
    return orig.apply(Garden, arguments);
  };
})();

/* pasting a copied plant, and duplicating one */
(function(){
  const dup = Garden.duplicate;
  Garden.duplicate = function(id){
    const before = DB.count("plantings");
    const r = dup.apply(Garden, arguments);
    const all = DB.all("plantings");
    if(DB.count("plantings") > before){
      const made = all[all.length - 1];
      Undo.push("duplicate", "Duplicated " + cropName(made.crop_id), [{ id: made.id, created: true }]);
    }
    return r;
  };
})();
</script>

<script>
/* ============================================================
   SELECTING SEVERAL PLANTS AT ONCE

   A row of twelve lettuces is twelve press-and-hold drags, and
   moving the row six inches off the path is twelve chances to put
   one of them somewhere you did not mean. The bed already knew how
   to copy one plant; what it never had was the idea of "these".

   Tap to add, tap again to drop. Press and hold anything already in
   the set and the whole set moves together, keeping its shape — a
   row stays a row. Remove and duplicate work on the set too, and
   both go on the undo stack as ONE action, because undoing a
   twelve-plant move one plant at a time would be its own punishment.
   ============================================================ */

const Sel = {
  on: false,
  ids: {},

  count(){ return Object.keys(Sel.ids).length; },
  has(id){ return !!Sel.ids[id]; },
  list(){ return Object.keys(Sel.ids).map(id => DB.find("plantings", id)).filter(Boolean).map(Geom.plant); },

  start(){
    Sel.on = true; Sel.ids = {};
    Garden.sel = null; Garden.paint = null; Garden.erase = false; Garden.clip = null;
    Garden.render();
    toast("Tap plants to gather them up");
  },
  stop(){ Sel.on = false; Sel.ids = {}; Garden.render(); },
  clear(silent){ Sel.ids = {}; if(!silent) Garden.render(); },

  toggle(id){
    if(Sel.ids[id]) delete Sel.ids[id]; else Sel.ids[id] = 1;
    haptic();
    Garden.repaint();
    Sel.paintBar();
  },

  all(){
    const bed = DB.find("beds", APP.bedId); if(!bed) return;
    Geom.live(bed.id).forEach(p => Sel.ids[p.id] = 1);
    Garden.repaint(); Sel.paintBar();
  },
  /* everything of the same crop — the usual reason you wanted a set */
  sameCrop(){
    const first = Sel.list()[0];
    if(!first) return toast("Pick one first and this gathers the rest of that crop");
    Geom.live(first.bed_id).forEach(p => { if(p.crop_id === first.crop_id) Sel.ids[p.id] = 1; });
    Garden.repaint(); Sel.paintBar();
    toast("All the " + cropName(first.crop_id).toLowerCase());
  },

  /* ---------- the bar under the toolbar ---------- */
  bar(){
    if(!Sel.on) return "";
    const n = Sel.count();
    let h = '<div class="selbar" id="selbar"><div class="row between" style="gap:8px">' +
      '<div class="b sm">' + (n ? n + " selected" : "Tap plants to select") + '</div>' +
      '<button class="chip" onclick="Sel.stop()">Done</button></div>' +
      '<div class="row wrap" style="gap:6px;margin-top:8px">' +
      '<button class="chip" onclick="Sel.all()">All</button>' +
      '<button class="chip" onclick="Sel.sameCrop()">Same crop</button>' +
      (n ? '<button class="chip" onclick="Sel.clear()">None</button>' +
           '<button class="chip" onclick="Sel.duplicateAll()">⧉ Duplicate</button>' +
           '<button class="chip bad" onclick="Sel.removeAll()">🧹 Remove</button>' : '') +
      '</div>';
    if(n) h += '<div class="tiny muted" style="margin-top:6px">Press and hold any of them to move the whole group.</div>';
    return h + '</div>';
  },
  paintBar(){
    const b = $("#selbar"); if(!b) return;
    const wrap = document.createElement("div");
    wrap.innerHTML = Sel.bar();
    if(wrap.firstChild) b.replaceWith(wrap.firstChild);
  },

  /* ---------- acting on the set ---------- */
  removeAll(){
    const ps = Sel.list(); if(!ps.length) return;
    confirmSheet("Remove " + ps.length + " plant" + (ps.length === 1 ? "" : "s") + "?",
      "They come off the bed. Harvest records stay, and you can undo this.",
      "Remove them", () => {
        Undo.push("remove", "Removed " + ps.length + " plant" + (ps.length === 1 ? "" : "s"),
          ps.map(p => ({ id: p.id, status: p.status || "planned", removed_on: p.removed_on || null })));
        ps.forEach(p => Garden.removePlanting(p.id, true, true));
        Sel.ids = {};
        Garden.render();
        toast("Removed " + ps.length, 3200);
      }, true);
  },

  duplicateAll(){
    const ps = Sel.list(); if(!ps.length) return;
    const bed = Geom.bed(DB.find("beds", ps[0].bed_id)); if(!bed) return;
    const made = [];
    ps.forEach(p => {
      const spot = Garden.openSpot(bed, Geom.RR(p), Geom.PX(p) + Geom.RC(p) * 2, Geom.PY(p));
      if(!spot) return;
      const copy = DB.insert("plantings", {
        bed_id: bed.id, crop_id: p.crop_id, variety: p.variety, variety_id: p.variety_id,
        seed_id: p.seed_id, qty: p.qty, status: p.status, sown_on: p.sown_on, notes: p.notes,
        span_mode: p.span_mode, px: Math.round(spot.x*10)/10, py: Math.round(spot.y*10)/10,
        rr: Geom.RR(p), rc: Geom.RC(p),
        rot: Math.round(Math.random()*40 - 20), sv: Math.floor(Math.random()*100000),
        x: Math.floor(spot.x / Garden.cell(bed)), y: Math.floor(spot.y / Garden.cell(bed)), w:1, h:1
      });
      made.push(copy);
    });
    if(!made.length) return toast("No free ground for copies in this bed");
    Undo.push("duplicate", "Duplicated " + made.length + " plant" + (made.length === 1 ? "" : "s"),
      made.map(m => ({ id: m.id, created: true })));
    Cal.rebuild();
    Sel.ids = {}; made.forEach(m => Sel.ids[m.id] = 1);
    Garden.render();
    toast(made.length < ps.length ? "Room for " + made.length + " of " + ps.length : "Duplicated " + made.length);
  },

  /* ---------- tap, and press-and-hold to move the group ---------- */
  tapStart(ev, pid){
    if(!Sel.has(pid)){
      /* not in the set yet — a tap adds it, and nothing drags */
      const sx = ev.clientX, sy = ev.clientY;
      let moved = false;
      const mv = e => { if(Math.abs(e.clientX - sx) > 8 || Math.abs(e.clientY - sy) > 8) moved = true; };
      const up = () => {
        window.removeEventListener("pointermove", mv);
        window.removeEventListener("pointerup", up);
        if(!moved) Sel.toggle(pid);
      };
      window.addEventListener("pointermove", mv);
      window.addEventListener("pointerup", up);
      return;
    }
    Sel.groupDrag(ev, pid);
  },

  groupDrag(ev, pid){
    const bed = Geom.bed(DB.find("beds", APP.bedId)); if(!bed) return;
    const svg = $("#pcanvas"); if(!svg) return;
    const ps = Sel.list(); if(!ps.length) return;
    const start = Canvas.toIn(svg, ev.clientX, ev.clientY);
    const origin = ps.map(p => ({ id: p.id, x: Geom.PX(p), y: Geom.PY(p), rr: Geom.RR(p),
                                  el: svg.querySelector('.pl[data-pid="' + p.id + '"]') }));
    let lifted = false, dead = false, dx = 0, dy = 0, done = false;

    const blockScroll = e => { if(lifted && e.cancelable) e.preventDefault(); };
    document.addEventListener("touchmove", blockScroll, { passive:false });

    const lift = () => {
      if(dead || lifted) return;
      lifted = true;
      svg.classList.add("dragging");
      origin.forEach(o => { if(o.el) o.el.setAttribute("opacity", "0.9"); });
      haptic();
    };
    const timer = setTimeout(lift, 190);

    /* the whole set keeps its shape: one delta, and the largest delta that
       still leaves every member inside the outline wins */
    const fits = (ddx, ddy) => origin.every(o =>
      Geom.inside(bed, o.x + ddx, o.y + ddy, Math.min(o.rr, 2)));

    const move = e => {
      if(!lifted){
        const ax = Math.abs(e.clientX - ev.clientX), ay = Math.abs(e.clientY - ev.clientY);
        if(ax < 6 && ay < 6) return;
        if((ev.pointerType === "touch" || ev.pointerType === "pen") && ay > ax * 1.4){
          dead = true; clearTimeout(timer); finish(false); return;
        }
        clearTimeout(timer); lift();
      }
      if(e.cancelable) e.preventDefault();
      const now = Canvas.toIn(svg, e.clientX, e.clientY);
      let ndx = now.x - start.x, ndy = now.y - start.y;
      if(num(bed.snap_in) > 0){ ndx = Geom.snap(ndx, num(bed.snap_in)); ndy = Geom.snap(ndy, num(bed.snap_in)); }
      if(fits(ndx, ndy)){ dx = ndx; dy = ndy; }
      origin.forEach(o => { if(o.el)
        o.el.setAttribute("transform", "translate(" + (Math.round((o.x+dx)*10)/10) + " " +
          (Math.round((o.y+dy)*10)/10) + ")"); });
    };

    const finish = drop => {
      if(done) return;
      done = true;
      clearTimeout(timer);
      window.removeEventListener("pointermove", move);
      window.removeEventListener("pointerup", onUp);
      window.removeEventListener("pointercancel", onUp);
      document.removeEventListener("touchmove", blockScroll);
      document.removeEventListener("touchmove", blockScroll);
      svg.classList.remove("dragging");
      origin.forEach(o => { if(o.el) o.el.removeAttribute("opacity"); });
      CanvasDrag.abort = null;
      if(!drop || !lifted) return;
      if(Math.abs(dx) < 0.2 && Math.abs(dy) < 0.2){ Garden.repaint(); return; }
      Undo.push("move", "Moved " + origin.length + " plant" + (origin.length === 1 ? "" : "s"),
        origin.map(o => ({ id: o.id, px: o.x, py: o.y })));
      const c = Garden.cell(bed);
      origin.forEach(o => DB.update("plantings", o.id, {
        px: Math.round((o.x + dx) * 10) / 10, py: Math.round((o.y + dy) * 10) / 10,
        x: Math.floor((o.x + dx) / c), y: Math.floor((o.y + dy) / c) }));
      Garden.render();
      toast("Moved " + origin.length + " together");
    };
    const onUp = () => finish(true);
    CanvasDrag.abort = () => {
      origin.forEach(o => { if(o.el)
        o.el.setAttribute("transform", "translate(" + o.x + " " + o.y + ")"); });
      dx = 0; dy = 0; finish(false);
    };

    window.addEventListener("pointermove", move);
    window.addEventListener("pointerup", onUp);
    window.addEventListener("pointercancel", onUp);
  }
};
</script>

<script>
/* ============================================================
   WHAT WOULD GO WELL WITH WHAT IS ALREADY HERE

   The app had two kinds of advice about companions and neither did
   this job. The bed view told you about pairings you had ALREADY
   made — good neighbours, warnings — which is a report card, not a
   suggestion. The crop picker badged individual crops as you
   scrolled past them, which only helps if you already had a
   shortlist in mind. "Suggest" ranked by season first, so in July
   it hands you the same list whatever is growing in the bed.

   What was missing is the obvious question: I have tomatoes and
   carrots in this bed — what else belongs in here?

   So: every crop the app knows, scored against WHAT IS PLANTED,
   named partner by partner with the reason, and anything that
   actively fights something already there thrown out rather than
   ranked low. Season and sun still speak, but as annotations on the
   answer rather than as the question.
   ============================================================ */

const BedRecs = {
  /* how much clear ground is left, roughly — used to say whether there is
     honestly room, not to refuse anything */
  freeSqFt(bed){
    const used = Geom.live(bed.id).reduce((a, p) => a + Math.PI * Geom.RR(p) * Geom.RR(p), 0);
    return Math.max(0, Math.round((Geom.areaSqIn(bed) - used) / 144 * 10) / 10);
  },

  forBed(bedId, limit){
    const bed = Geom.bed(DB.find("beds", bedId));
    if(!bed) return [];
    const live = Geom.live(bedId);
    if(!live.length) return [];

    /* one entry per crop in the bed, however many plants of it there are */
    const present = [];
    live.forEach(p => { if(present.indexOf(p.crop_id) < 0) present.push(p.crop_id); });

    const stock = {}; DB.all("seeds").forEach(s => { if(s.crop_id) stock[s.crop_id] = (stock[s.crop_id] || 0) + 1; });
    const recentFams = Recommend.recentFamilies(bedId);
    const sun = (typeof Micro !== "undefined" && Micro.sunHours) ? Micro.sunHours(bedId) : num(bed.sun_hours, 8);
    const out = [];

    CROPS.forEach(c => {
      if(present.indexOf(c.id) >= 0) return;

      const partners = [], clashes = [];
      present.forEach(oc => {
        const r = pairRating(c.id, oc);
        if(r.score >= 1) partners.push({ id: oc, score: r.score, why: r.why });
        else if(r.score <= -2) clashes.push({ id: oc, why: r.why });
      });
      /* the whole point is that this list is safe to plant from. Something
         that fights what is already in the bed does not belong on it at all,
         however well it scores otherwise. */
      if(clashes.length || !partners.length) return;

      let score = partners.reduce((a, x) => a + (x.score >= 2 ? 10 : 5), 0);
      const notes = [], warn = [];

      const st = Season.status(c.id, 10);
      if(st && st.inWindow){ score += 8; notes.push(st.w.icon + " " + st.w.label + " window is open now"); }
      else if(st && st.days > 0 && st.days < 75){ score += 2; notes.push("🗓️ " + st.w.label + " " + relDay(st.w.date)); }
      else { score -= 6; warn.push("Not in a sowing window at the moment."); }

      if(stock[c.id]){ score += 6; notes.push("🌰 You already have seed for this"); }

      if(sun >= c.sun) score += 3;
      else if(sun >= c.sun - 2){ score -= 5; warn.push("Wants " + c.sun + "h of sun and this bed gets " + sun + "h — a lighter crop."); }
      else { score -= 18; warn.push("Needs " + c.sun + "h of sun; this bed gets " + sun + "h."); }

      if(recentFams[c.fam]){ score -= 10; warn.push("A " + FAMILY[c.fam].n.toLowerCase() + " grew here " + recentFams[c.fam] + " — rotate if you can."); }

      const fits = Season.stillFits(c.id);
      if(fits && !fits.fits){ score -= 8; warn.push("Needs " + fits.needs + " days and " + fits.left + " remain before first frost."); }

      out.push({ crop: c, partners: partners, score: score, notes: notes, warn: warn,
                 hasSeed: !!stock[c.id], room: Geom.rootR(c.id, 1) });
    });

    out.sort((a, b) => (b.partners.length - a.partners.length) || (b.score - a.score));
    return limit ? out.slice(0, limit) : out;
  },

  /* one line naming who it would be joining — the reason is the useful part */
  line(r){
    const names = r.partners.slice(0, 3).map(x => cropEmoji(x.id) + " " + cropName(x.id));
    const more = r.partners.length - names.length;
    return "Goes with " + names.join(", ") + (more > 0 ? " and " + more + " more" : "");
  },

  /* ---------- the section under the bed ---------- */
  html(bed){
    const recs = BedRecs.forBed(bed.id, 6);
    if(!recs.length) return "";
    const free = BedRecs.freeSqFt(bed);
    let h = '<div class="sec"><h2>Would go well here</h2>' +
      '<span class="tiny muted">' + free + ' sq ft free</span></div><div class="card">';
    h += '<div class="tiny muted" style="margin-bottom:10px">Chosen for what is already planted in this bed, not just what is in season. ' +
      'Anything that would fight one of these plants has been left out.</div>';
    recs.forEach(r => {
      h += '<div class="note g" style="margin-bottom:8px"><div class="row between" style="gap:10px">' +
        '<div class="grow"><div class="b">' + r.crop.e + ' ' + esc(r.crop.n) + '</div>' +
        '<div class="tiny" style="margin-top:2px">💚 ' + esc(BedRecs.line(r)) + '</div>' +
        '<div class="tiny muted" style="margin-top:2px">' + esc(r.partners[0].why) + '</div>' +
        r.notes.slice(0, 2).map(n => '<div class="tiny muted" style="margin-top:2px">' + esc(n) + '</div>').join("") +
        r.warn.slice(0, 1).map(n => '<div class="tiny" style="margin-top:2px;color:var(--warn)">' + esc(n) + '</div>').join("") +
        '</div>' +
        '<button class="btn sm" onclick="BedRecs.plant(\'' + r.crop.id + '\')">Plant</button></div></div>';
    });
    h += '</div>';
    return h;
  },

  plant(cropId){
    Garden.paint = cropId; Garden.erase = false;
    if(typeof Sel !== "undefined") Sel.on = false;
    Garden.render();
    toast("Tap the bed to plant " + cropName(cropId));
  }
};

/* ============================================================
   WATERING, GROUPED

   `Recommend.water` answers for the bed as a whole by taking the
   thirstiest crop in it, which is the safe answer and the reason a
   bed of lettuce and rosemary gets watered to suit the lettuce. On
   a mixed bed that is how you drown herbs.

   So the same figures, grouped: who wants a soak, who wants a
   drink, and who would rather you left them alone. It is drawn
   from the same `water` column in inches per week that the bed
   verdict already uses, so the two can never disagree.
   ============================================================ */

const WaterGroups = {
  /* The thresholds sit where the crop data actually clusters. Nearly every
     vegetable in the table is the extension services' flat 1"/week; what
     stands apart is a short list that wants more, and the Mediterranean
     herbs and most of the flowers, which want distinctly less and are the
     ones that suffer when a bed is watered to suit the lettuce. */
  BANDS: [
    { k:"high", n:"Thirsty",  i:"💧💧", d:"1½\" a week or more — a deep soak, and mulch earns its keep", lo: 1.25 },
    { k:"med",  n:"Average",  i:"💧",   d:"about an inch a week",                                         lo: 0.9 },
    { k:"low",  n:"Sparing",  i:"🌵",   d:"half to three-quarters of an inch — let the top inch dry out between waterings", lo: 0 }
  ],

  band(cropId){
    const c = crop(cropId); if(!c) return null;
    const w = num(c.water, 1);
    return WaterGroups.BANDS.find(b => w >= b.lo) || WaterGroups.BANDS[2];
  },

  forBed(bedId){
    const out = {};
    Geom.live(bedId).forEach(p => {
      const b = WaterGroups.band(p.crop_id); if(!b) return;
      (out[b.k] = out[b.k] || { band: b, crops: {} });
      out[b.k].crops[p.crop_id] = (out[b.k].crops[p.crop_id] || 0) + num(p.qty, 1);
    });
    return WaterGroups.BANDS.map(b => out[b.k]).filter(Boolean);
  },

  html(bedId){
    const groups = WaterGroups.forBed(bedId);
    if(groups.length < 2) return "";     /* nothing to separate */
    let h = '<div class="note i" style="margin-top:10px"><div class="b sm" style="margin-bottom:6px">Not everything here wants the same amount</div>';
    groups.forEach(g => {
      const names = Object.keys(g.crops).map(id => cropEmoji(id) + " " + cropName(id));
      h += '<div class="tiny" style="margin-bottom:4px"><b>' + g.band.i + ' ' + esc(g.band.n) + '</b> · ' +
        esc(g.band.d) + '<br><span class="muted">' + esc(names.join(", ")) + '</span></div>';
    });
    h += '<div class="tiny muted" style="margin-top:6px">The verdict above is set by the thirstiest of them, which is the safe call for the bed. ' +
      'Water by hand at the base and the sparing group will thank you for being missed out.</div></div>';
    return h;
  }
};
</script>

<script>
/* ============================================================
   WHICH WAY THE BED FACES

   The micro-climate survey does ask which direction you are facing
   when you take each photo, and that bearing is doing real work —
   it is what turns a photograph into a measurement of the skyline
   and feeds the eight-sector horizon that Solar reads. But it
   describes THE SITE. It never learned which way the drawing points.

   That gap is why the shade check was quietly guessing. It decided
   who stood in whose light with:

       const north = Geom.PY(low) < Geom.PY(tall);

   — the top of the canvas is north — which is true only if you
   happened to draw the bed that way, and is the wrong answer by 90°
   for anyone who drew it to match how the bed looks from the path.
   Worse, `north` was computed and then never used, so the check
   flagged a tomato as shading a lettuce standing on the SUNNY side
   of it, which is the one place the lettuce is fine.

   So a bed now carries `north_deg`: the compass bearing that "up" on
   its drawing points to. Zero, the default, means north-up and the
   app behaves exactly as it did. You can set it with the dial, or
   stand at the bottom edge of the bed, point the phone up along it
   and let the compass read it — the same reader the survey uses.

   The sun is in the south at midday in the northern hemisphere and
   in the north in the southern, so shade falls on the far side from
   it. That is the whole calculation, and the latitude the gardener
   already gave decides which hemisphere she is in.
   ============================================================ */

const Orient = {
  /* bearing that the top edge of the drawing points at, 0 = north */
  of(bed){ return ((num((bed || {}).north_deg, 0) % 360) + 360) % 360; },

  /* Which way is the sun at midday, as a compass bearing. The gardener's
     latitude is already stored — the solar maths reads the same setting —
     and it is the only thing that decides this. Nothing here is hardcoded
     to the northern hemisphere. */
  sunAz(){
    const lat = DB.get("lat", null);
    if(lat === null || lat === undefined) return 180;
    return num(lat, 40) >= 0 ? 180 : 0;
  },

  /* Convert a vector on the drawing into a compass bearing.
     On the canvas y grows DOWNWARD, so a plant with a smaller y is further
     "up" the drawing, which is `north_deg`. */
  bearing(bed, dx, dy){
    const a = Math.atan2(dx, -dy) * 180 / Math.PI;   /* 0 = up the drawing */
    return (((a + Orient.of(bed)) % 360) + 360) % 360;
  },

  /* smallest angle between two bearings */
  delta(a, b){
    let d = Math.abs((((a - b) % 360) + 360) % 360);
    return d > 180 ? 360 - d : d;
  },

  /* Does `low` actually stand in `tall`'s shadow?
     True when it sits on the far side from the midday sun — within a wide
     arc, because the sun moves and a tall crop throws shade east in the
     morning and west in the evening too. */
  shaded(bed, tall, low){
    const dx = Geom.PX(low) - Geom.PX(tall), dy = Geom.PY(low) - Geom.PY(tall);
    if(Math.abs(dx) < 0.01 && Math.abs(dy) < 0.01) return true;
    const away = (Orient.sunAz() + 180) % 360;       /* the shadow points this way */
    return Orient.delta(Orient.bearing(bed, dx, dy), away) <= 75;
  },

  name(deg){
    const dirs = ["north","north-east","east","south-east","south","south-west","west","north-west"];
    return dirs[Math.round((((num(deg,0) % 360) + 360) % 360) / 45) % 8];
  },

  /* ---------- the control ---------- */
  sheet(bedId){
    const bed = Geom.bed(DB.find("beds", bedId || APP.bedId)); if(!bed) return;
    const d = Orient.of(bed);
    let h = '<p class="muted sm" style="margin-top:0">Which way does the <b>top of the drawing</b> point? ' +
      'The app needs this to know which plants stand in the shade of the tall ones, rather than assuming you drew the bed with north at the top.</p>';
    h += '<div class="center" style="margin:14px 0">' + Orient.dial(d) + '</div>';
    h += '<div class="field"><label class="f">Top of the bed points <b id="or-name">' + esc(Orient.name(d)) + '</b> · <b id="or-deg">' + Math.round(d) + '°</b></label>' +
      '<input type="range" id="or-range" min="0" max="355" step="5" value="' + Math.round(d/5)*5 + '" oninput="Orient.live(this.value)"></div>';
    h += '<div class="row wrap" style="gap:6px;margin-top:8px">' +
      [["N",0],["E",90],["S",180],["W",270]].map(x =>
        '<button class="chip" onclick="Orient.live(' + x[1] + ',1)">' + x[0] + '</button>').join("") + '</div>';
    h += '<button class="btn ghost block" style="margin-top:12px" onclick="Orient.readCompass()">🧭 Read it from the phone</button>';
    h += '<div class="tiny muted" style="margin-top:6px">Stand at the bottom edge of the bed, point the top of the phone up along it, and tap. ' +
      'Same compass the micro-climate survey uses.</div>';
    h += '<div class="note i" style="margin-top:12px">The midday sun is in the ' +
      esc(Orient.name(Orient.sunAz())) + ' where you are, so shade falls to the ' +
      esc(Orient.name((Orient.sunAz() + 180) % 360)) + ' of anything tall.</div>';
    h += '<button class="btn block" style="margin-top:14px" onclick="Orient.save(\'' + bed.id + '\')">Save</button>';
    openSheet("Which way the bed faces", h);
  },

  dial(deg){
    const r = 46, cx = 60, cy = 60;
    const a = (num(deg, 0) - 90) * Math.PI / 180;
    return '<svg id="or-dial" width="120" height="120" viewBox="0 0 120 120">' +
      '<circle cx="' + cx + '" cy="' + cy + '" r="' + r + '" fill="none" stroke="var(--line)" stroke-width="2"/>' +
      ["N","E","S","W"].map((t, i) => {
        const th = (i * 90 - 90) * Math.PI / 180;
        return '<text x="' + (cx + Math.cos(th) * (r - 11)) + '" y="' + (cy + Math.sin(th) * (r - 11) + 4) +
          '" text-anchor="middle" font-size="11" font-weight="700" fill="var(--muted)">' + t + '</text>';
      }).join("") +
      '<line id="or-needle" x1="' + cx + '" y1="' + cy + '" x2="' + (cx + Math.cos(a) * (r - 18)) +
      '" y2="' + (cy + Math.sin(a) * (r - 18)) + '" stroke="var(--green-600)" stroke-width="4" stroke-linecap="round"/>' +
      '<circle cx="' + cx + '" cy="' + cy + '" r="4" fill="var(--green-600)"/></svg>';
  },

  live(v, setSlider){
    const d = ((num(v, 0) % 360) + 360) % 360;
    const s = $("#or-range"); if(s && setSlider) s.value = Math.round(d/5)*5;
    const n = $("#or-name"); if(n) n.textContent = Orient.name(d);
    const g = $("#or-deg"); if(g) g.textContent = Math.round(d) + "°";
    const nd = $("#or-needle");
    if(nd){
      const a = (d - 90) * Math.PI / 180;
      nd.setAttribute("x2", 60 + Math.cos(a) * 28);
      nd.setAttribute("y2", 60 + Math.sin(a) * 28);
    }
  },

  readCompass(){
    if(typeof MicroUI === "undefined" || !MicroUI.heading) return toast("No compass on this device");
    toast("Hold still…");
    MicroUI.heading().then(deg => {
      if(deg === null || deg === undefined) return toast("No compass reading — set it by hand");
      Orient.live(Math.round(deg), 1);
      haptic();
      toast("Top of the bed points " + Orient.name(deg));
    });
  },

  save(bedId){
    const s = $("#or-range");
    const d = ((num(s ? s.value : 0, 0) % 360) + 360) % 360;
    DB.update("beds", bedId, { north_deg: Math.round(d) });
    closeSheet(); Garden.render();
    toast("Top of the bed points " + Orient.name(d));
  }
};

/* ---------- teach the shade check about it ----------
   Additive: a bed with no orientation set behaves exactly as before, because
   north_deg defaults to 0 and the old code assumed north-up anyway. What
   changes for everyone is that a plant standing on the SUNNY side of a tall
   crop is no longer reported as being shaded by it. */
(function(){
  const orig = Recommend.shading;
  Recommend.shading = function(bedId, when){
    const rows = orig.call(Recommend, bedId, when);
    const bed = Geom.bed(DB.find("beds", bedId));
    if(!bed) return rows;
    return rows.filter(r => Orient.shaded(bed, r.tall, r.low)).map(r => {
      const dx = Geom.PX(r.low) - Geom.PX(r.tall), dy = Geom.PY(r.low) - Geom.PY(r.tall);
      r.side = Orient.name(Orient.bearing(bed, dx, dy));
      return r;
    });
  };
})();
</script>

<script>
/* ============================================================
   SAVED BEDS

   Duplicating a bed already worked, but only sideways — one bed to
   another, right now, in this garden. What it could not do is carry
   a plan across a season. The bed that worked last year is the most
   valuable thing a gardener owns, and every February it had to be
   rebuilt plant by plant from memory.

   So a bed can be SAVED: its outline, its size, and every plant on
   it with the variety, the spacing you dragged it to and where it
   stood. Starting a new bed from a saved one lays the whole thing
   out again in one tap.

   Two rules keep this honest:

   · A saved bed stores no dates and no harvest history. Reusing last
     year's layout must not tell the app you sowed last year's seed
     today, and it must never manufacture a maturity record — those
     are the figures the whole app defers to, and inventing one would
     poison the gardener's own data with a copy of itself.
   · Positions are stored as FRACTIONS of the bed, so a layout saved
     from a 4×8 works on a 3×10. The plants land in the same relative
     arrangement and anything that no longer fits is pulled inside
     the outline rather than dropped.

   It lives in settings rather than a table of its own because it is
   a preference about how you garden, not a record of what happened.
   ============================================================ */

const Templates = {
  KEY: "bedTemplates",

  all(){
    const raw = DB.get(Templates.KEY, null);
    if(!raw) return [];
    try{ const v = typeof raw === "string" ? JSON.parse(raw) : raw; return Array.isArray(v) ? v : []; }
    catch(e){ return []; }
  },
  write(list){ DB.set(Templates.KEY, JSON.stringify(list.slice(0, 40))); },

  /* ---------- saving ---------- */
  save(bedId, name){
    const bed = Geom.bed(DB.find("beds", bedId || APP.bedId)); if(!bed) return null;
    const W = Geom.W(bed), H = Geom.H(bed);
    const plants = Geom.live(bed.id).map(p => ({
      crop_id: p.crop_id,
      variety: p.variety || null,
      qty: num(p.qty, 1),
      span_mode: p.span_mode || "fill",
      /* fractions, so the layout survives a different-sized bed */
      fx: Math.round(Geom.PX(p) / W * 1000) / 1000,
      fy: Math.round(Geom.PY(p) / H * 1000) / 1000,
      rr: Geom.RR(p), rc: Geom.RC(p),
      notes: p.notes || null
    }));
    const t = {
      id: uid(),
      name: (name || bed.name || "Saved bed").trim(),
      shape: Geom.shape(bed), w_in: W, h_in: H,
      poly: bed.poly || null,
      cell_in: num(bed.cell_in, 12), grid_on: num(bed.grid_on, 0),
      north_deg: num(bed.north_deg, 0),
      sun_hours: bed.sun_hours || null, soil: bed.soil || null, irrigation: bed.irrigation || null,
      plants: plants,
      saved: iso(today())
    };
    const list = Templates.all();
    list.unshift(t);
    Templates.write(list);
    return t;
  },

  remove(id){
    Templates.write(Templates.all().filter(t => t.id !== id));
  },
  rename(id, name){
    const list = Templates.all();
    const t = list.find(x => x.id === id); if(!t) return;
    t.name = String(name || "").trim() || t.name;
    Templates.write(list);
  },

  /* ---------- using one ---------- */
  create(tid, plotId){
    const t = Templates.all().find(x => x.id === tid); if(!t) return null;
    const bed = DB.insert("beds", {
      name: t.name, shape: t.shape, w_in: t.w_in, h_in: t.h_in, poly: t.poly || null,
      cell_in: t.cell_in, grid_on: t.grid_on, snap_in: t.grid_on ? t.cell_in : 0,
      north_deg: t.north_deg || 0,
      cols: Math.max(1, Math.round(t.w_in / (t.cell_in || 12))),
      rows: Math.max(1, Math.round(t.h_in / (t.cell_in || 12))),
      sun_hours: t.sun_hours, soil: t.soil, irrigation: t.irrigation,
      plot_id: plotId || APP.plotId || null
    });
    Templates.apply(t, bed.id);
    return bed;
  },

  /* lay a saved layout onto an existing bed */
  apply(t, bedId){
    const bed = Geom.bed(DB.find("beds", bedId)); if(!bed || !t) return 0;
    const W = Geom.W(bed), H = Geom.H(bed);
    const made = [];
    (t.plants || []).forEach(p => {
      if(!crop(p.crop_id)) return;          /* a crop she has since deleted */
      const fit = Geom.clampInto(bed, num(p.fx, 0.5) * W, num(p.fy, 0.5) * H, Math.min(num(p.rr, 6), 2));
      const row = DB.insert("plantings", {
        bed_id: bed.id, crop_id: p.crop_id, variety: p.variety || null,
        qty: Math.max(1, num(p.qty, 1)), span_mode: p.span_mode || "fill",
        /* planned, and dated today — never carrying last year's sowing date */
        status: "planned", sown_on: iso(today()), notes: p.notes || null,
        px: Math.round(fit.x * 10) / 10, py: Math.round(fit.y * 10) / 10,
        rr: num(p.rr, 6), rc: Math.max(num(p.rr, 6), num(p.rc, 8)),
        rot: Math.round(Math.random() * 40 - 20), sv: Math.floor(Math.random() * 100000),
        x: Math.floor(fit.x / Garden.cell(bed)), y: Math.floor(fit.y / Garden.cell(bed)), w: 1, h: 1
      });
      made.push(row);
    });
    if(made.length){
      Undo.push("template", "Laid out " + made.length + " plant" + (made.length === 1 ? "" : "s"),
        made.map(m => ({ id: m.id, created: true })));
      Cal.rebuild();
    }
    return made.length;
  },

  /* ---------- UI ---------- */
  sheet(){
    const list = Templates.all();
    const bed = APP.bedId ? Geom.bed(DB.find("beds", APP.bedId)) : null;
    let h = '<p class="muted sm" style="margin-top:0">A saved bed keeps its outline and every plant on it — variety, spacing and position — but no dates and no harvest records. ' +
      'Start next season from the one that worked.</p>';

    if(bed) h += '<button class="btn block" onclick="Templates.saveCurrent()">☆ Save “' +
      esc(bed.name) + '” as a layout</button>';

    if(!list.length) h += '<div class="note i" style="margin-top:12px">Nothing saved yet.</div>';
    else {
      h += '<div class="sec" style="margin-top:16px"><h2>Saved layouts</h2><span class="tiny muted">' + list.length + '</span></div>';
      h += '<div class="card pad0"><div class="list">';
      list.forEach(t => {
        const n = (t.plants || []).length;
        const icons = (t.plants || []).slice(0, 6).map(p => cropEmoji(p.crop_id)).join("");
        h += '<div class="item"><div class="av">' + ((Geom.SHAPES[t.shape] || {}).e || "▭") + '</div>' +
          '<div class="grow"><div class="b">' + esc(t.name) + '</div>' +
          '<div class="tiny muted">' + Math.round(t.w_in/12*10)/10 + '×' + Math.round(t.h_in/12*10)/10 + ' ft · ' +
          n + ' plant' + (n === 1 ? "" : "s") + ' · saved ' + esc(t.saved || "") + '</div>' +
          '<div class="tiny" style="margin-top:2px">' + icons + '</div></div></div>' +
          '<div class="row wrap" style="gap:6px;padding:0 12px 12px">' +
          '<button class="chip" onclick="Templates.useNew(\'' + t.id + '\')">＋ New bed from this</button>' +
          (bed ? '<button class="chip" onclick="Templates.useHere(\'' + t.id + '\')">Add to this bed</button>' : '') +
          '<button class="chip bad" onclick="Templates.drop(\'' + t.id + '\')">Delete</button></div>';
      });
      h += '</div></div>';
    }
    openSheet("Saved beds", h);
  },

  saveCurrent(){
    const bed = Geom.bed(DB.find("beds", APP.bedId)); if(!bed) return;
    const n = Geom.live(bed.id).length;
    const t = Templates.save(bed.id, bed.name);
    if(!t) return;
    toast("Saved “" + t.name + "” · " + n + " plant" + (n === 1 ? "" : "s"));
    Templates.sheet();
  },
  useNew(tid){
    const bed = Templates.create(tid);
    if(!bed) return toast("That layout has gone");
    closeSheet();
    Garden.open(bed.id);
    toast("Bed created from your saved layout");
  },
  useHere(tid){
    const t = Templates.all().find(x => x.id === tid); if(!t) return;
    const n = Templates.apply(t, APP.bedId);
    closeSheet(); Garden.render();
    toast(n ? "Added " + n + " plant" + (n === 1 ? "" : "s") : "Nothing to add");
  },
  drop(tid){
    const t = Templates.all().find(x => x.id === tid); if(!t) return;
    confirmSheet("Delete “" + t.name + "”?", "The saved layout goes. Beds you already made from it are untouched.",
      "Delete", () => { Templates.remove(tid); Templates.sheet(); }, true);
  }
};

/* the bed menu grows two entries: save this as a layout, and which way it faces */
(function(){
  const orig = Garden.bedMenu;
  Garden.bedMenu = function(){
    orig.apply(Garden, arguments);
    const body = $("#sheet-body"); if(!body) return;
    const bed = Geom.bed(DB.find("beds", APP.bedId));
    const extra = document.createElement("div");
    extra.innerHTML =
      '<button class="btn ghost block" style="margin-top:8px" onclick="Orient.sheet()">🧭 Which way this bed faces · ' +
        esc(Orient.name(Orient.of(bed || {}))) + ' at the top</button>' +
      '<button class="btn ghost block" style="margin-top:8px" onclick="Templates.sheet()">☆ Saved beds and layouts</button>';
    const save = body.querySelector('button[onclick*="saveBed"]');
    if(save && save.parentNode) save.parentNode.insertBefore(extra, save.nextSibling);
    else body.appendChild(extra);
  };
})();
</script>

<script>
/* ============================================================
   MICRO-CLIMATE — the engine

   A hardiness zone describes a county. It cannot tell you that the
   strip in front of the house bakes against a south wall and never
   sees rain under the eaves, while the bed behind it sits in a
   cold pocket that loses two hours of afternoon sun to a maple.
   That difference is the whole game, and almost no app records it.

   A micro-climate profile is a `sites` row attached to a PLOT.
   Every bed in that plot inherits it; any bed may override single
   fields with its own row. Nothing here invents weather — the sun
   figures are real solar geometry for the garden's own latitude,
   and everything else is an explicit, editable estimate carrying
   its own confidence.
   ============================================================ */

const D2R = Math.PI / 180, R2D = 180 / Math.PI;

/* the eight compass sectors the horizon is recorded in */
const SECTORS = ["N","NE","E","SE","S","SW","W","NW"];
const SECTOR_AZ = [0, 45, 90, 135, 180, 225, 270, 315];

const Solar = {
  /* Spencer's Fourier series — declination good to about 0.03° */
  declination(doy){
    const g = 2 * Math.PI * (doy - 1) / 365;
    return (0.006918
      - 0.399912 * Math.cos(g)     + 0.070257 * Math.sin(g)
      - 0.006758 * Math.cos(2 * g) + 0.000907 * Math.sin(2 * g)
      - 0.002697 * Math.cos(3 * g) + 0.001480 * Math.sin(3 * g)) * R2D;
  },

  /* altitude and azimuth (clockwise from true north) at an hour angle,
     H in degrees: 0 = solar noon, negative = morning */
  pos(lat, doy, H){
    const d = Solar.declination(doy) * D2R, p = lat * D2R, h = H * D2R;
    const alt = Math.asin(Math.sin(p) * Math.sin(d) + Math.cos(p) * Math.cos(d) * Math.cos(h));
    /* atan2 form, measured from south then rotated to north */
    const azS = Math.atan2(Math.sin(h), Math.cos(h) * Math.sin(p) - Math.tan(d) * Math.cos(p));
    let az = azS * R2D + 180;
    az = ((az % 360) + 360) % 360;
    return { alt: alt * R2D, az: az };
  },

  /* solar noon is 12:00 solar time; convert a local clock hour to an
     hour angle using longitude and the equation of time */
  eqTime(doy){
    const g = 2 * Math.PI * (doy - 1) / 365;
    return 229.18 * (0.000075 + 0.001868 * Math.cos(g) - 0.032077 * Math.sin(g)
      - 0.014615 * Math.cos(2 * g) - 0.040849 * Math.sin(2 * g));   /* minutes */
  },
  hourAngle(dateObj, lat, lon){
    const start = new Date(dateObj.getFullYear(), 0, 0);
    const doy = Math.floor((dateObj - start) / DAY);
    const mins = dateObj.getHours() * 60 + dateObj.getMinutes();
    const tzMin = -dateObj.getTimezoneOffset();
    const trueSolar = mins + Solar.eqTime(doy) + 4 * lon - tzMin;
    return { doy: doy, H: trueSolar / 4 - 180 };
  },
  /* where the sun actually is, right now, over this garden */
  now(lat, lon, when){
    const d = when || new Date();
    const ha = Solar.hourAngle(d, lat, lon);
    return Object.assign(Solar.pos(lat, ha.doy, ha.H), { doy: ha.doy, H: ha.H, at: d });
  },

  /* obstruction elevation at any bearing, interpolated between sectors */
  horizonAt(hz, az){
    if(!hz || !hz.length) return 0;
    const a = ((az % 360) + 360) % 360;
    const i = Math.floor(a / 45) % 8, f = (a - Math.floor(a / 45) * 45) / 45;
    const lo = num(hz[i], 0), hi = num(hz[(i + 1) % 8], 0);
    return lo + (hi - lo) * f;
  },

  /* Sun within a few degrees of the horizon is not doing garden work: the
     beam crosses ten-odd air masses and every real site loses it to distant
     trees and terrain that no survey records. Everything below this is
     ignored, for the open reference site as well as the surveyed one, so
     the two stay comparable. */
  MIN_ALT: 3,

  /* hours of direct sun on a given day, and the direct-beam energy
     relative to an unobstructed flat site (1.0 = wide open) */
  day(lat, doy, hz, tiltDeg, tiltAzDeg){
    let mins = 0, beam = 0, open = 0;
    const b = (tiltDeg || 0) * D2R, ba = (tiltAzDeg === null || tiltAzDeg === undefined ? 180 : tiltAzDeg) * D2R;
    for(let H = -180; H < 180; H += 1){          /* 1° of hour angle = 4 minutes */
      const p = Solar.pos(lat, doy, H);
      if(p.alt <= Solar.MIN_ALT) continue;
      const sinA = Math.sin(p.alt * D2R);
      open += sinA;
      if(p.alt <= Solar.horizonAt(hz, p.az)) continue;
      mins += 4;
      /* cosine of incidence on the sloped ground */
      const ci = sinA * Math.cos(b) + Math.cos(p.alt * D2R) * Math.sin(b) * Math.cos((p.az * D2R) - ba);
      beam += Math.max(0, ci);
    }
    return { hours: Math.round(mins / 60 * 10) / 10, gain: open > 0 ? beam / open : 0 };
  },

  /* the 15th of each month — a fair sample of the month's sun */
  MID_DOY: [15, 46, 74, 105, 135, 166, 196, 227, 258, 288, 319, 349],
  year(lat, hz, tiltDeg, tiltAzDeg){
    const hours = [], gain = [];
    for(let m = 0; m < 12; m++){
      const r = Solar.day(lat, Solar.MID_DOY[m], hz, tiltDeg, tiltAzDeg);
      hours.push(r.hours); gain.push(Math.round(r.gain * 100) / 100);
    }
    return { hours: hours, gain: gain };
  }
};

/* ============================================================
   MICRO — profiles, derived numbers, and the reasons for them
   ============================================================ */
const Micro = (() => {

  const JSON_FIELDS = ["horizon", "sun_hours_by_month", "sun_gain_by_month", "photos", "shots", "rain_obs", "frost_obs"];

  const DEFAULTS = {
    horizon: [0,0,0,0,0,0,0,0],
    slope_pct: 0, slope_dir: null,
    wind_exposure: "normal", shelter: "none",
