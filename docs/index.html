    canopy: "open", reflect: "none",
    drainage: "normal", surface: "soil",
    frost_pocket: "none",
    method: null, confidence: null
  };

  const WIND    = { sheltered:0.85, normal:1.00, breezy:1.12, exposed:1.30 };
  const CANOPY  = { open:1.00, partial:0.85, tree:0.65, eaves:0.25 };
  const REFLECT = { none:1.00, some:1.08, strong:1.18 };
  const DRAIN   = { fast:1.15, normal:1.00, slow:0.90, boggy:0.80 };

  const LABELS = {
    wind_exposure:{ sheltered:"Sheltered", normal:"Normal", breezy:"Breezy", exposed:"Open and exposed" },
    canopy:{ open:"Open sky", partial:"Partly overhung", tree:"Under tree canopy", eaves:"Under eaves or a roof" },
    reflect:{ none:"No reflected heat", some:"Some reflected heat", strong:"Strong reflected heat" },
    drainage:{ fast:"Fast draining", normal:"Normal", slow:"Slow draining", boggy:"Stays wet" },
    frost_pocket:{ elevated:"High and free-draining air", none:"Neither", slight:"Slightly low", pocket:"A cold pocket" },
    surface:{ soil:"Bare soil", lawn:"Lawn", mulch:"Mulch", gravel:"Gravel", paving:"Paving", deck:"Deck" }
  };

  /* ---------- storage ---------- */
  function decode(row){
    if(!row) return null;
    const out = Object.assign({}, row);
    JSON_FIELDS.forEach(f => {
      const v = out[f];
      if(typeof v === "string" && v){ try{ out[f] = JSON.parse(v); }catch(e){ out[f] = null; } }
    });
    return out;
  }
  function encode(obj){
    const out = Object.assign({}, obj);
    JSON_FIELDS.forEach(f => { if(out[f] !== undefined && out[f] !== null && typeof out[f] !== "string") out[f] = JSON.stringify(out[f]); });
    return out;
  }

  function row(scope, refId){
    if(!refId) return null;
    return decode(DB.all("sites").find(s => s.scope === scope && s.ref_id === refId) || null);
  }
  function save(scope, refId, patch){
    const raw = DB.all("sites").find(s => s.scope === scope && s.ref_id === refId);
    const body = encode(Object.assign({}, patch, { scope: scope, ref_id: refId, updated: new Date().toISOString() }));
    const saved = raw ? DB.update("sites", raw.id, body) : DB.insert("sites", body);
    Micro._cache = {};
    return decode(saved);
  }
  function clear(scope, refId){
    const raw = DB.all("sites").find(s => s.scope === scope && s.ref_id === refId);
    if(raw) DB.remove("sites", raw.id);
    Micro._cache = {};
  }

  /* ---------- resolution: bed overrides plot, plot is the default ---------- */
  function profile(bedId){
    const bed = DB.find("beds", bedId);
    if(!bed) return null;
    const plotSite = bed.plot_id ? row("plot", bed.plot_id) : null;
    const bedSite  = row("bed", bed.id);
    if(!plotSite && !bedSite) return null;
    const merged = Object.assign({}, DEFAULTS, plotSite || {});
    if(bedSite) Object.keys(bedSite).forEach(k => {
      if(bedSite[k] !== null && bedSite[k] !== undefined && bedSite[k] !== "" && k !== "id" && k !== "created") merged[k] = bedSite[k];
    });
    merged._from = bedSite && plotSite ? "bed override" : (bedSite ? "bed" : "plot");
    merged._plotId = bed.plot_id || null;
    return merged;
  }

  /* growing months, from this garden's own frost dates */
  function growMonths(){
    const lf = Season.lastFrostISO, ff = Season.firstFrostISO;
    const a = lf ? parseISO(lf).getMonth() : 3, b = ff ? parseISO(ff).getMonth() : 8;
    const out = [];
    for(let m = a; ; m = (m + 1) % 12){ out.push(m); if(m === b) break; if(out.length > 12) break; }
    return out;
  }

  /* ---------- the derived picture ---------- */
  function derive(site){
    if(!site) return null;
    const lat = DB.get("lat", null);
    const hz = Array.isArray(site.horizon) ? site.horizon : DEFAULTS.horizon;
    const slope = clamp(num(site.slope_pct, 0), 0, 60);
    const tilt = Math.atan(slope / 100) * R2D;
    const tiltAz = site.slope_dir === null || site.slope_dir === undefined || site.slope_dir === ""
      ? null : num(site.slope_dir, 180);

    const out = { site: site, lat: lat, slopeDeg: Math.round(tilt * 10) / 10, why: [] };

    if(lat === null || lat === undefined){
      out.sunKnown = false;
      out.why.push({ k:"w", t:"No location set", m:"Set the garden's location and the sun hours here are calculated from real solar geometry rather than guessed." });
    } else {
      const yr = Solar.year(num(lat), hz, tilt, tiltAz);
      out.sunKnown = true;
      out.sunByMonth = yr.hours;
      out.gainByMonth = yr.gain;
      const gm = growMonths();
      out.sunGrowing = Math.round(gm.reduce((a, m) => a + yr.hours[m], 0) / gm.length * 10) / 10;
      out.gainGrowing = Math.round(gm.reduce((a, m) => a + yr.gain[m], 0) / gm.length * 100) / 100;
      out.sunPeak = Math.max.apply(null, yr.hours);
      out.sunLow  = Math.min.apply(null, gm.map(m => yr.hours[m]));
      /* the yardstick for everything below: what an unobstructed flat site
         at this same latitude gets. Water and shade are judged against this,
         never against a hardcoded "8 hours" that means nothing at 60°N. */
      const openYr = Solar.year(num(lat), DEFAULTS.horizon, 0, null);
      out.sunOpen = Math.round(gm.reduce((a, m) => a + openYr.hours[m], 0) / gm.length * 10) / 10;
      out.sunShare = out.sunOpen > 0 ? Math.round(out.sunGrowing / out.sunOpen * 100) / 100 : 1;
      out.lost = Math.round((out.sunOpen - out.sunGrowing) * 10) / 10;
      if(out.lost >= 1) out.why.push({ k:"i", t: out.lost + "h of sun lost to obstructions",
        m:"An open site at this latitude averages " + out.sunOpen + "h through the growing season. What you have around this spot brings it to " + out.sunGrowing + "h." });
      if(out.gainGrowing >= 1.04) out.why.push({ k:"g", t:"Slope tilts into the sun",
        m:"The ground here faces the sun more squarely than flat ground — about " + Math.round((out.gainGrowing - 1) * 100) + "% more direct-beam energy. It warms earlier in spring." });
      if(out.gainGrowing <= 0.94 && slope >= 4) out.why.push({ k:"w", t:"Slope tilts away from the sun",
        m:"About " + Math.round((1 - out.gainGrowing) * 100) + "% less direct-beam energy than flat ground. Expect slower spring warm-up and later ripening." });
    }

    /* ---- water ---- */
    const wind = WIND[site.wind_exposure] || 1;
    const shelterAdj = (site.shelter && site.shelter !== "none") ? 0.92 : 1;
    /* shade cuts evaporative demand — measured against an open site here,
       not against an absolute hour count */
    const sunAdj = out.sunKnown ? clamp(0.7 + 0.3 * (out.sunShare / 0.95), 0.7, 1.1) : 1;
    const reflect = REFLECT[site.reflect] || 1;
    const runoff = slope >= 20 ? 1.18 : slope >= 10 ? 1.12 : slope >= 4 ? 1.06 : 1;
    const drain = DRAIN[site.drainage] || 1;
    out.windFactor = Math.round(wind * shelterAdj * 100) / 100;
    out.waterFactor = Math.round(clamp(wind * shelterAdj * sunAdj * reflect * runoff * drain, 0.6, 1.9) * 100) / 100;
    out.rainCal = rainCal(site);
    out.rainCatch = out.rainCal.ratio;
    if(out.rainCal.measured !== null) out.why.push({ k:"g", t:"Measured against " + out.rainCal.n + " real rain days",
      m:"The forecast promised " + out.rainCal.forecastIn + '" over those days and you recorded ' + out.rainCal.observedIn +
        '" here — about ' + Math.round(out.rainCal.measured * 100) + "%. That is what the watering call now assumes, instead of trusting the forecast at face value." });
    out.frostEvidence = frostEvidence(site);

    if(out.waterFactor >= 1.12) out.why.push({ k:"w", t:"Dries out faster than the rest of the garden",
      m:"Wind, sun and slope here add up to about " + Math.round((out.waterFactor - 1) * 100) + "% more water than a sheltered flat bed needs. Mulch is worth more here than anywhere else." });
    if(out.waterFactor <= 0.9) out.why.push({ k:"g", t:"Holds moisture longer",
      m:"About " + Math.round((1 - out.waterFactor) * 100) + "% less water than an open bed. Water less often and watch for rot rather than drought." });
    if(out.rainCatch <= 0.7) out.why.push({ k:"w", t:"Rain does not reach this spot",
      m:(site.canopy === "eaves"
        ? "Under eaves or a roof overhang, roughly three-quarters of the rain never lands here. This bed is effectively hand-watered year round."
        : "Tree canopy intercepts a good third of the rainfall before it reaches the soil, and the roots above are drinking too.") });

    /* ---- frost ---- */
    let sLast = 0, sFirst = 0;
    if(site.frost_pocket === "pocket"){ sLast += 9; sFirst -= 9;
      out.why.push({ k:"d", t:"Cold air collects here",
        m:"Cold air is heavy and flows downhill until something dams it. A low or enclosed spot frosts first in autumn and last in spring — plan roughly a week either side of the garden's average dates." }); }
    else if(site.frost_pocket === "slight"){ sLast += 4; sFirst -= 4; }
    else if(site.frost_pocket === "elevated"){ sLast -= 3; sFirst += 3;
      out.why.push({ k:"g", t:"Cold air drains away",
        m:"Air moves off this spot rather than pooling in it, which buys a few frost-free days at both ends of the season." }); }

    if(site.reflect === "strong"){ sLast -= 5; sFirst += 5;
      out.why.push({ k:"g", t:"A wall works as a storage heater",
        m:"Masonry soaks up sun all day and releases it overnight. A south-facing wall commonly runs a week ahead of open ground in spring and holds tender crops later in autumn." }); }
    else if(site.reflect === "some"){ sLast -= 2; sFirst += 2; }

    if(site.canopy === "tree" || site.canopy === "eaves"){ sLast -= 3; sFirst += 3;
      out.why.push({ k:"i", t:"Overhead cover blunts radiation frost",
        m:"Anything overhead reflects heat back down on a clear night, so this spot escapes light frosts that catch open beds." }); }

    if(slope >= 4 && tiltAz !== null){
      const southish = Math.cos((tiltAz - 180) * D2R);          /* 1 = due south, -1 = due north */
      if(southish > 0.5){ sLast -= 3; sFirst += 3; }
      else if(southish < -0.5){ sLast += 3; sFirst -= 3;
        out.why.push({ k:"w", t:"North-facing slope runs cold",
          m:"Ground tilted away from the sun warms later in spring and cools sooner in autumn. Start heat-lovers elsewhere." }); }
    }

    out.frostShiftLast = clamp(Math.round(sLast), -14, 14);
    out.frostShiftFirst = clamp(Math.round(sFirst), -14, 14);
    out.lastFrost = Season.lastFrost() ? addDays(Season.lastFrost(), out.frostShiftLast) : null;
    out.firstFrost = Season.firstFrost() ? addDays(Season.firstFrost(), out.frostShiftFirst) : null;
    out.seasonShift = out.frostShiftFirst - out.frostShiftLast;

    /* ---- an honest headline ---- */
    if(out.sunKnown){
      out.band = out.sunGrowing >= 6 ? "full sun" : out.sunGrowing >= 4 ? "part sun" : out.sunGrowing >= 2 ? "part shade" : "full shade";
    }
    out.aspect = aspectLabel(hz);
    return out;
  }

  /* ============================================================
     GROUND TRUTH

     A forecast is for a grid square several miles across. Gardeners
     watch it promise half an inch and then walk out to dust. Rather
     than argue with the forecast, the app asks — on the days it said
     rain — what actually landed, and keeps the ratio.

     That single number absorbs two real effects at once: how much
     the forecast runs high over this address, and how much of what
     does fall is intercepted by eaves or canopy before it reaches
     the soil. Both make the same difference to the watering call.
     Until there is enough evidence it stays out of the way and the
     canopy estimate stands.
     ============================================================ */
  function rainCal(site){
    const est = CANOPY[site.canopy] === undefined ? 1 : CANOPY[site.canopy];
    const obs = (Array.isArray(site.rain_obs) ? site.rain_obs : [])
      .filter(o => o && num(o.f, 0) >= 0.05);
    const fc = obs.reduce((a, o) => a + num(o.f, 0), 0);
    const ob = obs.reduce((a, o) => a + num(o.o, 0), 0);
    if(obs.length < 3 || fc < 0.3) return { ratio: est, measured: null, n: obs.length, est: est, source:"estimated" };
    const measured = clamp(ob / fc, 0.05, 1.35);
    /* eight confirmed rain days is enough to trust the record outright;
       fewer and it is blended with the estimate rather than replacing it */
    const wt = Math.min(1, obs.length / 8);
    return {
      ratio: Math.round((est * (1 - wt) + measured * wt) * 100) / 100,
      measured: Math.round(measured * 100) / 100,
      n: obs.length, est: est, weight: Math.round(wt * 100) / 100,
      forecastIn: Math.round(fc * 100) / 100, observedIn: Math.round(ob * 100) / 100,
      source: wt >= 1 ? "measured" : "measured and estimated"
    };
  }

  /* how far the forecast itself runs off at this address, judged from the
     most open surveyed spot — the one where nothing overhead can be blamed */
  function rainBias(){
    const rows = DB.all("sites").map(decode);
    const open = rows.filter(r => (r.canopy || "open") === "open");
    const pool = (open.length ? open : rows);
    const obs = [];
    pool.forEach(r => (Array.isArray(r.rain_obs) ? r.rain_obs : []).forEach(o => { if(o && num(o.f, 0) >= 0.05) obs.push(o); }));
    if(obs.length < 4) return null;
    const fc = obs.reduce((a, o) => a + num(o.f, 0), 0);
    const ob = obs.reduce((a, o) => a + num(o.o, 0), 0);
    if(fc < 0.5) return null;
    return { ratio: Math.round(ob / fc * 100) / 100, n: obs.length,
             forecastIn: Math.round(fc * 100) / 100, observedIn: Math.round(ob * 100) / 100,
             clean: open.length > 0 };
  }

  /* frost is the other thing a forecast gets wrong locally, and the one
     the gardener notices most. Evidence is recorded and a change is
     SUGGESTED — never applied behind her back. */
  function frostEvidence(site){
    const obs = (Array.isArray(site.frost_obs) ? site.frost_obs : []).filter(Boolean);
    if(!obs.length) return { n: 0, suggest: null };
    let colder = 0, warmer = 0;
    obs.forEach(o => {
      const low = num(o.low, 40);
      if(o.frost === true && low > 34) colder++;
      else if(o.frost === false && low <= 32) warmer++;
    });
    const order = ["elevated", "none", "slight", "pocket"];
    const at = Math.max(0, order.indexOf(site.frost_pocket || "none"));
    let suggest = null, msg = null;
    if(colder - warmer >= 2 && at < 3){
      suggest = order[at + 1];
      msg = "Frost has caught this spot " + colder + " times on nights the forecast low stayed above freezing. That is what a cold pocket looks like.";
    } else if(warmer - colder >= 2 && at > 0){
      suggest = order[at - 1];
      msg = "This spot has escaped frost " + warmer + " times on nights the forecast said freezing. It is running warmer than the garden average.";
    }
    return { n: obs.length, colder: colder, warmer: warmer, suggest: suggest, msg: msg };
  }

  /* which way the sky is most open — the plain-English aspect */
  function aspectLabel(hz){
    if(!hz || !hz.length) return null;
    let best = 0, bestV = 999;
    SECTOR_AZ.forEach((az, i) => { const v = num(hz[i], 0); if(v < bestV){ bestV = v; best = i; } });
    let worst = 0, worstV = -1;
    SECTOR_AZ.forEach((az, i) => { const v = num(hz[i], 0); if(v > worstV){ worstV = v; worst = i; } });
    if(worstV < 5) return "open on every side";
    return "opens to the " + ({N:"north",NE:"north-east",E:"east",SE:"south-east",S:"south",SW:"south-west",W:"west",NW:"north-west"})[SECTORS[best]] +
      ", closed to the " + ({N:"north",NE:"north-east",E:"east",SE:"south-east",S:"south",SW:"south-west",W:"west",NW:"north-west"})[SECTORS[worst]];
  }

  /* ---------- cached lookups the rest of the app calls ---------- */
  const api = {
    SECTORS: SECTORS, SECTOR_AZ: SECTOR_AZ, DEFAULTS: DEFAULTS, LABELS: LABELS,
    _cache: {},

    row: row, save: save, clear: clear, profile: profile, aspectLabel: aspectLabel,
    encode: encode, decode: decode, growMonths: growMonths,
    rainCal: rainCal, rainBias: rainBias, frostEvidence: frostEvidence,

    /* every spot with a profile, plot or bed */
    sites(){
      return DB.all("sites").map(decode).map(s => Object.assign({}, s, {
        name: s.scope === "plot" ? ((DB.find("plots", s.ref_id) || {}).name || null)
                                 : ((DB.find("beds", s.ref_id) || {}).name || null)
      })).filter(s => s.name);
    },

    /* append one confirmed rain day. Re-answering a day replaces it. */
    logRain(scope, refId, dateISO, forecastIn, observedIn){
      const s = row(scope, refId); if(!s) return null;
      const obs = (Array.isArray(s.rain_obs) ? s.rain_obs : []).filter(o => o && o.d !== dateISO);
      obs.push({ d: dateISO, f: Math.round(num(forecastIn, 0) * 100) / 100,
                 o: Math.round(clamp(num(observedIn, 0), 0, 20) * 100) / 100 });
      obs.sort((a, b) => String(a.d).localeCompare(String(b.d)));
      const saved = save(scope, refId, { rain_obs: obs.slice(-60) });
      api.invalidate();
      return saved;
    },
    logFrost(scope, refId, dateISO, forecastLow, frosted){
      const s = row(scope, refId); if(!s) return null;
      const obs = (Array.isArray(s.frost_obs) ? s.frost_obs : []).filter(o => o && o.d !== dateISO);
      obs.push({ d: dateISO, low: Math.round(num(forecastLow, 40)), frost: !!frosted });
      obs.sort((a, b) => String(a.d).localeCompare(String(b.d)));
      const saved = save(scope, refId, { frost_obs: obs.slice(-40) });
      api.invalidate();
      return saved;
    },
    answered(s, kind, dateISO){
      const arr = Array.isArray(s[kind === "rain" ? "rain_obs" : "frost_obs"]) ? s[kind === "rain" ? "rain_obs" : "frost_obs"] : [];
      return arr.some(o => o && o.d === dateISO);
    },

    /* everything derived for a bed, memoised per render pass */
    forBed(bedId){
      if(!bedId) return null;
      if(api._cache[bedId] !== undefined) return api._cache[bedId];
      const p = profile(bedId);
      return (api._cache[bedId] = p ? derive(p) : null);
    },
    forPlot(plotId){
      const s = row("plot", plotId);
      return s ? derive(Object.assign({}, DEFAULTS, s)) : null;
    },
    derive: derive,
    invalidate(){ api._cache = {}; },

    /* the sun figure the rest of the app should use for a bed:
       the surveyed number when there is one, the gardener's own otherwise */
    sunHours(bedId){
      const bed = DB.find("beds", bedId);
      const d = api.forBed(bedId);
      if(d && d.sunKnown && !d.site.sun_override) return d.sunGrowing;
      return bed ? num(bed.sun_hours, 8) : 8;
    },
    sunSource(bedId){
      const d = api.forBed(bedId);
      return (d && d.sunKnown && !d.site.sun_override) ? "surveyed" : "entered";
    },

    /* frost dates for one bed rather than the whole county */
    frostFor(bedId){
      const d = api.forBed(bedId);
      if(!d) return { last: Season.lastFrost(), first: Season.firstFrost(), shifted: false };
      return { last: d.lastFrost || Season.lastFrost(), first: d.firstFrost || Season.firstFrost(),
               shifted: !!(d.frostShiftLast || d.frostShiftFirst),
               shiftLast: d.frostShiftLast, shiftFirst: d.frostShiftFirst };
    },
    daysLeft(bedId){
      const f = api.frostFor(bedId);
      return f.first ? diffDays(today(), f.first) : null;
    },

    /* a one-line summary for a card */
    chip(bedId){
      const d = api.forBed(bedId);
      if(!d) return null;
      const bits = [];
      if(d.sunKnown) bits.push(d.sunGrowing + "h sun");
      if(d.waterFactor !== 1) bits.push((d.waterFactor > 1 ? "+" : "") + Math.round((d.waterFactor - 1) * 100) + "% water");
      if(d.rainCatch < 1) bits.push(Math.round((1 - d.rainCatch) * 100) + "% rain blocked");
      if(d.seasonShift) bits.push((d.seasonShift > 0 ? "+" : "") + d.seasonShift + "d season");
      return bits.join(" · ");
    },

    /* has anything been surveyed at all? */
    any(){ return DB.count("sites") > 0; },
    hasFor(bedId){ return !!profile(bedId); }
  };
  return api;
})();

/* ============================================================
   WIRING — the profile has to actually change the advice, or it
   is just a form. Both wrappers are additive: with no profile
   they hand straight back to the original behaviour.
   ============================================================ */
(function wireRecommend(){

  /* ---- watering: crop need scaled by the site, rain scaled by what reaches it ---- */
  const origWater = Recommend.water;
  Recommend.water = function(bedId, weather){
    const base = origWater.call(Recommend, bedId, weather);
    if(!base) return base;
    const d = Micro.forBed(bedId);
    if(!d) return base;

    const need = Math.round(base.need * d.waterFactor * 100) / 100;
    const rain = Math.round(base.rain * d.rainCatch * 100) / 100;
    const deficit = Math.round((need - rain - base.logged) * 100) / 100;
    const why = [];
    if(d.waterFactor !== 1) why.push(
      (d.waterFactor > 1 ? "Needs " + Math.round((d.waterFactor - 1) * 100) + "% more" : "Needs " + Math.round((1 - d.waterFactor) * 100) + "% less") +
      " than the crop table alone — " +
      [ d.site.wind_exposure === "exposed" || d.site.wind_exposure === "breezy" ? "wind here" : null,
        d.sunKnown && d.sunShare >= 0.95 ? "an open sky all day" : null,
        d.site.reflect !== "none" ? "reflected heat" : null,
        num(d.site.slope_pct, 0) >= 4 ? "runoff down the slope" : null,
        d.site.drainage === "fast" ? "fast-draining soil" : null,
        d.site.drainage === "slow" || d.site.drainage === "boggy" ? "soil that holds water" : null
      ].filter(Boolean).join(", ") + ".");
    if(d.rainCatch < 1) why.push("Only about " + Math.round(d.rainCatch * 100) + "% of rainfall reaches this spot" +
      (d.site.canopy === "eaves" ? " — it sits under an overhang." : " — the canopy above takes the rest."));

    return Object.assign({}, base, {
      need: need, rain: rain, deficit: deficit,
      verdict: deficit <= 0.05 ? "skip" : (deficit < 0.5 ? "light" : "water"),
      baseNeed: base.need, baseRain: base.rain,
      micro: { factor: d.waterFactor, rainCatch: d.rainCatch, why: why }
    });
  };

  /* ---- recommendations: surveyed sun, and this bed's own frost dates ---- */
  const origNow = Recommend.now;
  Recommend.now = function(opts){
    const o = Object.assign({}, opts || {});
    const d = o.bedId ? Micro.forBed(o.bedId) : null;
    if(d && d.sunKnown && o.sun === undefined) o.sun = d.sunGrowing;
    const out = origNow.call(Recommend, o);
    if(!d) return out;

    const left = Micro.daysLeft(o.bedId);
    out.forEach(r => {
      if(d.sunKnown) r.why.push("☀️ " + d.sunGrowing + "h of surveyed sun here in season" +
        (d.lost >= 1 ? " (" + d.lost + "h less than open ground)" : ""));
      /* the frost window this bed actually gets, not the county's */
      if(left !== null && d.frostShiftFirst){
        const needs = r.crop.dtm;
        if(left < needs + 7 && r.window.kind !== "fall" && r.window.kind !== "indoor"){
          r.score -= 10;
          r.warn.push("This spot frosts " + Math.abs(d.frostShiftFirst) + " days " +
            (d.frostShiftFirst < 0 ? "earlier" : "later") + " than the garden average — " + left + " days left, and it needs " + needs + ".");
        } else if(d.frostShiftFirst > 0){
          r.score += 3;
          r.why.push("🍂 Frost holds off about " + d.frostShiftFirst + " days longer here.");
        }
      }
      if(d.waterFactor >= 1.15 && r.crop.water >= 1.2){
        r.score -= 6;
        r.warn.push("Thirsty crop in a spot that dries fast — mulch heavily or pick somewhere else.");
      }
      if(d.rainCatch <= 0.4){
        r.warn.push("Rain barely reaches this spot; everything here is hand-watered.");
      }
    });
    return out.sort((a, b) => b.score - a.score);
  };
})();
</script>

<script>
/* ============================================================
   MICRO-CLIMATE — the survey

   Two ways in, and the second never depends on the first:

   1. Guided photo survey. Stand in the spot, shoot the four
      directions. Each shot is followed by the questions that make
      the picture readable — which way you were facing, what time
      it is, whether that ground is flat — and the answers plus the
      garden's latitude let the app work out where the sun was at
      the moment of the shot. A photo taken at a known time from a
      known bearing is not a picture, it is a measurement: if the
      sun was 40° up in the south-east and this spot was in shade,
      something 40° high stands to the south-east. That single
      geometric fact is worth more than any amount of guessing.

   2. The same form, filled in by hand. Everything the camera path
      produces is an editable estimate in that form. No API key,
      no camera, no network.
   ============================================================ */

const MicroUI = {
  cap: null, stream: null,

  DIRS: [["N",0,"north"],["E",90,"east"],["S",180,"south"],["W",270,"west"]],
  SLOPES: [["flat",0,"Flat"],["slight",5,"Slight"],["moderate",12,"Moderate"],["steep",25,"Steep"]],

  /* ---------- entry point ---------- */
  open(scope, refId){
    Micro.invalidate();
    const isPlot = scope === "plot";
    const name = isPlot ? (DB.find("plots", refId) || {}).name : (DB.find("beds", refId) || {}).name;
    if(!name) return toast("That is gone");
    const site = Micro.row(scope, refId);
    const d = site ? Micro.derive(Object.assign({}, Micro.DEFAULTS, site)) : null;

    let h = '<p class="muted sm" style="margin-top:0">' +
      (isPlot ? 'Everything in <b>' + esc(name) + '</b> inherits this. A single bed can still override it.'
              : 'This overrides the plot profile for <b>' + esc(name) + '</b> only.') + '</p>';

    if(!site){
      h += '<div class="note i"><b>Why this is worth five minutes.</b> Your zone describes a whole county. It cannot know that the strip in front of the house bakes against a wall and never sees rain under the eaves, while the bed out back loses the afternoon to a maple and frosts a week early. That is the difference between a crop and a shrug.</div>';
    } else {
      h += MicroUI.summary(d);
    }

    h += '<div class="row" style="gap:8px;margin-top:14px">' +
      '<button class="btn grow" onclick="MicroUI.capture(\'' + scope + '\',\'' + refId + '\')">📷 Survey with photos</button>' +
      '<button class="btn ghost grow" onclick="MicroUI.form(\'' + scope + '\',\'' + refId + '\')">✏️ ' + (site ? "Edit by hand" : "Enter by hand") + '</button></div>';
    if(!Vision.ready()) h += '<div class="tiny muted" style="margin-top:8px">No AI key connected, so the photo survey will measure light and shadow on-device and ask you the rest. It still works.</div>';
    if(site) h += '<button class="btn ghost block" style="margin-top:8px" onclick="MicroUI.remove(\'' + scope + '\',\'' + refId + '\')">Delete this profile</button>';

    openSheet("Micro-climate · " + name, h);
  },

  remove(scope, refId){
    confirmSheet("Delete the profile?", "The survey for this " + scope + " is removed and it falls back to the garden's general figures.",
      "Delete", () => { Micro.clear(scope, refId); Garden.render(); toast("Profile deleted"); }, true);
  },

  /* ---------- the derived picture, in plain language ---------- */
  summary(d){
    if(!d) return "";
    let h = '<div class="card" style="margin-top:12px">';
    h += '<div class="grid3">' +
      '<div class="stat"><span class="n">' + (d.sunKnown ? d.sunGrowing + "h" : "—") + '</span><span class="l">sun in season</span></div>' +
      '<div class="stat"><span class="n">' + (d.waterFactor > 1 ? "+" : "") + Math.round((d.waterFactor - 1) * 100) + '%</span><span class="l">water</span></div>' +
      '<div class="stat"><span class="n">' + (d.seasonShift > 0 ? "+" : "") + d.seasonShift + 'd</span><span class="l">season</span></div>' +
      '</div>';
    if(d.sunKnown){
      h += '<div class="tiny b muted" style="text-transform:uppercase;letter-spacing:.06em;margin:14px 0 6px">Direct sun by month</div>';
      h += MicroUI.sunChart(d);
      h += '<div class="tiny muted" style="margin-top:6px">' +
        (d.band ? '<b>' + esc(d.band) + '</b> through the growing season' : '') +
        (d.aspect ? ' · ' + esc(d.aspect) : '') + '</div>';
    }
    if(d.lastFrost || d.firstFrost){
      h += '<div class="note ' + (d.seasonShift < 0 ? "w" : d.seasonShift > 0 ? "g" : "i") + '" style="margin-top:12px">🌡️ <b>This spot\'s own frost dates.</b> Last ' +
        fmt(d.lastFrost) + ', first ' + fmt(d.firstFrost) +
        (d.seasonShift ? ' — ' + Math.abs(d.seasonShift) + ' days ' + (d.seasonShift > 0 ? "longer" : "shorter") + ' than the garden average.' : ' — the same as the garden average.') +
        '</div>';
    }
    d.why.forEach(w => h += '<div class="note ' + w.k + '" style="margin-top:8px"><b>' + esc(w.t) + '</b><br>' + esc(w.m) + '</div>');
    h += '<div class="tiny muted" style="margin-top:10px">Sun hours are real solar geometry for latitude ' +
      (d.lat === null || d.lat === undefined ? "—" : (Math.round(num(d.lat) * 100) / 100)) +
      '°, blocked by the skyline you recorded. Water, wind and frost figures are estimates from that skyline and your answers — edit any of them.</div>';
    h += '</div>';
    return h;
  },

  sunChart(d){
    const max = Math.max(1, Math.ceil(Math.max.apply(null, d.sunByMonth)));
    const grow = Micro.growMonths();
    let h = '<div class="row" style="gap:3px;align-items:flex-end;height:64px">';
    d.sunByMonth.forEach((v, m) => {
      const pct = Math.round(v / max * 100);
      const on = grow.indexOf(m) >= 0;
      h += '<div class="grow" style="text-align:center" title="' + esc(MONF[m]) + ': ' + v + 'h">' +
        '<div style="height:' + Math.max(2, Math.round(pct * 0.46)) + 'px;border-radius:4px 4px 0 0;background:' +
        (on ? "var(--green-600)" : "var(--line)") + '"></div>' +
        '<div class="tiny muted" style="font-size:.55rem;margin-top:3px">' + MON[m][0] + '</div></div>';
    });
    h += '</div>';
    return h;
  },

  /* ============================================================
     THE PHOTO SURVEY
     ============================================================ */
  capture(scope, refId){
    MicroUI.cap = { scope: scope, refId: refId, shots: [], i: 0 };
    MicroUI.shotStep();
  },

  shotStep(){
    const c = MicroUI.cap; if(!c) return;
    if(c.i >= MicroUI.DIRS.length) return MicroUI.finish();
    const d = MicroUI.DIRS[c.i];
    const done = c.shots.filter(s => s.photo).length;
    let h = '<div class="row between" style="margin-bottom:10px"><div>' +
      '<div class="b">Face ' + esc(d[2]) + ' and shoot</div>' +
      '<div class="tiny muted">Stand in the middle of the space. Hold the phone level, take in the whole skyline.</div></div>' +
      '<div style="font-size:2rem">🧭</div></div>';
    h += '<div class="row" style="gap:6px;margin-bottom:10px">' +
      MicroUI.DIRS.map((x, i) => '<span class="chip ' + (i === c.i ? "on" : (c.shots[i] && c.shots[i].photo ? "good" : "")) + '" style="flex:1;text-align:center;justify-content:center">' +
        x[0] + '</span>').join("") + '</div>';
    h += '<div id="mc-cam"></div>';
    h += '<div class="row" style="gap:8px;margin-top:10px">' +
      '<button class="btn grow" onclick="MicroUI.camStart()">📷 Open camera</button>' +
      '<button class="btn ghost grow" onclick="MicroUI.pick(true)">Snapshot</button>' +
      '<button class="btn ghost" onclick="MicroUI.pick(false)">🖼️</button></div>';
    h += '<button class="btn outline block" style="margin-top:8px" onclick="MicroUI.skipShot()">Skip ' + esc(d[2]) + ' →</button>';
    if(done) h += '<button class="btn ghost block sm" style="margin-top:6px" onclick="MicroUI.finish()">Done — use the ' + done + ' shot' + (done > 1 ? "s" : "") + ' I have</button>';
    h += '<div class="note i" style="margin-top:12px">Photos are read at full size and thrown away; only a small thumbnail is kept, inside your encrypted vault.</div>';
    openSheet("Survey · " + (c.i + 1) + " of 4", h, () => MicroUI.camStop());
  },

  async camStart(){
    const wrap = $("#mc-cam"); if(!wrap) return;
    if(!Cam.supported()){ toast("Live camera needs https — using your camera app"); return MicroUI.pick(true); }
    try{
      MicroUI.camStop();
      MicroUI.stream = await Cam.rear();
      wrap.innerHTML = '<video id="mcfeed" playsinline autoplay muted></video>' +
        '<button class="btn block" style="margin-top:8px" onclick="MicroUI.snap()">◉ Capture</button>';
      const v = $("#mcfeed"); v.srcObject = MicroUI.stream; await v.play();
    }catch(e){ toast("Camera blocked — using your photo library"); MicroUI.pick(true); }
  },
  camStop(){ Cam.stop(MicroUI.stream); MicroUI.stream = null; },

  snap(){
    const v = $("#mcfeed"); if(!v) return;
    const s = Math.min(1, 1400 / Math.max(v.videoWidth, v.videoHeight));
    const c = document.createElement("canvas");
    c.width = Math.round(v.videoWidth * s); c.height = Math.round(v.videoHeight * s);
    c.getContext("2d").drawImage(v, 0, 0, c.width, c.height);
    MicroUI.camStop();
    MicroUI.got(c.toDataURL("image/jpeg", 0.8), c);
  },
  pick(useCamera){
    const inp = useCamera ? $("#filepick-cam") : $("#filepick");
    inp.value = "";
    inp.onchange = async () => {
      const f = inp.files[0]; if(!f) return;
      try{ const r = await shrinkImage(f, 1400, 0.8); MicroUI.got(r.dataUrl, r.canvas); }
      catch(e){ toast("Could not read that image"); }
    };
    inp.click();
  },

  skipShot(){ const c = MicroUI.cap; c.shots[c.i] = null; c.i++; MicroUI.shotStep(); },

  /* the reading copy is never stored — same rule as the seed packet reader */
  async got(dataUrl, canvas){
    const c = MicroUI.cap; if(!c) return;
    const thumb = await MicroUI.thumb(canvas);
    c.pending = {
      dir: MicroUI.DIRS[c.i][0],
      bearing: MicroUI.DIRS[c.i][1],
      reading: Vision.fromDataUrl(dataUrl),
      light: MicroUI.light(canvas),
      photoId: thumb,
      at: new Date()
    };
    MicroUI.questions();
    /* the compass is a nicety — it must never hold up the form */
    MicroUI.heading().then(deg => {
      if(deg === null || !MicroUI.cap || !MicroUI.cap.pending) return;
      MicroUI.cap.pending.compass = deg;
      const el = $("#mq-compass");
      if(el){
        el.innerHTML = '🧭 Compass says <b>' + Math.round(deg) + '° (' + MicroUI.nearest(deg) + ')</b> — tap to use it';
        el.style.display = "";
        el.onclick = () => { MicroUI.setBearing(deg); toast("Using the compass reading"); };
      }
    });
  },

  thumb(canvas){
    return new Promise(res => {
      const s = Math.min(1, 640 / Math.max(canvas.width, canvas.height));
      const c = document.createElement("canvas");
      c.width = Math.round(canvas.width * s); c.height = Math.round(canvas.height * s);
      c.getContext("2d").drawImage(canvas, 0, 0, c.width, c.height);
      res(Photos.put(c.toDataURL("image/jpeg", 0.7), c.width, c.height));
    });
  },

  nearest(deg){
    const i = Math.round((((deg % 360) + 360) % 360) / 45) % 8;
    return Micro.SECTORS[i];
  },
  setBearing(deg){
    if(!MicroUI.cap || !MicroUI.cap.pending) return;
    MicroUI.cap.pending.bearing = Math.round(((deg % 360) + 360) % 360);
    const sel = $("#mq-dir"); if(sel) sel.value = String(Math.round(MicroUI.cap.pending.bearing / 45) * 45 % 360);
  },

  /* ---------- the questions that make a photo readable ---------- */
  questions(){
    const p = MicroUI.cap.pending;
    const nowStr = String(p.at.getHours()).padStart(2, "0") + ":" + String(p.at.getMinutes()).padStart(2, "0");
    const lat = DB.get("lat", null), lon = DB.get("lon", null);
    const sun = (lat !== null && lon !== null) ? Solar.now(num(lat), num(lon), p.at) : null;

    let h = '<div class="row" style="gap:10px;margin-bottom:12px">' +
      '<img src="' + esc(Photos.url(p.photoId) || "") + '" style="width:88px;height:88px;object-fit:cover;border-radius:12px">' +
      '<div class="grow"><div class="b">A few questions</div>' +
      '<div class="tiny muted">These turn the photo into a measurement rather than a guess.</div></div></div>';

    h += '<div class="field"><label class="f">Which way were you facing?</label><select id="mq-dir">' +
      Micro.SECTOR_AZ.map((az, i) => '<option value="' + az + '"' + (az === p.bearing ? " selected" : "") + '>' +
        Micro.SECTORS[i] + ' — ' + az + '°</option>').join("") +
      '<option value="">Not sure</option></select></div>';
    h += '<div class="note i tiny" id="mq-compass" style="margin-top:6px;display:none;cursor:pointer"></div>';

    h += '<div class="grid2" style="margin-top:12px">' +
      '<div><label class="f">Time of this photo</label><input type="time" id="mq-time" value="' + nowStr + '"></div>' +
      '<div><label class="f">Ground here</label><select id="mq-slope">' +
        MicroUI.SLOPES.map(s => '<option value="' + s[1] + '">' + s[2] + (s[1] ? ' (~' + s[1] + '%)' : '') + '</option>').join("") +
      '</select></div></div>';

    h += '<div class="field" style="margin-top:12px"><label class="f">If it slopes, which way is downhill?</label><select id="mq-down">' +
      '<option value="">Level / not sure</option>' +
      Micro.SECTOR_AZ.map((az, i) => '<option value="' + az + '">' + Micro.SECTORS[i] + '</option>').join("") +
      '</select></div>';

    h += '<div class="field" style="margin-top:12px"><label class="f">Is this spot in direct sun right now?</label>' +
      '<div class="seg" id="mq-sunlit">' +
        '<button data-v="yes">☀️ In sun</button><button data-v="no">🌥️ In shade</button><button data-v="" class="on">Not sure</button>' +
      '</div></div>';

    if(sun && sun.alt > 0){
      h += '<div class="note g tiny" style="margin-top:8px">At ' + nowStr + ' the sun is <b>' + Math.round(sun.alt) +
        '° up, bearing ' + Math.round(sun.az) + '° (' + MicroUI.nearest(sun.az) + ')</b>. ' +
        'Answering the question above pins the skyline in that direction to within a few degrees — it is the single most useful thing you can tell the app.</div>';
    } else if(sun){
      h += '<div class="note i tiny" style="margin-top:8px">The sun is below the horizon at ' + nowStr + ', so the shadow check is skipped for this shot.</div>';
    }

    h += '<div class="row" style="gap:8px;margin-top:16px">' +
      '<button class="btn ghost" onclick="MicroUI.dropShot()">Retake</button>' +
      '<button class="btn grow" id="mq-go" onclick="MicroUI.acceptShot()">' +
        (Vision.ready() ? "Read this photo →" : "Save and continue →") + '</button></div>';

    openSheet("Shot " + (MicroUI.cap.i + 1) + " · " + MicroUI.DIRS[MicroUI.cap.i][2], h);
    $$("#mq-sunlit button").forEach(b => b.onclick = () => {
      $$("#mq-sunlit button").forEach(x => x.classList.toggle("on", x === b));
    });
  },

  dropShot(){
    const p = MicroUI.cap.pending;
    if(p && p.photoId) Photos.drop(p.photoId);
    MicroUI.cap.pending = null;
    MicroUI.shotStep();
  },

  async acceptShot(){
    const c = MicroUI.cap, p = c.pending; if(!p) return;
    const dirV = $("#mq-dir").value;
    p.bearing = dirV === "" ? null : num(dirV, 0);
    p.slopePct = num($("#mq-slope").value, 0);
    const dv = $("#mq-down").value;
    p.slopeDir = dv === "" ? null : num(dv, 180);
    const sel = $("#mq-sunlit button.on");
    const sv = sel ? sel.dataset.v : "";
    p.sunlit = sv === "yes" ? true : sv === "no" ? false : null;

    const t = ($("#mq-time").value || "").split(":");
    if(t.length === 2){ const d = new Date(p.at); d.setHours(num(t[0], 12), num(t[1], 0), 0, 0); p.at = d; }
    const lat = DB.get("lat", null), lon = DB.get("lon", null);
    p.sun = (lat !== null && lon !== null) ? Solar.now(num(lat), num(lon), p.at) : null;

    const btn = $("#mq-go");
    if(Vision.ready()){
      if(btn){ btn.disabled = true; btn.innerHTML = '<span class="spinner"></span> Reading the photo…'; }
      try{ p.ai = await MicroUI.read(p); }
      catch(e){ toast(Vision.explain(e)); p.aiError = Vision.explain(e); }
    }
    delete p.reading;                      /* the full-size copy is never kept */
    c.shots[c.i] = p; c.pending = null; c.i++;
    MicroUI.shotStep();
  },

  /* ---------- the vision call ---------- */
  read(p){
    const dirName = p.bearing === null ? "an unknown direction" : MicroUI.nearest(p.bearing) + " (" + p.bearing + "°)";
    const sunLine = p.sun && p.sun.alt > 0
      ? "At the moment this photo was taken the sun was " + Math.round(p.sun.alt) + " degrees above the horizon at a compass bearing of " +
        Math.round(p.sun.az) + " degrees. Use the direction and length of any shadows to check this and to judge how high the things casting them are."
      : "The sun was below the horizon when this was taken, so ignore shadow direction.";

    const prompt =
      "You are surveying a vegetable garden site for its micro-climate. This photo was taken from the middle of the growing " +
      "space, by someone standing in it, facing " + dirName + ". " + sunLine + "\n\n" +
      "Estimate what is around this spot. Angles are elevation above the horizontal measured from where the photographer stands: " +
      "a fence a few metres away might be 15 degrees, a two-storey house close by 40 degrees, a tall tree overhead 60 or more. " +
      "Open sky is 0.\n\n" +
      "Reply with ONLY a JSON object, no prose:\n" +
      "{\n" +
      '  "horizon_angle_deg": number,          // representative obstruction elevation across the centre of the frame\n' +
      '  "obstructions": [ { "what": string, "bearing_offset_deg": number, "height_angle_deg": number, "distance_ft": number, "solid": boolean } ],\n' +
      '  "open_sky_fraction": number,          // 0..1 of the frame that is clear sky\n' +
      '  "shadow": { "present": boolean, "covers_fraction": number, "hardness": "hard"|"soft"|"none" },\n' +
      '  "spot_in_direct_sun": true|false|null,\n' +
      '  "ground_slope_percent": number,       // 0 if it looks level\n' +
      '  "slope_downhill": "N"|"NE"|"E"|"SE"|"S"|"SW"|"W"|"NW"|null,\n' +
      '  "surface": "soil"|"lawn"|"mulch"|"gravel"|"paving"|"deck",\n' +
      '  "canopy_overhead": "open"|"partial"|"tree"|"eaves",\n' +
      '  "reflected_heat": "none"|"some"|"strong",   // light walls, paving or glass that would bounce heat onto the beds\n' +
      '  "wind_exposure": "sheltered"|"normal"|"breezy"|"exposed",\n' +
      '  "drainage_signs": "fast"|"normal"|"slow"|"boggy",\n' +
      '  "low_spot": true|false,               // does the ground dip here, so cold air would settle\n' +
      '  "notes": string                       // one short sentence a gardener would care about\n' +
      "}\n\n" +
      "bearing_offset_deg is relative to the direction the camera faces: negative left, positive right, roughly -40 to +40 for a phone frame. " +
      "Where you are unsure, say so with a conservative number rather than omitting the field. Do not describe plants or give growing advice.";

    return Vision.json(p.reading, prompt);
  },

  /* ---------- on-device light reading, so this works with no key ---------- */
  light(canvas){
    const W = 160, H = Math.max(1, Math.round(canvas.height / canvas.width * W));
    const c = document.createElement("canvas"); c.width = W; c.height = H;
    const ctx = c.getContext("2d"); ctx.drawImage(canvas, 0, 0, W, H);
    let d; try{ d = ctx.getImageData(0, 0, W, H).data; }catch(e){ return null; }
    let sky = 0, upper = 0, sum = 0, sum2 = 0, n = 0, dark = 0, lower = 0;
    for(let y = 0; y < H; y++) for(let x = 0; x < W; x++){
      const i = (y * W + x) * 4, r = d[i], g = d[i+1], b = d[i+2];
      const mx = Math.max(r,g,b), mn = Math.min(r,g,b), v = mx / 255, sat = mx ? (mx - mn) / mx : 0;
      const isSky = v > 0.62 && (b >= r - 6) && sat < 0.45;
      if(y < H * 0.55){ upper++; if(isSky) sky++; }
      else { lower++; sum += v; sum2 += v * v; n++; if(v < 0.32) dark++; }
    }
    const mean = n ? sum / n : 0;
    const varr = n ? Math.max(0, sum2 / n - mean * mean) : 0;
    return {
      skyFraction: upper ? Math.round(sky / upper * 100) / 100 : 0,
      groundBrightness: Math.round(mean * 100) / 100,
      contrast: Math.round(Math.sqrt(varr) * 100) / 100,
      shadowFraction: lower ? Math.round(dark / lower * 100) / 100 : 0
    };
  },
  /* a crude skyline angle when there is no model to ask — clearly labelled as such */
  estimate(light){
    if(!light) return null;
    return Math.round(clamp((1 - light.skyFraction) * 55, 0, 70));
  },

  /* ---------- compass ---------- */
  heading(){
    return new Promise(res => {
      let done = false;
      const finish = v => { if(done) return; done = true; clearTimeout(t); off(); res(v); };
      function off(){
        try{ window.removeEventListener("deviceorientationabsolute", on); window.removeEventListener("deviceorientation", on); }catch(e){}
      }
      function on(e){
        let deg = null;
        if(typeof e.webkitCompassHeading === "number" && isFinite(e.webkitCompassHeading)) deg = e.webkitCompassHeading;
        else if(e.absolute && typeof e.alpha === "number" && isFinite(e.alpha)) deg = (360 - e.alpha) % 360;
        if(deg !== null) finish(deg);
      }
      const t = setTimeout(() => finish(null), 2000);
      try{
        const DOE = window.DeviceOrientationEvent;
        if(DOE && typeof DOE.requestPermission === "function"){
          DOE.requestPermission()
            .then(p => { if(p === "granted") window.addEventListener("deviceorientation", on); else finish(null); })
            .catch(() => finish(null));
        } else if(DOE){
          window.addEventListener("deviceorientationabsolute", on);
          window.addEventListener("deviceorientation", on);
        } else finish(null);
      }catch(e){ finish(null); }
    });
  },

  /* ============================================================
     MERGING THE SHOTS INTO ONE SKYLINE
     ============================================================ */
  mergeHorizon(shots){
    const acc = Micro.SECTOR_AZ.map(() => ({ s: 0, w: 0 }));
    (shots || []).forEach(s => {
      if(!s || s.bearing === null || s.bearing === undefined) return;
      const items = [];
      if(s.ai && Array.isArray(s.ai.obstructions)) s.ai.obstructions.forEach(o => {
        const hgt = clamp(num(o.height_angle_deg, 0), 0, 89);
        if(!hgt) return;
        items.push({ az: s.bearing + clamp(num(o.bearing_offset_deg, 0), -60, 60), h: hgt, w: 1 });
      });
      let centre = null;
      if(s.ai && s.ai.horizon_angle_deg !== undefined && s.ai.horizon_angle_deg !== null) centre = clamp(num(s.ai.horizon_angle_deg, 0), 0, 89);
      else centre = MicroUI.estimate(s.light);
      if(centre !== null) items.push({ az: s.bearing, h: centre, w: 0.85 });
      items.forEach(it => {
        Micro.SECTOR_AZ.forEach((az, i) => {
          const dd = Math.abs(((it.az - az + 540) % 360) - 180);
          if(dd > 55) return;
          const w = it.w * (1 - dd / 55);
          acc[i].s += it.h * w; acc[i].w += w;
        });
      });
    });
    return acc.map(a => a.w > 0 ? Math.round(a.s / a.w) : 0);
  },

  /* A photo of a known bearing at a known time is a geometric constraint.
     If the sun was 40° up in the south-east and the gardener says this spot
     was in shade, then something at least 40° high stands to the south-east —
     no estimate required. This is the most reliable number in the whole survey. */
  applySunChecks(hz, shots){
    const out = hz.slice();
    (shots || []).forEach(s => {
      if(!s || !s.sun || s.sun.alt <= 4) return;
      let lit = s.sunlit;
      if(lit === null || lit === undefined){
        if(s.ai && (s.ai.spot_in_direct_sun === true || s.ai.spot_in_direct_sun === false)) lit = s.ai.spot_in_direct_sun;
      }
      if(lit === null || lit === undefined) return;
      const az = s.sun.az, alt = s.sun.alt;
      const i = Math.round((((az % 360) + 360) % 360) / 45) % 8;
      const cur = num(out[i], 0);
      if(lit === false && cur < alt) out[i] = Math.min(85, Math.ceil(alt) + 2);
      else if(lit === true && cur >= alt) out[i] = Math.max(0, Math.floor(alt) - 2);
      s.constrained = true;
    });
    return out;
  },

  /* pick the value most shots agree on */
  vote(shots, key, fallback){
    const tally = {};
    (shots || []).forEach(s => {
      const v = s && s.ai ? s.ai[key] : null;
      if(v === null || v === undefined || v === "") return;
      tally[v] = (tally[v] || 0) + 1;
    });
    const keys = Object.keys(tally);
    if(!keys.length) return fallback;
    return keys.sort((a, b) => tally[b] - tally[a])[0];
  },

  finish(){
    const c = MicroUI.cap; if(!c) return;
    MicroUI.camStop();
    const shots = c.shots.filter(Boolean);
    if(!shots.length){ toast("No shots taken"); return MicroUI.open(c.scope, c.refId); }

    let hz = MicroUI.mergeHorizon(shots);
    hz = MicroUI.applySunChecks(hz, shots);

    /* slope: the gardener's own answer wins over the model's */
    let slope = 0, slopeDir = null;
    shots.forEach(s => {
      if(num(s.slopePct, 0) > slope){ slope = num(s.slopePct, 0); slopeDir = s.slopeDir; }
    });
    if(!slope){
      const aiSlope = shots.map(s => s.ai ? num(s.ai.ground_slope_percent, 0) : 0).sort((a, b) => b - a)[0] || 0;
      if(aiSlope >= 3){
        slope = Math.round(aiSlope);
        const dir = MicroUI.vote(shots, "slope_downhill", null);
        const idx = dir ? Micro.SECTORS.indexOf(dir) : -1;
        slopeDir = idx >= 0 ? Micro.SECTOR_AZ[idx] : null;
      }
    }

    const lowSpot = shots.filter(s => s.ai && s.ai.low_spot === true).length;
    const withAI = shots.filter(s => s.ai).length;

    const prefill = {
      horizon: hz,
      slope_pct: slope,
      slope_dir: slopeDir,
      canopy: MicroUI.vote(shots, "canopy_overhead", "open"),
      reflect: MicroUI.vote(shots, "reflected_heat", "none"),
      wind_exposure: MicroUI.vote(shots, "wind_exposure", "normal"),
      drainage: MicroUI.vote(shots, "drainage_signs", "normal"),
      surface: MicroUI.vote(shots, "surface", "soil"),
      frost_pocket: lowSpot >= 2 ? "pocket" : lowSpot === 1 ? "slight" : "none",
      method: withAI ? "photo survey (" + shots.length + " shots, " + Vision.who() + ")" : "photo survey (" + shots.length + " shots, on-device)",
      confidence: withAI && shots.some(s => s.constrained) ? "high" : withAI ? "medium" : "low",
      photos: shots.map(s => s.photoId).filter(Boolean),
      shots: shots.map(s => ({
        dir: s.dir, bearing: s.bearing, at: s.at ? s.at.toISOString() : null,
        sun: s.sun ? { alt: Math.round(s.sun.alt), az: Math.round(s.sun.az) } : null,
        sunlit: s.sunlit, constrained: !!s.constrained,
        notes: s.ai ? s.ai.notes : null, error: s.aiError || null
      })),
      notes: shots.map(s => s.ai && s.ai.notes ? s.dir + ": " + s.ai.notes : null).filter(Boolean).join(" ")
    };

    MicroUI.cap = null;
    MicroUI.form(c.scope, c.refId, prefill);
  },

  /* ============================================================
     THE FORM — everything above lands here as an editable estimate
     ============================================================ */
  form(scope, refId, prefill){
    const site = Micro.row(scope, refId);
    const v = Object.assign({}, Micro.DEFAULTS, site || {}, prefill || {});
    const ai = k => prefill && prefill[k] !== undefined && prefill[k] !== null ? " ai-filled" : "";
    const hz = Array.isArray(v.horizon) ? v.horizon : Micro.DEFAULTS.horizon;
    const opts = (id, map, cur) => Object.keys(map).map(k =>
      '<option value="' + k + '"' + (String(cur) === k ? " selected" : "") + '>' + esc(map[k]) + '</option>').join("");

    let h = "";
    if(prefill){
      const shots = prefill.shots || [];
      const pinned = shots.filter(s => s.constrained).length;
      h += '<div class="note g" style="margin-top:0"><b>Read from ' + shots.length + ' photo' + (shots.length > 1 ? "s" : "") + '.</b> ' +
        (pinned ? pinned + ' of them caught the sun at a known angle, which pins the skyline in ' + (pinned > 1 ? "those directions" : "that direction") + ' to within a few degrees. ' : '') +
        'Green fields were filled by the app — change anything that looks wrong. It is your garden; you can see it and the camera cannot.</div>';
      if(shots.some(s => s.error)) h += '<div class="note w" style="margin-top:8px">Some shots could not be read: ' +
        esc(shots.filter(s => s.error).map(s => s.dir + " — " + s.error).join("; ")) + '</div>';
    }

    h += '<div class="sec"><h2>Skyline</h2><span class="tiny muted">degrees above the horizon</span></div>';
    h += '<div class="note i tiny">How high the tallest thing in each direction rises, seen from the middle of the space. A low fence is about 10°, a nearby house 35–45°, a big tree overhead 60°+. Open sky is 0. This is what decides the sun hours.</div>';
    h += '<div class="grid2" style="margin-top:10px">';
    Micro.SECTORS.forEach((s, i) => {
      h += '<div style="margin-bottom:6px"><label class="f">' + s + ' <span class="muted" id="hzl-' + i + '">' + num(hz[i], 0) + '°</span></label>' +
        '<input type="range" id="hz-' + i + '" min="0" max="85" step="1" value="' + num(hz[i], 0) + '"' +
        ' class="' + (prefill && num(hz[i], 0) > 0 ? "ai-filled" : "") + '"' +
        ' oninput="document.getElementById(\'hzl-' + i + '\').textContent=this.value+String.fromCharCode(176)"></div>';
    });
    h += '</div>';

    h += '<div class="sec"><h2>The ground</h2></div>';
    h += '<div class="grid2">' +
      '<div><label class="f">Slope</label><input type="number" id="mf-slope" min="0" max="60" value="' + num(v.slope_pct, 0) + '" class="' + ai("slope_pct") + '"><div class="tiny muted">percent</div></div>' +
      '<div><label class="f">Downhill toward</label><select id="mf-slopedir" class="' + ai("slope_dir") + '">' +
        '<option value="">Level / not sure</option>' +
        Micro.SECTOR_AZ.map((az, i) => '<option value="' + az + '"' + (num(v.slope_dir, -1) === az ? " selected" : "") + '>' + Micro.SECTORS[i] + '</option>').join("") +
      '</select></div></div>';
    h += '<div class="grid2" style="margin-top:12px">' +
      '<div><label class="f">Surface</label><select id="mf-surface" class="' + ai("surface") + '">' + opts("surface", Micro.LABELS.surface, v.surface) + '</select></div>' +
      '<div><label class="f">Drainage</label><select id="mf-drain" class="' + ai("drainage") + '">' + opts("drainage", Micro.LABELS.drainage, v.drainage) + '</select></div></div>';

    h += '<div class="sec"><h2>Air and shelter</h2></div>';
    h += '<div class="grid2">' +
      '<div><label class="f">Wind</label><select id="mf-wind" class="' + ai("wind_exposure") + '">' + opts("wind_exposure", Micro.LABELS.wind_exposure, v.wind_exposure) + '</select></div>' +
      '<div><label class="f">Overhead</label><select id="mf-canopy" class="' + ai("canopy") + '">' + opts("canopy", Micro.LABELS.canopy, v.canopy) + '</select></div></div>';
    h += '<div class="grid2" style="margin-top:12px">' +
      '<div><label class="f">Reflected heat</label><select id="mf-reflect" class="' + ai("reflect") + '">' + opts("reflect", Micro.LABELS.reflect, v.reflect) + '</select></div>' +
      '<div><label class="f">Cold air</label><select id="mf-frost" class="' + ai("frost_pocket") + '">' + opts("frost_pocket", Micro.LABELS.frost_pocket, v.frost_pocket) + '</select></div></div>';
    h += '<div class="note i tiny" style="margin-top:10px">Cold air behaves like water: it runs downhill and pools against walls, hedges and fences. A spot that collects it frosts first in autumn and last in spring. A wall that catches the sun does the opposite — it stores heat all day and gives it back at night.</div>';

    h += '<div class="field" style="margin-top:14px"><label class="f">Notes</label><textarea id="mf-notes" class="' + ai("notes") + '" placeholder="Anything you know that a photo cannot show — where the frost sits, which corner floods, what the wind does in March.">' + esc(v.notes || "") + '</textarea></div>';

    h += '<div class="row between" style="margin-top:14px"><div><div class="b sm">Keep my own sun hours</div>' +
      '<div class="tiny muted">Ignore the calculated figure and use the number on each bed.</div></div>' +
      '<button class="switch ' + (v.sun_override ? "on" : "") + '" id="mf-override"></button></div>';

    h += '<div id="mf-preview"></div>';
    h += '<div class="row" style="gap:8px;margin-top:16px">' +
      '<button class="btn ghost" onclick="MicroUI.preview(\'' + scope + '\',\'' + refId + '\')">Preview</button>' +
      '<button class="btn grow" onclick="MicroUI.save(\'' + scope + '\',\'' + refId + '\')">Save profile</button></div>';

    openSheet("Micro-climate details", h);
    const sw = $("#mf-override"); if(sw) sw.onclick = () => sw.classList.toggle("on");
    MicroUI._pending = prefill || null;
  },

  collect(){
    const hz = Micro.SECTORS.map((s, i) => num(($("#hz-" + i) || {}).value, 0));
    const sd = $("#mf-slopedir").value;
    const p = MicroUI._pending || {};
    return {
      horizon: hz,
      slope_pct: clamp(num($("#mf-slope").value, 0), 0, 60),
      slope_dir: sd === "" ? null : num(sd, 180),
      surface: $("#mf-surface").value,
      drainage: $("#mf-drain").value,
      wind_exposure: $("#mf-wind").value,
      canopy: $("#mf-canopy").value,
      reflect: $("#mf-reflect").value,
      frost_pocket: $("#mf-frost").value,
      notes: $("#mf-notes").value.trim(),
      sun_override: $("#mf-override").classList.contains("on") ? 1 : 0,
      method: p.method || "entered by hand",
      confidence: p.confidence || "gardener",
      photos: p.photos || null,
      shots: p.shots || null
    };
  },

  preview(scope, refId){
    const d = Micro.derive(Object.assign({}, Micro.DEFAULTS, MicroUI.collect()));
    const box = $("#mf-preview");
    box.innerHTML = '<div class="sec"><h2>What this changes</h2></div>' + MicroUI.summary(d);
    if(box.scrollIntoView) try{ box.scrollIntoView({ behavior:"smooth", block:"nearest" }); }catch(e){}
  },

  save(scope, refId){
    Micro.save(scope, refId, MicroUI.collect());
    Micro.invalidate();
    MicroUI._pending = null;
    closeSheet();
    Garden.render();
    if(APP.tab === "weather") Weather.render();
    toast("Micro-climate saved 🌤️");
  }
};

/* ============================================================
   HOOKS — the profile has to be visible where the gardener works
   ============================================================ */
(function wireGarden(){

  /* the plot list gets a micro-climate card for whichever plot is selected */
  const origList = Garden.listView;
  Garden.listView = function(){
    Micro.invalidate();
    origList.call(Garden);
    const box = $("#s-garden");
    const sc = box.querySelector(".scroller");
    if(!sc) return;
    const plotId = APP.plotId && DB.find("plots", APP.plotId) ? APP.plotId : null;
    if(!plotId){
      if(DB.count("plots")) sc.insertAdjacentHTML("afterend",
        '<div class="note i" style="margin-top:10px">Pick a plot above to give it a micro-climate — the sun, wind, slope and frost of that particular corner. Front of the house and back of the house are rarely the same garden.</div>');
      return;
    }
    const d = Micro.forPlot(plotId);
    const p = DB.find("plots", plotId);
    let h = '<div class="card" style="margin-top:10px"><div class="row between">' +
      '<div class="grow"><div class="b">🌤️ Micro-climate · ' + esc(p.name) + '</div>' +
      '<div class="tiny muted">' + (d
        ? (d.sunKnown ? d.sunGrowing + 'h sun in season' : 'skyline recorded') +
          ' · ' + (d.waterFactor > 1 ? "+" : "") + Math.round((d.waterFactor - 1) * 100) + '% water' +
          (d.seasonShift ? ' · ' + (d.seasonShift > 0 ? "+" : "") + d.seasonShift + 'd season' : '') +
          (d.site.method ? ' · ' + esc(d.site.method) : '')
        : 'Not surveyed — the app is using county-wide figures for this plot') + '</div></div>' +
      '<button class="btn sm" onclick="MicroUI.open(\'plot\',\'' + plotId + '\')">' + (d ? "Open" : "Survey") + '</button></div>';
    if(d && d.why.length) h += '<div class="note ' + d.why[0].k + '" style="margin-top:10px"><b>' + esc(d.why[0].t) + '</b><br>' + esc(d.why[0].m) + '</div>';
    h += '</div>';
    sc.insertAdjacentHTML("afterend", h);
  };

  /* the bed view gets the resolved picture, plus why the watering call moved */
  const origBed = Garden.bedView;
  Garden.bedView = function(){
    Micro.invalidate();
    origBed.call(Garden);
    const b = DB.find("beds", APP.bedId); if(!b) return;
    const box = $("#s-garden");
    const first = box.querySelector(".card"); if(!first) return;
    const d = Micro.forBed(b.id);

    let h = '<div class="card" style="margin-top:12px"><div class="row between">' +
      '<div class="grow"><div class="b">🌤️ Micro-climate</div>' +
      '<div class="tiny muted">' + (d
        ? esc(Micro.chip(b.id) || "") + ' · from the ' + esc(d.site._from)
        : 'Not surveyed. Sun hours come from the number you typed.') + '</div></div>' +
      '<button class="btn sm ghost" onclick="MicroUI.open(\'' + (d && d.site._from === "plot" && d.site._plotId ? "plot','" + d.site._plotId : "bed','" + b.id) + '\')">' +
        (d ? "Open" : "Survey") + '</button></div>';

    if(d){
      if(d.sunKnown && Math.abs(d.sunGrowing - num(b.sun_hours, 8)) >= 1)
        h += '<div class="note w" style="margin-top:10px">☀️ The survey puts this bed at <b>' + d.sunGrowing +
          'h</b> of direct sun in season; the bed is set to ' + esc(b.sun_hours) + 'h. Recommendations use the surveyed figure.</div>';
      const w = Recommend.water(b.id, APP.weather);
      if(w && w.micro && w.micro.why.length)
        w.micro.why.forEach(x => h += '<div class="note i" style="margin-top:8px">💧 ' + esc(x) + '</div>');
      if(d.frostShiftFirst) h += '<div class="note ' + (d.frostShiftFirst < 0 ? "d" : "g") + '" style="margin-top:8px">🌡️ First frost here is around <b>' +
        fmt(d.firstFrost) + '</b> — ' + Math.abs(d.frostShiftFirst) + ' days ' + (d.frostShiftFirst < 0 ? "earlier" : "later") + ' than the garden average.</div>';
      if(d.site._from === "plot") h += '<button class="btn ghost block sm" style="margin-top:10px" onclick="MicroUI.open(\'bed\',\'' + b.id + '\')">This bed differs from the rest of the plot →</button>';
    }
    h += '</div>';
    first.insertAdjacentHTML("afterend", h);
  };

  /* and a way in from bed settings */
  const origMenu = Garden.bedMenu;
  Garden.bedMenu = function(){
    origMenu.call(Garden);
    const body = $("#sheet-body"); if(!body) return;
    const b = DB.find("beds", APP.bedId); if(!b) return;
    body.insertAdjacentHTML("beforeend",
      '<button class="btn ghost block" style="margin-top:8px" onclick="closeSheet();setTimeout(function(){MicroUI.open(\'bed\',\'' + b.id + '\')},250)">🌤️ Micro-climate for this bed</button>');
  };

  /* a new plot is worth surveying straight away */
  const origSavePlot = Garden.savePlot;
  Garden.savePlot = function(){
    const before = DB.count("plots");
    origSavePlot.call(Garden);
    if(DB.count("plots") > before){
      const p = DB.all("plots")[DB.count("plots") - 1];
      setTimeout(() => {
        if($("#sheet").classList.contains("on")) return;
        confirmSheet("Survey " + p.name + "?",
          "A two-minute photo survey of this spot — sun, slope, wind, shelter — is what turns a county-wide zone into advice for this particular corner of the garden.",
          "Survey it now", () => MicroUI.open("plot", p.id));
      }, 400);
    }
  };
})();
</script>

<script>
/* ============================================================
   SEED BANK — inventory, viability, packet photos
   ============================================================ */
const Seeds = {
  q: "", filter: "all",

  viability(s){
    const c = crop(s.crop_id);
    const yrs = c && c.via ? c.via : 3;
    const packed = num(s.packed_year, 0);
    const yr = today().getFullYear();
    if(s.exp_date){
      const d = parseISO(s.exp_date);
      if(d && d < today()) return { level:"expired", age: packed ? yr - packed : null, pct: 20, yrs: yrs,
        msg:"Past the printed date — test before sowing." };
    }
    if(!packed) return { level:"unknown", age:null, pct:null, yrs:yrs, msg:"No packed year — add one to track viability." };
    const age = yr - packed, r = age / yrs;
    const base = num(s.germ_rate, 85);
    const pct = Math.round(clamp(base * Math.pow(0.72, Math.max(0, r * 1.4)), 5, 100));
    if(r < 0.4) return { level:"fresh",   age: age, pct: pct, yrs: yrs, msg:"Fresh — sow with confidence." };
    if(r < 0.85) return { level:"good",    age: age, pct: pct, yrs: yrs, msg:"Still strong. Sow normally." };
    if(r < 1.15) return { level:"fading", age: age, pct: pct, yrs: yrs, msg:"Getting old — sow thicker and use these first." };
    return { level:"expired", age: age, pct: pct, yrs: yrs, msg:"Past typical viability. Run a paper-towel test on 10 seeds before giving up bed space." };
  },
  badge(v){
    const m = { fresh:["good","Fresh"], good:["good","Good"], fading:["warn","Fading"], expired:["bad","Expired"], unknown:["","Unknown"] };
    const x = m[v.level] || m.unknown;
    return '<span class="chip ' + x[0] + ' tiny">' + x[1] + (v.pct !== null ? " · ~" + v.pct + "%" : "") + '</span>';
  },

  render(){
    const box = $("#s-seeds");
    let list = DB.all("seeds").slice();
    const q = Seeds.q.toLowerCase();
    if(q) list = list.filter(s => (s.name + " " + (s.variety||"") + " " + (s.brand||"") + " " + cropName(s.crop_id)).toLowerCase().indexOf(q) >= 0);
    if(Seeds.filter !== "all") list = list.filter(s => {
      const v = Seeds.viability(s);
      if(Seeds.filter === "expired") return v.level === "expired";
      if(Seeds.filter === "fading") return v.level === "fading";
      if(Seeds.filter === "sownow"){ const st = Season.status(s.crop_id); return st && st.inWindow; }
      return true;
    });
    list.sort((a,b) => (a.name || "").localeCompare(b.name || ""));

    const all = DB.all("seeds");
    const counts = { expired: 0, fading: 0, sownow: 0 };
    all.forEach(s => { const v = Seeds.viability(s);
      if(v.level === "expired") counts.expired++; if(v.level === "fading") counts.fading++;
      const st = Season.status(s.crop_id); if(st && st.inWindow) counts.sownow++; });

    let h = '';
    h += '<div class="card"><div class="grid3">' +
      '<div class="stat"><span class="n">' + all.length + '</span><span class="l">packets</span></div>' +
      '<div class="stat"><span class="n">' + counts.sownow + '</span><span class="l">sow now</span></div>' +
      '<div class="stat"><span class="n">' + counts.expired + '</span><span class="l">expired</span></div>' +
      '</div></div>';

    h += '<div class="row" style="gap:8px;margin-top:12px">' +
      '<button class="btn grow" onclick="Seeds.add()">＋ Add packet</button>' +
      '<button class="btn ghost" onclick="Seeds.germTest()">🧪 Germ test</button></div>';

    h += '<input type="search" id="sd-q" placeholder="Search your seed bank…" style="margin-top:12px" value="' + esc(Seeds.q) + '">';
    h += '<div class="scroller" style="margin-top:10px">' +
      ['all','sownow','fading','expired'].map(f => '<button class="chip ' + (Seeds.filter === f ? "on" : "") + '" onclick="Seeds.filter=\'' + f + '\';Seeds.render()">' +
        ({all:"All", sownow:"Sow now", fading:"Fading", expired:"Expired"})[f] + '</button>').join("") + '</div>';

    if(!all.length){
      h += '<div class="card" style="margin-top:12px"><div class="empty"><span class="e">🌰</span><div class="b">Your seed bank is empty</div>' +
        '<div class="tiny">Snap a photo of a packet or type it in. Every packet you add fills in your grow calendar automatically.</div></div>' +
        '<button class="btn block" onclick="Seeds.add()">Add my first packet</button></div>';
    } else if(!list.length){
      h += '<div class="card center muted sm" style="margin-top:12px">Nothing matches that filter.</div>';
    } else {
      h += '<div class="card pad0" style="margin-top:12px"><div class="list">';
      list.forEach(s => {
        const v = Seeds.viability(s);
        const st = Season.status(s.crop_id);
        const ph = Photos.url(s.photo_id);
        h += '<button class="item" onclick="Seeds.open(\'' + s.id + '\')">' +
          '<div class="av">' + (ph ? '<img src="' + ph + '" alt="">' : cropEmoji(s.crop_id)) + '</div>' +
          '<div class="grow"><div class="b truncate">' + esc(s.name) + (s.variety ? ' <span class="muted">· ' + esc(s.variety) + '</span>' : '') + '</div>' +
          '<div class="tiny muted truncate">' + esc(s.brand || "—") + (s.packed_year ? ' · packed ' + esc(s.packed_year) : '') +
            (s.qty ? ' · ' + esc(s.qty) + ' ' + esc(s.unit || "seeds") : '') + '</div>' +
          '<div class="row wrap" style="gap:4px;margin-top:4px">' + Seeds.badge(v) +
            (st && st.inWindow ? '<span class="chip info tiny">' + esc(st.w.label) + ' now</span>' : '') + '</div></div>' +
          '<span class="go">›</span></button>';
      });
      h += '</div></div>';
    }
    box.innerHTML = h;
    const qi = $("#sd-q");
    if(qi) qi.oninput = e => { Seeds.q = e.target.value; Seeds.render(); setTimeout(() => { const n = $("#sd-q"); if(n){ n.focus(); n.setSelectionRange(n.value.length, n.value.length); } }, 0); };
  },

  /* ---------- add / edit ---------- */
  add(prefill){
    Seeds.form(null, prefill);
  },
  open(id){ Seeds.form(DB.find("seeds", id)); },

  form(s, prefill){
    s = s || null;
    Seeds._editId = s ? s.id : null;
    const cur = Object.assign({}, s || {}, prefill || {});
    const yr = today().getFullYear();
    Seeds._readState = null;
    Seeds._aiFields = {};
    Seeds._readSrc = null;
    /* "Packed for year" is pre-filled with this year as a convenience. That is a
       default, not something she typed, so the packet reader may replace it. */
    Seeds._defaults = { "#sd-packed": cur.packed_year ? "" : String(yr) };
    let h = '';

    h += '<div id="sd-photo">' + Seeds.photoBlock(cur.photo_id) + '</div>';
    h += '<div class="row" style="gap:8px;margin:10px 0">' +
      '<button class="btn ghost grow sm" onclick="Seeds.capture(true)">📷 Photograph packet</button>' +
      '<button class="btn ghost grow sm" onclick="Seeds.capture(false)">🖼️ Upload</button></div>';
    h += '<div id="sd-airead" style="margin-bottom:12px">' + Seeds.readBlock() + '</div>';

    h += '<div class="field"><label class="f">Crop</label><div class="row" style="gap:8px">' +
      '<input type="text" id="sd-cropname" readonly value="' + esc(cur.crop_id ? cropName(cur.crop_id) : "") + '" placeholder="Pick a crop">' +
      '<button class="btn ghost sm" onclick="Seeds.pickCrop()">Choose</button></div>' +
      '<input type="hidden" id="sd-crop" value="' + esc(cur.crop_id || "") + '"></div>';
    h += '<div class="field"><label class="f">Packet name</label><input type="text" id="sd-name" value="' + esc(cur.name || "") + '" placeholder="Cherry Tomato"></div>';
    h += '<div class="grid2" style="margin-top:12px">' +
      '<div><label class="f">Variety</label><div class="row" style="gap:6px">' +
        '<input type="text" id="sd-var" value="' + esc(cur.variety || "") + '" placeholder="Sungold">' +
        (cur.crop_id ? '<button class="btn ghost sm" onclick="Seeds.pickVariety()">▾</button>' : '') + '</div></div>' +
      '<div><label class="f">Brand</label><input type="text" id="sd-brand" value="' + esc(cur.brand || "") + '" placeholder="Baker Creek"></div></div>';
    h += '<div class="grid2" style="margin-top:12px">' +
      '<div><label class="f">Quantity</label><input type="number" id="sd-qty" value="' + esc(cur.qty || "") + '" placeholder="50"></div>' +
      '<div><label class="f">Unit</label><select id="sd-unit">' + ["seeds","grams","oz","packets","cloves","slips"].map(u =>
        '<option' + (cur.unit === u ? " selected" : "") + '>' + u + '</option>').join("") + '</select></div></div>';
    h += '<div class="grid2" style="margin-top:12px">' +
      '<div><label class="f">Packed for year</label><input type="number" id="sd-packed" value="' + esc(cur.packed_year || yr) + '" min="1990" max="' + (yr+3) + '"></div>' +
      '<div><label class="f">Printed expiry</label><input type="date" id="sd-exp" value="' + esc(cur.exp_date || "") + '"></div></div>';
    h += '<div class="grid2" style="margin-top:12px">' +
      '<div><label class="f">Germination %</label><input type="number" id="sd-germ" value="' + esc(cur.germ_rate || "") + '" placeholder="85" min="1" max="100"></div>' +
      '<div><label class="f">Cost ($)</label><input type="number" id="sd-cost" step="0.01" value="' + esc(cur.cost || "") + '" placeholder="3.95"></div></div>';
    h += '<div class="field"><label class="f">Source / lot</label><input type="text" id="sd-source" value="' + esc(cur.source || "") + '" placeholder="Where you got it, lot number"></div>';
    h += '<div class="field"><label class="f">Notes</label><textarea id="sd-notes" placeholder="Saved from my own plants, gifted, etc.">' + esc(cur.notes || "") + '</textarea></div>';

    if(s){
      const v = Seeds.viability(s), c = crop(s.crop_id);
      h += '<div class="note ' + (v.level === "expired" ? "d" : v.level === "fading" ? "w" : "g") + '" style="margin-top:14px">' +
        '<b>' + (v.age !== null ? v.age + ' year' + (v.age === 1 ? "" : "s") + ' old' : 'Age unknown') + '.</b> ' + esc(v.msg) +
        (c ? ' ' + esc(c.n) + ' seed typically stays viable about ' + v.yrs + ' years.' : '') + '</div>';
      const ws = Season.windows(s.crop_id);
      if(ws.length){
        h += '<div class="note i" style="margin-top:8px"><b>Your sowing dates</b><br>' +
          ws.map(w => w.icon + ' ' + esc(w.label) + ': <b>' + fmt(w.date) + '</b>').join("<br>") + '</div>';
      }
      if(c) h += '<div class="note g" style="margin-top:8px"><b>Germination.</b> ' + c.depth + '" deep · ' +
        c.germ[0] + '–' + c.germ[1] + ' days · soil ' + c.soilF[0] + '–' + c.soilF[2] + '°F (best at ' + c.soilF[1] + '°F).</div>';
    }

    h += '<div class="row" style="gap:8px;margin-top:16px">' +
      (s ? '<button class="btn ghost" onclick="Seeds.del(\'' + s.id + '\')">Delete</button>' : '') +
      '<button class="btn grow" onclick="Seeds.save()">Save packet</button></div>';
    if(s) h += '<button class="btn ghost block" style="margin-top:8px" onclick="closeSheet();setTimeout(function(){Library.open(\'' + s.crop_id + '\')},250)">Growing guide →</button>';

    openSheet(s ? "Edit packet" : "Add seed packet", h);
    Seeds._photoId = cur.photo_id || null;
  },

  photoBlock(id){
    const u = Photos.url(id);
    return u ? '<img class="photo" src="' + u + '" alt="Seed packet" style="max-height:220px;object-fit:cover">'
             : '<div class="center muted sm" style="padding:22px;background:var(--surface-2);border-radius:var(--radius)">📷 No packet photo yet</div>';
  },

  capture(useCamera){
    const inp = useCamera ? $("#filepick-cam") : $("#filepick");
    inp.value = "";
    inp.onchange = async () => {
      const f = inp.files[0]; if(!f) return;
      try{
        /* Two sizes. Packet print is small, so the copy sent for reading keeps
           more pixels — but that copy is never stored, because a vault holding
           twenty full-size packet photos would blow past the localStorage
           fallback. What gets saved is the usual 900px thumbnail. */
        const lo = await shrinkImage(f, 900, 0.72);
        if(Seeds._photoId) Photos.drop(Seeds._photoId);
        Seeds._photoId = Photos.put(lo.dataUrl, lo.w, lo.h);
        const box = $("#sd-photo"); if(box) box.innerHTML = Seeds.photoBlock(Seeds._photoId);
        Seeds._readSrc = null;
        if(Vision.ready()){
          try{ const hi = await shrinkImage(f, 1500, 0.86); Seeds._readSrc = Vision.fromDataUrl(hi.dataUrl); }
          catch(e){ /* fall back to the stored thumbnail */ }
          /* the point of photographing a packet is not having to type it in,
             so read it straight away rather than waiting to be asked */
          Seeds.readPacket();
        } else { Seeds.paint(); toast("Photo attached"); }
      }catch(e){ toast("Could not read that image"); }
    };
    inp.click();
  },

  /* ---------- the AI-read strip under the photo ---------- */
  readBlock(state){
    state = state || Seeds._readState || null;
    if(!Vision.ready()){
      return !Seeds._photoId ? '' :
        '<div class="note i tiny">Connect an AI key in Settings and the app will read packets for you automatically.' +
        ' <button class="btn ghost sm" style="margin-top:8px" onclick="closeSheet();setTimeout(function(){Assist.setup()},250)">Connect</button></div>';
    }
    if(state && state.busy)
      return '<div class="note i sm"><span class="spinner"></span> Reading the packet with ' + esc(Vision.who()) + '…</div>';
    if(state && state.err)
      return '<div class="note d sm"><b>Could not read the packet.</b><br>' + esc(state.err) + '</div>' +
        '<button class="btn outline block sm" style="margin-top:8px" onclick="Seeds.readPacket()">↻ Try reading it again</button>';
    if(state && state.filled)
      return '<div class="note g sm"><b>✨ Filled in from the photo.</b> ' +
        (state.filled.length ? esc(state.filled.join(", ")) + '. ' : '') +
        'Check each field and correct anything it got wrong before saving.</div>' +
        (state.missed && state.missed.length
          ? '<div class="note w tiny" style="margin-top:6px">Could not read: ' + esc(state.missed.join(", ")) + '. Fill those in yourself.</div>' : '') +
        '<button class="btn ghost block sm" style="margin-top:8px" onclick="Seeds.readPacket()">↻ Read the photo again</button>';
    return Seeds._photoId
      ? '<button class="btn outline block sm" onclick="Seeds.readPacket()">✨ Read the packet with ' + esc(Vision.who()) + '</button>'
      : '';
  },
  paint(){ const b = $("#sd-airead"); if(b) b.innerHTML = Seeds.readBlock(); },

  pickVariety(){
    const d = Seeds.readForm();
    if(!d.crop_id) return toast("Pick a crop first");
    Seeds._draft = d;
    const editId = Seeds._editId;
    Varieties.pick(d.crop_id, name => {
      closeSheet();
      setTimeout(() => {
        Seeds.form(editId ? DB.find("seeds", editId) : null,
          Object.assign({}, Seeds._draft, { variety: name || "" }));
      }, 220);
    });
  },

  pickCrop(){
    Seeds._draft = Seeds.readForm();          /* capture what is typed BEFORE the sheet swaps */
    const editId = Seeds._editId;
    Garden.cropPicker("Which crop is this?", id => {
      closeSheet();
      setTimeout(() => {
        const merged = Object.assign({}, Seeds._draft || {}, {
          crop_id: id, photo_id: Seeds._photoId,
          name: (Seeds._draft && Seeds._draft.name) || cropName(id)
        });
        Seeds.form(editId ? DB.find("seeds", editId) : null, merged);
      }, 230);
    });
  },

  readForm(){
    if(!$("#sd-name")) return {};
    return {
      crop_id: $("#sd-crop").value, name: $("#sd-name").value.trim(), variety: $("#sd-var").value.trim(),
      brand: $("#sd-brand").value.trim(), qty: $("#sd-qty").value, unit: $("#sd-unit").value,
      packed_year: $("#sd-packed").value, exp_date: $("#sd-exp").value, germ_rate: $("#sd-germ").value,
      cost: $("#sd-cost").value, source: $("#sd-source").value.trim(), notes: $("#sd-notes").value.trim(),
      photo_id: Seeds._photoId
    };
  },

  save(id){
    if(id === undefined) id = Seeds._editId;
    const d = Seeds.readForm();
    if(!d.name && !d.crop_id) return toast("Add a name or pick a crop");
    if(!d.name) d.name = cropName(d.crop_id);
    if(id) DB.update("seeds", id, d); else DB.insert("seeds", d);
    Cal.rebuild();
    closeSheet(); Seeds.render(); toast("Packet saved");
  },
  del(id){
    confirmSheet("Delete this packet?", "It is removed from your seed bank and its calendar entries go with it.", "Delete", () => {
