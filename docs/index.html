        '<div><label class="f">Square size (in)</label><input type="number" id="nb-cell" value="12" min="3" max="48"></div>' +
        '<div><label class="f">Direct sun (hrs)</label><input type="number" id="nb-sun" value="8" min="0" max="16"></div>' +
      '</div>' +
      (plots.length ? '<div class="field"><label class="f">Plot</label><select id="nb-plot"><option value="">— none —</option>' +
        plots.map(p => '<option value="' + p.id + '"' + (APP.plotId === p.id ? " selected" : "") + '>' + esc(p.name) + '</option>').join("") + '</select></div>' : '') +
      '<div class="note i" style="margin-top:12px">12" squares are the classic square-foot grid: 1 tomato, 4 lettuce, 9 beets, or 16 carrots per square. Change the size for wide-row or in-ground beds.</div>' +
      '<button class="btn block" style="margin-top:14px" onclick="Garden.saveNewBed()">Create bed</button>');
    setTimeout(() => $("#nb-name").focus(), 300);
  },
  saveNewBed(){
    const b = DB.insert("beds", {
      name: $("#nb-name").value.trim() || ("Bed " + (DB.count("beds") + 1)),
      cols: clamp(num($("#nb-cols").value, 4), 1, 24), rows: clamp(num($("#nb-rows").value, 8), 1, 24),
      cell_in: num($("#nb-cell").value, 12), sun_hours: num($("#nb-sun").value, 8),
      plot_id: ($("#nb-plot") ? $("#nb-plot").value : "") || APP.plotId || null
    });
    closeSheet(); Garden.open(b.id); toast("Bed created — tap a square to plant");
  }
};
</script>

<script>
/* ============================================================
   MULTI-CELL PLANTINGS
   A planting occupies a w x h rectangle of squares. It is either
   ONE plant sprawling over that area (a cucumber that ate six
   square feet) or a BLOCK filled with several plants of the same
   crop. Both are real gardening situations and the app tracks
   which is which, because they mean different things for spacing,
   seed counts and yield per square foot.
   ============================================================ */
Object.assign(Garden, {
  _cs: 46, sel: null,

  /* ---------- geometry ---------- */
  W(p){ return clamp(num(p.w, 1) || 1, 1, 24); },
  H(p){ return clamp(num(p.h, 1) || 1, 1, 24); },
  live(bedId){ return DB.where("plantings", p => p.bed_id === bedId && p.status !== "removed"); },

  covers(p, x, y){
    const px = num(p.x), py = num(p.y);
    return x >= px && x < px + Garden.W(p) && y >= py && y < py + Garden.H(p);
  },
  at(bedId, x, y){ return Garden.live(bedId).find(p => Garden.covers(p, x, y)) || null; },

  /* would a w x h rectangle at (x,y) hit anything or run off the bed? */
  blocked(bed, x, y, w, h, ignoreId){
    if(x < 0 || y < 0 || x + w > num(bed.cols) || y + h > num(bed.rows)) return "outside";
    const hit = Garden.live(bed.id).find(p => {
      if(p.id === ignoreId) return false;
      return !(num(p.x) + Garden.W(p) <= x || x + w <= num(p.x) ||
               num(p.y) + Garden.H(p) <= y || y + h <= num(p.y));
    });
    return hit ? hit : null;
  },

  /* ---------- planting maths ---------- */
  sqFt(bed, w, h){ const c = num(bed.cell_in, 12) / 12; return w * h * c * c; },

  /* how many plants fit in this area at proper spacing */
  fitPlants(cropId, bed, w, h){
    const c = crop(cropId); if(!c) return w * h;
    return Math.max(1, Math.round(c.psf * Garden.sqFt(bed, w, h)));
  },

  /* seeds to sow for a target number of plants, allowing for germination */
  seedsNeeded(cropId, plants, seedId){
    let pct = 85;
    const s = seedId ? DB.find("seeds", seedId) : null;
    if(s){
      const v = Seeds.viability(s);
      if(v.pct) pct = v.pct;
      else if(num(s.germ_rate)) pct = num(s.germ_rate);
    }
    pct = clamp(pct, 5, 100);
    return { seeds: Math.ceil(plants / (pct / 100) * 1.15), pct: Math.round(pct) };
  },

  /* what has this crop actually done in this garden before? */
  observedSpread(cropId){
    const list = DB.where("plantings", p => p.crop_id === cropId &&
      p.span_mode === "single" && (Garden.W(p) * Garden.H(p)) > 1);
    if(!list.length) return null;
    let best = list[0];
    list.forEach(p => { if(Garden.W(p) * Garden.H(p) > Garden.W(best) * Garden.H(best)) best = p; });
    const bed = DB.find("beds", best.bed_id);
    return { w: Garden.W(best), h: Garden.H(best), n: list.length,
             sqft: bed ? Math.round(Garden.sqFt(bed, Garden.W(best), Garden.H(best)) * 10) / 10 : null,
             when: best.sown_on || (best.created || "").slice(0, 10) };
  },

  /* ---------- placing ---------- */
  place(bed, x, y, cropId, silent, opts){
    const o = opts || {};
    const w = clamp(num(o.w, 1), 1, num(bed.cols)), h = clamp(num(o.h, 1), 1, num(bed.rows));
    const mode = o.mode || "fill";
    const qty = o.qty !== undefined ? num(o.qty)
      : (mode === "single" ? 1 : Garden.fitPlants(cropId, bed, w, h));
    const p = DB.insert("plantings", {
      bed_id: bed.id, x: x, y: y, w: w, h: h, span_mode: mode,
      crop_id: cropId, qty: qty, status: "planned", sown_on: iso(today())
    });
    if(!silent) toast(cropName(cropId) + " placed");
    Cal.forPlanting(p);
    return p;
  },

  /* ---------- grid rendering with spans ---------- */
  gridHTML(bed, opts){
    const o = opts || {};
    const cols = num(bed.cols, 4), rows = num(bed.rows, 4);
    const cs = o.cs || 46;
    const gap = o.gap === undefined ? 3 : o.gap;
    const ps = Garden.live(bed.id);
    const conflictCells = {};
    if(o.conflicts) o.conflicts.forEach(c => {
      conflictCells[c.a.x + "," + c.a.y] = 1; conflictCells[c.b.x + "," + c.b.y] = 1; });
    const friendCells = {};
    if(o.friends) o.friends.forEach(c => {
      friendCells[c.a.x + "," + c.a.y] = 1; friendCells[c.b.x + "," + c.b.y] = 1; });

    const start = {}; ps.forEach(p => start[num(p.x) + "," + num(p.y)] = p);
    const taken = {};
    ps.forEach(p => { for(let dy = 0; dy < Garden.H(p); dy++) for(let dx = 0; dx < Garden.W(p); dx++)
      taken[(num(p.x) + dx) + "," + (num(p.y) + dy)] = p.id; });

    let h = '<div class="bed" style="grid-template-columns:repeat(' + cols + ',' + cs + 'px);' +
      'grid-auto-rows:' + cs + 'px;gap:' + gap + 'px;--cs:' + cs + 'px">';
    for(let y = 0; y < rows; y++) for(let x = 0; x < cols; x++){
      const k = x + "," + y, p = start[k];
      if(p){
        const w = Garden.W(p), hh = Garden.H(p);
        const pw = w * cs + (w - 1) * gap, ph = hh * cs + (hh - 1) * gap;
        const big = w > 1 || hh > 1;
        const isSel = Garden.sel === p.id;
        h += '<button class="cell filled ' + (isSel ? "sel" : "") + '" ' +
          (o.interactive ? 'onclick="Garden.tapCell(' + x + ',' + y + ')" ' : '') +
          'style="grid-column:' + (x + 1) + '/span ' + w + ';grid-row:' + (y + 1) + '/span ' + hh + ';' +
          'width:' + pw + 'px;height:' + ph + 'px;' +
          'font-size:' + Math.round(Math.min(pw, ph) * (big ? 0.42 : 0.5)) + 'px">' +
          cropEmoji(p.crop_id) +
          (num(p.qty) > 1 ? '<span class="qty">' + p.qty + '</span>' : '') +
          (p.span_mode === "single" && big ? '<span class="one">1 plant</span>' : '') +
          (conflictCells[k] ? '<span class="warnflag">⚠️</span>'
            : (friendCells[k] ? '<span class="loveflag">💚</span>' : '')) +
          (isSel && o.interactive ? '<span class="grip" onpointerdown="Garden.gripStart(event,\'' + p.id + '\')"></span>' : '') +
          '</button>';
      } else if(!taken[k]){
        h += '<button class="cell" ' + (o.interactive ? 'onclick="Garden.tapCell(' + x + ',' + y + ')"' : '') +
          ' style="grid-column:' + (x + 1) + ';grid-row:' + (y + 1) + ';' +
          'width:' + cs + 'px;height:' + cs + 'px"></button>';
      }
    }
    return h + '</div>';
  },

  miniGrid(b){
    const cols = num(b.cols, 4);
    const cs = clamp(Math.floor(260 / cols), 10, 26);
    return '<div class="bedwrap" style="padding:4px">' + Garden.gridHTML(b, { cs: cs, gap: 2 }) + '</div>';
  },

  /* ---------- drag-to-resize ---------- */
  gripStart(ev, id){
    ev.preventDefault(); ev.stopPropagation();
    const p = DB.find("plantings", id); if(!p) return;
    const bed = DB.find("beds", p.bed_id);
    const startX = ev.clientX, startY = ev.clientY;
    const w0 = Garden.W(p), h0 = Garden.H(p);
    const step = Garden._cs + 3;
    let lastW = w0, lastH = h0;
    const move = e => {
      const dw = Math.round((e.clientX - startX) / step), dh = Math.round((e.clientY - startY) / step);
      const w = clamp(w0 + dw, 1, num(bed.cols) - num(p.x));
      const h = clamp(h0 + dh, 1, num(bed.rows) - num(p.y));
      if(w === lastW && h === lastH) return;
      if(Garden.blocked(bed, num(p.x), num(p.y), w, h, p.id)) return;
      lastW = w; lastH = h;
      DB.update("plantings", p.id, { w: w, h: h });
      Garden.syncQty(p.id);
      Garden.render();
      haptic();
    };
    const up = () => {
      window.removeEventListener("pointermove", move);
      window.removeEventListener("pointerup", up);
      const f = DB.find("plantings", id);
      if(f) toast(Garden.W(f) + "×" + Garden.H(f) + " · " + f.qty + " plant" + (num(f.qty) === 1 ? "" : "s"));
    };
    window.addEventListener("pointermove", move);
    window.addEventListener("pointerup", up);
  },

  /* keep plant count sensible when the area changes */
  syncQty(id){
    const p = DB.find("plantings", id); if(!p) return;
    const bed = DB.find("beds", p.bed_id);
    if(p.span_mode === "single"){ DB.update("plantings", id, { qty: 1 }); return; }
    DB.update("plantings", id, { qty: Garden.fitPlants(p.crop_id, bed, Garden.W(p), Garden.H(p)) });
  },

  resizeBy(id, dw, dh){
    const p = DB.find("plantings", id); if(!p) return;
    const bed = DB.find("beds", p.bed_id);
    const w = clamp(Garden.W(p) + dw, 1, num(bed.cols) - num(p.x));
    const h = clamp(Garden.H(p) + dh, 1, num(bed.rows) - num(p.y));
    const hit = Garden.blocked(bed, num(p.x), num(p.y), w, h, p.id);
    if(hit === "outside") return toast("That runs off the edge of the bed");
    if(hit) return toast("Blocked by " + cropName(hit.crop_id));
    DB.update("plantings", id, { w: w, h: h });
    Garden.syncQty(id);
    Garden.plantingSheet(DB.find("plantings", id));
    Garden.render();
  },

  setMode(id, mode){
    DB.update("plantings", id, { span_mode: mode });
    Garden.syncQty(id);
    Garden.plantingSheet(DB.find("plantings", id));
    Garden.render();
  },

  /* ---------- tap handling ---------- */
  tapCell(x, y){
    haptic();
    const bed = DB.find("beds", APP.bedId);
    const ex = Garden.at(bed.id, x, y);
    if(Garden.erase){ if(ex){ Garden.removePlanting(ex.id, true); Garden.render(); } return; }
    if(Garden.paint){
      if(ex){ if(ex.crop_id === Garden.paint) return; Garden.removePlanting(ex.id, true); }
      Garden.place(bed, x, y, Garden.paint, true);
      Garden.render(); return;
    }
    if(ex){
      Garden.sel = (Garden.sel === ex.id) ? null : ex.id;
      Garden.render();
      if(Garden.sel) Garden.plantingSheet(ex);
      return;
    }
    Garden.sel = null;
    Garden.pickCrop(x, y);
  },

  removePlanting(id, silent){
    DB.update("plantings", id, { status:"removed", removed_on: iso(today()) });
    DB.bulkRemove("events", e => e.planting_id === id && e.done !== "1");
    if(Garden.sel === id) Garden.sel = null;
    if(!silent){ closeSheet(); Garden.render(); toast("Square cleared"); }
  },

  /* ---------- the planting sheet ---------- */
  plantingSheet(p){
    if(!p) return;
    const c = crop(p.crop_id), bed = DB.find("beds", p.bed_id);
    const w = Garden.W(p), hh = Garden.H(p);
    const area = Garden.sqFt(bed, w, hh);
    const single = p.span_mode === "single";
    const seeds = DB.where("seeds", s => s.crop_id === p.crop_id);
    const fit = Garden.fitPlants(p.crop_id, bed, w, hh);
    const sn = Garden.seedsNeeded(p.crop_id, num(p.qty, 1), p.seed_id);
    const obs = Garden.observedSpread(p.crop_id);

    let h = '<div class="row" style="gap:12px;margin-bottom:12px"><div style="font-size:2.4rem">' + cropEmoji(p.crop_id) + '</div>' +
      '<div class="grow"><div class="b" style="font-size:1.1rem">' + esc(cropName(p.crop_id)) + '</div>' +
      '<div class="tiny muted">Row ' + (num(p.y)+1) + ', column ' + (num(p.x)+1) + ' of ' + esc(bed.name) +
      ' · ' + w + '×' + hh + ' (' + (Math.round(area*10)/10) + ' sq ft)</div></div></div>';

    /* size */
    h += '<div class="card"><div class="tiny b muted" style="text-transform:uppercase;letter-spacing:.06em;margin-bottom:8px">Area it covers</div>' +
      '<div class="row between" style="gap:14px">' +
      '<div><div class="tiny muted">Width</div><div class="stepper">' +
        '<button onclick="Garden.resizeBy(\'' + p.id + '\',-1,0)">−</button><span class="v">' + w + '</span>' +
        '<button onclick="Garden.resizeBy(\'' + p.id + '\',1,0)">＋</button></div></div>' +
      '<div><div class="tiny muted">Height</div><div class="stepper">' +
        '<button onclick="Garden.resizeBy(\'' + p.id + '\',0,-1)">−</button><span class="v">' + hh + '</span>' +
        '<button onclick="Garden.resizeBy(\'' + p.id + '\',0,1)">＋</button></div></div>' +
      '</div>' +
      '<div class="tiny muted" style="margin-top:8px">Tap the square on the grid to select it, then drag the corner handle to stretch it.</div></div>';

    /* mode */
    h += '<div class="card" style="margin-top:12px"><div class="tiny b muted" style="text-transform:uppercase;letter-spacing:.06em;margin-bottom:8px">What is in this area</div>' +
      '<div class="seg">' +
      '<button class="' + (single ? "on" : "") + '" onclick="Garden.setMode(\'' + p.id + '\',\'single\')">One plant, sprawling</button>' +
      '<button class="' + (!single ? "on" : "") + '" onclick="Garden.setMode(\'' + p.id + '\',\'fill\')">Filled with plants</button>' +
      '</div>';
    h += single
      ? '<div class="note i" style="margin-top:10px">One ' + esc(cropName(p.crop_id)) + ' claiming ' + (Math.round(area*10)/10) +
        ' sq ft. This is how you record a plant that grew far bigger than the book says — and the app remembers it for next season.</div>'
      : '<div class="note g" style="margin-top:10px">At ' + esc(c ? c.sp + '" spacing' : 'normal spacing') + ', ' +
        (Math.round(area*10)/10) + ' sq ft holds about <b>' + fit + ' plant' + (fit === 1 ? "" : "s") + '</b>.</div>';
    h += '<div class="field" style="margin-top:12px"><label class="f">Plants here</label>' +
      '<input type="number" id="pl-qty" min="1" value="' + esc(p.qty || 1) + '"></div>';
    const vv = p.variety ? Varieties.find(p.crop_id, p.variety) : null;
    h += '<div class="field"><label class="f">Variety</label>' +
      '<button class="item" style="border:1px solid var(--line);border-radius:12px;width:100%" onclick="Garden.pickVariety(\'' + p.id + '\')">' +
        '<div class="av">' + (p.variety ? "🏷️" : "＋") + '</div>' +
        '<div class="grow"><div class="b">' + (p.variety ? esc(p.variety) : "Choose a variety") + '</div>' +
        '<div class="tiny muted">' + (vv
            ? ((vv.dtm ? vv.dtm + " days · " : "") + esc(vv.habit || "") + (vv.resistance ? " · " + esc(vv.resistance) : ""))
            : (p.variety ? "Tap to change" : "Pick from the list, or look one up")) + '</div></div>' +
        '<span class="go">›</span></button>' +
      '<input type="hidden" id="pl-var" value="' + esc(p.variety || "") + '"></div>';
    if(vv && vv.notes) h += '<div class="note i" style="margin-top:8px">🏷️ <b>' + esc(vv.name) + '.</b> ' + esc(vv.notes) + '</div>';
    if(!single && num(p.qty) !== fit)
      h += '<button class="btn ghost block sm" style="margin-top:8px" onclick="Garden.syncQty(\'' + p.id + '\');Garden.plantingSheet(DB.find(\'plantings\',\'' + p.id + '\'));Garden.render()">Reset to recommended (' + fit + ')</button>';
    h += '</div>';

    /* seeds */
    h += '<div class="card" style="margin-top:12px"><div class="tiny b muted" style="text-transform:uppercase;letter-spacing:.06em;margin-bottom:8px">Seeds to sow</div>' +
      '<div class="row between"><div><div class="b" style="font-size:1.3rem">' + sn.seeds + ' seeds</div>' +
      '<div class="tiny muted">for ' + num(p.qty, 1) + ' plant' + (num(p.qty,1) === 1 ? "" : "s") + ' at ~' + sn.pct + '% germination, plus a little spare</div></div>' +
      '<div style="font-size:1.8rem">🌰</div></div>';
    if(seeds.length) h += '<div class="field" style="margin-top:10px"><label class="f">From packet</label><select id="pl-seed"><option value="">— none —</option>' +
      seeds.map(s => '<option value="' + s.id + '"' + (p.seed_id === s.id ? " selected" : "") + '>' +
        esc(s.name + (s.variety ? " · " + s.variety : "")) + '</option>').join("") + '</select></div>';
    else h += '<input type="hidden" id="pl-seed" value="">';
    h += '</div>';

    /* what she has seen before */
    if(obs) h += '<div class="note w" style="margin-top:12px">📐 <b>From your own garden.</b> You recorded ' + esc(cropName(p.crop_id)) +
      ' covering ' + obs.w + '×' + obs.h + (obs.sqft ? ' (' + obs.sqft + ' sq ft)' : '') + ' as a single plant' +
      (obs.when ? ', ' + fmtY(obs.when) : '') + '. Worth allowing that much room again.</div>';

    /* status & dates */
    h += '<div class="grid2" style="margin-top:12px">' +
      '<div><label class="f">Status</label><select id="pl-status">' +
        ["planned","seeded","growing","harvesting","done"].map(s => '<option value="' + s + '"' + (p.status === s ? " selected" : "") + '>' + s + '</option>').join("") +
      '</select></div>' +
      '<div><label class="f">Sown / planted</label><input type="date" id="pl-sown" value="' + esc(p.sown_on || "") + '"></div></div>';
    h += '<div class="field"><label class="f">Notes</label><textarea id="pl-notes" placeholder="How big it actually got, flavour, what you would change">' + esc(p.notes || "") + '</textarea></div>';

    if(c){
      const mx = Maturity.expected(p.crop_id, p.variety);
      const mine = Maturity.mine(p.crop_id, p.variety);
      const rec = DB.where("maturity", m => m.planting_id === p.id)[0];
      const harv = p.sown_on ? Season.harvestFrom(p.crop_id, p.sown_on, "seed", p.variety) : null;
      h += '<div class="card" style="margin-top:12px"><div class="tiny b muted" style="text-transform:uppercase;letter-spacing:.06em;margin-bottom:8px">Days to maturity</div>';
      if(mx) h += '<div class="row between"><div><div class="b" style="font-size:1.2rem">' + mx.lo + '–' + mx.hi + ' days</div>' +
        '<div class="tiny muted">' + esc({ yours:"your own average, from " + mx.n + " past planting" + (mx.n === 1 ? "" : "s"),
          blend:"your results blended with the catalogue figure", variety:"typical for this variety",
          crop:"typical for the crop — varies a lot by variety" }[mx.source]) + '</div></div>' +
        '<div style="font-size:1.6rem">📈</div></div>';
      if(mine) h += '<div class="note g" style="margin-top:8px">🌱 <b>In your garden.</b> ' + esc(cropName(p.crop_id)) +
        (mine.varietySpecific && p.variety ? ' (' + esc(p.variety) + ')' : '') + ' has averaged <b>' + mine.avg + ' days</b> over ' +
        mine.n + ' planting' + (mine.n === 1 ? "" : "s") + (mine.n > 1 ? ', ranging ' + mine.lo + '–' + mine.hi : '') + '.' +
        (mx && mx.pub && Math.abs(mine.avg - mx.pub.mid) >= 5
          ? ' That is ' + Math.abs(mine.avg - mx.pub.mid) + ' days ' + (mine.avg > mx.pub.mid ? 'slower' : 'faster') + ' than published.' : '') + '</div>';
      if(harv) h += '<div class="note i" style="margin-top:8px">🗓️ First harvest around <b>' + fmtY(harv) + '</b>' +
        (Season.firstFrost() && harv > Season.firstFrost() ? '. That lands after your first frost, so this planting may not finish outdoors.' : '.') + '</div>';
      h += '<button class="btn ' + (rec ? "ghost" : "") + ' block" style="margin-top:10px" onclick="Maturity.sheet(\'' + p.id + '\')">' +
        (rec ? '📈 First harvest recorded — ' + rec.days + ' days' : '📈 Record the first harvest') + '</button>' +
        '<div class="tiny muted" style="margin-top:6px">Every one you record makes the app\'s timing more like your garden and less like a seed catalogue.</div></div>';
      const occ = Garden.live(bed.id).filter(x => x.id !== p.id);
      const bad = [], good = [];
      occ.forEach(o => { const r = pairRating(p.crop_id, o.crop_id);
        if(r.score <= -2) bad.push(cropName(o.crop_id)); else if(r.score >= 1) good.push(cropName(o.crop_id)); });
      if(good.length) h += '<div class="note g" style="margin-top:8px">💚 Happy neighbours: ' + esc(good.filter((v,i,a)=>a.indexOf(v)===i).join(", ")) + '</div>';
      if(bad.length) h += '<div class="note d" style="margin-top:8px">⚠️ Poor neighbours: ' + esc(bad.filter((v,i,a)=>a.indexOf(v)===i).join(", ")) + '</div>';
    }

    h += '<div class="row" style="gap:8px;margin-top:16px">' +
      '<button class="btn ghost" onclick="Garden.removePlanting(\'' + p.id + '\')">Clear</button>' +
      '<button class="btn grow" onclick="Garden.savePlanting(\'' + p.id + '\')">Save</button></div>';
    h += '<button class="btn ghost block" style="margin-top:8px" onclick="closeSheet();setTimeout(function(){Library.open(\'' + p.crop_id + '\')},250)">Full growing guide →</button>';
    h += '<button class="btn ghost block" style="margin-top:8px" onclick="closeSheet();setTimeout(function(){Journal.quick(\'harvest\',\'' + bed.id + '\',\'' + p.id + '\')},250)">🧺 Log a harvest from this plant</button>';

    openSheet("Planting", h);
  },

  savePlanting(id){
    const p = DB.find("plantings", id); if(!p) return;
    DB.update("plantings", id, {
      variety: $("#pl-var") ? $("#pl-var").value.trim() : p.variety,
      qty: $("#pl-qty") ? Math.max(1, num($("#pl-qty").value, 1)) : p.qty,
      status: $("#pl-status") ? $("#pl-status").value : p.status,
      sown_on: $("#pl-sown") ? $("#pl-sown").value : p.sown_on,
      seed_id: ($("#pl-seed") && $("#pl-seed").value) || null,
      notes: $("#pl-notes") ? $("#pl-notes").value.trim() : p.notes
    });
    Cal.forPlanting(DB.find("plantings", id));
    closeSheet(); Garden.render(); toast("Saved");
  },

  /* placing into a chosen square, then straight into sizing */
  pickCrop(x, y){
    const bed = DB.find("beds", APP.bedId);
    Garden.cropPicker("Plant row " + (y+1) + ", column " + (x+1), id => {
      closeSheet();
      const obs = Garden.observedSpread(id);
      const p = Garden.place(bed, x, y, id, true,
        obs ? { w: Math.min(obs.w, num(bed.cols) - x), h: Math.min(obs.h, num(bed.rows) - y), mode:"single", qty:1 } : {});
      Garden.sel = p.id;
      Garden.render();
      if(obs) toast("Sized to the " + obs.w + "×" + obs.h + " you recorded before");
      setTimeout(() => Garden.plantingSheet(DB.find("plantings", p.id)), 250);
    }, bed);
  }
});

/* conflicts now measure rectangle-to-rectangle distance, not corner-to-corner */
Recommend.conflicts = function(bedId){
  const ps = Garden.live(bedId), out = [];
  const gap = (a, b) => {
    const ax2 = num(a.x) + Garden.W(a) - 1, ay2 = num(a.y) + Garden.H(a) - 1;
    const bx2 = num(b.x) + Garden.W(b) - 1, by2 = num(b.y) + Garden.H(b) - 1;
    const dx = Math.max(0, Math.max(num(a.x) - bx2, num(b.x) - ax2));
    const dy = Math.max(0, Math.max(num(a.y) - by2, num(b.y) - ay2));
    return dx + dy;
  };
  for(let i = 0; i < ps.length; i++) for(let j = i + 1; j < ps.length; j++){
    if(ps[i].crop_id === ps[j].crop_id) continue;
    const r = pairRating(ps[i].crop_id, ps[j].crop_id);
    if(r.score <= -2 && gap(ps[i], ps[j]) <= 2) out.push({ a: ps[i], b: ps[j], why: r.why, dist: gap(ps[i], ps[j]) });
  }
  return out;
};

/* the encouraging mirror of conflicts: pairings worth pointing out */
Recommend.friends = function(bedId){
  const ps = Garden.live(bedId), out = [];
  const gap = (a, b) => {
    const ax2 = num(a.x) + Garden.W(a) - 1, ay2 = num(a.y) + Garden.H(a) - 1;
    const bx2 = num(b.x) + Garden.W(b) - 1, by2 = num(b.y) + Garden.H(b) - 1;
    const dx = Math.max(0, Math.max(num(a.x) - bx2, num(b.x) - ax2));
    const dy = Math.max(0, Math.max(num(a.y) - by2, num(b.y) - ay2));
    return dx + dy;
  };
  for(let i = 0; i < ps.length; i++) for(let j = i + 1; j < ps.length; j++){
    if(ps[i].crop_id === ps[j].crop_id) continue;
    const r = pairRating(ps[i].crop_id, ps[j].crop_id);
    if(r.score >= 1 && gap(ps[i], ps[j]) <= 2) out.push({ a: ps[i], b: ps[j], why: r.why, score: r.score });
  }
  /* a genuinely great pairing outranks a merely good one */
  return out.sort((a, b) => b.score - a.score);
};

/* resizing a bed must not orphan the far edge of a span */
Garden.resize = function(dc, dr){
  const b = DB.find("beds", APP.bedId);
  const cols = clamp(num(b.cols) + dc, 1, 24), rows = clamp(num(b.rows) + dr, 1, 24);
  const orphan = Garden.live(b.id).filter(p =>
    num(p.x) + Garden.W(p) > cols || num(p.y) + Garden.H(p) > rows);
  const apply = () => {
    orphan.forEach(p => {
      const w = Math.min(Garden.W(p), cols - num(p.x)), h = Math.min(Garden.H(p), rows - num(p.y));
      if(w >= 1 && h >= 1){ DB.update("plantings", p.id, { w: w, h: h }); Garden.syncQty(p.id); }
      else DB.update("plantings", p.id, { status:"removed", removed_on: iso(today()) });
    });
    DB.update("beds", b.id, { cols: cols, rows: rows });
    Garden.render();
  };
  if(orphan.length) confirmSheet("Shrink the bed?",
    orphan.length + " planting" + (orphan.length > 1 ? "s" : "") + " will be trimmed or cleared to fit the new size.",
    "Shrink anyway", apply, true);
  else apply();
};

const Varieties = {
  /* bundled + saved, for one crop */
  forCrop(cropId){
    const ref = VARIETY_REF.filter(v => v[0] === cropId).map(v => ({
      id: "ref:" + cropId + ":" + v[1], crop_id: v[0], name: v[1], dtm: v[2],
      habit: v[3], resistance: v[4], notes: v[5], source: "reference"
    }));
    const mine = DB.where("varieties", v => v.crop_id === cropId)
      .map(v => Object.assign({}, v, { source: v.source || "saved" }));
    return mine.concat(ref);
  },
  find(cropId, name){
    if(!name) return null;
    const n = String(name).toLowerCase().trim();
    return Varieties.forCrop(cropId).find(v => v.name.toLowerCase() === n) ||
           Varieties.forCrop(cropId).find(v => v.name.toLowerCase().indexOf(n) >= 0) || null;
  },
  save(v){
    const ex = DB.where("varieties", x => x.crop_id === v.crop_id &&
      (x.name || "").toLowerCase() === String(v.name || "").toLowerCase())[0];
    if(ex) return DB.update("varieties", ex.id, v);
    return DB.insert("varieties", v);
  },

  /* ---------- picker ---------- */
  pick(cropId, onPick){
    const list = Varieties.forCrop(cropId);
    let h = '<p class="muted sm" style="margin-top:0">Varieties of ' + esc(cropName(cropId)) +
      '. Days to maturity is the figure catalogues broadly agree on — your seed packet is the authority.</p>';
    h += '<input type="search" id="vp-q" placeholder="Search or type a new variety name…">';
    h += '<div id="vp-list" style="margin-top:10px"></div>';
    h += '<div class="row" style="gap:8px;margin-top:12px">' +
      '<button class="btn ghost grow" id="vp-add">＋ Add manually</button>' +
      /* Assist.ready(), never DB.get("gemKey") — this button was invisible to
         anyone using Claude, which is the same bug the packet reader had. */
      (Assist.ready() ? '<button class="btn grow" id="vp-ai">✨ Look it up</button>' : '') + '</div>';
    if(!Assist.ready()) h += '<div class="tiny muted" style="margin-top:8px">Connect the assistant in Settings and this can search the web for any variety and fill in the details.</div>';
    h += '<div id="vp-out" style="margin-top:12px"></div>';
    openSheet("Choose a variety", h);

    const draw = q => {
      const f = list.filter(v => !q || v.name.toLowerCase().indexOf(q) >= 0);
      let o = '<div class="card pad0"><div class="list">';
      o += '<button class="item" data-v=""><div class="av">—</div><div class="grow"><div class="b">No variety</div>' +
           '<div class="tiny muted">Just the crop</div></div></button>';
      if(!f.length) o += '<div class="empty sm">Nothing matches — add it manually or look it up.</div>';
      f.forEach(v => {
        o += '<button class="item" data-v="' + esc(v.name) + '"><div class="av">' + cropEmoji(cropId) + '</div>' +
          '<div class="grow"><div class="b">' + esc(v.name) + (v.source !== "reference" ? ' <span class="chip good tiny">yours</span>' : '') + '</div>' +
          '<div class="tiny muted">' + (v.dtm ? v.dtm + ' days · ' : '') + esc(v.habit || "") +
          (v.resistance ? ' · ' + esc(v.resistance) : '') + '</div>' +
          (v.notes ? '<div class="tiny muted" style="margin-top:2px">' + esc(v.notes) + '</div>' : '') +
          '</div><span class="go">›</span></button>';
      });
      o += '</div></div>';
      $("#vp-list").innerHTML = o;
      $$("#vp-list .item").forEach(el => el.onclick = () => onPick(el.dataset.v, Varieties.find(cropId, el.dataset.v)));
    };
    $("#vp-q").oninput = e => draw(e.target.value.toLowerCase().trim());
    $("#vp-add").onclick = () => Varieties.form(cropId, $("#vp-q").value.trim(), onPick);
    if($("#vp-ai")) $("#vp-ai").onclick = () => Varieties.lookup(cropId, $("#vp-q").value.trim(), onPick);
    draw("");
  },

  form(cropId, name, onPick, prefill){
    const p = prefill || {};
    openSheet("Add a variety",
      '<div class="field"><label class="f">Variety name</label><input type="text" id="vf-name" value="' + esc(p.name || name || "") + '"></div>' +
      '<div class="grid2" style="margin-top:12px">' +
      '<div><label class="f">Days to maturity</label><input type="number" id="vf-dtm" value="' + esc(p.dtm || "") + '"></div>' +
      '<div><label class="f">Habit / type</label><input type="text" id="vf-habit" value="' + esc(p.habit || "") + '" placeholder="Indeterminate"></div></div>' +
      '<div class="field"><label class="f">Disease resistance</label><input type="text" id="vf-res" value="' + esc(p.resistance || "") + '" placeholder="VFN"></div>' +
      '<div class="field"><label class="f">Notes</label><textarea id="vf-notes">' + esc(p.notes || "") + '</textarea></div>' +
      (p.source ? '<div class="note i" style="margin-top:10px">Filled in from a web search. Check it against your packet before trusting the numbers.</div>' : '') +
      '<a class="chip info" style="margin-top:10px" href="https://www.vegetables.cornell.edu/pest-management/disease-factsheets/disease-resistant-vegetable-varieties/" target="_blank" rel="noopener noreferrer">🔗 What the resistance codes mean (Cornell) ↗</a>' +
      '<button class="btn block" style="margin-top:14px" id="vf-save">Save variety</button>');
    $("#vf-save").onclick = () => {
      const n = $("#vf-name").value.trim();
      if(!n) return toast("Give it a name");
      Varieties.save({ crop_id: cropId, name: n, dtm: num($("#vf-dtm").value) || null,
        habit: $("#vf-habit").value.trim(), resistance: $("#vf-res").value.trim(),
        notes: $("#vf-notes").value.trim(), source: p.source || "manual" });
      toast("Variety saved");
      onPick(n, Varieties.find(cropId, n));
    };
  },

  /* ---------- assistant lookup ----------
     Goes through Ask, which follows whichever provider is connected. Do not
     put a provider endpoint back in this file: it is what made this feature
     Gemini-only and invisible to everyone else, exactly as the packet reader
     was Anthropic-only before Vision existed. */
  async lookup(cropId, name, onPick){
    if(!Ask.ready()) return toast("Connect the assistant in Settings first");
    if(!name) return toast("Type the variety name first");
    const out = $("#vp-out");
    out.innerHTML = '<div class="row"><span class="spinner"></span><span class="sm muted">Searching for ' + esc(name) + '…</span></div>';
    try{
      const res = await Ask.json(
        "Look up the vegetable variety '" + name + "' of " + cropName(cropId) + ". " +
        "Reply with a single JSON object and nothing after it, with keys: name, dtm (days to maturity as a number), " +
        "habit (e.g. Indeterminate, Bush, Determinate paste), " +
        "resistance (standard disease-resistance letter codes if the variety is known for them, else empty string), " +
        "notes (two short sentences a home gardener would want: flavour, growth habit, any quirk). " +
        "If you cannot find reliable information, return {\"error\":\"not found\"}. Do not invent numbers.");
      const d = res.data;
      if(d.error) throw new Error("Nothing reliable found for that name");
      const srcs = res.sources || [];
      out.innerHTML = '<div class="note g"><b>' + esc(d.name || name) + '</b><br>' +
        (d.dtm ? d.dtm + ' days to maturity · ' : '') + esc(d.habit || "") +
        (d.resistance ? '<br>Resistance: ' + esc(d.resistance) : '') +
        (d.notes ? '<br><br>' + esc(d.notes) : '') +
        (srcs.length ? '<div class="tiny" style="margin-top:6px;opacity:.8">Sources: ' + esc(srcs.join(" · ")) + '</div>' : '') +
        '</div>' +
        '<div class="note w" style="margin-top:8px">From a web search, not a checked reference. Confirm against your seed packet.</div>' +
        '<button class="btn block" style="margin-top:10px" id="vp-use">Review and save</button>';
      $("#vp-use").onclick = () => Varieties.form(cropId, d.name || name, onPick,
        { name: d.name || name, dtm: d.dtm, habit: d.habit, resistance: d.resistance, notes: d.notes, source:"web search" });
    }catch(e){
      /* Ask.explain, not e.message — a gardener should never be shown
         "Unexpected token < in JSON at position 0" and left to guess. */
      out.innerHTML = '<div class="note d">' + esc(Ask.explain(e)) +
        ' You can still add it manually.</div>';
    }
  }
};

/* wire the variety picker into the planting sheet */
Garden.pickVariety = function(plantingId){
  const p = DB.find("plantings", plantingId); if(!p) return;
  Varieties.pick(p.crop_id, (name, v) => {
    DB.update("plantings", plantingId, { variety: name || null, variety_id: v ? v.id : null });
    closeSheet();
    setTimeout(() => { Garden.plantingSheet(DB.find("plantings", plantingId)); Garden.render(); }, 220);
  });
};
</script>

<script>
/* ============================================================
   GARDEN MAP
   The beds already know their real size in feet. This lays them
   out on one plan of the whole garden, so you can see where
   everything is rather than remembering which bed is which.
   Drag to arrange, add landmarks for orientation, tap to open.
   ============================================================ */
const FEATURES = {
  shed:      { n:"Shed",        e:"🏚️", w:8,  h:6 },
  greenhouse:{ n:"Greenhouse",  e:"🏡", w:8,  h:10 },
  compost:   { n:"Compost",     e:"♻️", w:3,  h:3 },
  water:     { n:"Water tap",   e:"🚰", w:1,  h:1 },
  tree:      { n:"Tree",        e:"🌳", w:6,  h:6 },
  shrub:     { n:"Shrub",       e:"🌿", w:3,  h:3 },
  path:      { n:"Path",        e:"⬜", w:10, h:2 },
  house:     { n:"House",       e:"🏠", w:16, h:10 },
  fence:     { n:"Fence",       e:"🚧", w:16, h:1 },
  gate:      { n:"Gate",        e:"🚪", w:3,  h:1 },
  table:     { n:"Potting bench", e:"🪵", w:4, h:2 },
  chair:     { n:"Seat",        e:"🪑", w:3,  h:3 }
};

const Gmap = {
  arrange: false, sel: null, _ppf: 12,

  /* ---------- geometry ---------- */
  bedFeet(b){
    const ft = num(b.cell_in, 12) / 12;
    const w = num(b.cols, 1) * ft, h = num(b.rows, 1) * ft;
    return num(b.rot) === 90 ? { w: h, h: w } : { w: w, h: h };
  },
  featFeet(m){
    const f = FEATURES[m.kind] || { w:3, h:3 };
    const w = num(m.w, f.w), h = num(m.h, f.h);
    return num(m.rot) === 90 ? { w: h, h: w } : { w: w, h: h };
  },

  /* a position that was never set must stay null — num() would turn it into 0 */
  pos(v){ return (v === null || v === undefined || v === "") ? null
                : (isFinite(parseFloat(v)) ? parseFloat(v) : null); },

  items(plotId){
    const beds = DB.all("beds").filter(b => !plotId || b.plot_id === plotId)
      .map(b => ({ kind:"bed", id:b.id, row:b, x:Gmap.pos(b.mx), y:Gmap.pos(b.my), size:Gmap.bedFeet(b) }));
    const feats = DB.all("mapitems").filter(m => !plotId || m.plot_id === plotId)
      .map(m => ({ kind:"feature", id:m.id, row:m, x:Gmap.pos(m.mx), y:Gmap.pos(m.my), size:Gmap.featFeet(m) }));
    return beds.concat(feats);
  },

  /* anything never placed gets tiled into free space so the map is never empty */
  autoPlace(plotId){
    const items = Gmap.items(plotId);
    const placed = items.filter(i => i.x !== null && i.y !== null);
    const loose = items.filter(i => i.x === null || i.y === null);
    if(!loose.length) return;
    let cx = 1, cy = 1, rowH = 0;
    const maxW = 24;
    placed.forEach(p => { cy = Math.max(cy, p.y + p.size.h + 2); });
    loose.forEach(i => {
      if(cx + i.size.w > maxW){ cx = 1; cy += rowH + 2; rowH = 0; }
      DB.update(i.kind === "bed" ? "beds" : "mapitems", i.id, { mx: cx, my: cy });
      cx += i.size.w + 2; rowH = Math.max(rowH, i.size.h);
    });
  },

  extent(plotId){
    const items = Gmap.items(plotId);
    let w = 12, h = 10;
    items.forEach(i => {
      if(i.x === null || i.y === null) return;
      w = Math.max(w, i.x + i.size.w + 1);
      h = Math.max(h, i.y + i.size.h + 1);
    });
    return { w: Math.ceil(w), h: Math.ceil(h) };
  },

  /* ---------- rendering ---------- */
  render(){
    const box = $("#s-garden");
    const plotId = APP.plotId && DB.find("plots", APP.plotId) ? APP.plotId : null;
    Gmap.autoPlace(plotId);
    const items = Gmap.items(plotId);
    const ext = Gmap.extent(plotId);
    const avail = Math.min(window.innerWidth, 520) - 32;
    const ppf = Gmap._ppf = clamp(avail / ext.w, 6, 40);
    const H = Math.round(ext.h * ppf);

    let h = Garden.viewToggle();

    const plots = DB.all("plots");
    if(plots.length){
      h += '<div class="scroller">' +
        '<button class="chip ' + (!plotId ? "on" : "") + '" onclick="APP.plotId=null;Garden.render()">Whole garden</button>' +
        plots.map(p => '<button class="chip ' + (plotId === p.id ? "on" : "") + '" onclick="APP.plotId=\'' + p.id + '\';Garden.render()">' +
          esc(p.name) + '</button>').join("") + '</div>';
    }

    if(!items.length){
      h += '<div class="card"><div class="empty"><span class="e">🗺️</span><div class="b">Nothing to map yet</div>' +
        '<div class="tiny">Create a bed and it appears here. Then drag things around until the plan matches your garden.</div></div>' +
        '<button class="btn block" onclick="Garden.newBed()">＋ New bed</button></div>';
      box.innerHTML = h; return;
    }

    h += '<div class="row" style="gap:8px;margin:12px 0">' +
      '<button class="btn ' + (Gmap.arrange ? "" : "ghost") + ' grow" onclick="Gmap.toggleArrange()">' +
        (Gmap.arrange ? "✓ Done arranging" : "✋ Arrange") + '</button>' +
      '<button class="btn ghost" onclick="Gmap.addFeature()">＋ Landmark</button>' +
      '<button class="btn ghost" onclick="Gmap.snapshot()">📸</button></div>';

    h += Gmap.arrange
      ? '<div class="note i">Drag anything to move it. Tap once to select, then use the buttons below to rotate or remove it. Positions snap to the foot.</div>'
      : '<div class="tiny muted center" style="margin-bottom:8px">' + ext.w + ' × ' + ext.h + ' ft · tap a bed to open it</div>';

    h += '<div class="mapwrap"><div class="mapplot" id="mapplot" style="height:' + H + 'px">';
    /* one-foot grid so the scale reads clearly */
    h += '<div class="mapgrid" style="background-size:' + ppf + 'px ' + ppf + 'px"></div>';
    h += '<div class="mapnorth">N ↑</div>';

    items.forEach(i => {
      if(i.x === null || i.y === null) return;
      const L = Math.round(i.x * ppf), T = Math.round(i.y * ppf);
      const W = Math.max(22, Math.round(i.size.w * ppf)), Hh = Math.max(22, Math.round(i.size.h * ppf));
      const isSel = Gmap.sel === i.id;
      if(i.kind === "bed"){
        const b = i.row;
        const ps = Garden.live(b.id);
        const crops = {}; ps.forEach(p => crops[p.crop_id] = (crops[p.crop_id] || 0) + 1);
        const emo = Object.keys(crops).slice(0, 6).map(cid => cropEmoji(cid)).join("");
        const full = ps.length, cells = num(b.cols) * num(b.rows);
        h += '<div class="mapbed ' + (isSel ? "sel" : "") + '" data-id="' + i.id + '" data-kind="bed" ' +
          'style="left:' + L + 'px;top:' + T + 'px;width:' + W + 'px;height:' + Hh + 'px">' +
          '<div class="mb-name">' + esc(b.name) + '</div>' +
          (Hh > 44 ? '<div class="mb-emo">' + emo + '</div>' : '') +
          (Hh > 60 ? '<div class="mb-sub">' + full + '/' + cells + ' planted · ' + esc(b.sun_hours || "?") + 'h sun</div>' : '') +
          '</div>';
      } else {
        const f = FEATURES[i.row.kind] || { n:"Item", e:"⬜" };
        h += '<div class="mapfeat ' + (isSel ? "sel" : "") + '" data-id="' + i.id + '" data-kind="feature" ' +
          'style="left:' + L + 'px;top:' + T + 'px;width:' + W + 'px;height:' + Hh + 'px">' +
          '<div class="mf-e">' + f.e + '</div>' +
          (W > 54 ? '<div class="mf-n">' + esc(i.row.label || f.n) + '</div>' : '') +
          '</div>';
      }
    });
    h += '</div></div>';

    if(Gmap.arrange && Gmap.sel){
      const it = items.find(x => x.id === Gmap.sel);
      if(it) h += '<div class="card" style="margin-top:12px"><div class="row between">' +
        '<div class="b">' + esc(it.kind === "bed" ? it.row.name : (it.row.label || (FEATURES[it.row.kind] || {}).n || "Item")) + '</div>' +
        '<div class="row" style="gap:6px">' +
          '<button class="chip" onclick="Gmap.rotate(\'' + it.id + '\')">⟳ Rotate</button>' +
          (it.kind === "feature" ? '<button class="chip bad" onclick="Gmap.removeFeature(\'' + it.id + '\')">Remove</button>' : '') +
        '</div></div>' +
        '<div class="tiny muted" style="margin-top:6px">' +
          Math.round(it.size.w * 10)/10 + ' × ' + Math.round(it.size.h * 10)/10 + ' ft' +
          (it.kind === "bed" ? ' · ' + it.row.cols + '×' + it.row.rows + ' squares' : '') + '</div></div>';
    }

    /* legend */
    const beds = items.filter(i => i.kind === "bed");
    if(beds.length && !Gmap.arrange){
      h += '<div class="sec"><h2>What is where</h2></div><div class="card pad0"><div class="list">';
      beds.forEach(i => {
        const b = i.row, ps = Garden.live(b.id);
        const names = ps.map(p => cropName(p.crop_id)).filter((v, ix, a) => a.indexOf(v) === ix);
        h += '<button class="item" onclick="Garden.open(\'' + b.id + '\')"><div class="av">🪴</div>' +
          '<div class="grow"><div class="b">' + esc(b.name) + '</div>' +
          '<div class="tiny muted">' + Math.round(i.size.w*10)/10 + '×' + Math.round(i.size.h*10)/10 + ' ft · ' +
          (names.length ? esc(names.slice(0, 5).join(", ")) + (names.length > 5 ? " +" + (names.length - 5) : "") : "empty") +
          '</div></div><span class="go">›</span></button>';
      });
      h += '</div></div>';
    }

    box.innerHTML = h;
    Gmap.bind();
  },

  bind(){
    const plot = $("#mapplot"); if(!plot) return;
    $$("#mapplot .mapbed, #mapplot .mapfeat").forEach(el => {
      el.onclick = e => {
        if(el._moved){ el._moved = false; return; }
        const id = el.dataset.id;
        if(!Gmap.arrange){
          if(el.dataset.kind === "bed") Garden.open(id);
          return;
        }
        Gmap.sel = Gmap.sel === id ? null : id;
        Garden.render();
      };
      el.addEventListener("pointerdown", e => Gmap.dragStart(e, el));
    });
  },

  dragStart(ev, el){
    if(!Gmap.arrange) return;
    ev.preventDefault();
    const id = el.dataset.id, kind = el.dataset.kind;
    const table = kind === "bed" ? "beds" : "mapitems";
    const row = DB.find(table, id); if(!row) return;
    const ppf = Gmap._ppf;
    const sx = ev.clientX, sy = ev.clientY;
    const ox = num(row.mx, 0), oy = num(row.my, 0);
    el._moved = false;
    const move = e => {
      const dxf = (e.clientX - sx) / ppf, dyf = (e.clientY - sy) / ppf;
      if(Math.abs(e.clientX - sx) > 4 || Math.abs(e.clientY - sy) > 4) el._moved = true;
      const nx = Math.max(0, Math.round((ox + dxf) * 2) / 2);
      const ny = Math.max(0, Math.round((oy + dyf) * 2) / 2);
      el.style.left = Math.round(nx * ppf) + "px";
      el.style.top = Math.round(ny * ppf) + "px";
      el._nx = nx; el._ny = ny;
    };
    const up = () => {
      window.removeEventListener("pointermove", move);
      window.removeEventListener("pointerup", up);
      if(el._moved && el._nx !== undefined){
        DB.update(table, id, { mx: el._nx, my: el._ny });
        Gmap.sel = id;
        haptic();
        Garden.render();
      }
    };
    window.addEventListener("pointermove", move);
    window.addEventListener("pointerup", up);
  },

  toggleArrange(){ Gmap.arrange = !Gmap.arrange; Gmap.sel = null; Garden.render(); },

  rotate(id){
    const bed = DB.find("beds", id);
    if(bed){ DB.update("beds", id, { rot: num(bed.rot) === 90 ? 0 : 90 }); }
    else { const m = DB.find("mapitems", id); if(m) DB.update("mapitems", id, { rot: num(m.rot) === 90 ? 0 : 90 }); }
    Garden.render();
  },

  addFeature(){
    let h = '<p class="muted sm" style="margin-top:0">Landmarks are just for orientation — a shed, a tree, the water tap. They help you read the map at a glance.</p>';
    h += '<div class="grid2">';
    Object.keys(FEATURES).forEach(k => {
      const f = FEATURES[k];
      h += '<button class="card" style="text-align:left" onclick="Gmap.saveFeature(\'' + k + '\')">' +
        '<div style="font-size:1.6rem">' + f.e + '</div><div class="b">' + esc(f.n) + '</div>' +
        '<div class="tiny muted">' + f.w + '×' + f.h + ' ft to start</div></button>';
    });
    h += '</div>';
    openSheet("Add a landmark", h);
  },
  saveFeature(kind){
    const f = FEATURES[kind]; if(!f) return;
    const ext = Gmap.extent(APP.plotId || null);
    DB.insert("mapitems", { plot_id: APP.plotId || null, kind: kind, label: f.n,
      w: f.w, h: f.h, mx: 1, my: Math.max(1, ext.h - f.h - 1), rot: 0 });
    closeSheet();
    Gmap.arrange = true;
    Garden.render();
    toast(f.n + " added — drag it into place");
  },
  removeFeature(id){
    DB.remove("mapitems", id);
    Gmap.sel = null; Garden.render(); toast("Removed");
  },

  /* ---------- shareable plan ---------- */
  snapshot(){
    const plotId = APP.plotId && DB.find("plots", APP.plotId) ? APP.plotId : null;
    const items = Gmap.items(plotId), ext = Gmap.extent(plotId);
    const pad = 60, ppf = Math.max(10, Math.min(1000 / ext.w, 1400 / ext.h));
    const W = Math.round(ext.w * ppf) + pad * 2, H = Math.round(ext.h * ppf) + pad * 2 + 90;
    const cv = document.createElement("canvas"); cv.width = W; cv.height = H;
    const x = cv.getContext("2d");
    const F = (s, wt) => (wt || "600") + " " + s + "px -apple-system, 'Segoe UI', Roboto, sans-serif";

    x.fillStyle = "#f6f8f5"; x.fillRect(0, 0, W, H);
    x.fillStyle = "#16211c"; x.font = F(34, "800");
    x.fillText((plotId ? DB.find("plots", plotId).name : "My garden"), pad, 52);
    x.fillStyle = "#5c6b62"; x.font = F(20, "500");
    x.fillText(fmtY(today()) + "  ·  " + ext.w + " × " + ext.h + " ft" +
      (DB.get("town") ? "  ·  " + DB.get("town") : ""), pad, 78);

    const oy = 100;
    /* one-foot grid */
    x.strokeStyle = "#e2e7e0"; x.lineWidth = 1;
    for(let i = 0; i <= ext.w; i++){
      x.beginPath(); x.moveTo(pad + i * ppf, oy); x.lineTo(pad + i * ppf, oy + ext.h * ppf); x.stroke(); }
    for(let j = 0; j <= ext.h; j++){
      x.beginPath(); x.moveTo(pad, oy + j * ppf); x.lineTo(pad + ext.w * ppf, oy + j * ppf); x.stroke(); }

    items.forEach(i => {
      if(i.x === null || i.y === null) return;
      const L = pad + i.x * ppf, T = oy + i.y * ppf;
      const w = Math.max(24, i.size.w * ppf), hh = Math.max(24, i.size.h * ppf);
      if(i.kind === "bed"){
        x.fillStyle = "#8a6a4f"; roundRect(x, L, T, w, hh, 8); x.fill();
        x.strokeStyle = "#6b4f38"; x.lineWidth = 2; x.stroke();
        x.fillStyle = "#fff"; x.font = F(Math.max(13, Math.min(20, hh * 0.22)), "700");
        x.fillText(esc0(i.row.name).slice(0, 22), L + 8, T + Math.max(18, hh * 0.28));
        const ps = Garden.live(i.row.id);
        const emo = Object.keys(ps.reduce((a, p) => (a[p.crop_id] = 1, a), {})).slice(0, 8).map(cropEmoji).join(" ");
        if(hh > 46){ x.font = F(Math.max(14, Math.min(22, hh * 0.2)), "500");
          x.fillText(emo, L + 8, T + Math.max(40, hh * 0.58)); }
      } else {
        const f = FEATURES[i.row.kind] || { n:"", e:"⬜" };
        x.fillStyle = "#e6e9e4"; roundRect(x, L, T, w, hh, 8); x.fill();
        x.strokeStyle = "#c9cec6"; x.lineWidth = 2; x.stroke();
        x.fillStyle = "#16211c"; x.font = F(Math.max(16, Math.min(26, Math.min(w, hh) * 0.4)), "600");
        x.textAlign = "center";
        x.fillText(f.e, L + w / 2, T + hh / 2 + 6);
        if(w > 70){ x.font = F(13, "600"); x.fillStyle = "#5c6b62";
          x.fillText(esc0(i.row.label || f.n).slice(0, 16), L + w / 2, T + hh - 6); }
        x.textAlign = "left";
      }
    });

    /* north arrow and scale bar */
    x.fillStyle = "#16211c"; x.font = F(22, "700");
    x.fillText("N ↑", W - pad - 44, oy + 24);
    const barFt = ext.w > 20 ? 5 : 2;
    x.strokeStyle = "#16211c"; x.lineWidth = 3;
    x.beginPath(); x.moveTo(pad, H - 26); x.lineTo(pad + barFt * ppf, H - 26); x.stroke();
    x.font = F(16, "600"); x.fillText(barFt + " ft", pad + barFt * ppf + 10, H - 20);

    cv.toBlob(blob => {
      const file = new File([blob], "garden-map-" + iso(today()) + ".png", { type:"image/png" });
      if(navigator.canShare && navigator.canShare({ files:[file] }))
        navigator.share({ files:[file], title:"Garden map" }).catch(() => download(file.name, blob));
      else download(file.name, blob);
      toast("Map saved 🗺️");
    }, "image/png");
  }
};

/* ---------- the Garden tab now has two views ---------- */
Garden.view = "beds";
Garden.viewToggle = function(){
  return '<div class="seg" style="margin-bottom:12px">' +
    '<button class="' + (Garden.view === "beds" ? "on" : "") + '" onclick="Garden.setView(\'beds\')">🪴 Beds</button>' +
    '<button class="' + (Garden.view === "map" ? "on" : "") + '" onclick="Garden.setView(\'map\')">🗺️ Map</button>' +
    '</div>';
};
Garden.setView = function(v){ Garden.view = v; Gmap.sel = null; Garden.render(); };

(function wrapRender(){
  Garden.render = function(){
    if(APP.bedId) return Garden.bedView();
    if(Garden.view === "map") return Gmap.render();
    return Garden.listView();
  };
})();

/* the bed list gets the same toggle at the top */
(function wrapList(){
  const orig = Garden.listView.bind(Garden);
  Garden.listView = function(){
    orig();
    const box = $("#s-garden");
    box.innerHTML = Garden.viewToggle() + box.innerHTML;
  };
})();
</script>

<script>
/* ============================================================
   BED GEOMETRY — the canvas underneath everything

   The grid had to go. Nothing in a garden grows in a box: leaves
   weave together overhead while roots keep their distance below,
   and a rigid lattice can express neither. Making the squares
   smaller would only have made the lattice finer.

   So a bed is now an OUTLINE measured in inches, and a planting is
   a POINT in that outline carrying two radii — the root zone it
   needs to itself, and the canopy it will throw once mature.
   Overlapping canopies are normal and drawn as such. Overlapping
   root zones are the thing worth warning about.

   The square-foot grid survives as an optional overlay and a
   snapping step, because plenty of people do plant in rows and
   the method is a good one. It is a preference now, not the model.
   ============================================================ */

const Geom = (() => {

  /* ---------- shapes ---------- */
  const SHAPES = {
    rect:    { n:"Rectangle",  e:"▭", d:"Raised beds, borders, rows" },
    round:   { n:"Rounded",    e:"▢", d:"A rectangle with soft corners" },
    circle:  { n:"Circle",     e:"◯", d:"Round beds, half-barrels, pots" },
    ellipse: { n:"Oval",       e:"⬭", d:"Island beds" },
    tri:     { n:"Triangle",   e:"△", d:"Corners — butt two together for a diamond" },
    trap:    { n:"Trapezoid",  e:"⏢", d:"Tapered ends, keyhole beds" },
    hex:     { n:"Hexagon",    e:"⬡", d:"Tiles against its neighbours with no waste" },
    ell:     { n:"L-shape",    e:"⌐", d:"Wraps a corner" },
    poly:    { n:"Draw it",    e:"✎", d:"Trace your own outline, corner by corner" }
  };

  /* every preset is a normalised outline, 0..1, y downward */
  function outline(shape){
    switch(shape){
      case "tri":  return [[0.5,0],[1,1],[0,1]];
      case "trap": return [[0.24,0],[0.76,0],[1,1],[0,1]];
      case "hex":  return [[0.25,0],[0.75,0],[1,0.5],[0.75,1],[0.25,1],[0,0.5]];
      case "ell":  return [[0,0],[0.46,0],[0.46,0.54],[1,0.54],[1,1],[0,1]];
      default:     return [[0,0],[1,0],[1,1],[0,1]];
    }
  }
  const isRound = s => s === "circle" || s === "ellipse";

  /* ---------- lazy migration ----------
     A bed built before the canvas describes itself as cols × rows of
     cell_in squares. That is a rectangle in inches and converts exactly,
     so it is done on read rather than in a migration pass that could
     half-finish. Idempotent: once w_in is set it never runs again. */
  function bed(b){
    if(!b) return null;
    if(b.w_in === null || b.w_in === undefined || b.w_in === ""){
      const cell = num(b.cell_in, 12);
      DB.update("beds", b.id, {
        shape: b.shape || "rect",
        w_in: Math.max(6, num(b.cols, 4) * cell),
        h_in: Math.max(6, num(b.rows, 4) * cell),
        grid_on: b.grid_on === undefined || b.grid_on === null ? 0 : b.grid_on,
        snap_in: num(b.snap_in, 0)
      });
      b = DB.find("beds", b.id);
    }
    return b;
  }

  /* A traced outline is a JSON string on disk so the vault and the .sqlite
     export stay real. It is parsed on demand and memoised against the raw
     string — NEVER written back onto the row. Anything stashed on a cached
     row ends up serialised into the gardener's backup and, worse, stringified
     into the SQL export as "0,0,1,0,…". */
  let polyMemo = { src: null, val: null };
  function polyOf(b){
    const raw = b.poly;
    if(!raw) return null;
    if(Array.isArray(raw)) return raw;
    if(polyMemo.src === raw) return polyMemo.val;
    let val = null;
    try{ val = JSON.parse(raw); }catch(e){ val = null; }
    polyMemo = { src: raw, val: val };
    return val;
  }
  function savePoly(bedId, pts){
    DB.update("beds", bedId, { poly: JSON.stringify(pts), shape:"poly" });
    polyMemo = { src: null, val: null };
  }

  const W = b => Math.max(6, num(bed(b).w_in, 48));
  const H = b => Math.max(6, num(bed(b).h_in, 48));
  const shape = b => bed(b).shape || "rect";

  /* absolute outline in inches */
  function pts(b){
    const w = W(b), h = H(b), s = shape(b);
    const bb = bed(b);
    const pl = polyOf(bb);
    if(s === "poly" && Array.isArray(pl) && pl.length >= 3)
      return pl.map(p => [num(p[0]) * w, num(p[1]) * h]);
    if(isRound(s)){
      /* an ellipse sampled finely enough that the polygon maths below
         works on it too — one containment routine, not two */
      const out = [];
      for(let i = 0; i < 48; i++){
        const t = i / 48 * Math.PI * 2;
        out.push([w/2 + w/2 * Math.cos(t), h/2 + h/2 * Math.sin(t)]);
      }
      return out;
    }
    return outline(s).map(p => [p[0] * w, p[1] * h]);
  }

  /* ---------- containment ---------- */
  function inPoly(poly, x, y){
    let inside = false;
    for(let i = 0, j = poly.length - 1; i < poly.length; j = i++){
      const xi = poly[i][0], yi = poly[i][1], xj = poly[j][0], yj = poly[j][1];
      if(((yi > y) !== (yj > y)) && (x < (xj - xi) * (y - yi) / ((yj - yi) || 1e-9) + xi)) inside = !inside;
    }
    return inside;
  }
  function segDist(x, y, ax, ay, bx, by){
    const dx = bx - ax, dy = by - ay;
    const L = dx*dx + dy*dy;
    let t = L ? ((x - ax) * dx + (y - ay) * dy) / L : 0;
    t = clamp(t, 0, 1);
    const px = ax + t*dx, py = ay + t*dy;
    return Math.sqrt((x-px)*(x-px) + (y-py)*(y-py));
  }
  function edgeDist(poly, x, y){
    let m = Infinity;
    for(let i = 0, j = poly.length - 1; i < poly.length; j = i++)
      m = Math.min(m, segDist(x, y, poly[j][0], poly[j][1], poly[i][0], poly[i][1]));
    return m;
  }
  /* inside, and at least `margin` inches clear of every edge */
  function inside(b, x, y, margin){
    const P = pts(b);
    if(!inPoly(P, x, y)) return false;
    return !margin || edgeDist(P, x, y) >= margin;
  }
  function centroid(b){
    const P = pts(b);
    let a = 0, cx = 0, cy = 0;
    for(let i = 0, j = P.length - 1; i < P.length; j = i++){
      const f = P[j][0]*P[i][1] - P[i][0]*P[j][1];
      a += f; cx += (P[j][0] + P[i][0]) * f; cy += (P[j][1] + P[i][1]) * f;
    }
    if(Math.abs(a) < 1e-6) return { x: W(b)/2, y: H(b)/2 };
    return { x: cx / (3*a), y: cy / (3*a) };
  }
  /* pull a point back inside — walk it toward the centre until it fits */
  function clampInto(b, x, y, margin){
    if(inside(b, x, y, margin)) return { x: x, y: y };
    const c = centroid(b);
    let lo = 0, hi = 1;
    if(!inside(b, c.x, c.y, margin)){
      /* the bed is too small for this plant at all — centre it and let the
         caller warn, rather than silently refusing the drop */
      return { x: c.x, y: c.y, tight: true };
    }
    for(let i = 0; i < 22; i++){
      const t = (lo + hi) / 2;
      const px = c.x + (x - c.x) * t, py = c.y + (y - c.y) * t;
      if(inside(b, px, py, margin)) lo = t; else hi = t;
    }
    return { x: c.x + (x - c.x) * lo, y: c.y + (y - c.y) * lo, clamped: true };
  }

  function areaSqIn(b){
    const P = pts(b);
    let a = 0;
    for(let i = 0, j = P.length - 1; i < P.length; j = i++)
      a += P[j][0]*P[i][1] - P[i][0]*P[j][1];
    return Math.abs(a / 2);
  }
  const areaSqFt = b => Math.round(areaSqIn(b) / 144 * 10) / 10;

  function svgPath(b){
    const s = shape(b), w = W(b), h = H(b);
    if(isRound(s)) return null;                       /* drawn as an <ellipse> */
    const P = pts(b);
    let d = "M" + P.map(p => (Math.round(p[0]*10)/10) + " " + (Math.round(p[1]*10)/10)).join("L") + "Z";
    return d;
  }

  /* ============================================================
     PLANT FOOTPRINTS

     Root radius is half the crop's own in-row spacing, which is what
     that number has always meant: two plants are correctly spaced
     when their root circles touch. A clump of several plants sharing
     one spot needs the area to scale with the count, so the radius
     scales with its square root.

     Canopy is the mature foliage spread. It is not in the crop table,
     so it comes from growth habit — a cucumber sprawls over twice its
     root zone, an onion barely covers its own.
     ============================================================ */
  const SPREAD = {
    cucurbit:2.10, solanaceae:1.35, legume:1.20, brassica:1.30, aster:1.15,
    apiaceae:1.00, chenopod:1.15, allium:0.80, poaceae:0.95, lamiaceae:1.30,
    malvaceae:1.20, convolvulaceae:1.80, polygonaceae:1.10, rosaceae:1.20,
    asparagaceae:1.30, tropaeolaceae:1.60, boraginaceae:1.40
  };
  /* mature height in inches — what decides who shades whom */
  const HEIGHT = {
    corn:84, polebean:78, pea:54, sunflower:96, okra:60, tomato:56, asparagus:60,
    eggplant:32, pepper:30, hotpepper:30, tomatillo:48, potato:30, bushbean:22,
    zucchini:26, cucumber:16, wintersquash:16, pumpkin:16, melon:14, watermelon:14,
    kale:28, broccoli:26, cauliflower:24, cabbage:16, brussels:32, chard:20,
    lettuce:9, spinach:8, arugula:8, radish:7, carrot:11, beet:12, turnip:12,
    onion:16, garlic:20, leek:22, chive:12, basil:20, parsley:12, cilantro:14, dill:36
  };
  const HEIGHT_FAM = { poaceae:80, solanaceae:40, legume:30, cucurbit:16, brassica:24,
                       aster:12, apiaceae:14, allium:18, chenopod:16, lamiaceae:18 };

  function rootR(cropId, qty){
    const c = crop(cropId);
    const sp = c ? num(c.sp, 12) : 12;
    return Math.round(sp / 2 * Math.sqrt(Math.max(1, num(qty, 1))) * 10) / 10;
  }
  function canopyR(cropId, qty){
    const c = crop(cropId);
    const k = (c && SPREAD[c.fam]) || 1.2;
    return Math.round(rootR(cropId, qty) * k * 10) / 10;
  }
  function height(cropId){
    if(HEIGHT[cropId] !== undefined) return HEIGHT[cropId];
    const c = crop(cropId);
    return (c && HEIGHT_FAM[c.fam]) || 18;
  }
  const isTall = id => height(id) >= 44;
  /* a crop that genuinely produces in shade, per the crop table's own figure */
  const shadeOk = id => { const c = crop(id); return !!c && num(c.sun, 8) <= 5; };

  /* how many plants that footprint can honestly hold */
  function fitsIn(cropId, r){
    const c = crop(cropId); if(!c) return 1;
    const sq = Math.PI * r * r / 144;
    return Math.max(1, Math.round(num(c.psf, 1) * sq));
  }

  /* ---------- lazy migration of a planting ----------
     The old model gave a rectangle of cells. Its centre becomes the
     plant's position and its size is preserved as canopy, so a cucumber
     someone recorded sprawling over six square feet still shows sprawling
     over six square feet. */
  function plant(p){
    if(!p) return null;
    if(p.px !== null && p.px !== undefined && p.px !== "") return p;
    const b = DB.find("beds", p.bed_id);
    const cell = b ? num(b.cell_in, 12) : 12;
    const w = clamp(num(p.w, 1) || 1, 1, 40), h = clamp(num(p.h, 1) || 1, 1, 40);
    const px = (num(p.x, 0) + w / 2) * cell;
    const py = (num(p.y, 0) + h / 2) * cell;
    const qty = Math.max(1, num(p.qty, 1));
    let rr = rootR(p.crop_id, p.span_mode === "single" ? 1 : qty);
    let rc = canopyR(p.crop_id, p.span_mode === "single" ? 1 : qty);
    if(p.span_mode === "single" && (w > 1 || h > 1)){
      /* a sprawl she recorded herself outranks the catalogue */
      rc = Math.max(rc, Math.sqrt((w*cell)*(w*cell) + (h*cell)*(h*cell)) / 2);
    }
    DB.update("plantings", p.id, {
      px: Math.round(px * 10) / 10, py: Math.round(py * 10) / 10,
      rr: rr, rc: Math.round(Math.max(rr, rc) * 10) / 10,
      rot: Math.round((hash(p.id) % 41) - 20),
      sv: hash(p.id + "v") % 100000
    });
    return DB.find("plantings", p.id);
  }
  function hash(s){
    let h = 2166136261 >>> 0;
    s = String(s);
    for(let i = 0; i < s.length; i++){ h ^= s.charCodeAt(i); h = Math.imul(h, 16777619) >>> 0; }
    return h >>> 0;
  }

  /* every live planting in a bed, migrated */
  function live(bedId){
    return DB.where("plantings", p => p.bed_id === bedId && p.status !== "removed").map(plant);
  }
  const PX = p => num(plant(p).px, 0);
  const PY = p => num(plant(p).py, 0);
  const RR = p => Math.max(1, num(plant(p).rr, 6));
  const RC = p => Math.max(RR(p), num(plant(p).rc, 8));
  function dist(a, b){
    const dx = PX(a) - PX(b), dy = PY(a) - PY(b);
    return Math.sqrt(dx*dx + dy*dy);
  }
  /* How close counts as "next to"? Companion advice is about plants sharing
     ground, so: their leaves meet, or there is under a foot of clear soil
     between their root zones. One definition, used everywhere — the bed view,
     the drag overlay and the planting sheet must never disagree. */
  const NEAR_GAP = 12;
  function relation(a, b){
    const d = dist(a, b);
    const gap = d - RR(a) - RR(b);
    return {
      d: Math.round(d * 10) / 10,
      rootsClash: d < RR(a) + RR(b) - 0.5,
      canopyTouch: d < RC(a) + RC(b),
      near: d < RC(a) + RC(b) || gap <= NEAR_GAP,
      gap: Math.round(gap * 10) / 10,
      /* one sitting inside the other's shade, which is a guild if the
         understorey crop actually wants it and a mistake if it does not */
      under: d < Math.max(RC(a), RC(b)) &&
             ((isTall(a.crop_id) && !isTall(b.crop_id)) || (isTall(b.crop_id) && !isTall(a.crop_id)))
    };
  }

  /* ---------- snapping ----------
     Corner to corner between beds, and vertex to vertex while drawing.
     A snap that only ever lines up to an invisible lattice is no use for
     butting two real beds together. */
  function snap(v, step){ return step > 0 ? Math.round(v / step) * step : v; }
  function nearest(x, y, cands, tol){
    let best = null, bd = tol;
    (cands || []).forEach(c => {
      const d = Math.sqrt((x - c[0])*(x - c[0]) + (y - c[1])*(y - c[1]));
      if(d <= bd){ bd = d; best = c; }
    });
    return best;
  }
  /* the corners of a bed as it sits on the plot map, in feet */
  function cornersFt(b){
    const bb = bed(b);
    const w = W(bb) / 12, h = H(bb) / 12;
    const rot = num(bb.rot) === 90;
    const ox = num(bb.mx, 0), oy = num(bb.my, 0);
    return pts(bb).map(p => {
      let px = p[0] / 12, py = p[1] / 12;
      if(rot){ const t = px; px = h - py; py = t; }
      return [ox + px, oy + py];
    });
  }
  function footprintFt(b){
    const bb = bed(b);
    const w = W(bb) / 12, h = H(bb) / 12;
    return num(bb.rot) === 90 ? { w: h, h: w } : { w: w, h: h };
  }

  return {
    SHAPES: SHAPES, SPREAD: SPREAD, HEIGHT: HEIGHT,
    outline: outline, isRound: isRound, bed: bed, savePoly: savePoly, polyOf: polyOf,
    W: W, H: H, shape: shape, pts: pts, svgPath: svgPath,
    inPoly: inPoly, inside: inside, centroid: centroid, clampInto: clampInto,
    edgeDist: edgeDist, segDist: segDist,
    areaSqIn: areaSqIn, areaSqFt: areaSqFt,
    rootR: rootR, canopyR: canopyR, height: height, isTall: isTall, shadeOk: shadeOk,
    fitsIn: fitsIn, plant: plant, live: live, hash: hash,
    PX: PX, PY: PY, RR: RR, RC: RC, dist: dist, relation: relation,
    snap: snap, nearest: nearest, cornersFt: cornersFt, footprintFt: footprintFt,
    NEAR_GAP: NEAR_GAP, near(a, b){ return relation(a, b).near; },

    /* one pass so the SQL console and exports are never half-converted */
    migrateAll(){
      DB.all("beds").forEach(bed);
      DB.all("plantings").forEach(plant);
    }
  };
})();

/* ============================================================
   THE OLD GRID API, NOW A VIEW OF THE CANVAS

   Plenty of the app — and the assistant's own tools — still speak in
   squares. Rather than run two models side by side, these read the
   canvas and answer in cells. There is one source of truth.
   ============================================================ */
Object.assign(Garden, {
  live(bedId){ return Geom.live(bedId); },
  cell(bed){ return num(Geom.bed(bed).cell_in, 12) || 12; },

  W(p){ return Math.max(1, Math.round(Geom.RC(p) * 2 / Garden.cell(DB.find("beds", p.bed_id) || {}))); },
  H(p){ return Garden.W(p); },

  /* does this plant's canopy fall over that square? */
  covers(p, x, y){
    const b = DB.find("beds", p.bed_id); if(!b) return false;
    const c = Garden.cell(b);
    const cx = (x + 0.5) * c, cy = (y + 0.5) * c;
    const dx = Geom.PX(p) - cx, dy = Geom.PY(p) - cy;
    return Math.sqrt(dx*dx + dy*dy) <= Geom.RC(p) + c * 0.2;
  },
  at(bedId, x, y){
    const list = Geom.live(bedId).filter(p => Garden.covers(p, x, y));
    if(!list.length) return null;
    const b = DB.find("beds", bedId), c = Garden.cell(b);
    const cx = (x + 0.5) * c, cy = (y + 0.5) * c;
    list.sort((a, z) => (Math.hypot(Geom.PX(a)-cx, Geom.PY(a)-cy) - Geom.RR(a)) -
                        (Math.hypot(Geom.PX(z)-cx, Geom.PY(z)-cy) - Geom.RR(z)));
    return list[0];
  },
  /* nearest plant to a point in inches, preferring one you actually hit */
  hit(bedId, ix, iy){
    let best = null, bd = Infinity;
    Geom.live(bedId).forEach(p => {
      const d = Math.hypot(Geom.PX(p) - ix, Geom.PY(p) - iy);
      const slack = d - Geom.RC(p);
      if(d <= Geom.RC(p) + 3 && slack < bd){ bd = slack; best = p; }
    });
    return best;
  },

  sqFt(bed, w, h){ const c = Garden.cell(bed) / 12; return w * h * c * c; },
  bedSqFt(bed){ return Geom.areaSqFt(bed); },

  /* would a plant of this footprint sit badly here? */
  blocked(bed, x, y, w, h, ignoreId){
    const c = Garden.cell(bed);
    const px = (num(x) + num(w, 1) / 2) * c, py = (num(y) + num(h, 1) / 2) * c;
    const r = Math.max(num(w, 1), num(h, 1)) * c / 2;
    if(!Geom.inside(bed, px, py, Math.min(r, 1))) return "outside";
    const hit = Geom.live(bed.id).find(p => p.id !== ignoreId &&
      Math.hypot(Geom.PX(p) - px, Geom.PY(p) - py) < Geom.RR(p) + r - 0.5);
    return hit || null;
  },

  fitPlants(cropId, bed, w, h){
    const c = crop(cropId); if(!c) return 1;
    return Math.max(1, Math.round(num(c.psf, 1) * Garden.sqFt(bed, w, h)));
  }
});
</script>

<script>
/* ============================================================
   WHAT A PLANT LOOKS LIKE ON THE CANVAS

   The first version of this drew every plant procedurally — its own
   leaves, its own angles, no two alike. It looked like a garden and
   was useless: a bed of green blobs with "Tomato" written under one
   of them tells you nothing at a glance, which is the one thing a
   plan has to do.

   So the icon is the crop itself. A tomato looks like a tomato.

   Everything organic about the canvas lives in the two circles that
   Canvas draws around it — the root zone and the mature canopy, both
   translucent so overlaps read properly — and in the fact that those
   circles are real measured sizes. The icon only has to answer
   "what is planted here", and the label under it answers "which
   variety", because by August that is the question you are actually
   asking.

   What stays from the old version is the part that was doing real
   work: growth. A plant is drawn small in May and full size in
   August, scaled by its own days to maturity, and a bed previewed
   before its sowing date shows an intention rather than a plant.
   ============================================================ */

const PlantArt = (() => {

  /* ---------- growth habit ----------
     No longer drives the drawing, but it still describes the plant
     honestly, and the size and colour work reads off it. */
  const ARCH = {
    lettuce:"rosette", cabbage:"rosette", spinach:"rosette", chard:"rosette",
    kale:"rosette", arugula:"rosette", bokchoy:"rosette", mustard:"rosette",
    broccoli:"rosette", cauliflower:"rosette", collards:"rosette", kohlrabi:"rosette",

    tomato:"bush", pepper:"bush", hotpepper:"bush", eggplant:"bush", tomatillo:"bush",
    bushbean:"bush", basil:"bush", oregano:"bush", thyme:"bush", sage:"bush",
    rosemary:"bush", mint:"bush", marigold:"bush", nasturtium:"bush", borage:"bush",
    potato:"bush", okra:"bush", brussels:"bush",

    cucumber:"vine", zucchini:"vine", wintersquash:"vine", pumpkin:"vine",
    melon:"vine", watermelon:"vine", sweetpotato:"vine",

    carrot:"fern", dill:"fern", fennel:"fern", cilantro:"fern", parsley:"fern",

    onion:"strap", garlic:"strap", leek:"strap", chive:"strap", shallot:"strap",
    asparagus:"strap",

    corn:"grass",

    polebean:"climb", pea:"climb",

    beet:"root", radish:"root", turnip:"root", parsnip:"root", celery:"root",
    strawberry:"root", rhubarb:"root"
  };
  const ARCH_FAM = {
    cucurbit:"vine", poaceae:"grass", allium:"strap", apiaceae:"fern",
    solanaceae:"bush", legume:"bush", brassica:"rosette", aster:"rosette",
    chenopod:"rosette", lamiaceae:"bush"
  };
  function archetype(cropId){
    if(ARCH[cropId]) return ARCH[cropId];
    const c = crop(cropId);
    return (c && ARCH_FAM[c.fam]) || "bush";
  }

  /* the ripe colour, used to tint the canopy so a bed reads at a glance
     even when the icons are too small to make out */
  const FRUIT = {
    tomato:"#d8402f", tomatillo:"#a8bf46", pepper:"#d4402c", hotpepper:"#c2302a",
    eggplant:"#6b3f8f", cucumber:"#2f7a35", zucchini:"#3f8a3a", wintersquash:"#d08420",
    pumpkin:"#e07b18", melon:"#d6c05c", watermelon:"#2f6b3a", corn:"#e8c34a",
    bushbean:"#63a44e", polebean:"#54a047", pea:"#74b85c", okra:"#5f9c3c",
    radish:"#d24a5a", beet:"#8f2f52", carrot:"#e07b28", turnip:"#c9b8d0",
    onion:"#c9a06a", garlic:"#e6ded0", strawberry:"#e0424f", sunflower:"#f0c020",
    marigold:"#f0a020", nasturtium:"#e8743d", broccoli:"#3f7a3f",
    cauliflower:"#eee6cf", cabbage:"#7fae6a", potato:"#c9a878"
  };

  /* ---------- a repeatable random stream per planting ----------
     Still here: the soil texture uses it, and it keeps the small
     tilt on each icon consistent between renders. */
  function rng(seed){
    let a = (seed >>> 0) || 1;
    return function(){
      a |= 0; a = a + 0x6D2B79F5 | 0;
      let t = Math.imul(a ^ a >>> 15, 1 | a);
      t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t;
      return ((t ^ t >>> 14) >>> 0) / 4294967296;
    };
  }
  const R1 = (r, lo, hi) => lo + r() * (hi - lo);

  function palette(cropId, r){
    const c = crop(cropId);
    const arch = archetype(cropId);
    let hue = 108, sat = 38, lit = 34;
    if(arch === "strap"){ hue = 128; sat = 30; lit = 38; }
    else if(arch === "fern"){ hue = 112; sat = 44; lit = 40; }
    else if(arch === "grass"){ hue = 92;  sat = 40; lit = 40; }
    else if(arch === "vine"){ hue = 104; sat = 42; lit = 31; }
    else if(arch === "rosette"){ hue = 96; sat = 42; lit = 38; }
    if(c && c.fam === "brassica"){ hue = 148; sat = 26; lit = 40; }
    if(c && c.fam === "chenopod"){ hue = 132; sat = 34; lit = 33; }
    if(r){ hue += R1(r, -9, 9); sat += R1(r, -5, 6); lit += R1(r, -4, 5); }
    const H = (v, s, l) => "hsl(" + Math.round(v) + " " + Math.round(s) + "% " + Math.round(l) + "%)";
    return {
      leaf:  H(hue, sat, lit),
      light: H(hue + 6, sat + 6, lit + 11),
      dark:  H(hue - 6, sat + 4, Math.max(14, lit - 10)),
      stem:  H(hue - 4, sat - 6, Math.max(16, lit - 6)),
      fruit: FRUIT[cropId] || ((c && FAMILY[c.fam]) ? FAMILY[c.fam].c : "#d8402f")
    };
  }

  /* ---------- how far along it is on a given date ---------- */
  function growth(p, when){
    const c = crop(p.crop_id);
    if(!c) return 1;
    const sown = parseISO(p.sown_on) || parseISO(String(p.created || "").slice(0, 10));
    if(!sown) return 1;
    let dtm = num(c.dtm, 70);
    /* the gardener's own recorded timing beats the catalogue, same as everywhere else */
    if(typeof Maturity !== "undefined" && Maturity.expected){
      const mx = Maturity.expected(p.crop_id, p.variety);
      if(mx && mx.lo && mx.hi) dtm = (mx.lo + mx.hi) / 2;
    }
    const days = diffDays(sown, when || today());
    if(days < 0) return -1;                       /* not sown yet on this date */
    /* something set out as a transplant is already a plant, not a seed */
    const base = c.from === "transplant" ? 0.24 : 0;
    return clamp(base + (1 - base) * days / Math.max(14, dtm), 0, 1.18);
  }
  function stage(g){
    if(g < 0) return "unsown";
    if(g < 0.10) return "seedling";
    if(g < 0.42) return "young";
    if(g < 0.80) return "growing";
    if(g < 1.02) return "mature";
    return "over";
  }
  /* the drawn size relative to full spread — a seedling is not a small adult,
     but it is genuinely smaller, and that is the point of the scrubber */
  function sizeAt(g){
    if(g < 0) return 0;
    return clamp(0.16 + 0.84 * Math.pow(clamp(g, 0, 1), 0.72), 0.16, 1);
  }

  /* what to show for this crop. The emoji in the crop table is the icon —
     it is the same one used in every list in the app, so a bed and the
     "growing here" list underneath it agree. */
  function icon(cropId){
    const c = crop(cropId);
    return (c && c.e) || "🌱";
  }

  /* ============================================================
     THE DRAWING — one <g> in a unit circle of radius 1, which the
     canvas scales to the size the icon should actually appear at.

     R is how much of that unit circle the art actually fills, and it
     is exported because the canvas has to fit the icon inside a
     measured circle: scale × R is the radius the drawing really
     occupies. Nothing below may reach further than R from the origin.
     The widest thing here is a seedling — the 🌱 badge sits at
     (0.5, -0.45) at font-size 0.7, so it ends at 0.85 — with the soil
     shadow (0.62 + 0.2) and the mature glyph (font-size 1.55, half an
     em either side = 0.775) both just inside it. Change the drawing
     and this number changes with it.
     ============================================================ */
  const R = 0.85;

  function svg(p, opts){
    const o = opts || {};
    const g = o.growth === undefined ? growth(p, o.when) : o.growth;
    const seed = num(p.sv, 0) || Geom.hash(p.id);
    const r = rng(seed);
    const pal = palette(p.crop_id, r);

    if(g < 0){
      /* not yet sown on the date being previewed — show the intention */
      return '<g opacity="0.55">' +
        '<circle r="0.55" fill="none" stroke="' + pal.stem +
        '" stroke-width="0.16" stroke-dasharray="0.34 0.28"/></g>';
    }

    /* a small consistent tilt so a row of the same crop does not read as
       a row of stamps, but nowhere near enough to make it hard to identify */
    const tilt = Math.round(clamp(num(p.rot, 0) * 0.3, -8, 8));
    const young = g < 0.10;
    return '<g transform="rotate(' + tilt + ')"' + (g > 1.02 ? ' opacity="0.75"' : '') + '>' +
      /* a soft shadow so the icon sits on the soil rather than floating */
      '<ellipse cx="0" cy="0.62" rx="0.62" ry="0.2" fill="#2b2118" fill-opacity="0.28"/>' +
      '<text x="0" y="0" text-anchor="middle" dominant-baseline="central" ' +
      'font-size="' + (young ? 1.05 : 1.55) + '" ' +
      'style="font-size:' + (young ? 1.05 : 1.55) + 'px">' + icon(p.crop_id) + '</text>' +
      (young ? '<text x="0.5" y="-0.45" text-anchor="middle" dominant-baseline="central" ' +
               'font-size="0.7" style="font-size:0.7px">🌱</text>' : '') +
      '</g>';
  }

  return { svg: svg, growth: growth, stage: stage, sizeAt: sizeAt, icon: icon, R: R,
           archetype: archetype, palette: palette, rng: rng, ARCH: ARCH, FRUIT: FRUIT };
})();
</script>
