<script>
/* ============================================================
   THE PLANTING CANVAS

   One SVG, drawn in inches. The viewBox does the scaling, so every
   number in this file is a real garden measurement and nothing has
   to be converted twice.

   Draw order is back to front by depth, which is how you actually
   see a bed: the plants nearer you overlap the ones behind. Anything
   that overlaps what is behind it goes slightly transparent, so a
   sprawling squash never hides the beetroot it has grown over.
   ============================================================ */

const Canvas = {
  PAD: 5,                 /* inches of soil edge around the bed */
  showRoots: false,
  showCanopy: true,
  labels: null,           /* null = decide by how crowded the bed is */

  /* the date the plan is being previewed at */
  date(){ return addDays(today(), num(Garden.tl, 0) * 7); },

  /* How much of the inner circle's radius the icon may occupy. Short of the
     line on purpose: an icon that touches the circle it sits in reads as one
     blob, and the gap is what makes the ring legible as a measurement. */
  ICON_FIT: 0.9,

  /* How big to draw the icon. PlantArt draws in a unit circle, so this is a
     scale factor, and `scale × PlantArt.R` is the radius the drawing actually
     occupies in inches.

     THE RULE IS CONTAINMENT. Two circles are drawn around every plant — the
     root zone it needs to itself, at full size whatever the season, and the
     canopy at the size it has reached on the date being previewed. The icon
     has to fit inside whichever of those is currently the smaller, or it hides
     the very measurement the circle was drawn to show. Both failures were real:
     a radish's emoji came out wider than the radish's own root zone, because a
     legibility floor measured off the *bed* took no notice of how small the
     plant was; and any icon sized off the mature canopy spilled past the canopy
     a seedling had actually grown.

     Inside that cap the icon still wants to be as large as it usefully can — a
     fraction of the current canopy, with a floor so a long row of carrots is
     not a line of specks. But the cap always wins over the floor. Zoom is the
     answer to a genuinely tiny plant; drawing over its own root zone is not. */
  iconR(bed, rc, grown, rr){
    const can = num(rc, 6) * num(grown, 1);
    /* rr omitted (a preview with nothing but a canopy to go on) means the
       canopy is the only circle there is to stay inside of */
    const inner = (rr === undefined || rr === null) ? can : Math.min(num(rr, can), can);
    const cap = inner * Canvas.ICON_FIT / PlantArt.R;
    const floor = Math.min(Geom.W(bed), Geom.H(bed)) * 0.055;
    const want = Math.max(can * 0.62, floor);
    /* two places, not one: at a radish's size a tenth of an inch of rounding
       is the difference between fitting and spilling */
    return Math.round(Math.min(want, cap) * 100) / 100;
  },

  /* How big a companion badge should be.
     This was a flat `Math.max(2.4, rc * 0.42)` — a radius in *inches*, with a
     hard 2.4" floor. On a radish that is a badge nearly as wide as the plant,
     so a bed of small crops turned into a field of hearts and told you less
     than the plants themselves did. It is a fraction of the bed now, which
     means a constant small size on screen whatever the plot measures, with a
     warning allowed to be a little larger than a heart because a warning is
     the one you must not miss. */
  badgeR(bed, rc, bad){
    const span = Math.min(Geom.W(bed), Geom.H(bed));
    const ts = typeof Zoom !== "undefined" ? Zoom.textScale() : 1;
    const p = num(rc, 6);
    /* the floor keeps a badge visible on a big plot; the cap against the
       plant's own canopy is the point of the whole change — a marker that is
       wider than the thing it marks tells you nothing you wanted to know */
    const r = Math.min(clamp(p * 0.26, span * 0.009, span * 0.020), p * 0.6) * ts;
    return Math.round((bad ? r * 1.3 : r) * 100) / 100;
  },

  /* How big the two buttons on a selected plant are — the resize handle and
     the ⋯ menu — and how far out they sit.

     This was `Math.max(2, rc * 0.2)`: a fifth of the canopy, in inches. So
     dragging a pumpkin's spread out to four feet grew its own handle to nearly
     ten inches across, and the control ended up larger than most of the plants
     around it. A button is not a measurement. It should be the same size on
     screen whatever the plant measures and whatever the magnification, the way
     a map's controls are — which means a fraction of the bed (constant on
     screen at 1×) times Zoom.textScale (constant on screen at every zoom, by
     shrinking in inches exactly as fast as the view magnifies).

     The fraction is of the bed's WIDTH plus the soil margin, not of its
     shorter side, because that is the number the SVG actually scales by: the
     element is `width:100%; height:auto`, so pixels-per-inch comes from the
     viewBox width and nothing else. Measuring off `min(W,H)` the way the
     badges do left a 96×48 bed's buttons at half the size of a 48×96 one's,
     for no reason a gardener could see.

     Nothing caps it against the plant, deliberately: the buttons sit outboard
     of the canopy rather than on it, and a handle that shrank with the radish
     it belonged to would be the same inconsistency in the other direction.
     What a small plant gets instead is `gripAt` pushing the two apart far
     enough that they clear each other. */
  GRIP_SCREEN: 0.033,     /* of the view width — a ~7% wide button, at any zoom */
  gripR(bed){
    const view = Geom.W(bed) + Canvas.PAD * 2;
    const ts = typeof Zoom !== "undefined" ? Zoom.textScale() : 1;
    return Math.round(view * Canvas.GRIP_SCREEN * ts * 100) / 100;
  },
  /* on the diagonal, at the canopy edge — but never so close in that the two
     buttons overlap each other on a plant smaller than they are */
  gripAt(bed, rc){
    const br = Canvas.gripR(bed);
    return Math.round(Math.max(num(rc, 6) * 0.7071, br * 1.15) * 10) / 10;
  },
  /* the invisible touch target behind each one — a fat finger's worth wider
     than the circle it sits under. It rides gripR, so it tracks zoom too;
     a fixed-inch pad would cover the neighbours at 4×. */
  gripTap(bed){ return Math.round(Canvas.gripR(bed) * 1.4 * 10) / 10; },

  wantLabels(bed){
    if(Canvas.labels !== null) return Canvas.labels;
    const ps = Geom.live(bed.id);
    /* Six of the herbs share one emoji, and so do asparagus and rhubarb. The
       icon cannot tell basil from sage, so when a bed holds two crops that
       look alike the labels are not optional — that is the whole job of the
       screen. */
    const seen = {};
    for(const p of ps){
      const k = PlantArt.icon(p.crop_id);
      if(seen[k] && seen[k] !== p.crop_id) return true;
      seen[k] = p.crop_id;
    }
    return ps.length <= 14;
  },

  /* ---------- soil ---------- */
  soilDefs(bed){
    const r = PlantArt.rng(Geom.hash(bed.id + "soil"));
    let spec = "";
    for(let i = 0; i < 26; i++){
      const x = r() * 16, y = r() * 16, rad = 0.18 + r() * 0.55;
      const tone = ["#7d6249","#4a3728","#6b5140","#8a6f52","#3f2f22"][Math.floor(r() * 5)];
      spec += '<circle cx="' + (Math.round(x*10)/10) + '" cy="' + (Math.round(y*10)/10) +
              '" r="' + (Math.round(rad*100)/100) + '" fill="' + tone + '" fill-opacity="' +
              (Math.round((0.25 + r() * 0.5) * 100) / 100) + '"/>';
    }
    const id = "soil-" + bed.id;
    return '<pattern id="' + id + '" width="16" height="16" patternUnits="userSpaceOnUse">' +
      '<rect width="16" height="16" fill="#5d4634"/>' + spec + '</pattern>' +
      '<radialGradient id="vig-' + bed.id + '" cx="50%" cy="42%" r="72%">' +
        '<stop offset="55%" stop-color="#000" stop-opacity="0"/>' +
        '<stop offset="100%" stop-color="#000" stop-opacity="0.34"/>' +
      '</radialGradient>';
  },

  bedShapeSVG(bed, attrs){
    const s = Geom.shape(bed), w = Geom.W(bed), h = Geom.H(bed);
    if(Geom.isRound(s))
      return '<ellipse cx="' + (w/2) + '" cy="' + (h/2) + '" rx="' + (w/2) + '" ry="' + (h/2) + '" ' + attrs + '/>';
    if(s === "round")
      return '<rect x="0" y="0" width="' + w + '" height="' + h + '" rx="' +
             Math.min(w, h) * 0.12 + '" ' + attrs + '/>';
    return '<path d="' + Geom.svgPath(bed) + '" ' + attrs + '/>';
  },

  /* ---------- the whole picture ---------- */
  svg(bed, opts){
    const o = opts || {};
    bed = Geom.bed(bed);
    const W = Geom.W(bed), H = Geom.H(bed), P = o.pad === undefined ? Canvas.PAD : o.pad;
    const when = o.when || Canvas.date();
    const ps = Geom.live(bed.id).slice().sort((a, b) => Geom.PY(a) - Geom.PY(b));
    const inter = !!o.interactive;
    const clip = "clip-" + bed.id;

    /* Zoom is a viewBox change and nothing else. Canvas.toIn reads the live
       viewBox off the element, so every gesture in the app — tap, drag,
       resize, the buttons — stays correct at any magnification for free. A
       CSS transform would have broken all of them. At 1× this emits exactly
       the string it always did. */
    const vb = (inter && typeof Zoom !== "undefined") ? Zoom.viewBox(bed, P) : null;
    let h = '<svg viewBox="' + (vb || ((-P) + ' ' + (-P) + ' ' + (W + P*2) + ' ' + (H + P*2))) +
      '" xmlns="http://www.w3.org/2000/svg"' + (inter ? ' id="pcanvas"' : '') + '>';
    h += '<defs>' + Canvas.soilDefs(bed) +
      '<clipPath id="' + clip + '">' + Canvas.bedShapeSVG(bed, '') + '</clipPath></defs>';

    /* the bed itself */
    h += Canvas.bedShapeSVG(bed, 'fill="url(#soil-' + bed.id + ')"');
    h += '<g clip-path="url(#' + clip + ')">';
    if(num(bed.grid_on)){
      const c = Garden.cell(bed);
      let g = '';
      for(let x = c; x < W; x += c) g += '<path d="M' + x + ' 0V' + H + '"/>';
      for(let y = c; y < H; y += c) g += '<path d="M0 ' + y + 'H' + W + '"/>';
      h += '<g stroke="#fff" stroke-opacity="0.13" stroke-width="0.35">' + g + '</g>';
    }
    h += Canvas.bedShapeSVG(bed, 'fill="url(#vig-' + bed.id + ')"');
    h += '</g>';
    h += Canvas.bedShapeSVG(bed, 'fill="none" stroke="#3a2c20" stroke-opacity="0.75" stroke-width="' +
      Math.max(0.5, Math.min(W, H) * 0.012) + '"');

    /* who gets on with whom, worked out once for the whole bed */
    const flags = Canvas.flags(bed.id);
    const detail = clamp(1.25 - ps.length * 0.02, 0.4, 1.2);

    h += '<g class="plants">';
    ps.forEach((p, i) => {
      const px = Geom.PX(p), py = Geom.PY(p), rc = Geom.RC(p), rr = Geom.RR(p);
      const g = PlantArt.growth(p, when);
      const grown = Math.max(0.18, PlantArt.sizeAt(g));
      const over = ps.slice(0, i).some(q => Geom.dist(p, q) < rc + Geom.RC(q) - 0.5);
      const marked = typeof Sel !== "undefined" && Sel.has(p.id);
      const sel = Garden.sel === p.id && !marked;
      const f = flags[p.id] || {};

      h += '<g class="pl' + (sel ? " sel" : "") + (marked ? " marked" : "") + (over ? " ghosted" : "") +
           '" data-pid="' + p.id +
           '" transform="translate(' + (Math.round(px*10)/10) + ' ' + (Math.round(py*10)/10) + ')">';

      if(marked)
        h += '<circle class="markring" r="' + (Math.round(rc * grown * 1.06 * 10) / 10) +
             '" fill="none" stroke="#f0a500" stroke-width="' +
             (Math.round(Math.max(0.4, Math.min(Geom.W(bed), Geom.H(bed)) * 0.006) * 100) / 100) + '"/>';

      if(Canvas.showCanopy && g >= 0)
        h += '<circle class="canring" r="' + (Math.round(rc * grown * 10) / 10) +
             '" fill="' + (f.bad ? "#c9453c" : f.good ? "#2a8c5e" : "#4a7a52") +
             '" fill-opacity="' + (f.bad ? 0.20 : 0.16) + '" stroke="' +
             (f.bad ? "#c9453c" : f.good ? "#2a8c5e" : "#ffffff") + '" stroke-opacity="' +
             (f.bad || f.good ? 0.55 : 0.28) + '" stroke-width="0.35" stroke-dasharray="1.6 1.2"/>';

      if(Canvas.showRoots || sel)
        h += '<circle r="' + (Math.round(rr*10)/10) + '" fill="none" stroke="' +
             (f.crowded ? "#d98324" : "#f7f3ea") + '" stroke-opacity="0.7" stroke-width="0.32"/>';

      h += '<g class="art" transform="scale(' + Canvas.iconR(bed, rc, grown, rr) + ')">' +
           PlantArt.svg(p, { growth: g }) + '</g>';

      if(num(p.qty, 1) > 1 && rc >= 4)
        h += '<text x="0" y="' + (Math.round((rc * grown + 2.4) * 10) / 10) +
             '" text-anchor="middle" font-size="' + (Math.max(2.2, rc * 0.34)) +
             '" fill="#fff" fill-opacity="0.82" font-weight="700">×' + num(p.qty, 1) + '</text>';

      if(f.bad || f.good){
        const bs = Canvas.badgeR(bed, rc, f.bad);
        /* outboard of the canopy, so it sits beside the plant rather than on it */
        const bo = Math.round((rc * grown + bs * 0.9) * 0.7071 * 10) / 10;
        h += '<g class="cbadge" transform="translate(' + bo + ' ' + (-bo) + ')">' +
          '<circle r="' + bs + '" fill="' + (f.bad ? "#c9453c" : "#2a8c5e") +
          '" stroke="#fff" stroke-opacity="0.55" stroke-width="' + (Math.round(bs*0.18*100)/100) + '"/>' +
          '<text y="' + (Math.round(bs * 0.38 * 100) / 100) + '" text-anchor="middle" font-size="' +
          (Math.round(bs * 1.15 * 100) / 100) + '" fill="#fff">' + (f.bad ? "!" : "♥") + '</text></g>';
      }

      if(sel && inter){
        /* A constant size on screen, at every plant size and every zoom, with
           an invisible hit circle behind each — zoom is the real cure for a
           small target, this is the belt. */
        const gx = Canvas.gripAt(bed, rc);
        const br = Canvas.gripR(bed);
        const tap = Canvas.gripTap(bed);
        h += '<circle class="hitpad" data-grip="' + p.id + '" cx="' + gx + '" cy="' + gx +
             '" r="' + tap + '" fill="transparent"/>' +
             '<circle class="grip" data-grip="' + p.id + '" cx="' + gx + '" cy="' + gx +
             '" r="' + br + '" fill="#fff" stroke="#2a8c5e" stroke-width="' +
             (Math.round(br*0.22*100)/100) + '"/>';
        /* …and its twin bottom-left: everything about this plant — variety,
           how many, which packet, dates, notes. */
        h += '<circle class="hitpad" data-menu="' + p.id + '" cx="' + (-gx) + '" cy="' + gx +
             '" r="' + tap + '" fill="transparent"/>' +
             '<g class="pmenu" data-menu="' + p.id + '" transform="translate(' + (-gx) + ' ' + gx + ')">' +
             '<circle r="' + br + '" fill="#fff" stroke="#2a8c5e" stroke-width="' +
             (Math.round(br*0.22*100)/100) + '"/>' +
             '<text y="' + (Math.round(br*0.34*100)/100) + '" text-anchor="middle" font-size="' +
             (Math.round(br*1.25*100)/100) + '" fill="#2a8c5e" font-weight="700">⋯</text></g>';
      }
      h += '</g>';
    });
    h += '</g>';

    if(Canvas.wantLabels(bed)){
      h += '<g class="labels" pointer-events="none">';
      ps.forEach(p => {
        const rc = Geom.RC(p), rr = Geom.RR(p);
        const fs = clamp(Math.min(W, H) * 0.045, 2.1, 4.2) *
          (inter && typeof Zoom !== "undefined" ? Zoom.textScale() : 1);
        const grown = Math.max(0.18, PlantArt.sizeAt(PlantArt.growth(p, when)));
        const below = Math.max(rc * grown, Canvas.iconR(bed, rc, grown, rr) * PlantArt.R * 1.15);
        h += '<text x="' + (Math.round(Geom.PX(p)*10)/10) + '" y="' +
          (Math.round((Geom.PY(p) + below + fs * 1.5) * 10) / 10) +
          '" text-anchor="middle" font-size="' + (Math.round(fs*10)/10) +
          '" font-weight="700" fill="#fff" fill-opacity="0.92" stroke="#2b2118" stroke-width="' +
          (fs*0.24) + '" paint-order="stroke">' + esc(Canvas.label(p)) + '</text>';
      });
      h += '</g>';
    }

    h += '<g id="cvlive"></g>';        /* live drag feedback draws in here */
    h += '</svg>';
    return h;
  },

  /* The variety is the useful label once the icon has said what the crop is.
     "Mountain Fresh" tells you something "Tomato" does not, when the icon is
     already a tomato. */
  label(p){
    const v = String(p.variety || "").trim();
    return v || cropName(p.crop_id);
  },

  /* ---------- who is next to whom ---------- */
  flags(bedId){
    const ps = Geom.live(bedId), out = {};
    for(let i = 0; i < ps.length; i++) for(let j = i + 1; j < ps.length; j++){
      const a = ps[i], b = ps[j];
      if(a.crop_id === b.crop_id) continue;
      const rel = Geom.relation(a, b);
      if(!rel.near) continue;
      const r = pairRating(a.crop_id, b.crop_id);
      if(r.score <= -2){ (out[a.id] = out[a.id] || {}).bad = 1; (out[b.id] = out[b.id] || {}).bad = 1; }
      else if(r.score >= 1){ (out[a.id] = out[a.id] || {}).good = 1; (out[b.id] = out[b.id] || {}).good = 1; }
    }
    /* crowding is about roots, and is nobody's fault but the spacing */
    for(let i = 0; i < ps.length; i++) for(let j = i + 1; j < ps.length; j++){
      if(Geom.relation(ps[i], ps[j]).rootsClash){
        (out[ps[i].id] = out[ps[i].id] || {}).crowded = 1;
        (out[ps[j].id] = out[ps[j].id] || {}).crowded = 1;
      }
    }
    return out;
  },

  /* ---------- screen to garden ---------- */
  toIn(svgEl, clientX, clientY){
    const r = svgEl.getBoundingClientRect();
    const vb = (svgEl.getAttribute("viewBox") || "0 0 100 100").split(/\s+/).map(Number);
    if(!r.width || !r.height) return { x: 0, y: 0 };
    return { x: vb[0] + (clientX - r.left) / r.width * vb[2],
             y: vb[1] + (clientY - r.top) / r.height * vb[3] };
  }
};

/* ============================================================
   PLACING — free, anywhere the outline allows
   ============================================================ */
Object.assign(Garden, {
  tl: 0,                 /* timeline offset in weeks */
  clip: null,            /* a copied planting waiting to be placed */
  sel: null,
  clearClip(){ Garden.clip = null; Garden.render(); },

  placeAt(bed, px, py, cropId, opts){
    const o = opts || {};
    bed = Geom.bed(bed);
    const mode = o.mode || "fill";
    let qty = o.qty !== undefined ? Math.max(1, num(o.qty, 1))
      : (mode === "single" ? 1
        : (o.w || o.h) ? Garden.fitPlants(cropId, bed, num(o.w, 1), num(o.h, 1))
        : Garden.fitPlants(cropId, bed, 1, 1));
    let rr = o.rr !== undefined ? num(o.rr) : Geom.rootR(cropId, qty);
    let rc = o.rc !== undefined ? num(o.rc) : Geom.canopyR(cropId, qty);
    /* a sprawl she recorded before is better evidence than the catalogue */
    if(!o.rc && mode === "single"){
      const obs = Garden.observedSpread(cropId);
      if(obs && obs.r) rc = Math.max(rc, obs.r);
    }
    if(num(bed.snap_in) > 0){
      px = Geom.snap(px, num(bed.snap_in));
      py = Geom.snap(py, num(bed.snap_in));
    }
    const fit = Geom.clampInto(bed, px, py, Math.min(rr, 2));
    const p = DB.insert("plantings", {
      bed_id: bed.id, crop_id: cropId, qty: qty, status:"planned", sown_on: iso(today()),
      span_mode: mode,
      px: Math.round(fit.x * 10) / 10, py: Math.round(fit.y * 10) / 10,
      rr: Math.round(rr * 10) / 10, rc: Math.round(Math.max(rr, rc) * 10) / 10,
      rot: Math.round(Math.random() * 40 - 20), sv: Math.floor(Math.random() * 100000),
      x: Math.floor(fit.x / Garden.cell(bed)), y: Math.floor(fit.y / Garden.cell(bed)),
      w: 1, h: 1
    });
    if(!o.silent) toast(cropName(cropId) + " planted");
    if(!o.noUndo) Undo.push("place", "Planted " + cropName(cropId), [{ id: p.id, created: true }]);
    Cal.forPlanting(p);
    return p;
  },

  /* the old signature still works — the assistant and the tests speak in squares */
  place(bed, x, y, cropId, silent, opts){
    const o = opts || {};
    const c = Garden.cell(bed);
    const w = num(o.w, 1), h = num(o.h, 1);
    return Garden.placeAt(bed, (num(x, 0) + w / 2) * c, (num(y, 0) + h / 2) * c, cropId,
      Object.assign({}, o, { silent: silent }));
  },

  /* what this crop has actually done in this garden, as a radius */
  observedSpread(cropId){
    const list = DB.where("plantings", p => p.crop_id === cropId && p.span_mode === "single")
      .map(Geom.plant).filter(p => Geom.RC(p) > Geom.canopyR(cropId, 1) * 1.15);
    if(!list.length) return null;
    let best = list[0];
    list.forEach(p => { if(Geom.RC(p) > Geom.RC(best)) best = p; });
    const r = Geom.RC(best);
    return { r: r, n: list.length, across: Math.round(r * 2),
             sqft: Math.round(Math.PI * r * r / 144 * 10) / 10,
             when: best.sown_on || String(best.created || "").slice(0, 10) };
  },

  /* ---------- resizing ---------- */
  setRadius(id, rc, rr){
    const p = Geom.plant(DB.find("plantings", id)); if(!p) return;
    const bed = Geom.bed(DB.find("beds", p.bed_id));
    const maxR = Math.max(Geom.W(bed), Geom.H(bed)) * 0.7;
    const nrc = clamp(num(rc, Geom.RC(p)), 1.5, maxR);
    const nrr = clamp(rr === undefined ? Geom.RR(p) : num(rr), 1, nrc);
    DB.update("plantings", id, { rr: Math.round(nrr*10)/10, rc: Math.round(nrc*10)/10 });
  },
  /* keep the plant count honest when the footprint changes */
  syncQty(id){
    const p = Geom.plant(DB.find("plantings", id)); if(!p) return;
    if(p.span_mode === "single"){ DB.update("plantings", id, { qty: 1 }); return; }
    DB.update("plantings", id, { qty: Geom.fitsIn(p.crop_id, Geom.RR(p)) });
  },
  setMode(id, mode){
    DB.update("plantings", id, { span_mode: mode });
    Garden.syncQty(id);
    const p = DB.find("plantings", id);
    if(mode === "fill") Garden.setRadius(id, Geom.canopyR(p.crop_id, p.qty), Geom.rootR(p.crop_id, p.qty));
    Garden.plantingSheet(DB.find("plantings", id));
    Garden.render();
  },
  setQty(id, q){
    const p = Geom.plant(DB.find("plantings", id)); if(!p) return;
    const qty = Math.max(1, Math.round(num(q, 1)));
    DB.update("plantings", id, { qty: qty });
    if(p.span_mode !== "single")
      Garden.setRadius(id, Geom.canopyR(p.crop_id, qty), Geom.rootR(p.crop_id, qty));
  },

  /* the steppers still work; they just move inches now */
  resizeBy(id, dw, dh){
    const p = Geom.plant(DB.find("plantings", id)); if(!p) return;
    const step = (num(dw, 0) + num(dh, 0)) * Garden.cell(DB.find("beds", p.bed_id)) / 2;
    Garden.setRadius(id, Geom.RC(p) + step);
    Garden.plantingSheet(DB.find("plantings", id));
    Garden.render();
  },

  /* A removal is a soft delete — status goes to "removed" and the row stays —
     so putting one back is a matter of clearing two fields. That is what makes
     undo honest here rather than a re-creation that quietly loses the variety,
     the packet it came from and the date it went in. */
  removePlanting(id, silent, noUndo){
    const p = DB.find("plantings", id); if(!p) return;
    if(!noUndo) Undo.push("remove", "Removed " + cropName(p.crop_id),
      [{ id: id, status: p.status || "planned", removed_on: p.removed_on || null }]);
    DB.update("plantings", id, { status:"removed", removed_on: iso(today()) });
    DB.bulkRemove("events", e => e.planting_id === id && e.done !== "1");
    if(Garden.sel === id) Garden.sel = null;
    if(!silent){ closeSheet(); Garden.render(); toast("Removed", 3200); }
  },

  /* ---------- taps ---------- */
  tapAt(px, py){
    haptic();
    const bed = Geom.bed(DB.find("beds", APP.bedId)); if(!bed) return;
    const ex = Garden.hit(bed.id, px, py);

    if(typeof Sel !== "undefined" && Sel.on){ if(ex) Sel.toggle(ex.id); return; }
    if(Garden.clip){ if(!ex) Garden.pasteAt(px, py); else toast("Something is already there"); return; }
    if(Garden.erase){ if(ex){ Garden.removePlanting(ex.id, true); Garden.render(); } return; }
    if(Garden.paint){ Garden.placeAt(bed, px, py, Garden.paint, { silent:true }); Garden.render(); return; }
    if(ex){
      /* Tapping a plant used to TOGGLE selection, and the details sheet only
         opened on the tap that selected. A freshly placed plant is already
         selected, so the very next tap deselected it and nothing opened —
         which is why the variety picker looked as though it had been removed.
         A tap on a plant always opens that plant. Bare soil deselects. */
      Garden.sel = ex.id;
      Garden.render();
      Garden.plantingSheet(ex);
      return;
    }
    Garden.sel = null;
    Garden.pickCropAt(px, py);
  },
  /* squares still map onto the canvas, for the assistant and old callers */
  tapCell(x, y){
    const bed = Geom.bed(DB.find("beds", APP.bedId)); if(!bed) return;
    const c = Garden.cell(bed);
    Garden.tapAt((x + 0.5) * c, (y + 0.5) * c);
  },

  pickCropAt(px, py){
    const bed = Geom.bed(DB.find("beds", APP.bedId));
    Garden.cropPicker("Plant here", id => {
      closeSheet();
      const obs = Garden.observedSpread(id);
      const p = Garden.placeAt(bed, px, py, id, obs ? { mode:"single", qty:1, rc: obs.r, silent:true } : { silent:true });
      Garden.sel = p.id;
      Garden.render();
      if(obs) toast("Sized to the " + obs.across + '" spread you recorded before');
      setTimeout(() => Garden.plantingSheet(DB.find("plantings", p.id)), 250);
    }, bed);
  },
  pickCrop(x, y){
    const bed = Geom.bed(DB.find("beds", APP.bedId));
    const c = Garden.cell(bed);
    Garden.pickCropAt((num(x,0) + 0.5) * c, (num(y,0) + 0.5) * c);
  },

  pasteAt(px, py){
    const c = Garden.clip; if(!c) return;
    const bed = Geom.bed(DB.find("beds", APP.bedId)); if(!bed) return;
    const p = Garden.placeAt(bed, px, py, c.crop_id, {
      mode: c.span_mode, qty: c.qty, rr: c.rr, rc: c.rc, silent: true });
    DB.update("plantings", p.id, { variety: c.variety, variety_id: c.variety_id,
      seed_id: c.seed_id, notes: c.notes, status: c.status, sown_on: c.sown_on });
    haptic(); Garden.render();
    toast(cropName(c.crop_id) + " added");
  },
  copyPlanting(id){
    const p = Geom.plant(DB.find("plantings", id)); if(!p) return;
    Garden.clip = {
      crop_id: p.crop_id, variety: p.variety || null, variety_id: p.variety_id || null,
      rr: Geom.RR(p), rc: Geom.RC(p), span_mode: p.span_mode || "fill",
      qty: num(p.qty, 1), seed_id: p.seed_id || null, notes: p.notes || null,
      status: p.status || "planned", sown_on: p.sown_on || iso(today())
    };
    Garden.paint = null; Garden.erase = false; Garden.sel = null;
    closeSheet(); Garden.render();
    toast("Copied " + cropName(p.crop_id) + " — tap the bed to place more");
  },

  /* somewhere with room, searching outward from a point */
  freeSpot(bed, w, h, fromX, fromY){
    bed = Geom.bed(bed);
    const c = Garden.cell(bed);
    const r = Math.max(num(w, 1), num(h, 1)) * c / 2;
    const sx = fromX === undefined ? Geom.W(bed)/2 : (num(fromX) + 0.5) * c;
    const sy = fromY === undefined ? Geom.H(bed)/2 : (num(fromY) + 0.5) * c;
    const spot = Garden.openSpot(bed, r, sx, sy);
    return spot ? { x: Math.floor(spot.x / c), y: Math.floor(spot.y / c), px: spot.x, py: spot.y } : null;
  },
  openSpot(bed, radius, nearX, nearY, ignoreId){
    bed = Geom.bed(bed);
    const W = Geom.W(bed), H = Geom.H(bed);
    const nx = nearX === undefined ? W/2 : nearX, ny = nearY === undefined ? H/2 : nearY;
    const step = Math.max(2, Math.min(W, H) / 22);
    let best = null, bd = Infinity;
    for(let y = step/2; y < H; y += step) for(let x = step/2; x < W; x += step){
      if(!Geom.inside(bed, x, y, Math.min(radius, 2))) continue;
      const clash = Geom.live(bed.id).some(p => p.id !== ignoreId &&
        Math.hypot(Geom.PX(p) - x, Geom.PY(p) - y) < Geom.RR(p) + radius - 0.5);
      if(clash) continue;
      const d = Math.hypot(x - nx, y - ny);
      if(d < bd){ bd = d; best = { x: x, y: y }; }
    }
    return best;
  },
  duplicate(id){
    const p = Geom.plant(DB.find("plantings", id)); if(!p) return;
    const bed = Geom.bed(DB.find("beds", p.bed_id));
    const spot = Garden.openSpot(bed, Geom.RR(p), Geom.PX(p) + Geom.RC(p) * 2, Geom.PY(p));
    if(!spot) return toast("No free ground that size in this bed");
    const copy = DB.insert("plantings", {
      bed_id: bed.id, crop_id: p.crop_id, variety: p.variety, variety_id: p.variety_id,
      seed_id: p.seed_id, qty: p.qty, status: p.status, sown_on: p.sown_on, notes: p.notes,
      span_mode: p.span_mode, px: Math.round(spot.x*10)/10, py: Math.round(spot.y*10)/10,
      rr: Geom.RR(p), rc: Geom.RC(p),
      rot: Math.round(Math.random()*40 - 20), sv: Math.floor(Math.random()*100000),
      x: Math.floor(spot.x / Garden.cell(bed)), y: Math.floor(spot.y / Garden.cell(bed)), w:1, h:1
    });
    Cal.forPlanting(copy);
    Garden.sel = copy.id; closeSheet(); Garden.render();
    toast("Duplicated alongside");
  },

  /* the bed list preview is the same canvas, small and inert */
  miniGrid(b){
    return '<div class="canvaswrap" style="padding:5px;border-radius:14px;margin-top:8px">' +
      Canvas.svg(b, { interactive:false, pad: 3 }) + '</div>';
  }
});

/* ============================================================
   COMPANIONS ON A CANVAS
   Distance is now inches between centres, and "next to" means the
   canopies actually meet — which is what the gardening advice was
   always about, rather than how many squares apart two icons sat.
   ============================================================ */
function nearPairs(bedId, test){
  const ps = Geom.live(bedId), out = [];
  for(let i = 0; i < ps.length; i++) for(let j = i + 1; j < ps.length; j++){
    const a = ps[i], b = ps[j];
    if(a.crop_id === b.crop_id) continue;
    const rel = Geom.relation(a, b);
    if(!rel.near) continue;
    const r = pairRating(a.crop_id, b.crop_id);
    if(!test(r)) continue;
    out.push({ a: a, b: b, why: r.why, score: r.score, dist: rel.d, rel: rel });
  }
  return out;
}
Recommend.conflicts = bedId => nearPairs(bedId, r => r.score <= -2).sort((x, y) => x.dist - y.dist);
Recommend.friends   = bedId => nearPairs(bedId, r => r.score >= 1).sort((x, y) => y.score - x.score);

/* root zones that overlap — a spacing problem, not a companion one */
Recommend.crowding = function(bedId){
  const ps = Geom.live(bedId), out = [];
  for(let i = 0; i < ps.length; i++) for(let j = i + 1; j < ps.length; j++){
    const rel = Geom.relation(ps[i], ps[j]);
    if(rel.rootsClash) out.push({ a: ps[i], b: ps[j], overlap: Math.round(-rel.gap * 10) / 10 });
  }
  return out.sort((a, b) => b.overlap - a.overlap);
};

/* who is standing in whose light, at the date being previewed */
Recommend.shading = function(bedId, when){
  const ps = Geom.live(bedId), out = [];
  ps.forEach(tall => {
    if(!Geom.isTall(tall.crop_id)) return;
    if(PlantArt.growth(tall, when) < 0.35) return;
    ps.forEach(low => {
      if(low.id === tall.id || Geom.isTall(low.crop_id)) return;
      const d = Geom.dist(tall, low);
      if(d > Geom.RC(tall) + Geom.RC(low)) return;
      /* Shade under a tall crop is only a problem if the plant underneath
         cannot take it. Two things say it can: its own sun figure in the crop
         table, and the companion data — tomato over basil is the oldest
         recommendation in the book, and flagging it as a shading fault would
         have the app arguing with itself. */
      const r = pairRating(tall.crop_id, low.crop_id);
      const north = Geom.PY(low) < Geom.PY(tall);
      out.push({ tall: tall, low: low, dist: Math.round(d*10)/10,
                 ok: Geom.shadeOk(low.crop_id) || r.score >= 1,
                 companion: r.score >= 1, north: north });
    });
  });
  return out;
};
</script>

<script>
/* ============================================================

Object.assign(Garden, {

  bedView(){

      sqft + ' sq ft · ' + esc(bed.sun_hours || "?") + 'h sun</div></div>' +
      '<button class="iconbtn" onclick="Garden.bedMenu()">⋯</button></div>';

    /* ---- toolbar ---- */
    h += '<div class="cvbar">';

      h += '<span class="chip on">' + cropEmoji(Garden.paint) + ' Tap to plant ' + esc(cropName(Garden.paint)) + '</span>' +
           '<button class="chip" onclick="Garden.paint=null;Garden.render()">Done</button>';
    } else if(Garden.erase){
      h += '<span class="chip bad">🧹 Tap a plant to remove it</span>' +
           '<button class="chip" onclick="Garden.erase=false;Garden.render()">Done</button>';

         '<button class="chip' + (Canvas.wantLabels(bed) ? " on" : "") + '" onclick="Garden.toggleLabels()">🏷️ Names</button>' +
         '<button class="chip' + (Sel.on ? " on" : "") + '" onclick="Sel.on?Sel.stop():Sel.start()">☑︎ Select</button>' +
         Zoom.chip() + Undo.chip();
    h += '</div>';
    h += Sel.bar();

    /* ---- the canvas ---- */
    h += '<div class="canvaswrap" id="cvhost" style="margin-top:10px">' +

    h += '<div class="tiny muted center" style="margin-top:6px">' +
      (Sel.on
        ? 'Tap plants to gather them up, then press and hold any of them to move the group.'

    h += '<div class="tlwrap"><div class="tlhead">' +
      '<div class="b" id="tl-date">' + (num(Garden.tl) === 0 ? "Today" : fmtY(when)) + '</div>' +
      '<div class="tiny muted" id="tl-note">' + esc(Garden.tlNote(bed, when)) + '</div></div>' +

      '" oninput="Garden.scrub(this.value)">' +
      '<div class="row between tiny muted"><span>6 weeks back</span>' +

    /* ---- what the plan is telling her ---- */

      h += '<div class="sec"><h2>Too close together</h2><span class="tiny muted">' + crowd.length + '</span></div><div class="card">';

        cropEmoji(c.a.crop_id) + ' <b>' + esc(cropName(c.a.crop_id)) + '</b> and ' +
        cropEmoji(c.b.crop_id) + ' <b>' + esc(cropName(c.b.crop_id)) + '</b> overlap at the root by ' +

      h += '</div>';
    }
    if(shade.length){

      h += '<div class="sec"><h2>Light and shade</h2></div><div class="card">';
      bad.slice(0, 3).forEach(s => h += '<div class="note d" style="margin-bottom:8px">🌑 ' +
        cropEmoji(s.tall.crop_id) + ' <b>' + esc(cropName(s.tall.crop_id)) + '</b> reaches about ' +
        Geom.height(s.tall.crop_id) + '" and will stand over ' + cropEmoji(s.low.crop_id) + ' <b>' +
        esc(cropName(s.low.crop_id)) + '</b>, which wants ' + crop(s.low.crop_id).sun +
        'h of sun' + (s.side ? ' and sits to the ' + esc(s.side) + ' of it' : '') +
        '. Move it to the sunny side, or swap in something that tolerates shade.</div>');
      const seenGuild = {};
      good.slice(0, 4).forEach(s => {
        const k = s.tall.crop_id + "|" + s.low.crop_id;
        if(seenGuild[k]) return; seenGuild[k] = 1;
        h += '<div class="note g" style="margin-bottom:8px">🌿 <b>Understorey.</b> ' +
        cropEmoji(s.low.crop_id) + ' ' + esc(cropName(s.low.crop_id)) + ' under ' +
        cropEmoji(s.tall.crop_id) + ' ' + esc(cropName(s.tall.crop_id)) + ' is a real guild — ' +
        (s.companion
          ? 'these two are recommended together, and the shade is part of why.'
          : 'it takes the shade, keeps the soil covered, and crops before the tall one closes over.') + '</div>';
      });
      h += '</div>';
    }
    if(friends.length){
      h += '<div class="sec"><h2>Good neighbours</h2></div><div class="card">';
      const seen = {};
      friends.slice(0, 6).forEach(f => {
        const key = [f.a.crop_id, f.b.crop_id].sort().join("|");
        if(seen[key]) return; seen[key] = 1;
        h += '<div class="note g" style="margin-bottom:8px">💚 ' + cropEmoji(f.a.crop_id) + ' <b>' + esc(cropName(f.a.crop_id)) +
          '</b> beside ' + cropEmoji(f.b.crop_id) + ' <b>' + esc(cropName(f.b.crop_id)) + '</b> · ' + f.dist +
          '" apart<br>' + esc(f.why) + '</div>';
      });
      h += '</div>';
    }
    if(conflicts.length){
      h += '<div class="sec"><h2>Companion warnings</h2></div><div class="card">';
      conflicts.slice(0, 5).forEach(c => h += '<div class="note d" style="margin-bottom:8px">⚠️ ' +
        cropEmoji(c.a.crop_id) + ' <b>' + esc(cropName(c.a.crop_id)) + '</b> ' + c.dist + '" from ' +
        cropEmoji(c.b.crop_id) + ' <b>' + esc(cropName(c.b.crop_id)) + '</b><br>' + esc(c.why) + '</div>');
      h += '</div>';
    }

    /* ---- growing here ---- */
    h += '<div class="sec"><h2>Growing here</h2><span class="tiny muted">' + ps.length +
      ' plant' + (ps.length === 1 ? "" : "s") + '</span></div>';
    if(!ps.length) h += '<div class="card center muted sm">Bare soil. Tap the bed to plant something.</div>';
    else {
      const byCrop = {};
      ps.forEach(p => { (byCrop[p.crop_id] = byCrop[p.crop_id] || []).push(p); });
      h += '<div class="card pad0"><div class="list">';
      Object.keys(byCrop).forEach(id => {
        const arr = byCrop[id], c = crop(id);
        const qty = arr.reduce((a, p) => a + num(p.qty, 1), 0);
        const g = PlantArt.growth(arr[0], when);
        const st = PlantArt.stage(g);
        const sunOk = !c || Micro.sunHours(bed.id) >= c.sun;
        h += '<button class="item" onclick="Library.open(\'' + id + '\')"><div class="av">' + cropEmoji(id) + '</div>' +

          '<div class="tiny muted">' + esc({ unsown:"not sown by this date", seedling:"just up", young:"young",

          (!sunOk ? '<div class="tiny" style="color:var(--warn)">Wants ' + c.sun + 'h sun, this bed gets ' +

      if(heavy.length) h += '<div class="note w" style="margin-top:10px">🌿 Heavy feeders here (' +

      h += WaterGroups.html(bed.id);

    }

    /* ---- what else belongs in this bed ---- */
    h += BedRecs.html(bed);

    const fams = Recommend.recentFamilies(bed.id);
    if(Object.keys(fams).length){

      Object.keys(fams).forEach(f => h += '<span class="chip"><span class="swatch" style="background:' +

      h += '</div><div class="tiny muted" style="margin-top:8px">Aim for a 3-year gap before the same family returns to a bed.</div></div>';
    }

    box.innerHTML = h;

  tlNote(bed, when){
    const ps = Geom.live(bed.id);
    if(!ps.length) return "nothing planted";
    if(num(Garden.tl) === 0) return ps.length + " plants, as they are now";
    const gs = ps.map(p => PlantArt.growth(p, when));
    const up = gs.filter(g => g >= 0).length;
    const done = gs.filter(g => g >= 1).length;
    return up + " up" + (done ? ", " + done + " cropping" : "") +
      (up < ps.length ? ", " + (ps.length - up) + " not sown yet" : "");
  },

  /* redraw only the canvas — a scrubber has to feel immediate */
  scrub(v){
    Garden.tl = clamp(Math.round(num(v, 0)), -6, 34);

    const d = $("#tl-date"); if(d) d.textContent = num(Garden.tl) === 0 ? "Today" : fmtY(when);
    const n = $("#tl-note"); if(n) n.textContent = Garden.tlNote(bed, when);
    const r = $("#tl-range"); if(r && num(r.value) !== Garden.tl) r.value = Garden.tl;
  },

  toggleGrid(){
    const bed = DB.find("beds", APP.bedId); if(!bed) return;
    const on = num(bed.grid_on) ? 0 : 1;
    DB.update("beds", bed.id, { grid_on: on, snap_in: on ? num(bed.cell_in, 12) : 0 });
    Garden.render();

  },
  toggleLabels(){
    const bed = Geom.bed(DB.find("beds", APP.bedId));
    Canvas.labels = !Canvas.wantLabels(bed);
    Garden.render();
  },

  back(){
    APP.bedId = null; Garden.sel = null; Garden.tl = 0;
    if(typeof Sel !== "undefined"){ Sel.on = false; Sel.ids = {}; }
    Garden.render();
  }
});

/* ============================================================
   THE PLANTING SHEET — spacing in inches, and two ways to resize
   ============================================================ */
Garden.plantingSheet = function(p){
  if(!p) return;
  p = Geom.plant(p);
  const c = crop(p.crop_id), bed = Geom.bed(DB.find("beds", p.bed_id));
  if(!bed) return;
  const rr = Geom.RR(p), rc = Geom.RC(p);
  const single = p.span_mode === "single";
  const seeds = DB.where("seeds", s => s.crop_id === p.crop_id);
  const holds = Geom.fitsIn(p.crop_id, rr);
  const sn = Garden.seedsNeeded(p.crop_id, num(p.qty, 1), p.seed_id);
  const obs = Garden.observedSpread(p.crop_id);
  const when = Canvas.date();
  const g = PlantArt.growth(p, when);

  let h = '<div class="row" style="gap:12px;margin-bottom:12px"><div style="font-size:2.4rem">' + cropEmoji(p.crop_id) + '</div>' +
    '<div class="grow"><div class="b" style="font-size:1.1rem">' + esc(cropName(p.crop_id)) + '</div>' +
    '<div class="tiny muted">' + Math.round(Geom.PX(p)) + '", ' + Math.round(Geom.PY(p)) + '" into ' + esc(bed.name) +
    ' · ' + esc(PlantArt.stage(g)) + ' on ' + fmt(when) + '</div></div></div>';

  /* ---- footprint ---- */
  h += '<div class="card"><div class="tiny b muted" style="text-transform:uppercase;letter-spacing:.06em;margin-bottom:8px">Footprint</div>';
  h += '<div class="field"><label class="f">Root zone — keep this clear · <b id="rr-v">' + rr + '"</b> radius</label>' +
    '<input type="range" id="pl-rr" min="1" max="' + Math.max(24, Math.ceil(rc)) + '" step="0.5" value="' + rr +
    '" oninput="Garden.liveRadius(\'' + p.id + '\',null,this.value)"></div>';
  h += '<div class="field" style="margin-top:8px"><label class="f">Mature canopy · <b id="rc-v">' + rc + '"</b> radius, ' +
    Math.round(rc*2) + '" across</label>' +
    '<input type="range" id="pl-rc" min="1.5" max="' + Math.max(36, Math.ceil(rc * 1.6)) + '" step="0.5" value="' + rc +
    '" oninput="Garden.liveRadius(\'' + p.id + '\',this.value,null)"></div>';
  h += '<div class="row between" style="margin-top:10px;gap:14px">' +
    '<div><div class="tiny muted">Nudge</div><div class="stepper">' +
      '<button onclick="Garden.resizeBy(\'' + p.id + '\',-1,0)">−</button><span class="v">' + Math.round(rc*2) + '"</span>' +
      '<button onclick="Garden.resizeBy(\'' + p.id + '\',1,0)">＋</button></div></div>' +
    '<div class="grow" style="text-align:right"><div class="tiny muted">' +
      (Math.round(Math.PI * rc * rc / 144 * 10) / 10) + ' sq ft of canopy</div>' +
      '<div class="tiny muted">' + (c ? c.sp + '" recommended spacing' : '') + '</div></div></div>';
  h += '<div class="tiny muted" style="margin-top:8px">You can also drag the white handle on the selected plant to resize it right on the bed.</div></div>';

  /* ---- one plant or a clump ---- */
  h += '<div class="card" style="margin-top:12px"><div class="tiny b muted" style="text-transform:uppercase;letter-spacing:.06em;margin-bottom:8px">What is planted here</div>' +
    '<div class="seg">' +
    '<button class="' + (single ? "on" : "") + '" onclick="Garden.setMode(\'' + p.id + '\',\'single\')">One plant</button>' +
    '<button class="' + (!single ? "on" : "") + '" onclick="Garden.setMode(\'' + p.id + '\',\'fill\')">A clump</button>' +
    '</div>';
  h += single
    ? '<div class="note i" style="margin-top:10px">A single ' + esc(cropName(p.crop_id)) + ' spreading ' +
      Math.round(rc*2) + '" across. Record what it really did and the app offers that much room next season.</div>'
    : '<div class="note g" style="margin-top:10px">At ' + esc(c ? c.sp + '"' : 'normal') + ' spacing, a ' +
      Math.round(rr*2) + '" patch holds about <b>' + holds + ' plant' + (holds === 1 ? "" : "s") + '</b>.</div>';
  h += '<div class="field" style="margin-top:12px"><label class="f">Plants here</label>' +
    '<input type="number" id="pl-qty" min="1" value="' + esc(p.qty || 1) + '"></div>';

  const vv = p.variety ? Varieties.find(p.crop_id, p.variety) : null;
  h += '<div class="field"><label class="f">Variety</label>' +
    '<button class="item" style="border:1px solid var(--line);border-radius:12px;width:100%" onclick="Garden.pickVariety(\'' + p.id + '\')">' +
      '<div class="av">' + (p.variety ? "🏷️" : "＋") + '</div>' +
      '<div class="grow"><div class="b">' + (p.variety ? esc(p.variety) : "Choose a variety") + '</div>' +
      '<div class="tiny muted">' + (vv ? ((vv.dtm ? vv.dtm + " days · " : "") + esc(vv.habit || "")) :
        (p.variety ? "Tap to change" : "Pick from the list, or look one up")) + '</div></div>' +
      '<span class="go">›</span></button>' +
    '<input type="hidden" id="pl-var" value="' + esc(p.variety || "") + '"></div>';
  h += '</div>';

  /* ---- seeds ---- */
  h += '<div class="card" style="margin-top:12px"><div class="tiny b muted" style="text-transform:uppercase;letter-spacing:.06em;margin-bottom:8px">Seeds to sow</div>' +
    '<div class="row between"><div><div class="b" style="font-size:1.3rem">' + sn.seeds + ' seeds</div>' +
    '<div class="tiny muted">for ' + num(p.qty, 1) + ' plant' + (num(p.qty,1) === 1 ? "" : "s") +
    ' at ~' + sn.pct + '% germination, plus a little spare</div></div><div style="font-size:1.8rem">🌰</div></div>';
  if(seeds.length) h += '<div class="field" style="margin-top:10px"><label class="f">From packet</label><select id="pl-seed"><option value="">— none —</option>' +
    seeds.map(s => '<option value="' + s.id + '"' + (p.seed_id === s.id ? " selected" : "") + '>' +
      esc(s.name + (s.variety ? " · " + s.variety : "")) + '</option>').join("") + '</select></div>';
  else h += '<input type="hidden" id="pl-seed" value="">';
  h += '</div>';

  if(obs && obs.n) h += '<div class="note w" style="margin-top:12px">📐 <b>From your own garden.</b> You recorded ' +
    esc(cropName(p.crop_id)) + ' spreading about ' + obs.across + '" across (' + obs.sqft + ' sq ft)' +
    (obs.when ? ', ' + fmtY(obs.when) : '') + '. Worth allowing that much room again.</div>';

  /* ---- neighbours, by distance ---- */
  const others = Geom.live(bed.id).filter(x => x.id !== p.id);
  const near = others.map(o => ({ o: o, rel: Geom.relation(p, o), r: pairRating(p.crop_id, o.crop_id) }))
    .filter(x => x.rel.near)
    .sort((a, b) => a.rel.d - b.rel.d);
  if(near.length){
    h += '<div class="card" style="margin-top:12px"><div class="tiny b muted" style="text-transform:uppercase;letter-spacing:.06em;margin-bottom:8px">Neighbours</div>';
    near.slice(0, 6).forEach(x => {
      const k = x.r.score >= 1 ? "g" : x.r.score <= -2 ? "d" : "i";
      const icon = x.r.score >= 1 ? "💚" : x.r.score <= -2 ? "⚠️" : "·";
      h += '<div class="note ' + k + '" style="margin-bottom:6px">' + icon + ' ' + cropEmoji(x.o.crop_id) +
        ' <b>' + esc(cropName(x.o.crop_id)) + '</b> — ' + x.rel.d + '" away' +
        (x.rel.rootsClash ? ', roots overlapping' : x.rel.canopyTouch ? ', leaves will meet' : '') +
        (x.r.score !== 0 ? '<br>' + esc(x.r.why) : '') + '</div>';
    });
    h += '</div>';
  }

  /* ---- status, dates, maturity ---- */
  h += '<div class="grid2" style="margin-top:12px">' +
    '<div><label class="f">Status</label><select id="pl-status">' +
      ["planned","seeded","growing","harvesting","done"].map(s => '<option value="' + s + '"' + (p.status === s ? " selected" : "") + '>' + s + '</option>').join("") +
    '</select></div>' +
    '<div><label class="f">Sown / planted</label><input type="date" id="pl-sown" value="' + esc(p.sown_on || "") + '"></div></div>';
  h += '<div class="field"><label class="f">Notes</label><textarea id="pl-notes" placeholder="How big it actually got, flavour, what you would change">' + esc(p.notes || "") + '</textarea></div>';

  if(c){
    const mx = Maturity.expected(p.crop_id, p.variety);
    const rec = DB.where("maturity", m => m.planting_id === p.id)[0];
    const harv = p.sown_on ? Season.harvestFrom(p.crop_id, p.sown_on, "seed", p.variety) : null;
    h += '<div class="card" style="margin-top:12px"><div class="tiny b muted" style="text-transform:uppercase;letter-spacing:.06em;margin-bottom:8px">Days to maturity</div>';
    if(mx) h += '<div class="b" style="font-size:1.2rem">' + mx.lo + '–' + mx.hi + ' days</div>';
    if(harv) h += '<div class="note i" style="margin-top:8px">🗓️ First harvest around <b>' + fmtY(harv) + '</b>' +
      (Season.firstFrost() && harv > Season.firstFrost() ? '. That lands after your first frost.' : '.') + '</div>';
    h += '<button class="btn ' + (rec ? "ghost" : "") + ' block" style="margin-top:10px" onclick="Maturity.sheet(\'' + p.id + '\')">' +
      (rec ? '📈 First harvest recorded — ' + rec.days + ' days' : '📈 Record the first harvest') + '</button></div>';
  }

  h += '<div class="grid2" style="margin-top:16px">' +
    '<button class="btn ghost" onclick="Garden.duplicate(\'' + p.id + '\')">⧉ Duplicate</button>' +
    '<button class="btn ghost" onclick="Garden.copyPlanting(\'' + p.id + '\')">📋 Copy to place</button></div>';
  h += '<div class="row" style="gap:8px;margin-top:8px">' +
    '<button class="btn ghost" onclick="Garden.removePlanting(\'' + p.id + '\')">Remove</button>' +
    '<button class="btn grow" onclick="Garden.savePlanting(\'' + p.id + '\')">Save</button></div>';
  h += '<button class="btn ghost block" style="margin-top:8px" onclick="closeSheet();setTimeout(function(){Library.open(\'' + p.crop_id + '\')},250)">Full growing guide →</button>';
  h += '<button class="btn ghost block" style="margin-top:8px" onclick="closeSheet();setTimeout(function(){Journal.quick(\'harvest\',\'' + bed.id + '\',\'' + p.id + '\')},250)">🧺 Log a harvest from this plant</button>';

  openSheet("Planting", h);
};

/* sliders redraw the bed live rather than on release */
Garden.liveRadius = function(id, rc, rr){
  const p = Geom.plant(DB.find("plantings", id)); if(!p) return;
  Garden.setRadius(id, rc === null || rc === undefined ? Geom.RC(p) : num(rc),
                       rr === null || rr === undefined ? Geom.RR(p) : num(rr));
  const q = DB.find("plantings", id);
  const a = $("#rr-v"); if(a) a.textContent = Geom.RR(q) + '"';
  const b = $("#rc-v"); if(b) b.textContent = Geom.RC(q) + '"';
  const rrEl = $("#pl-rr"); if(rrEl) rrEl.value = Geom.RR(q);
  Garden.repaint();
};
/* repaint the canvas in place, without rebuilding the whole screen */
Garden.repaint = function(){
  const bed = APP.bedId && DB.find("beds", APP.bedId); if(!bed) return;
  const host = $("#cvhost"); if(!host) return;
  host.innerHTML = Canvas.svg(Geom.bed(bed), { interactive:true, when: Canvas.date() });
  CanvasDrag.bind();
};

Garden.savePlanting = function(id){
  const p = DB.find("plantings", id); if(!p) return;
  const qty = $("#pl-qty") ? Math.max(1, num($("#pl-qty").value, 1)) : num(p.qty, 1);
  DB.update("plantings", id, {
    variety: $("#pl-var") ? $("#pl-var").value.trim() : p.variety,
    qty: qty,
    status: $("#pl-status") ? $("#pl-status").value : p.status,
    sown_on: $("#pl-sown") ? $("#pl-sown").value : p.sown_on,
    seed_id: ($("#pl-seed") && $("#pl-seed").value) || null,
    notes: $("#pl-notes") ? $("#pl-notes").value.trim() : p.notes
  });
  Cal.forPlanting(DB.find("plantings", id));
  closeSheet(); Garden.render(); toast("Saved");
};

Garden.suggest = function(){
  const bed = Geom.bed(DB.find("beds", APP.bedId));
  const recs = Recommend.now({ bedId: bed.id }).slice(0, 12);
  let h = '<p class="muted sm" style="margin-top:0">Ranked for <b>' + esc(bed.name) + '</b> — ' +
    Micro.sunHours(bed.id) + 'h of sun, ' + Geom.areaSqFt(bed) + ' sq ft, what is already growing there, ' +
    'what grew there before, and what is in your seed bank.</p>';
  if(!recs.length) h += '<div class="note i">No sowing windows are open right now.</div>';
  recs.forEach(r => {
    h += '<div class="card" style="margin-bottom:10px"><div class="row" style="gap:10px">' +
      '<div style="font-size:1.8rem">' + r.crop.e + '</div><div class="grow">' +
      '<div class="b">' + esc(r.crop.n) + '</div><div class="tiny muted">' + esc(FAMILY[r.crop.fam].n) +
      ' · ' + r.crop.dtm + ' days · needs ' + r.crop.sp + '" of room</div></div>' +
      '<button class="btn sm" onclick="Garden.paint=\'' + r.crop.id + '\';closeSheet();Garden.render();toast(\'Tap the bed to plant\')">Plant</button></div>';
    r.why.slice(0, 3).forEach(x => h += '<div class="tiny" style="margin-top:5px">' + esc(x) + '</div>');
    r.warn.slice(0, 2).forEach(x => h += '<div class="tiny" style="margin-top:5px;color:var(--warn)">' + esc(x) + '</div>');
    h += '</div>';
  });
  openSheet("Suggestions for this bed", h);
};
</script>

<script>
/* ============================================================
   DRAGGING ON THE CANVAS

   Two gestures, both on the same SVG:

   · press and hold a plant to lift it and move it anywhere. Not a
     bare drag — on a phone a bare drag competes with scrolling and
     the browser wins.
   · drag the white handle on a selected plant to resize what it
     will grow into.

   The point of doing this live is the feedback. Companion advice
   that only appears after you have committed to a spot is advice
   you have to undo. While the plant is in your hand every
   neighbour it comes near lights up — a heart for a pairing worth
   having, a warning for one worth avoiding, an amber ring where
   two root zones have started to fight over the same water.
   ============================================================ */

const CanvasDrag = {
  magnet: true,
  active: null,
  /* set by whichever gesture is in flight so a second finger landing on the
     canvas (a pinch) can call it off rather than flinging the plant across
     the bed. Zoom is the only caller. */
  abort: null,

  bind(){
    const svg = $("#pcanvas"); if(!svg) return;
    if(svg._bound) return;
    svg._bound = true;
    svg.addEventListener("pointerdown", CanvasDrag.down);
    svg.addEventListener("contextmenu", e => e.preventDefault());
  },

  /* ---------- shared helpers ---------- */
  bed(){ return Geom.bed(DB.find("beds", APP.bedId)); },
  at(ev){ return Canvas.toIn($("#pcanvas"), ev.clientX, ev.clientY); },
  live(html){ const g = $("#cvlive"); if(g) g.innerHTML = html || ""; },

  down(ev){
    if(ev.button !== undefined && ev.button > 0) return;
    const svg = $("#pcanvas"); if(!svg) return;
    /* a second finger on the canvas is a pinch, not a drag */
    if(typeof Zoom !== "undefined" && Zoom.pinching()) return;

    /* the little ⋯ button on a selected plant opens its details. It has to be
       tested before the .pl branch below, or press-and-hold swallows it. */
    const menu = ev.target && ev.target.closest && ev.target.closest("[data-menu]");
    if(menu){
      ev.preventDefault(); ev.stopPropagation();
      const mid = menu.getAttribute("data-menu");
      const mp = DB.find("plantings", mid);
      if(mp){ Garden.sel = mid; haptic(); Garden.repaint(); Garden.plantingSheet(mp); }
      return;
    }
    const grip = ev.target && ev.target.closest && ev.target.closest("[data-grip]");
    if(grip) return CanvasDrag.resizeStart(ev, grip.getAttribute("data-grip"));
    const el = ev.target && ev.target.closest && ev.target.closest(".pl");
    if(el && !Garden.erase && !Garden.paint && !Garden.clip){
      const pid = el.getAttribute("data-pid");
      /* in multi-select mode a tap adds to the set rather than dragging one */
      if(typeof Sel !== "undefined" && Sel.on) return Sel.tapStart(ev, pid);
      return CanvasDrag.moveStart(ev, pid, el);
    }
    CanvasDrag.tapStart(ev);
  },

  /* ---------- a plain tap on soil or on a plant ---------- */
  tapStart(ev){
    const sx = ev.clientX, sy = ev.clientY;
    let moved = false;
    const move = e => { if(Math.abs(e.clientX - sx) > 8 || Math.abs(e.clientY - sy) > 8) moved = true; };
    const up = e => {
      window.removeEventListener("pointermove", move);
      window.removeEventListener("pointerup", up);
      if(moved) return;
      const pt = Canvas.toIn($("#pcanvas"), e.clientX, e.clientY);
      const bed = CanvasDrag.bed();
      if(!bed) return;
      /* a tap outside the outline is a miss, not a plant in the path */
      if(!Geom.inside(bed, pt.x, pt.y, 0) && !Garden.hit(bed.id, pt.x, pt.y)){
        if(Garden.sel){ Garden.sel = null; Garden.render(); }
        return;
      }
      Garden.tapAt(pt.x, pt.y);
    };
    window.addEventListener("pointermove", move);
    window.addEventListener("pointerup", up);
  },

  /* ============================================================
     MOVING A PLANT
     ============================================================ */
  moveStart(ev, id, el){
    const p = Geom.plant(DB.find("plantings", id)); if(!p) return;
    const bed = CanvasDrag.bed(); if(!bed) return;
    const svg = $("#pcanvas");
    const start = CanvasDrag.at(ev);
    const ox = Geom.PX(p), oy = Geom.PY(p);
    const touch = ev.pointerType === "touch" || ev.pointerType === "pen";
    let lifted = false, dead = false, far = 0, pos = { x: ox, y: oy };

    const blockScroll = e => { if(lifted && e.cancelable) e.preventDefault(); };
    document.addEventListener("touchmove", blockScroll, { passive:false });

    const lift = () => {
      if(dead || lifted) return;
      lifted = true;
      CanvasDrag.active = id;
      svg.classList.add("dragging");
      el.classList.add("sel");
      el.setAttribute("opacity", "0.9");
      haptic();
    };
    const timer = setTimeout(lift, 190);

    const move = e => {
      if(!lifted){
        const dx = Math.abs(e.clientX - ev.clientX), dy = Math.abs(e.clientY - ev.clientY);
        if(dx < 6 && dy < 6) return;
        /* a mostly-vertical swipe on a touchscreen is the page scrolling,
           and taking it away would trap her on this screen */
        if(touch && dy > dx * 1.4){ dead = true; clearTimeout(timer); finish(false); return; }
        clearTimeout(timer); lift();
        if(!lifted) return;
      }
      if(e.cancelable) e.preventDefault();
      far = Math.max(far, Math.abs(e.clientX - ev.clientX), Math.abs(e.clientY - ev.clientY));
      const now = CanvasDrag.at(e);
      pos = CanvasDrag.settle(bed, p, ox + (now.x - start.x), oy + (now.y - start.y));
      el.setAttribute("transform", "translate(" + (Math.round(pos.x*10)/10) + " " + (Math.round(pos.y*10)/10) + ")");
      CanvasDrag.live(CanvasDrag.feedback(bed, p, pos));
    };

    let done = false;
    const finish = drop => {
      if(done) return;
      done = true;
      clearTimeout(timer);
      window.removeEventListener("pointermove", move);
      window.removeEventListener("pointerup", onUp);
      window.removeEventListener("pointercancel", onUp);
      document.removeEventListener("touchmove", blockScroll);
      svg.classList.remove("dragging");
      el.removeAttribute("opacity");
      CanvasDrag.active = null;
      CanvasDrag.live("");
      CanvasDrag.abort = null;
      if(!drop || !lifted){ if(!lifted && far < 8) Garden.tapAt(start.x, start.y); return; }
      if(Math.abs(pos.x - ox) < 0.2 && Math.abs(pos.y - oy) < 0.2) return;
      Undo.push("move", "Moved " + cropName(p.crop_id), [{ id: id, px: ox, py: oy }]);
      DB.update("plantings", id, { px: Math.round(pos.x*10)/10, py: Math.round(pos.y*10)/10,
        x: Math.floor(pos.x / Garden.cell(bed)), y: Math.floor(pos.y / Garden.cell(bed)) });
      Garden.sel = id;
      Garden.render();
      const msg = CanvasDrag.verdict(bed, DB.find("plantings", id));
      toast(msg || (cropName(p.crop_id) + " moved"));
    };
    const onUp = () => finish(true);
    CanvasDrag.abort = () => { el.setAttribute("transform", "translate(" + ox + " " + oy + ")"); finish(false); };

    window.addEventListener("pointermove", move);
    window.addEventListener("pointerup", onUp);
    window.addEventListener("pointercancel", onUp);
  },

  /* keep it inside the bed, honour the grid if it is on, and let a good
     companion pull it gently into place */
  settle(bed, p, x, y){
    const rr = Geom.RR(p);
    if(CanvasDrag.magnet){
      const pull = CanvasDrag.pullTo(bed, p, x, y);
      if(pull){ x = pull.x; y = pull.y; }
    }
    if(num(bed.snap_in) > 0){
      x = Geom.snap(x, num(bed.snap_in));
      y = Geom.snap(y, num(bed.snap_in));
    }
    const fit = Geom.clampInto(bed, x, y, Math.min(rr, 2));
    return { x: fit.x, y: fit.y };
  },

  /* companion magnetism: nudge toward the distance the two actually want,
     rather than refusing to let them near each other */
  pullTo(bed, p, x, y){
    let best = null, bd = Infinity;
    Geom.live(bed.id).forEach(o => {
      if(o.id === p.id || o.crop_id === p.crop_id) return;
      const r = pairRating(p.crop_id, o.crop_id);
      if(r.score < 1) return;
      const ox = Geom.PX(o), oy = Geom.PY(o);
      const d = Math.hypot(x - ox, y - oy);
      const ideal = Geom.RR(p) + Geom.RR(o) + 1.5;
      if(Math.abs(d - ideal) > Math.max(4, ideal * 0.45)) return;
      if(Math.abs(d - ideal) < bd){ bd = Math.abs(d - ideal); best = { o: o, ideal: ideal, d: d, ox: ox, oy: oy }; }
    });
    if(!best) return null;
    if(best.d < 0.01) return null;
    const t = best.ideal / best.d;
    return { x: best.ox + (x - best.ox) * t, y: best.oy + (y - best.oy) * t };
  },

  /* ---------- the live overlay ---------- */
  feedback(bed, p, pos){
    const rcP = Geom.RC(p), rrP = Geom.RR(p);
    let out = '';
    let anyBad = false;
    Geom.live(bed.id).forEach(o => {
      if(o.id === p.id) return;
      const ox = Geom.PX(o), oy = Geom.PY(o);
      const d = Math.hypot(pos.x - ox, pos.y - oy);
      const touch = d < rcP + Geom.RC(o);
      const clash = d < rrP + Geom.RR(o) - 0.5;
      if(!touch && d - rrP - Geom.RR(o) > Geom.NEAR_GAP) return;
      let kind = null;
      if(o.crop_id !== p.crop_id){
        const r = pairRating(p.crop_id, o.crop_id);
        if(r.score <= -2) kind = "bad";
        else if(r.score >= 1) kind = "good";
      }
      if(!kind && clash) kind = "crowd";
      if(!kind) return;
      if(kind === "bad") anyBad = true;
      const col = kind === "bad" ? "#c9453c" : kind === "good" ? "#2a8c5e" : "#d98324";
      const sym = kind === "bad" ? "!" : kind === "good" ? "♥" : "⊙";
      out += '<path d="M' + (Math.round(pos.x*10)/10) + ' ' + (Math.round(pos.y*10)/10) + 'L' +
             (Math.round(ox*10)/10) + ' ' + (Math.round(oy*10)/10) + '" stroke="' + col +
             '" stroke-width="0.5" stroke-dasharray="1.4 1.2" stroke-opacity="0.9"/>';
      const mx = (pos.x + ox) / 2, my = (pos.y + oy) / 2;
      /* a marker, not a placard. Sized off the bed so it is the same size on
         screen whatever the plot measures, and small enough that it never
         hides the plant it is telling you about. */
      const bs = Canvas.badgeR(bed, Geom.RC(p), kind === "bad");
      out += '<g transform="translate(' + (Math.round(mx*10)/10) + ' ' + (Math.round(my*10)/10) + ')">' +
        '<circle r="' + bs + '" fill="' + col + '"/>' +
        '<text y="' + (bs*0.38) + '" text-anchor="middle" font-size="' + (bs*1.2) + '" fill="#fff">' + sym + '</text></g>';
      if(clash)
        out += '<circle cx="' + (Math.round(ox*10)/10) + '" cy="' + (Math.round(oy*10)/10) + '" r="' +
               (Math.round(Geom.RR(o)*10)/10) + '" fill="none" stroke="#d98324" stroke-width="0.4" stroke-opacity="0.9"/>';
      /* a guild worth pointing out: shade-lover settling under something tall */
      if(kind !== "bad" && Geom.isTall(o.crop_id) && Geom.shadeOk(p.crop_id) && d < Geom.RC(o))
        out += '<circle cx="' + (Math.round(ox*10)/10) + '" cy="' + (Math.round(oy*10)/10) + '" r="' +
               (Math.round(Geom.RC(o)*10)/10) + '" fill="#2a8c5e" fill-opacity="0.18" stroke="#2a8c5e" stroke-width="0.4"/>';
    });
    /* where it will actually land */
    out += '<circle cx="' + (Math.round(pos.x*10)/10) + '" cy="' + (Math.round(pos.y*10)/10) + '" r="' +
           (Math.round(rrP*10)/10) + '" fill="none" stroke="' + (anyBad ? "#c9453c" : "#f7f3ea") +
           '" stroke-width="0.45" stroke-opacity="0.95"/>';
    return out;
  },

  /* one honest sentence about where it ended up */
  verdict(bed, p){
    if(!p) return null;
    let bad = null, good = null, crowd = null;
    Geom.live(bed.id).forEach(o => {
      if(o.id === p.id) return;
      const rel = Geom.relation(p, o);
      if(!rel.near) return;
      if(rel.rootsClash && !crowd) crowd = o;
      if(o.crop_id === p.crop_id) return;
      const r = pairRating(p.crop_id, o.crop_id);
      if(r.score <= -2 && !bad) bad = o;
      else if(r.score >= 1 && !good) good = o;
    });
    if(bad) return "⚠️ Now next to " + cropName(bad.crop_id) + " — they do not get on";
    if(crowd) return "⊙ Root zones overlap with " + cropName(crowd.crop_id);
    if(good) return "💚 Good company for " + cropName(good.crop_id);
    return null;
  },

  /* ============================================================
     RESIZING BY DRAGGING THE HANDLE
     ============================================================ */
  resizeStart(ev, id){
    ev.preventDefault(); ev.stopPropagation();
    const p = Geom.plant(DB.find("plantings", id)); if(!p) return;
    const bed = CanvasDrag.bed(); if(!bed) return;
    const svg = $("#pcanvas");
    const el = svg.querySelector('.pl[data-pid="' + id + '"]'); if(!el) return;
    const cx = Geom.PX(p), cy = Geom.PY(p);
    const rr0 = Geom.RR(p), rc0 = Geom.RC(p);
    const ratio = rc0 > 0 ? rr0 / rc0 : 0.7;
    const maxR = Math.max(Geom.W(bed), Geom.H(bed)) * 0.7;
    let rc = rc0;

    svg.classList.add("dragging");
    const blockScroll = e => { if(e.cancelable) e.preventDefault(); };
    document.addEventListener("touchmove", blockScroll, { passive:false });

    const paint = () => {
      const ring = el.querySelector(".canring");
      const art = el.querySelector("g.art");
      const root = el.querySelector('circle[stroke-opacity="0.7"]');
      const g = PlantArt.growth(p, Canvas.date());
      const grown = Math.max(0.18, PlantArt.sizeAt(g));
      if(ring) ring.setAttribute("r", Math.round(rc * grown * 10) / 10);
      /* the root ring below is drawn at rc*ratio, so the icon is capped against
         the same figure — it shrinks with the plant as the handle comes in */
      if(art) art.setAttribute("transform", "scale(" + Canvas.iconR(bed, rc, grown, rc * ratio) + ")");
      if(root) root.setAttribute("r", Math.round(rc * ratio * 10) / 10);

      /* Only the *positions* move. The buttons are a constant size on screen
         now, so dragging the canopy out no longer inflates the handle you are
         dragging it with — which is what made a big plant's controls swell
         under your finger. `querySelector("[data-grip]")` also only ever found
         the invisible hit pad, so the white circle stayed behind while its
         target slid away; all four elements are moved by name. */
      const gx = Canvas.gripAt(bed, rc);
      el.querySelectorAll("[data-grip]").forEach(n => {
        n.setAttribute("cx", gx); n.setAttribute("cy", gx);
      });
      el.querySelectorAll("circle.hitpad[data-menu]").forEach(n => {
        n.setAttribute("cx", -gx); n.setAttribute("cy", gx);
      });
      const menu = el.querySelector("g.pmenu");
      if(menu) menu.setAttribute("transform", "translate(" + (-gx) + " " + gx + ")");
    };

    const move = e => {
      if(e.cancelable) e.preventDefault();
      const pt = CanvasDrag.at(e);
      rc = clamp(Math.hypot(pt.x - cx, pt.y - cy), 1.5, maxR);
      paint();
    };
    const up = () => {
      window.removeEventListener("pointermove", move);
      window.removeEventListener("pointerup", up);
      window.removeEventListener("pointercancel", up);
      document.removeEventListener("touchmove", blockScroll);
      svg.classList.remove("dragging");
      CanvasDrag.abort = null;
      if(Math.abs(rc - rc0) > 0.2) Undo.push("resize", "Resized " + cropName(p.crop_id), [{ id: id, rc: rc0, rr: rr0 }]);
      Garden.setRadius(id, rc, rc * ratio);
      /* a footprint that changed by hand is a footprint she means —
         record it as one plant that sprawls, not a clump that grew */
      const q = DB.find("plantings", id);
      if(q && q.span_mode !== "single" && Math.abs(rc - rc0) > 1) Garden.syncQty(id);
      Garden.sel = id;
      Garden.render();
      haptic();
      toast(Math.round(rc * 2) + '" across');
    };
    window.addEventListener("pointermove", move);
    window.addEventListener("pointerup", up);
    window.addEventListener("pointercancel", up);
    CanvasDrag.abort = () => { rc = rc0; paint(); up(); };
  }
};

/* The magnet is a preference, and some people want none of it. It used to be
   an in-memory flag that reset to on at every launch, which made it look like
   the setting had not stuck — so it is a stored preference now. */
Garden.toggleMagnet = function(){
  CanvasDrag.magnet = !CanvasDrag.magnet;
  DB.set("magnet", CanvasDrag.magnet ? "1" : "0");
  Garden.render();
  toast(CanvasDrag.magnet ? "Companions will pull into place" : "Free placement — nothing snaps");
};
Garden.loadMagnet = function(){ CanvasDrag.magnet = DB.get("magnet", "1") !== "0"; };
</script>

<script>
/* ============================================================
   BED SHAPES

   Beds are rectangles in catalogues and almost nowhere else. Real
   ones follow a fence, wrap a corner, fill a triangle beside a
   path, or are a half-barrel. So: eight presets that resize and
   rotate, and a pencil for everything they miss.

   The drawing tool snaps corner to corner. That is the whole
   trick — a shape you trace freehand never closes cleanly and
   never butts up against its neighbour, so you end up with
   overlapping slivers. Snapping to a three-inch grid and to
   corners you have already placed means two beds drawn separately
   still meet exactly, and hexagons or triangles tile into any
   layout you like.
   ============================================================ */

const Shape = {
  draft: null,          /* the polygon being drawn, in inches */

  /* ---------- the sheet ---------- */
  open(bedId){
    const bed = Geom.bed(DB.find("beds", bedId || APP.bedId)); if(!bed) return;
    const cur = Geom.shape(bed);
    let h = '<p class="muted sm" style="margin-top:0">Pick an outline, then set the size. Every shape can be rotated on the garden map, and several can be butted together to build a layout no single shape covers.</p>';

    h += '<div class="shapegrid">';
    Object.keys(Geom.SHAPES).forEach(k => {
      const s = Geom.SHAPES[k];
      h += '<button class="' + (cur === k ? "on" : "") + '" onclick="Shape.pick(\'' + bed.id + '\',\'' + k + '\')">' +
        '<div class="g">' + s.e + '</div><div class="n">' + esc(s.n) + '</div></button>';
    });
    h += '</div>';
    h += '<div class="tiny muted" style="margin-top:8px">' + esc((Geom.SHAPES[cur] || {}).d || "") + '</div>';

    h += '<div class="canvaswrap" id="sh-prev" style="margin-top:12px;padding:6px">' +
      Canvas.svg(bed, { interactive:false, pad:3 }) + '</div>';

    h += '<div class="grid2" style="margin-top:12px">' +
      '<div><label class="f">Width · <b id="sh-wv">' + Shape.ft(Geom.W(bed)) + '</b></label>' +
        '<input type="range" id="sh-w" min="12" max="480" step="3" value="' + Geom.W(bed) +
        '" oninput="Shape.size(\'' + bed.id + '\')"></div>' +
      '<div><label class="f">Depth · <b id="sh-hv">' + Shape.ft(Geom.H(bed)) + '</b></label>' +
        '<input type="range" id="sh-h" min="12" max="480" step="3" value="' + Geom.H(bed) +
        '" oninput="Shape.size(\'' + bed.id + '\')"></div></div>';
    h += '<div class="tiny muted" id="sh-area" style="margin-top:6px">' + Geom.areaSqFt(bed) + ' sq ft of growing space</div>';

    h += '<div class="row between" style="margin-top:14px"><div><div class="b sm">Square-foot grid</div>' +
      '<div class="tiny muted">Shows the squares and snaps new plants to them.</div></div>' +
      '<button class="switch ' + (num(bed.grid_on) ? "on" : "") + '" id="sh-grid"></button></div>';
    h += '<div class="field" style="margin-top:10px"><label class="f">Square size (inches)</label>' +
      '<input type="number" id="sh-cell" min="3" max="48" value="' + esc(num(bed.cell_in, 12)) + '"></div>';

    /* Companion magnetism used to be buried here. It is a thing you change
       while you are dragging plants about, not while you are choosing how big
       the bed is, so it lives on the bed's own toolbar now — 🧲 Snap. */

    h += '<button class="btn ghost block" style="margin-top:14px" onclick="Shape.drawStart(\'' + bed.id + '\')">✎ Trace my own outline</button>';
    h += '<button class="btn block" style="margin-top:8px" onclick="Shape.save(\'' + bed.id + '\')">Save</button>';

    openSheet("Shape and size", h);
    const g = $("#sh-grid"); if(g) g.onclick = () => g.classList.toggle("on");
  },

  ft(inches){
    const f = Math.floor(inches / 12), i = Math.round(inches - f * 12);
    return (f ? f + "′" : "") + (i ? " " + i + "″" : (f ? "" : "0″"));
  },

  pick(bedId, shape){
    const bed = DB.find("beds", bedId); if(!bed) return;
    if(shape === "poly") return Shape.drawStart(bedId);
    DB.update("beds", bedId, { shape: shape });
    Shape.open(bedId);
  },

  size(bedId){
    const w = clamp(num(($("#sh-w") || {}).value, 48), 12, 480);
    const h = clamp(num(($("#sh-h") || {}).value, 48), 12, 480);
    DB.update("beds", bedId, { w_in: w, h_in: h });
    const bed = DB.find("beds", bedId);
    const wv = $("#sh-wv"); if(wv) wv.textContent = Shape.ft(w);
    const hv = $("#sh-hv"); if(hv) hv.textContent = Shape.ft(h);
    const pv = $("#sh-prev"); if(pv) pv.innerHTML = Canvas.svg(Geom.bed(bed), { interactive:false, pad:3 });
    const ar = $("#sh-area"); if(ar) ar.textContent = Geom.areaSqFt(Geom.bed(bed)) + " sq ft of growing space";
  },

  save(bedId){
    const cell = clamp(num(($("#sh-cell") || {}).value, 12), 3, 48);
    const gridOn = $("#sh-grid") && $("#sh-grid").classList.contains("on") ? 1 : 0;
    const bed = Geom.bed(DB.find("beds", bedId));
    /* cols and rows are only the grid overlay now, but the map, the recap
       and the assistant still read them, so keep them honest */
    DB.update("beds", bedId, {
      cell_in: cell, grid_on: gridOn, snap_in: gridOn ? cell : 0,
      cols: Math.max(1, Math.round(Geom.W(bed) / cell)),
      rows: Math.max(1, Math.round(Geom.H(bed) / cell))
    });
    const b = DB.find("beds", bedId);
    /* anything now outside the new outline is pulled back in rather than lost */
    let moved = 0;
    Geom.live(bedId).forEach(p => {
      const fit = Geom.clampInto(Geom.bed(b), Geom.PX(p), Geom.PY(p), Math.min(Geom.RR(p), 2));
      if(fit.clamped || fit.tight){
        DB.update("plantings", p.id, { px: Math.round(fit.x*10)/10, py: Math.round(fit.y*10)/10 });
        moved++;
      }
    });
    closeSheet(); Garden.render();
    toast(moved ? moved + " plant" + (moved > 1 ? "s" : "") + " moved back inside" : "Bed updated");
  },

  /* ============================================================
     TRACING AN OUTLINE

     Tap to drop corners. Each one snaps to a 3-inch grid, and to
     any corner already placed — including the first, which is how
     you close the shape cleanly instead of leaving a sliver.
     ============================================================ */
  GRID: 3,
  drawStart(bedId){
    const bed = Geom.bed(DB.find("beds", bedId));
    Shape.draft = { bedId: bedId, pts: [], w: Geom.W(bed), h: Geom.H(bed) };
    Shape.drawSheet();
  },

  drawSheet(){
    const d = Shape.draft; if(!d) return;
    const n = d.pts.length;
    let h = '<p class="muted sm" style="margin-top:0">Tap to drop a corner. Corners snap to the ' + Shape.GRID +
      '″ grid and to each other — tap the first corner again to close the shape.</p>';
    h += '<div class="canvaswrap" id="sh-draw" style="padding:6px">' + Shape.drawSVG() + '</div>';
    h += '<div class="row between tiny muted" style="margin-top:8px">' +
      '<span>' + n + ' corner' + (n === 1 ? "" : "s") + (n >= 3 ? ' · ' + Shape.draftArea() + ' sq ft' : '') + '</span>' +
      '<span>' + Shape.ft(d.w) + ' × ' + Shape.ft(d.h) + ' canvas</span></div>';
    h += '<div class="row" style="gap:8px;margin-top:12px">' +
      '<button class="btn ghost" onclick="Shape.undo()">↶ Undo</button>' +
      '<button class="btn ghost" onclick="Shape.drawStart(\'' + d.bedId + '\')">Clear</button>' +
      '<button class="btn grow" onclick="Shape.drawSave()"' + (n < 3 ? " disabled" : "") + '>Use this outline</button></div>';
    h += '<button class="btn ghost block" style="margin-top:8px" onclick="Shape.open(\'' + d.bedId + '\')">← Back to the presets</button>';
    openSheet("Trace the bed", h);
    Shape.bindDraw();
  },

  drawSVG(){
    const d = Shape.draft;
    const P = Shape.GRID;
    let g = '';
    for(let x = 0; x <= d.w; x += P * 4) g += '<path d="M' + x + ' 0V' + d.h + '"/>';
    for(let y = 0; y <= d.h; y += P * 4) g += '<path d="M0 ' + y + 'H' + d.w + '"/>';
    let h = '<svg id="drawsvg" viewBox="-4 -4 ' + (d.w + 8) + ' ' + (d.h + 8) +
      '" xmlns="http://www.w3.org/2000/svg" style="touch-action:none">';
    h += '<rect x="0" y="0" width="' + d.w + '" height="' + d.h + '" fill="var(--surface-2)" stroke="var(--line)" stroke-width="0.6"/>';
    h += '<g stroke="var(--line)" stroke-width="0.4" fill="none">' + g + '</g>';
    if(d.pts.length >= 2){
      const path = "M" + d.pts.map(p => p[0] + " " + p[1]).join("L") + (d.pts.length >= 3 ? "Z" : "");
      h += '<path d="' + path + '" fill="#5d4634" fill-opacity="' + (d.pts.length >= 3 ? "0.6" : "0") +
           '" stroke="#2a8c5e" stroke-width="0.9" stroke-linejoin="round"/>';
    }
    d.pts.forEach((p, i) => {
      h += '<circle class="vtx" data-i="' + i + '" cx="' + p[0] + '" cy="' + p[1] + '" r="2.6" fill="' +
        (i === 0 ? "#2a8c5e" : "#fff") + '" stroke="#2a8c5e" stroke-width="0.8"/>';
    });
    h += '</svg>';
    return h;
  },

  draftArea(){
    const pts = Shape.draft.pts;
    let a = 0;
    for(let i = 0, j = pts.length - 1; i < pts.length; j = i++)
      a += pts[j][0]*pts[i][1] - pts[i][0]*pts[j][1];
    return Math.round(Math.abs(a / 2) / 144 * 10) / 10;
  },

  /* every corner already placed is a snap target, and so is the grid */
  snapPt(x, y){
    const d = Shape.draft;
    const hit = Geom.nearest(x, y, d.pts, 6);
    if(hit) return { x: hit[0], y: hit[1], onVertex: true, i: d.pts.indexOf(hit) };
    return { x: clamp(Geom.snap(x, Shape.GRID), 0, d.w), y: clamp(Geom.snap(y, Shape.GRID), 0, d.h) };
  },

  bindDraw(){
    const svg = $("#drawsvg"); if(!svg) return;
    svg.addEventListener("pointerdown", ev => {
      const d = Shape.draft; if(!d) return;
      const vtx = ev.target && ev.target.closest && ev.target.closest(".vtx");
      if(vtx) return Shape.dragVertex(ev, num(vtx.getAttribute("data-i"), 0));
      const pt = Canvas.toIn(svg, ev.clientX, ev.clientY);
      const s = Shape.snapPt(pt.x, pt.y);
      if(s.onVertex && s.i === 0 && d.pts.length >= 3){ return Shape.drawSave(); }
      if(s.onVertex) return;
      d.pts.push([s.x, s.y]);
      haptic();
      Shape.drawSheet();
    });
  },

  dragVertex(ev, i){
    ev.preventDefault();
    const svg = $("#drawsvg"), d = Shape.draft;
    const move = e => {
      const pt = Canvas.toIn(svg, e.clientX, e.clientY);
      const others = d.pts.filter((p, k) => k !== i);
      const hit = Geom.nearest(pt.x, pt.y, others, 6);
      d.pts[i] = hit ? [hit[0], hit[1]]
                     : [clamp(Geom.snap(pt.x, Shape.GRID), 0, d.w), clamp(Geom.snap(pt.y, Shape.GRID), 0, d.h)];
      const host = $("#sh-draw"); if(host){ host.innerHTML = Shape.drawSVG(); Shape.bindDraw(); }
    };
    const up = () => {
      window.removeEventListener("pointermove", move);
      window.removeEventListener("pointerup", up);
      Shape.drawSheet();
    };
    window.addEventListener("pointermove", move);
    window.addEventListener("pointerup", up);
  },

  undo(){
    if(!Shape.draft || !Shape.draft.pts.length) return;
    Shape.draft.pts.pop();
    Shape.drawSheet();
  },

  drawSave(){
    const d = Shape.draft;
    if(!d || d.pts.length < 3) return toast("Three corners at least");
    /* trim the canvas to what was actually drawn, and store normalised */
    let minX = Infinity, minY = Infinity, maxX = -Infinity, maxY = -Infinity;
    d.pts.forEach(p => { minX = Math.min(minX, p[0]); minY = Math.min(minY, p[1]);
                         maxX = Math.max(maxX, p[0]); maxY = Math.max(maxY, p[1]); });
    const w = Math.max(12, maxX - minX), h = Math.max(12, maxY - minY);
    const norm = d.pts.map(p => [Math.round((p[0] - minX) / w * 1000) / 1000,
                                 Math.round((p[1] - minY) / h * 1000) / 1000]);
    DB.update("beds", d.bedId, { w_in: Math.round(w), h_in: Math.round(h) });
    Geom.savePoly(d.bedId, norm);
    Shape.draft = null;
    closeSheet(); Garden.render();
    toast("Outline saved · " + Geom.areaSqFt(Geom.bed(DB.find("beds", d.bedId))) + " sq ft");
  }
};
