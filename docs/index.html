<script>
/* ============================================================
   LIVE DATA — all free, no API key, CORS-enabled
     phzmapi.org ............ USDA hardiness zone by US ZIP
     open-meteo geocoding ... place -> lat/lon (worldwide)
     open-meteo archive ..... 10y daily lows -> real frost dates
     open-meteo forecast .... 7-day weather, rain, frost alerts
     wikipedia REST ......... live plant reference lookups
   Every call degrades gracefully to offline defaults.
   ============================================================ */
const ZONE_FROST = {
  "2":["06-01","08-30"], "3":["05-25","09-10"], "4":["05-18","09-21"], "5":["05-08","10-05"],
  "6":["04-25","10-17"], "7":["04-08","11-02"], "8":["03-24","11-18"], "9":["02-20","12-10"],
  "10":["01-20","12-26"], "11":["01-01","12-31"], "12":["01-01","12-31"], "13":["01-01","12-31"]
};

const Live = (() => {
  const TO = 12000;
  function jget(url){
    const ctl = ("AbortController" in window) ? new AbortController() : null;
    const t = setTimeout(() => { if(ctl) ctl.abort(); }, TO);
    return fetch(url, { signal: ctl ? ctl.signal : undefined, referrerPolicy:"no-referrer", credentials:"omit", mode:"cors" })
      .then(r => { if(!r.ok) throw new Error("HTTP " + r.status); return r.json(); })
      .finally(() => clearTimeout(t));
  }

  /* ---- location ---- */
  async function byZip(zip){
    const z = String(zip).trim();
    if(/^\d{5}$/.test(z)){
      try{
        const d = await jget("https://phzmapi.org/" + z + ".json");
        return { zip: z, zone: d.zone, lat: parseFloat(d.coordinates.lat), lon: parseFloat(d.coordinates.lon),
                 label: "ZIP " + z, tempRange: d.temperature_range, src: "phzmapi" };
      }catch(e){ /* fall through to place search */ }
    }
    const g = await jget("https://geocoding-api.open-meteo.com/v1/search?count=1&format=json&language=en&name=" + encodeURIComponent(z));
    if(!g.results || !g.results.length) throw new Error("Couldn't find that place");
    const r = g.results[0];
    return { zip: null, zone: null, lat: r.latitude, lon: r.longitude,
             label: [r.name, r.admin1, r.country_code].filter(Boolean).join(", "), src: "open-meteo" };
  }
  async function byGPS(){
    const p = await new Promise((res, rej) => {
      if(!navigator.geolocation) return rej(new Error("No GPS"));
      navigator.geolocation.getCurrentPosition(res, rej, { timeout: 10000, maximumAge: 600000 });
    });
    return { zip: null, zone: null, lat: p.coords.latitude, lon: p.coords.longitude, label: "Current location", src: "gps" };
  }

  /* ---- frost dates from 10 years of real daily lows ---- */
  async function frostDates(lat, lon){
    const end = new Date(); end.setDate(end.getDate() - 5);
    const y = end.getFullYear();
    const start = new Date(y - 10, 0, 1);
    const url = "https://archive-api.open-meteo.com/v1/archive?latitude=" + lat.toFixed(3) + "&longitude=" + lon.toFixed(3) +
      "&start_date=" + iso(start) + "&end_date=" + iso(end) +
      "&daily=temperature_2m_min&temperature_unit=fahrenheit&timezone=auto";
    const d = await jget(url);
    const days = d.daily.time, mins = d.daily.temperature_2m_min;
    const lastByYear = {}, firstByYear = {}, coldByYear = {};
    for(let i = 0; i < days.length; i++){
      const t = mins[i]; if(t === null || t === undefined) continue;
      const dt = parseISO(days[i]); const yr = dt.getFullYear();
      const doy = Math.round((dt - new Date(yr, 0, 1)) / DAY);
      if(coldByYear[yr] === undefined || t < coldByYear[yr]) coldByYear[yr] = t;
      if(t <= 32){
        if(doy < 200){ if(lastByYear[yr] === undefined || doy > lastByYear[yr]) lastByYear[yr] = doy; }
        else { if(firstByYear[yr] === undefined || doy < firstByYear[yr]) firstByYear[yr] = doy; }
      }
    }
    const med = o => { const v = Object.keys(o).map(k => o[k]).sort((a,b) => a-b);
      return v.length ? v[Math.floor(v.length/2)] : null; };
    const lastDoy = med(lastByYear), firstDoy = med(firstByYear);
    const avgLow = (() => { const v = Object.keys(coldByYear).map(k => coldByYear[k]);
      return v.length ? v.reduce((a,b) => a+b, 0) / v.length : null; })();
    const yr = today().getFullYear();
    const mmdd = doy => doy === null ? null : iso(addDays(new Date(yr, 0, 1), doy)).slice(5);
    return {
      lastFrost: mmdd(lastDoy), firstFrost: mmdd(firstDoy),
      season: (lastDoy !== null && firstDoy !== null) ? (firstDoy - lastDoy) : null,
      avgAnnualLow: avgLow === null ? null : Math.round(avgLow),
      zoneFromLow: avgLow === null ? null : zoneFromLow(avgLow),
      years: Object.keys(coldByYear).length, src: "open-meteo archive (10-yr median)"
    };
  }
  function zoneFromLow(f){
    const z = Math.floor((f + 60) / 10) + 1;
    const half = ((f + 60) % 10) >= 5 ? "b" : "a";
    return clamp(z, 1, 13) + half;
  }

  /* ---- forecast ---- */
  async function forecast(lat, lon){
    const url = "https://api.open-meteo.com/v1/forecast?latitude=" + lat.toFixed(3) + "&longitude=" + lon.toFixed(3) +
      "&current=temperature_2m,relative_humidity_2m,precipitation,weather_code,wind_speed_10m" +
      "&daily=weather_code,temperature_2m_max,temperature_2m_min,precipitation_sum,et0_fao_evapotranspiration,sunrise,sunset,uv_index_max" +
      "&past_days=7&forecast_days=7&temperature_unit=fahrenheit&precipitation_unit=inch&wind_speed_unit=mph&timezone=auto";
    return jget(url);
  }
  const WMO = {0:["Clear","☀️"],1:["Mostly clear","🌤️"],2:["Partly cloudy","⛅"],3:["Overcast","☁️"],
    45:["Fog","🌫️"],48:["Rime fog","🌫️"],51:["Light drizzle","🌦️"],53:["Drizzle","🌦️"],55:["Heavy drizzle","🌦️"],
    61:["Light rain","🌧️"],63:["Rain","🌧️"],65:["Heavy rain","🌧️"],66:["Freezing rain","🌨️"],67:["Freezing rain","🌨️"],
    71:["Light snow","🌨️"],73:["Snow","❄️"],75:["Heavy snow","❄️"],77:["Snow grains","❄️"],
    80:["Showers","🌦️"],81:["Showers","🌧️"],82:["Violent showers","⛈️"],85:["Snow showers","🌨️"],86:["Snow showers","❄️"],
    95:["Thunderstorm","⛈️"],96:["Thunderstorm + hail","⛈️"],99:["Severe thunderstorm","⛈️"]};
  function wx(code){ return WMO[code] || ["—","🌡️"]; }

  /* ---- wikipedia ---- */
  async function wiki(term){
    const s = await jget("https://en.wikipedia.org/w/api.php?action=query&list=search&srlimit=1&format=json&origin=*&srsearch=" +
      encodeURIComponent(term));
    const hit = s.query && s.query.search && s.query.search[0];
    if(!hit) throw new Error("No article found");
    const sum = await jget("https://en.wikipedia.org/api/rest_v1/page/summary/" + encodeURIComponent(hit.title.replace(/ /g,"_")));
    return { title: sum.title, extract: sum.extract,
             thumb: sum.thumbnail ? sum.thumbnail.source : null,
             url: (sum.content_urls && sum.content_urls.desktop) ? sum.content_urls.desktop.page : null };
  }
  return { byZip, byGPS, frostDates, forecast, wiki, wx, zoneFromLow, jget };
})();

/* ============================================================
   SEASON MATH — frost dates -> real planting dates
   ============================================================ */
const Season = {
  get zone(){ return DB.get("zone", null); },
  get lastFrostISO(){
    const md = DB.get("lastFrost", null); if(!md) return null;
    return today().getFullYear() + "-" + md;
  },
  get firstFrostISO(){
    const md = DB.get("firstFrost", null); if(!md) return null;
    return today().getFullYear() + "-" + md;
  },
  fallbackFrom(zone){
    const z = String(zone || "6").replace(/[ab]/i, "");
    return ZONE_FROST[z] || ZONE_FROST["6"];
  },
  lastFrost(){ const s = Season.lastFrostISO; return s ? parseISO(s) : null; },
  firstFrost(){ const s = Season.firstFrostISO; return s ? parseISO(s) : null; },
  seasonDays(){ const a = Season.lastFrost(), b = Season.firstFrost(); return (a && b) ? diffDays(a, b) : null; },

  /* every sow/plant window for a crop, as real dates this year */
  windows(cropId){
    const c = crop(cropId); if(!c) return [];
    const LF = Season.lastFrost(), FF = Season.firstFrost();
    if(!LF || !FF) return [];
    const w = [], s = c.start || {};
    const W = n => addDays(LF, Math.round(n * 7));
    if(s.indoor !== undefined && s.indoor !== null)
      w.push({ kind:"indoor", label:"Start indoors", date: W(s.indoor), icon:"🏠",
               window: 14, note:"Sow in trays " + Math.abs(s.indoor) + " weeks " + (s.indoor < 0 ? "before" : "after") + " last frost." });
    if(s.tp !== undefined && s.tp !== null)
      w.push({ kind:"transplant", label:"Transplant out", date: W(s.tp), icon:"🌱",
               window: 21, note: s.tp < 0 ? "Goes out before last frost — it takes light cold." : "Wait until frost risk is gone." });
    if(s.direct !== undefined && s.direct !== null)
      w.push({ kind:"direct", label:"Direct sow", date: W(s.direct), icon:"🌰", window: 21, note:"Sow straight into the bed." });
    if(s.fall !== undefined && s.fall !== null && s.fall !== 0 && !s.fallPlant){
      const d = addDays(FF, Math.round(s.fall * 7));
      w.push({ kind:"fall", label:"Fall sowing", date: d, icon:"🍂", window: 14,
               note:"Sow " + Math.abs(s.fall) + " weeks before first frost for a fall harvest." });
    }
    if(s.fallPlant !== undefined && s.fallPlant !== null){
      const d = addDays(FF, Math.round(s.fallPlant * 7));
      w.push({ kind:"fall", label:"Plant in fall", date: d, icon:"🍂", window: 21,
               note:"Overwinters — plant " + Math.abs(s.fallPlant) + " weeks before first frost." });
    }
    return w;
  },

  /* is this crop plantable within N days of today? */
  status(cropId, slack){
    const sl = slack === undefined ? 12 : slack;
    const ws = Season.windows(cropId), t = today();
    let best = null;
    ws.forEach(w => {
      const from = addDays(w.date, -sl), to = addDays(w.date, w.window);
      const inWin = t >= from && t <= to;
      const days = diffDays(t, w.date);
      const cand = { w: w, inWindow: inWin, days: days, soon: days > 0 && days <= 30 };
      if(inWin && (!best || !best.inWindow)) best = cand;
      else if(!best) best = cand;
      else if(!best.inWindow && Math.abs(days) < Math.abs(best.days)) best = cand;
    });
    return best;
  },

  /* projected harvest from a sow/transplant date */
  harvestFrom(cropId, startISO, kind){
    const c = crop(cropId); if(!c || !startISO) return null;
    let d = parseISO(startISO); if(!d) return null;
    if(c.from === "transplant" && (kind === "indoor" || kind === "seed")){
      const s = c.start || {};
      const wk = (s.tp !== undefined && s.indoor !== undefined && s.tp !== null && s.indoor !== null) ? (s.tp - s.indoor) : 5;
      d = addDays(d, Math.round(wk * 7));
    }
    return addDays(d, c.dtm);
  },

  /* days until the first fall frost closes the window */
  daysLeft(){ const ff = Season.firstFrost(); return ff ? diffDays(today(), ff) : null; },

  /* can this crop still finish before frost if started today? */
  stillFits(cropId){
    const c = crop(cropId), left = Season.daysLeft();
    if(!c || left === null) return null;
    return { fits: left >= c.dtm + 7, left: left, needs: c.dtm };
  }
};

/* ============================================================
   RECOMMENDATION ENGINE
   ============================================================ */
const Recommend = {
  /* what should go in the ground right now */
  now(opts){
    const o = opts || {};
    const bed = o.bedId ? DB.find("beds", o.bedId) : null;
    const sunHours = o.sun !== undefined ? o.sun : (bed ? num(bed.sun_hours, 8) : 8);
    const occupants = bed ? DB.where("plantings", p => p.bed_id === bed.id && p.status !== "removed").map(p => p.crop_id) : [];
    const recentFams = bed ? Recommend.recentFamilies(bed.id) : {};
    const stock = {}; DB.all("seeds").forEach(s => { if(s.crop_id) stock[s.crop_id] = (stock[s.crop_id] || 0) + 1; });

    const out = [];
    CROPS.forEach(c => {
      const st = Season.status(c.id, o.slack === undefined ? 10 : o.slack);
      if(!st || !st.inWindow) return;
      let score = 50; const why = [], warn = [];
      why.push(st.w.icon + " " + st.w.label + " window is open " + (st.days === 0 ? "today" : (st.days > 0 ? "(peak " + relDay(st.w.date) + ")" : "(opened " + relDay(st.w.date) + ")")));

      if(sunHours >= c.sun){ score += 12; }
      else if(sunHours >= c.sun - 2){ score -= 8; warn.push("Wants " + c.sun + "h sun, this spot gets " + sunHours + "h — expect a lighter crop."); }
      else { score -= 30; warn.push("Needs " + c.sun + "h of sun; " + sunHours + "h is not enough."); }

      const fits = Season.stillFits(c.id);
      if(fits && !fits.fits && st.w.kind !== "fall" && st.w.kind !== "indoor"){
        score -= 25; warn.push("Needs " + fits.needs + " days and only " + fits.left + " remain before first frost.");
      }

      let comp = 0;
      occupants.forEach(oc => {
        const r = pairRating(c.id, oc);
        if(r.score >= 2){ comp += 8; why.push("💚 Great next to your " + cropName(oc)); }
        else if(r.score === 1){ comp += 4; why.push("🙂 Pairs well with your " + cropName(oc)); }
        else if(r.score <= -2){ comp -= 16; warn.push("⚠️ Keep away from your " + cropName(oc) + " — " + r.why); }
        else if(r.score === -1){ comp -= 5; warn.push("Same family as your " + cropName(oc) + "."); }
      });
      score += clamp(comp, -30, 24);

      if(recentFams[c.fam]){ score -= 14; warn.push("A " + FAMILY[c.fam].n.toLowerCase() + " grew here " + recentFams[c.fam] + " — rotate if you can."); }
      if(stock[c.id]){ score += 10; why.push("🌰 You already have seed for this"); }

      out.push({ crop: c, score: score, window: st.w, days: st.days, why: why, warn: warn, hasSeed: !!stock[c.id] });
    });
    return out.sort((a, b) => b.score - a.score);
  },

  recentFamilies(bedId){
    const out = {}, cut = addDays(today(), -730);
    DB.where("plantings", p => p.bed_id === bedId).forEach(p => {
      const c = crop(p.crop_id); if(!c) return;
      const d = parseISO(p.sown_on || p.created && p.created.slice(0,10));
      if(d && d >= cut) out[c.fam] = (d.getFullYear() === today().getFullYear() ? "this season" : "last season");
    });
    return out;
  },

  /* best companions for what's already in a bed */
  forBed(bedId){
    const occ = DB.where("plantings", p => p.bed_id === bedId && p.status !== "removed").map(p => p.crop_id);
    if(!occ.length) return [];
    const tally = {};
    occ.forEach(id => {
      const cc = companionsFor(id);
      cc.good.forEach(g => { if(occ.indexOf(g) < 0) tally[g] = (tally[g] || 0) + 1; });
    });
    return Object.keys(tally).map(id => ({ id: id, n: tally[id] })).sort((a,b) => b.n - a.n).slice(0, 8);
  },

  /* conflicts currently planted in a bed */
  conflicts(bedId){
    const ps = DB.where("plantings", p => p.bed_id === bedId && p.status !== "removed");
    const out = [];
    for(let i = 0; i < ps.length; i++) for(let j = i + 1; j < ps.length; j++){
      if(ps[i].crop_id === ps[j].crop_id) continue;
      const r = pairRating(ps[i].crop_id, ps[j].crop_id);
      if(r.score <= -2){
        const dist = Math.abs(num(ps[i].x) - num(ps[j].x)) + Math.abs(num(ps[i].y) - num(ps[j].y));
        if(dist <= 4) out.push({ a: ps[i], b: ps[j], why: r.why, dist: dist });
      }
    }
    return out;
  },

  /* watering call for a bed, from crop needs + real rainfall */
  water(bedId, weather){
    const ps = DB.where("plantings", p => p.bed_id === bedId && p.status !== "removed");
    if(!ps.length) return null;
    let need = 0;
    ps.forEach(p => { const c = crop(p.crop_id); if(c) need = Math.max(need, c.water); });
    let rain = 0;
    if(weather && weather.daily){
      const t = iso(today());
      weather.daily.time.forEach((d, i) => {
        const dd = diffDays(parseISO(d), today());
        if(dd >= 0 && dd < 7) rain += num(weather.daily.precipitation_sum[i]);
      });
    }
    const logged = DB.where("journal", j => j.bed_id === bedId && j.type === "water" && diffDays(parseISO(j.date), today()) < 7)
      .reduce((a, j) => a + num(j.amount), 0);
    const deficit = need - rain - logged;
    return { need: need, rain: Math.round(rain * 100) / 100, logged: Math.round(logged * 100) / 100,
             deficit: Math.round(deficit * 100) / 100,
             verdict: deficit <= 0.05 ? "skip" : (deficit < 0.5 ? "light" : "water") };
  }
};
</script>

<script>
/* ============================================================
   APP SHELL — router, header, home, onboarding
   ============================================================ */
const APP = { tab: "home", weather: null, wxAt: 0, bedId: null, plotId: null, month: null, dx: null };

const TABS = {
  home:     { t:"Pocket Fertilizer", s:"Your garden, today" },
  garden:   { t:"Garden Plan",       s:"Beds, grids & companions" },
  seeds:    { t:"Seed Bank",         s:"Inventory & viability" },
  calendar: { t:"Grow Calendar",     s:"Sow, transplant, harvest" },
  doctor:   { t:"Plant Doctor",      s:"Scan & diagnose" },
  weather:  { t:"Weather",           s:"Forecast & garden risks" },
  assist:   { t:"Ask",               s:"Your gardening assistant" },
  sources:  { t:"Sources",           s:"Where the advice comes from" },
  help:     { t:"How to use it",     s:"Starter guide & manual" },
  journal:  { t:"Garden Journal",    s:"Water, feed, harvest, cost" },
  recap:    { t:"Season Recap",      s:"Yield & resources" },
  library:  { t:"Plant Library",     s:"Care, spacing, companions" },
  settings: { t:"Settings",          s:"Location, security, data" },
  sql:      { t:"SQL Console",       s:"Query your garden database" }
};

function go(tab, opts){
  APP.tab = tab;
  $$(".screen").forEach(s => s.classList.remove("active"));
  const el = $("#s-" + tab); if(el) el.classList.add("active");
  $$("nav.tabs button").forEach(b => b.classList.toggle("on", b.dataset.tab === tab));
  const meta = TABS[tab] || TABS.home;
  $("#scr-title").textContent = meta.t;
  $("#scr-sub").textContent = meta.s;
  window.scrollTo(0, 0);
  render(tab, opts);
}
function render(tab, opts){
  const fn = ({ home: Home, garden: Garden, seeds: Seeds, calendar: Cal, doctor: Doctor,
                weather: Weather, assist: Assist, sources: Sources, help: Help,
                journal: Journal, recap: Recap, library: Library, settings: Settings, sql: SqlView })[tab];
  if(fn && fn.render) fn.render(opts);
}
function refresh(){ render(APP.tab); }

/* ---------- weather cache ---------- */
async function getWeather(force){
  const lat = DB.get("lat"), lon = DB.get("lon");
  if(!lat || !lon) return null;
  if(!force && APP.weather && Date.now() - APP.wxAt < 30 * 60 * 1000) return APP.weather;
  try{
    APP.weather = await Live.forecast(lat, lon);
    APP.wxAt = Date.now();
    DB.set("wxCache", { at: Date.now(), data: APP.weather });
  }catch(e){
    const c = DB.get("wxCache");
    if(c && c.data){ APP.weather = c.data; APP.wxAt = c.at; }
  }
  return APP.weather;
}

/* ============================================================
   HOME
   ============================================================ */
const Home = {
  render(){
    const box = $("#s-home");
    const zone = DB.get("zone"), lf = Season.lastFrost(), ff = Season.firstFrost();
    const left = Season.daysLeft();
    const beds = DB.all("beds"), plantings = DB.where("plantings", p => p.status !== "removed");
    const seeds = DB.all("seeds");
    /* actionable tasks only: frost markers live in the hero, and nothing
       older than three weeks should still be nagging as "overdue" */
    const dueEvents = DB.where("events", e => {
      if(e.done === "1" || e.done === true || e.type === "frost") return false;
      const d = parseISO(e.date); if(!d) return false;
      const n = diffDays(today(), d);
      return n >= -21 && n <= 7;
    }).sort((a,b) => a.date < b.date ? -1 : 1);

    let h = "";

    /* hero */
    h += '<div class="hero">';
    const town = DB.get("town"), region = DB.get("region"), zipc = DB.get("zip");
    const where = town ? (town + (region ? ", " + region : "")) : (DB.get("locLabel") || "Set your location");
    h += '<div class="row between"><div><div class="lbl">' + esc(where) + '</div>' +
         '<div style="font-size:2rem;font-weight:800;line-height:1">Zone ' + esc(zone || "—") + '</div>' +
         '<div class="sm" style="opacity:.9">' + (zipc ? 'ZIP ' + esc(zipc) : (zone ? 'Growing zone' : 'Tap below to set your location')) + '</div></div>' +
         '<div style="text-align:right">' +
         (left !== null ? '<div class="lbl">Season left</div><div style="font-size:2rem;font-weight:800;line-height:1">' +
            (left > 0 ? left : 0) + '</div><div class="sm" style="opacity:.9">days to frost</div>' : '') +
         '</div></div>';
    if(lf && ff) h += '<div class="row" style="gap:14px;margin-top:12px;font-size:.8rem;opacity:.95">' +
      '<span>❄️ Last frost ' + fmt(lf) + '</span><span>🍂 First frost ' + fmt(ff) + '</span></div>';
    h += '</div>';

    if(!zone) h += '<div class="card" style="margin-top:12px"><div class="note i">Set your location to unlock frost dates, planting windows and weather-aware watering.</div>' +
      '<button class="btn block" style="margin-top:10px" onclick="Onboard.open()">Set my location</button></div>';

    /* weather strip */
    h += '<div id="wxstrip"></div>';

    /* quick actions */
    h += '<div class="sec"><h2>Quick actions</h2></div>';
    h += '<div class="grid2">' +
      '<button class="card" style="text-align:left" onclick="go(\'doctor\')"><div style="font-size:1.5rem">🔬</div><div class="b">Scan a plant</div><div class="tiny muted">Diagnose leaf issues</div></button>' +
      '<button class="card" style="text-align:left" onclick="Seeds.add()"><div style="font-size:1.5rem">🌰</div><div class="b">Add seed packet</div><div class="tiny muted">Photo or manual</div></button>' +
      '<button class="card" style="text-align:left" onclick="Journal.quick(\'harvest\')"><div style="font-size:1.5rem">🧺</div><div class="b">Log a harvest</div><div class="tiny muted">Weight & value</div></button>' +
      '<button class="card" style="text-align:left" onclick="go(\'assist\')"><div style="font-size:1.5rem">✨</div><div class="b">Ask the assistant</div><div class="tiny muted">Type or speak</div></button>' +
      '</div>';

    /* tasks */
    h += '<div class="sec"><h2>Next 7 days</h2><a class="tiny b" onclick="go(\'calendar\')">Calendar →</a></div>';
    if(!dueEvents.length){
      h += '<div class="card center muted sm">Nothing scheduled. Add seeds to your bank and the calendar fills itself in.</div>';
    } else {
      h += '<div class="card pad0"><div class="list">';
      dueEvents.slice(0, 6).forEach(e => {
        const overdue = diffDays(today(), parseISO(e.date)) < 0;
        h += '<button class="item" onclick="Cal.openEvent(\'' + e.id + '\')">' +
          '<div class="av">' + (e.crop_id ? cropEmoji(e.crop_id) : "📌") + '</div>' +
          '<div class="grow"><div class="b truncate">' + esc(e.title) + '</div>' +
          '<div class="tiny ' + (overdue ? "" : "muted") + '" ' + (overdue ? 'style="color:var(--danger)"' : '') + '>' +
          (overdue ? "Overdue — " : "") + relDay(e.date) + ' · ' + fmt(e.date) + '</div></div>' +
          '<span class="go">›</span></button>';
      });
      h += '</div></div>';
    }

    /* recommendations */
    const recs = Recommend.now({ slack: 10 }).slice(0, 4);
    h += '<div class="sec"><h2>Plant this week</h2><a class="tiny b" onclick="Library.render({filter:\'now\'});go(\'library\')">All →</a></div>';
    if(!zone){ h += '<div class="card center muted sm">Set your location first.</div>'; }
    else if(!recs.length){ h += '<div class="card center muted sm">No sowing windows are open right now — check the calendar for what is coming up.</div>'; }
    else {
      h += '<div class="scroller">';
      recs.forEach(r => {
        h += '<button class="card" style="width:170px;text-align:left" onclick="Library.open(\'' + r.crop.id + '\')">' +
          '<div style="font-size:1.7rem">' + r.crop.e + '</div>' +
          '<div class="b truncate">' + esc(r.crop.n) + '</div>' +
          '<div class="tiny muted" style="height:32px;overflow:hidden">' + esc(r.window.label) + ' · ' + esc(r.window.note.slice(0, 46)) + '</div>' +
          '<div class="row" style="gap:4px;margin-top:6px">' +
            (r.hasSeed ? '<span class="chip good tiny">have seed</span>' : '') +
            (r.warn.length ? '<span class="chip warn tiny">' + r.warn.length + ' note' + (r.warn.length > 1 ? "s" : "") + '</span>' : '<span class="chip good tiny">good fit</span>') +
          '</div></button>';
      });
      h += '</div>';
    }

    /* beds + watering */
    h += '<div class="sec"><h2>Your beds</h2><a class="tiny b" onclick="go(\'garden\')">Plan →</a></div>';
    if(!beds.length){
      h += '<div class="card center"><div class="empty"><span class="e">🪴</span>No beds yet.<div class="tiny">Lay out a grid and start planning.</div></div>' +
        '<button class="btn block" onclick="Garden.newBed()">Create my first bed</button></div>';
    } else {
      h += '<div class="card pad0"><div class="list">';
      beds.forEach(b => {
        const n = DB.where("plantings", p => p.bed_id === b.id && p.status !== "removed").length;
        const cells = num(b.cols) * num(b.rows);
        const w = Recommend.water(b.id, APP.weather);
        let wtxt = "", wcls = "muted";
        if(w){
          if(w.verdict === "skip"){ wtxt = "💧 No water needed — " + w.rain + '" rain this week'; wcls = "muted"; }
          else if(w.verdict === "light"){ wtxt = '💧 Top up ~' + w.deficit + '" this week'; }
          else { wtxt = '💧 Needs ' + w.deficit + '" more this week'; }
        }
        h += '<button class="item" onclick="Garden.open(\'' + b.id + '\')">' +
          '<div class="av">🪴</div><div class="grow"><div class="b truncate">' + esc(b.name) + '</div>' +
          '<div class="tiny muted">' + b.cols + '×' + b.rows + ' · ' + n + '/' + cells + ' squares planted · ' + esc(b.sun_hours || "?") + 'h sun</div>' +
          (wtxt ? '<div class="tiny ' + wcls + '">' + esc(wtxt) + '</div>' : '') +
          '</div><span class="go">›</span></button>';
      });
      h += '</div></div>';
    }

    /* stats */
    const yr = today().getFullYear();
    const hv = DB.where("harvests", x => (x.date || "").slice(0,4) === String(yr));
    const lbs = hv.reduce((a, x) => a + (x.unit === "oz" ? num(x.weight)/16 : num(x.weight)), 0);
    const val = hv.reduce((a, x) => a + num(x.value), 0);
    const spent = DB.all("journal").filter(j => (j.date||"").slice(0,4) === String(yr)).reduce((a,j) => a + num(j.cost), 0)
                + DB.all("seeds").reduce((a,s) => a + num(s.cost), 0);
    h += '<div class="sec"><h2>' + yr + ' so far</h2><a class="tiny b" onclick="go(\'recap\')">Recap →</a></div>';
    h += '<div class="card"><div class="grid3">' +
      '<div class="stat"><span class="n">' + (Math.round(lbs*10)/10) + '</span><span class="l">lbs picked</span></div>' +
      '<div class="stat"><span class="n">$' + Math.round(val) + '</span><span class="l">value</span></div>' +
      '<div class="stat"><span class="n">' + plantings.length + '</span><span class="l">growing</span></div>' +
      '</div>' +
      (spent > 0 ? '<div class="tiny muted" style="margin-top:10px">$' + Math.round(spent) + ' spent · ' +
        (lbs > 0 ? '$' + (Math.round(spent/lbs*100)/100) + ' per lb' : 'no harvest logged yet') + '</div>' : '') +
      '</div>';

    /* tip of the day */
    h += '<div class="sec"><h2>Tip of the day</h2></div>' + Tips.card();

    /* seed alerts */
    const bad = seeds.filter(s => Seeds.viability(s).level === "expired");
    const soon = seeds.filter(s => Seeds.viability(s).level === "fading");
    if(bad.length || soon.length){
      h += '<div class="sec"><h2>Seed bank alerts</h2><a class="tiny b" onclick="go(\'seeds\')">Bank →</a></div><div class="card">';
      if(bad.length) h += '<div class="note d" style="margin-bottom:8px">' + bad.length + ' packet' + (bad.length>1?"s are":" is") + ' past viable age — germination will be poor. Test 10 seeds on a damp paper towel before you commit bed space.</div>';
      if(soon.length) h += '<div class="note w">' + soon.length + ' packet' + (soon.length>1?"s are":" is") + ' getting old — sow these first this season.</div>';
      h += '</div>';
    }

    box.innerHTML = h;
    Home.weather();
  },

  async weather(){
    const w = await getWeather();
    const strip = $("#wxstrip"); if(!strip) return;
    if(!w || !w.daily){ strip.innerHTML = ""; return; }
    const d = w.daily, t = iso(today());
    let h = '<div class="sec"><h2>Weather</h2><button class="tiny b" onclick="go(\'weather\')">Full forecast →</button></div>';
    const cur = w.current || {};
    const frostSoon = [];
    d.time.forEach((dt, i) => { const dd = diffDays(today(), parseISO(dt));
      if(dd >= 0 && dd <= 6 && num(d.temperature_2m_min[i], 99) <= 36) frostSoon.push({ dt: dt, t: d.temperature_2m_min[i] }); });
    h += '<div class="card">';
    h += '<div class="row between"><div class="row" style="gap:8px"><div style="font-size:1.8rem">' + Live.wx(cur.weather_code)[1] + '</div>' +
      '<div><div class="b">' + Math.round(num(cur.temperature_2m)) + '°F · ' + esc(Live.wx(cur.weather_code)[0]) + '</div>' +
      '<div class="tiny muted">' + Math.round(num(cur.relative_humidity_2m)) + '% humidity · wind ' + Math.round(num(cur.wind_speed_10m)) + ' mph</div></div></div>' +
      '<button class="iconbtn" onclick="go(\'weather\')">›</button></div>';
    h += '<div class="scroller" style="margin-top:10px;padding-bottom:0">';
    d.time.forEach((dt, i) => {
      const dd = diffDays(today(), parseISO(dt));
      if(dd < 0 || dd > 6) return;
      const cold = num(d.temperature_2m_min[i], 99) <= 36;
      h += '<div class="center" style="min-width:52px">' +
        '<div class="tiny muted">' + (dd === 0 ? "Today" : DOW[parseISO(dt).getDay()]) + '</div>' +
        '<div style="font-size:1.3rem">' + Live.wx(d.weather_code[i])[1] + '</div>' +
        '<div class="tiny b">' + Math.round(num(d.temperature_2m_max[i])) + '°</div>' +
        '<div class="tiny ' + (cold ? "" : "muted") + '" ' + (cold ? 'style="color:var(--info)"' : '') + '>' + Math.round(num(d.temperature_2m_min[i])) + '°</div>' +
        (num(d.precipitation_sum[i]) > 0.01 ? '<div class="tiny" style="color:var(--info)">' + (Math.round(num(d.precipitation_sum[i])*100)/100) + '"</div>' : '<div class="tiny">&nbsp;</div>') +
        '</div>';
    });
    h += '</div>';
    if(frostSoon.length) h += '<div class="note w" style="margin-top:10px">🥶 Cold coming: ' +
      Math.round(frostSoon[0].t) + '°F on ' + fmt(frostSoon[0].dt) + '. Cover tender crops (tomato, pepper, basil, squash) or bring pots in.</div>';
    let rain7 = 0; d.time.forEach((dt, i) => { const dd = diffDays(today(), parseISO(dt)); if(dd >= 0 && dd < 7) rain7 += num(d.precipitation_sum[i]); });
    if(rain7 > 0.4) h += '<div class="note i" style="margin-top:8px">🌧️ ' + (Math.round(rain7*100)/100) + '" of rain forecast this week — hold off on watering established beds.</div>';
    h += '</div>';
    strip.innerHTML = h;
  }
};

/* ============================================================
   ONBOARDING — location, zone, frost dates
   ============================================================ */
const Onboard = {
  open(){
    openSheet("Where do you garden?",
      '<p class="muted sm" style="margin-top:0">Your ZIP unlocks your USDA zone, ten-year median frost dates, and live weather. Nothing leaves your device except the lookup itself.</p>' +
      '<div class="field"><label class="f">US ZIP code or place name</label>' +
      '<input type="text" id="ob-zip" placeholder="97202 or Portland, Oregon" autocomplete="postal-code"></div>' +
      '<div class="row" style="margin-top:12px;gap:8px">' +
        '<button class="btn grow" id="ob-go">Look it up</button>' +
        '<button class="btn ghost" id="ob-gps" title="Use GPS">📍</button>' +
      '</div>' +
      '<div id="ob-out" style="margin-top:14px"></div>');
    $("#ob-go").onclick = () => Onboard.lookup($("#ob-zip").value);
    $("#ob-gps").onclick = () => Onboard.lookup(null, true);
    $("#ob-zip").addEventListener("keydown", e => { if(e.key === "Enter") Onboard.lookup($("#ob-zip").value); });
    const z = DB.get("zip"); if(z) $("#ob-zip").value = z;
  },

  async lookup(q, gps){
    const out = $("#ob-out");
    if(!gps && !String(q || "").trim()){ out.innerHTML = '<div class="note d">Enter a ZIP or a place name.</div>'; return; }
    out.innerHTML = '<div class="row"><span class="spinner"></span><span class="sm muted">Finding your zone…</span></div>';
    let loc;
    try{ loc = gps ? await Live.byGPS() : await Live.byZip(q); }
    catch(e){ out.innerHTML = '<div class="note d">' + esc(e.message || "Lookup failed") + '. Check your connection, or set frost dates manually in Settings.</div>'; return; }

    out.innerHTML = '<div class="row"><span class="spinner"></span><span class="sm muted">Reading 10 years of local frost history…</span></div>';
    let fr = null;
    try{ fr = await Live.frostDates(loc.lat, loc.lon); }catch(e){ /* fallback below */ }

    const zone = loc.zone || (fr && fr.zoneFromLow) || "6b";
    let lastF, firstF, src;
    if(fr && fr.lastFrost && fr.firstFrost){ lastF = fr.lastFrost; firstF = fr.firstFrost; src = fr.src; }
    else { const f = Season.fallbackFrom(zone); lastF = f[0]; firstF = f[1]; src = "zone average (offline estimate)"; }

    DB.set("zip", loc.zip || String(q || "").trim());
    DB.set("locLabel", loc.label);
    DB.set("lat", loc.lat); DB.set("lon", loc.lon);
    DB.set("zone", zone);
    DB.set("lastFrost", lastF); DB.set("firstFrost", firstF);
    DB.set("frostSrc", src);
    if(fr && fr.avgAnnualLow !== null && fr.avgAnnualLow !== undefined) DB.set("avgLow", fr.avgAnnualLow);
    DB.set("onboarded", true);

    const yr = today().getFullYear();
    out.innerHTML =
      '<div class="note g"><div class="b" style="font-size:1rem">Zone ' + esc(zone) + ' · ' + esc(loc.label) + '</div>' +
      '<div style="margin-top:6px">❄️ Last spring frost <b>' + fmt(yr + "-" + lastF) + '</b><br>' +
      '🍂 First fall frost <b>' + fmt(yr + "-" + firstF) + '</b><br>' +
      '🌱 Growing season <b>' + diffDays(parseISO(yr + "-" + lastF), parseISO(yr + "-" + firstF)) + ' days</b></div>' +
      '<div class="tiny" style="margin-top:6px;opacity:.8">Source: ' + esc(src) + (fr && fr.avgAnnualLow !== null && fr.avgAnnualLow !== undefined ? ' · avg annual low ' + fr.avgAnnualLow + '°F' : '') + '</div></div>' +
      '<button class="btn block" style="margin-top:12px" onclick="closeSheet();Cal.rebuild();refresh();toast(\'Location saved\')">Use these dates</button>' +
      '<button class="btn ghost block" style="margin-top:8px" onclick="closeSheet();go(\'settings\')">Adjust manually</button>';
    await getWeather(true);
  }
};
</script>

<script>
/* ============================================================
   PLACE NAMES
   phzmapi returns a zone and coordinates but no place name, so a
   ZIP lookup used to leave the app showing "ZIP 27560" — or
   nothing at all. Open-Meteo's geocoder resolves a US postcode to
   a town, so the app can say "Morrisville, North Carolina".
   ============================================================ */
Live.nameForZip = async function(zip){
  try{
    const g = await Live.jget("https://geocoding-api.open-meteo.com/v1/search?count=1&format=json&language=en&countryCode=US&name=" +
      encodeURIComponent(String(zip).trim()));
    const r = (g.results || [])[0];
    if(!r) return null;
    return { town: r.name, region: r.admin1 || "", country: r.country_code || "",
             lat: r.latitude, lon: r.longitude };
  }catch(e){ return null; }
};

Live.byZip = async function(q){
  const z = String(q).trim();
  if(/^\d{5}$/.test(z)){
    let zone = null, lat = null, lon = null, range = null;
    try{
      const d = await Live.jget("https://phzmapi.org/" + z + ".json");
      zone = d.zone; lat = parseFloat(d.coordinates.lat); lon = parseFloat(d.coordinates.lon);
      range = d.temperature_range;
    }catch(e){ /* zone lookup can fail; the place lookup below may still work */ }

    const place = await Live.nameForZip(z);
    if(place || lat !== null){
      const town = place ? place.town : null;
      const region = place ? place.region : null;
      return {
        zip: z, zone: zone,
        lat: lat !== null ? lat : place.lat,
        lon: lon !== null ? lon : place.lon,
        town: town, region: region,
        label: town ? (town + (region ? ", " + region : "")) : ("ZIP " + z),
        tempRange: range, src: zone ? "phzmapi + open-meteo" : "open-meteo"
      };
    }
  }
  const g = await Live.jget("https://geocoding-api.open-meteo.com/v1/search?count=1&format=json&language=en&name=" + encodeURIComponent(z));
  if(!g.results || !g.results.length) throw new Error("Couldn't find that place");
  const r = g.results[0];
  return { zip: null, zone: null, lat: r.latitude, lon: r.longitude,
           town: r.name, region: r.admin1 || "",
           label: [r.name, r.admin1].filter(Boolean).join(", "),
           src: "open-meteo" };
};

Live.byGPS = async function(){
  const p = await new Promise((res, rej) => {
    if(!navigator.geolocation) return rej(new Error("No GPS on this device"));
    navigator.geolocation.getCurrentPosition(res, rej, { timeout: 10000, maximumAge: 600000 });
  });
  const lat = p.coords.latitude, lon = p.coords.longitude;
  /* name the nearest town by searching the geocoder and picking the closest hit */
  let town = null, region = null;
  try{
    const g = await Live.jget("https://geocoding-api.open-meteo.com/v1/search?count=100&format=json&language=en&name=" +
      encodeURIComponent(""));
    void g;
  }catch(e){}
  return { zip: null, zone: null, lat: lat, lon: lon, town: town, region: region,
           label: town ? town + (region ? ", " + region : "")
                       : "Your location (" + lat.toFixed(2) + ", " + lon.toFixed(2) + ")",
           src: "gps" };
};

/* store the parts, not just a display string, so the UI can format them */
Onboard.apply = function(loc, fr){
  const zone = loc.zone || (fr && fr.zoneFromLow) || "6b";
  let lastF, firstF, src;
  if(fr && fr.lastFrost && fr.firstFrost){ lastF = fr.lastFrost; firstF = fr.firstFrost; src = fr.src; }
  else { const f = Season.fallbackFrom(zone); lastF = f[0]; firstF = f[1]; src = "zone average (offline estimate)"; }
  DB.set("zip", loc.zip || null);
  DB.set("town", loc.town || null);
  DB.set("region", loc.region || null);
  DB.set("locLabel", loc.label);
  DB.set("lat", loc.lat); DB.set("lon", loc.lon);
  DB.set("zone", zone);
  DB.set("lastFrost", lastF); DB.set("firstFrost", firstF);
  DB.set("frostSrc", src);
  if(fr && fr.avgAnnualLow !== null && fr.avgAnnualLow !== undefined) DB.set("avgLow", fr.avgAnnualLow);
  DB.set("onboarded", true);
  return { zone: zone, lastF: lastF, firstF: firstF, src: src };
};

/* one-time repair for installs saved before place names existed */
Onboard.repairLabel = async function(){
  const zip = DB.get("zip"), label = DB.get("locLabel", "");
  if(!zip || DB.get("town")) return;
  if(!/^ZIP\b/i.test(label) && label) return;
  const place = await Live.nameForZip(zip);
  if(!place) return;
  DB.set("town", place.town);
  DB.set("region", place.region);
  DB.set("locLabel", place.town + (place.region ? ", " + place.region : ""));
  if(APP.tab === "home") Home.render();
};

Onboard.lookup = async function(q, gps){
  const out = $("#ob-out");
  if(!gps && !String(q || "").trim()){ out.innerHTML = '<div class="note d">Enter a ZIP or a place name.</div>'; return; }
  out.innerHTML = '<div class="row"><span class="spinner"></span><span class="sm muted">Finding your area…</span></div>';
  let loc;
  try{ loc = gps ? await Live.byGPS() : await Live.byZip(q); }
  catch(e){ out.innerHTML = '<div class="note d">' + esc(e.message || "Lookup failed") +
    '. Check your connection, or set frost dates by hand in Settings → Advanced.</div>'; return; }

  out.innerHTML = '<div class="row"><span class="spinner"></span><span class="sm muted">Reading ten years of local frost history…</span></div>';
  let fr = null;
  try{ fr = await Live.frostDates(loc.lat, loc.lon); }catch(e){}

  const r = Onboard.apply(loc, fr);
  const yr = today().getFullYear();
  out.innerHTML =
    '<div class="note g"><div class="b" style="font-size:1.05rem">' + esc(loc.label) + '</div>' +
    '<div class="b" style="margin-top:2px">Growing zone ' + esc(r.zone) + (loc.zip ? ' · ZIP ' + esc(loc.zip) : '') + '</div>' +
    '<div style="margin-top:8px">❄️ Last spring frost <b>' + fmt(yr + "-" + r.lastF) + '</b><br>' +
    '🍂 First fall frost <b>' + fmt(yr + "-" + r.firstF) + '</b><br>' +
    '🌱 Growing season <b>' + diffDays(parseISO(yr + "-" + r.lastF), parseISO(yr + "-" + r.firstF)) + ' days</b></div>' +
    '<div class="tiny" style="margin-top:6px;opacity:.8">Source: ' + esc(r.src) +
    (fr && fr.avgAnnualLow !== null && fr.avgAnnualLow !== undefined ? ' · average annual low ' + fr.avgAnnualLow + '°F' : '') + '</div></div>' +
    '<button class="btn block" style="margin-top:12px" onclick="closeSheet();Cal.rebuild();refresh();toast(\'Saved — ' + esc((loc.town || "location").replace(/'/g, "")) + '\')">Use these</button>' +
    '<button class="btn ghost block" style="margin-top:8px" onclick="closeSheet();go(\'settings\')">Adjust by hand</button>';
  await getWeather(true);
};
</script>

<script>
/* ============================================================
   GARDEN PLANNER — plots, adjustable grids, companion checks
   ============================================================ */
const Garden = {
  paint: null,     /* crop id being painted */
  erase: false,

  /* ---------- routing ---------- */
  open(bedId){ APP.bedId = bedId; Garden.paint = null; Garden.erase = false; go("garden"); },
  back(){ APP.bedId = null; Garden.render(); },
  render(){ APP.bedId ? Garden.bedView() : Garden.listView(); },

  /* ---------- plots + bed list ---------- */
  listView(){
    const box = $("#s-garden");
    const plots = DB.all("plots"), beds = DB.all("beds");
    let h = "";

    if(!plots.length && !beds.length){
      h += '<div class="card"><div class="empty"><span class="e">🪴</span><div class="b">Plan your first bed</div>' +
        '<div class="tiny">A bed is a grid. One square usually equals one square foot — the classic square-foot method — but you can change the square size to anything.</div></div>' +
        '<button class="btn block" onclick="Garden.newBed()">＋ New bed</button></div>';
      box.innerHTML = h; return;
    }

    const cur = APP.plotId && DB.find("plots", APP.plotId) ? APP.plotId : null;
    h += '<div class="scroller">';
    h += '<button class="chip ' + (!cur ? "on" : "") + '" onclick="APP.plotId=null;Garden.render()">All plots</button>';
    plots.forEach(p => h += '<button class="chip ' + (cur === p.id ? "on" : "") + '" onclick="APP.plotId=\'' + p.id + '\';Garden.render()">' + esc(p.name) + '</button>');
    h += '<button class="chip" onclick="Garden.newPlot()">＋ Plot</button>';
    h += '</div>';

    const shown = beds.filter(b => !cur || b.plot_id === cur);
    const totalSq = shown.reduce((a, b) => a + num(b.cols) * num(b.rows) * Math.pow(num(b.cell_in, 12)/12, 2), 0);
    const planted = shown.reduce((a, b) => a + DB.where("plantings", p => p.bed_id === b.id && p.status !== "removed").length, 0);
    h += '<div class="card"><div class="grid3">' +
      '<div class="stat"><span class="n">' + shown.length + '</span><span class="l">beds</span></div>' +
      '<div class="stat"><span class="n">' + Math.round(totalSq) + '</span><span class="l">sq ft</span></div>' +
      '<div class="stat"><span class="n">' + planted + '</span><span class="l">planted</span></div>' +
      '</div></div>';

    shown.forEach(b => {
      const ps = DB.where("plantings", p => p.bed_id === b.id && p.status !== "removed");
      const conf = Recommend.conflicts(b.id);
      const crops = {}; ps.forEach(p => crops[p.crop_id] = (crops[p.crop_id] || 0) + 1);
      h += '<div class="card"><div class="bedtitle"><div class="grow"><div class="b">' + esc(b.name) + '</div>' +
        '<div class="tiny muted">' + b.cols + '×' + b.rows + ' squares · ' + esc(b.cell_in || 12) + '" each · ' + esc(b.sun_hours || "?") + 'h sun' +
        (b.plot_id && DB.find("plots", b.plot_id) ? ' · ' + esc(DB.find("plots", b.plot_id).name) : '') + '</div></div>' +
        '<button class="btn sm" onclick="Garden.open(\'' + b.id + '\')">Open</button></div>';
      h += Garden.miniGrid(b);
      h += '<div class="row wrap" style="gap:6px;margin-top:10px">';
      Object.keys(crops).slice(0, 8).forEach(id => h += '<span class="chip">' + cropEmoji(id) + ' ' + esc(cropName(id)) + ' ×' + crops[id] + '</span>');
      if(!ps.length) h += '<span class="chip">empty</span>';
      if(conf.length) h += '<span class="chip bad">⚠️ ' + conf.length + ' conflict' + (conf.length > 1 ? "s" : "") + '</span>';
      h += '</div></div>';
    });
    h += '<button class="btn block ghost" style="margin-top:12px" onclick="Garden.newBed()">＋ New bed</button>';
    box.innerHTML = h;
  },

  miniGrid(b){
    const cols = num(b.cols, 4), rows = num(b.rows, 4);
    const cs = clamp(Math.floor(260 / cols), 10, 26);
    const map = {};
    DB.where("plantings", p => p.bed_id === b.id && p.status !== "removed").forEach(p => map[p.x + "," + p.y] = p);
    let h = '<div class="bedwrap" style="padding:4px"><div class="bed" style="grid-template-columns:repeat(' + cols + ',' + cs + 'px);gap:2px;--cs:' + cs + 'px">';
    for(let y = 0; y < rows; y++) for(let x = 0; x < cols; x++){
      const p = map[x + "," + y];
      h += '<div class="cell ' + (p ? "filled" : "") + '" style="width:' + cs + 'px;height:' + cs + 'px;font-size:' + Math.round(cs*0.62) + 'px">' + (p ? cropEmoji(p.crop_id) : "") + '</div>';
    }
    return h + '</div></div>';
  },

  /* ---------- bed detail ---------- */
  bedView(){
    const b = DB.find("beds", APP.bedId);
    if(!b){ APP.bedId = null; return Garden.listView(); }
    const box = $("#s-garden");
    const cols = num(b.cols, 4), rows = num(b.rows, 4);
    const ps = DB.where("plantings", p => p.bed_id === b.id && p.status !== "removed");
    const map = {}; ps.forEach(p => map[p.x + "," + p.y] = p);
    const conflicts = Recommend.conflicts(b.id);
    const friends = Recommend.friends(b.id);
    const conflictCells = {};
    conflicts.forEach(c => { conflictCells[c.a.x + "," + c.a.y] = 1; conflictCells[c.b.x + "," + c.b.y] = 1; });

    let h = '';
    h += '<div class="row" style="margin-bottom:10px"><button class="iconbtn" onclick="Garden.back()">‹</button>' +
      '<div class="grow"><div class="b">' + esc(b.name) + '</div><div class="tiny muted">' + cols + '×' + rows + ' · ' + esc(b.cell_in || 12) + '" squares · ' + esc(b.sun_hours || "?") + 'h sun</div></div>' +
      '<button class="iconbtn" onclick="Garden.bedMenu()">⋯</button></div>';

    /* size controls */
    h += '<div class="card"><div class="row between" style="gap:14px">' +
      '<div><div class="l tiny b muted" style="text-transform:uppercase">Columns</div><div class="stepper">' +
        '<button onclick="Garden.resize(-1,0)">−</button><span class="v">' + cols + '</span><button onclick="Garden.resize(1,0)">＋</button></div></div>' +
      '<div><div class="l tiny b muted" style="text-transform:uppercase">Rows</div><div class="stepper">' +
        '<button onclick="Garden.resize(0,-1)">−</button><span class="v">' + rows + '</span><button onclick="Garden.resize(0,1)">＋</button></div></div>' +
      '<div class="grow" style="text-align:right"><div class="tiny muted">' +
        Math.round(cols * rows * Math.pow(num(b.cell_in,12)/12, 2)) + ' sq ft</div>' +
        '<div class="tiny muted">' + ps.length + '/' + (cols*rows) + ' filled</div></div>' +
      '</div></div>';

    /* paint toolbar */
    h += '<div class="card" style="margin-top:12px"><div class="row wrap" style="gap:6px">';
    if(Garden.paint){
      h += '<span class="chip on">' + cropEmoji(Garden.paint) + ' Placing ' + esc(cropName(Garden.paint)) + '</span>' +
           '<button class="chip" onclick="Garden.paint=null;Garden.render()">Done</button>';
    } else if(Garden.erase){
      h += '<span class="chip bad">🧹 Tap squares to clear</span><button class="chip" onclick="Garden.erase=false;Garden.render()">Done</button>';
    } else {
      h += '<button class="chip" onclick="Garden.pickPaint()">🖌️ Place a crop</button>' +
           '<button class="chip" onclick="Garden.erase=true;Garden.render()">🧹 Clear squares</button>' +
           '<button class="chip" onclick="Garden.suggest()">✨ Suggest for this bed</button>';
    }
    h += '</div><div class="tiny muted" style="margin-top:8px">Tap any square to plant it or see what is growing there.</div></div>';

    /* the grid — spans are drawn as single stretched cells */
    const cs = clamp(Math.floor((Math.min(window.innerWidth, 520) - 64) / cols), 22, 62);
    Garden._cs = cs;
    h += '<div class="bedwrap" style="margin-top:12px">' +
      Garden.gridHTML(b, { cs: cs, gap: 3, interactive: true, conflicts: conflicts, friends: friends }) + '</div>';
    h += '<div class="row center tiny muted" style="gap:12px;margin-top:8px;justify-content:center">' +
      '<span>💚 good neighbours</span><span>⚠️ keep apart</span></div>';
    h += '<div class="tiny muted center" style="margin-top:6px">Tap a planting to select it, then drag its corner handle — or use the width and height steppers — to cover more ground.</div>';

    /* good neighbours */
    if(friends.length){
      h += '<div class="sec"><h2>Good neighbours</h2><span class="tiny muted">💚 on the grid</span></div><div class="card">';
      const seen = {};
      friends.slice(0, 6).forEach(f => {
        const key = [f.a.crop_id, f.b.crop_id].sort().join("|");
        if(seen[key]) return; seen[key] = 1;
        h += '<div class="note g" style="margin-bottom:8px">' + cropEmoji(f.a.crop_id) + ' <b>' + esc(cropName(f.a.crop_id)) +
          '</b> beside ' + cropEmoji(f.b.crop_id) + ' <b>' + esc(cropName(f.b.crop_id)) + '</b><br>' + esc(f.why) + '</div>';
      });
      h += '</div>';
    }

    /* conflicts */
    if(conflicts.length){
      h += '<div class="sec"><h2>Companion warnings</h2></div><div class="card">';
      conflicts.slice(0, 5).forEach(c => {
        h += '<div class="note d" style="margin-bottom:8px">' + cropEmoji(c.a.crop_id) + ' <b>' + esc(cropName(c.a.crop_id)) + '</b> next to ' +
          cropEmoji(c.b.crop_id) + ' <b>' + esc(cropName(c.b.crop_id)) + '</b><br>' + esc(c.why) + '</div>';
      });
      h += '</div>';
    }

    /* what is growing */
    h += '<div class="sec"><h2>Growing here</h2><span class="tiny muted">' + ps.length + ' plantings</span></div>';
    if(!ps.length){ h += '<div class="card center muted sm">Empty bed. Tap a square to plant.</div>'; }
    else {
      const byCrop = {};
      ps.forEach(p => { (byCrop[p.crop_id] = byCrop[p.crop_id] || []).push(p); });
      h += '<div class="card pad0"><div class="list">';
      Object.keys(byCrop).forEach(id => {
        const arr = byCrop[id], c = crop(id);
        const qty = arr.reduce((a, p) => a + num(p.qty, 1), 0);
        const sown = arr.map(p => p.sown_on).filter(Boolean).sort()[0];
        const harv = sown && c ? Season.harvestFrom(id, sown, "seed") : null;
        const sunOk = !c || num(b.sun_hours, 8) >= c.sun;
        h += '<button class="item" onclick="Library.open(\'' + id + '\')"><div class="av">' + cropEmoji(id) + '</div>' +
          '<div class="grow"><div class="b">' + esc(cropName(id)) + ' <span class="muted tiny">×' + qty + ' plants</span></div>' +
          '<div class="tiny muted">' + (sown ? 'Sown ' + fmt(sown) : 'No sow date') +
            (harv ? ' · harvest ~' + fmt(harv) : '') + '</div>' +
          '<div class="tiny muted">' + arr.map(x => Garden.W(x) + '×' + Garden.H(x) +
            (x.span_mode === "single" && (Garden.W(x)*Garden.H(x)) > 1 ? ' (one plant)' : '')).join(", ") + '</div>' +
          (!sunOk ? '<div class="tiny" style="color:var(--warn)">Wants ' + c.sun + 'h sun, bed gets ' + esc(b.sun_hours) + 'h</div>' : '') +
          '</div><span class="go">›</span></button>';
      });
      h += '</div></div>';
    }

    /* bed care summary */
    const w = Recommend.water(b.id, APP.weather);
    if(w){
      h += '<div class="sec"><h2>Care</h2></div><div class="card">';
      h += '<div class="row between"><div><div class="b">' +
        (w.verdict === "skip" ? "💧 Skip watering" : w.verdict === "light" ? '💧 Light top-up' : '💧 Water this week') + '</div>' +
        '<div class="tiny muted">Needs ' + w.need + '"/wk · ' + w.rain + '" rain · ' + w.logged + '" logged</div></div>' +
        '<button class="btn sm" onclick="Journal.quick(\'water\',\'' + b.id + '\')">Log</button></div>';
      const heavy = ps.map(p => crop(p.crop_id)).filter(c => c && c.feeder === "heavy");
      if(heavy.length) h += '<div class="note w" style="margin-top:10px">🌿 Heavy feeders here (' +
        esc(heavy.map(c => c.n).filter((v,i,a) => a.indexOf(v) === i).join(", ")) + '). Side-dress with compost or a balanced organic feed every 3–4 weeks.</div>';
      h += '</div>';
    }

    /* rotation */
    const fams = Recommend.recentFamilies(b.id);
    if(Object.keys(fams).length){
      h += '<div class="sec"><h2>Rotation history</h2></div><div class="card"><div class="row wrap" style="gap:6px">';
      Object.keys(fams).forEach(f => h += '<span class="chip"><span class="swatch" style="background:' + FAMILY[f].c + '"></span>' + esc(FAMILY[f].n) + ' · ' + esc(fams[f]) + '</span>');
      h += '</div><div class="tiny muted" style="margin-top:8px">Aim for a 3-year gap before the same family returns to a bed. It starves out soil-borne disease and evens out nutrient draw.</div></div>';
    }

    box.innerHTML = h;
  },

  /* ---------- interactions ---------- */
  tapCell(x, y){
    haptic();
    const b = DB.find("beds", APP.bedId);
    const ex = DB.where("plantings", p => p.bed_id === b.id && num(p.x) === x && num(p.y) === y && p.status !== "removed")[0];
    if(Garden.erase){ if(ex){ DB.update("plantings", ex.id, { status:"removed", removed_on: iso(today()) }); Garden.render(); } return; }
    if(Garden.paint){
      if(ex && ex.crop_id === Garden.paint) return;
      if(ex) DB.update("plantings", ex.id, { status:"removed", removed_on: iso(today()) });
      Garden.place(b, x, y, Garden.paint, true);
      Garden.render(); return;
    }
    ex ? Garden.plantingSheet(ex) : Garden.pickCrop(x, y);
  },

  place(b, x, y, cropId, silent){
    const c = crop(cropId);
    const cell = num(b.cell_in, 12) / 12;
    const qty = Math.max(1, Math.round((c ? c.psf : 1) * cell * cell));
    const p = DB.insert("plantings", {
      bed_id: b.id, x: x, y: y, crop_id: cropId, qty: qty, status: "planned", sown_on: iso(today())
    });
    if(!silent) toast(cropName(cropId) + " placed");
    Cal.forPlanting(p);
    return p;
  },

  pickPaint(){
    Garden.cropPicker("Choose a crop to place", id => {
      Garden.paint = id; Garden.erase = false; closeSheet(); Garden.render();
      toast("Tap squares to place " + cropName(id));
    });
  },

  pickCrop(x, y){
    const b = DB.find("beds", APP.bedId);
    Garden.cropPicker("Plant row " + (y+1) + ", column " + (x+1), id => {
      closeSheet();
      const p = Garden.place(b, x, y, id);
      Garden.render();
      setTimeout(() => Garden.plantingSheet(p), 250);
    }, b);
  },

  cropPicker(title, onPick, bed){
    const stock = {}; DB.all("seeds").forEach(s => { if(s.crop_id) stock[s.crop_id] = (stock[s.crop_id] || 0) + 1; });
    const recs = Recommend.now({ bedId: bed ? bed.id : null }).slice(0, 30);
    const recIds = recs.map(r => r.crop.id);
    let h = '<input type="search" id="cp-q" placeholder="Search 50+ crops…" style="margin-bottom:10px">';
    h += '<div class="row wrap" style="gap:6px;margin-bottom:10px">' +
      '<button class="chip on" data-f="all">All</button>' +
      '<button class="chip" data-f="now">In season now</button>' +
      '<button class="chip" data-f="seed">I have seed</button>' +
      '<button class="chip" data-f="comp">Good companions</button></div>';
    h += '<div id="cp-list"></div>';
    openSheet(title, h);

    const compIds = bed ? Recommend.forBed(bed.id).map(x => x.id) : [];
    let filter = "all", q = "";
    function draw(){
      let list = CROPS.slice();
      if(filter === "now") list = list.filter(c => recIds.indexOf(c.id) >= 0);
      if(filter === "seed") list = list.filter(c => stock[c.id]);
      if(filter === "comp") list = list.filter(c => compIds.indexOf(c.id) >= 0);
      if(q) list = list.filter(c => (c.n + " " + c.id + " " + FAMILY[c.fam].n).toLowerCase().indexOf(q) >= 0);
      if(filter === "now") list.sort((a,b2) => recIds.indexOf(a.id) - recIds.indexOf(b2.id));
      let out = '<div class="list">';
      if(!list.length) out += '<div class="empty sm">Nothing matches.</div>';
      list.slice(0, 80).forEach(c => {
        const st = Season.status(c.id);
        const inWin = st && st.inWindow;
        let badge = "";
        if(inWin) badge = '<span class="chip good tiny">' + esc(st.w.label) + ' now</span>';
        else if(st && st.days > 0 && st.days < 60) badge = '<span class="chip info tiny">' + esc(st.w.label) + ' ' + relDay(st.w.date) + '</span>';
        let compBadge = "";
        if(bed){
          const occ = DB.where("plantings", p => p.bed_id === bed.id && p.status !== "removed").map(p => p.crop_id);
          let worst = 0, best = 0;
          occ.forEach(o => { const r = pairRating(c.id, o); worst = Math.min(worst, r.score); best = Math.max(best, r.score); });
          if(worst <= -2) compBadge = '<span class="chip bad tiny">conflict here</span>';
          else if(best >= 1) compBadge = '<span class="chip good tiny">good pairing</span>';
        }
        out += '<button class="item" data-id="' + c.id + '"><div class="av">' + c.e + '</div>' +
          '<div class="grow"><div class="b">' + esc(c.n) + (stock[c.id] ? ' <span class="tiny" style="color:var(--green-600)">🌰</span>' : '') + '</div>' +
          '<div class="tiny muted">' + esc(FAMILY[c.fam].n) + ' · ' + c.sun + 'h sun · ' + c.dtm + 'd</div>' +
          '<div class="row wrap" style="gap:4px;margin-top:3px">' + badge + compBadge + '</div></div>' +
          '<span class="go">›</span></button>';
      });
      out += '</div>';
      $("#cp-list").innerHTML = out;
      $$("#cp-list .item").forEach(el => el.onclick = () => onPick(el.dataset.id));
    }
    $("#cp-q").oninput = e => { q = e.target.value.toLowerCase().trim(); draw(); };
    $$("#sheet-body .chip[data-f]").forEach(el => el.onclick = () => {
      filter = el.dataset.f;
      $$("#sheet-body .chip[data-f]").forEach(x => x.classList.toggle("on", x === el));
      draw();
    });
    draw();
  },

  plantingSheet(p){
    const c = crop(p.crop_id), b = DB.find("beds", p.bed_id);
    const seeds = DB.where("seeds", s => s.crop_id === p.crop_id);
    const harv = p.sown_on ? Season.harvestFrom(p.crop_id, p.sown_on, "seed") : null;
    let h = '<div class="row" style="gap:12px;margin-bottom:12px"><div style="font-size:2.4rem">' + cropEmoji(p.crop_id) + '</div>' +
      '<div class="grow"><div class="b" style="font-size:1.1rem">' + esc(cropName(p.crop_id)) + '</div>' +
      '<div class="tiny muted">Row ' + (num(p.y)+1) + ', column ' + (num(p.x)+1) + ' of ' + esc(b.name) + '</div></div></div>';

    h += '<div class="field"><label class="f">Variety</label><input type="text" id="pl-var" value="' + esc(p.variety || "") + '" placeholder="e.g. Sungold, Cherokee Purple"></div>';
    h += '<div class="grid2" style="margin-top:12px">' +
      '<div><label class="f">Plants in this square</label><input type="number" id="pl-qty" min="1" value="' + esc(p.qty || 1) + '"></div>' +
      '<div><label class="f">Status</label><select id="pl-status">' +
        ["planned","seeded","growing","harvesting","done"].map(s => '<option value="' + s + '"' + (p.status === s ? " selected" : "") + '>' + s + '</option>').join("") +
      '</select></div></div>';
    h += '<div class="grid2" style="margin-top:12px">' +
      '<div><label class="f">Sown / planted</label><input type="date" id="pl-sown" value="' + esc(p.sown_on || "") + '"></div>' +
      '<div><label class="f">From seed packet</label><select id="pl-seed"><option value="">— none —</option>' +
        seeds.map(s => '<option value="' + s.id + '"' + (p.seed_id === s.id ? " selected" : "") + '>' + esc(s.name + (s.variety ? " · " + s.variety : "")) + '</option>').join("") +
      '</select></div></div>';

      h += '<div class="note g" style="margin-top:12px"><b>Spacing check.</b> ' + esc(c.n) + ' wants ' + c.sp + '" between plants — about ' +
        (Math.round(c.psf * 100)/100) + ' per square foot. Your ' + esc(b.cell_in || 12) + '" squares fit ' +
        Math.max(1, Math.round(c.psf * Math.pow(num(b.cell_in,12)/12, 2))) + ' comfortably.</div>';
      if(harv) h += '<div class="note i" style="margin-top:8px">🗓️ ' + c.dtm + ' days to maturity — first harvest around <b>' + fmtY(harv) + '</b>' +
        (Season.firstFrost() && harv > Season.firstFrost() ? '. That is after your first frost — this planting may not finish.' : '.') + '</div>';
      const occ = DB.where("plantings", x => x.bed_id === b.id && x.status !== "removed" && x.id !== p.id);
      const bad = [], good = [];
      occ.forEach(o => { const r = pairRating(p.crop_id, o.crop_id);
        if(r.score <= -2) bad.push(cropName(o.crop_id)); else if(r.score >= 1) good.push(cropName(o.crop_id)); });
      if(good.length) h += '<div class="note g" style="margin-top:8px">💚 Happy neighbours: ' + esc(good.filter((v,i,a)=>a.indexOf(v)===i).join(", ")) + '</div>';
      if(bad.length) h += '<div class="note d" style="margin-top:8px">⚠️ Poor neighbours: ' + esc(bad.filter((v,i,a)=>a.indexOf(v)===i).join(", ")) + ' — move one if you can.</div>';
    }

    h += '<div class="row" style="gap:8px;margin-top:16px">' +
      '<button class="btn ghost" onclick="Garden.removePlanting(\'' + p.id + '\')">Clear square</button>' +
      '<button class="btn grow" onclick="Garden.savePlanting(\'' + p.id + '\')">Save</button></div>';
    h += '<button class="btn ghost block" style="margin-top:8px" onclick="closeSheet();setTimeout(function(){Library.open(\'' + p.crop_id + '\')},250)">Full growing guide →</button>';
    h += '<button class="btn ghost block" style="margin-top:8px" onclick="closeSheet();setTimeout(function(){Journal.quick(\'harvest\',\'' + b.id + '\',\'' + p.id + '\')},250)">🧺 Log a harvest from this plant</button>';
    openSheet("Square details", h);
  },

  savePlanting(id){
    const p = DB.find("plantings", id); if(!p) return;
    DB.update("plantings", id, {
      variety: $("#pl-var").value.trim(), qty: num($("#pl-qty").value, 1),
      status: $("#pl-status").value, sown_on: $("#pl-sown").value,

  removePlanting(id){
    DB.update("plantings", id, { status:"removed", removed_on: iso(today()) });

  },

  resize(dc, dr){
    const b = DB.find("beds", APP.bedId);
    const cols = clamp(num(b.cols) + dc, 1, 24), rows = clamp(num(b.rows) + dr, 1, 24);
    const orphan = DB.where("plantings", p => p.bed_id === b.id && p.status !== "removed" && (num(p.x) >= cols || num(p.y) >= rows));
    const apply = () => {
      orphan.forEach(p => DB.update("plantings", p.id, { status:"removed", removed_on: iso(today()) }));
      DB.update("beds", b.id, { cols: cols, rows: rows });
      Garden.render();
    };
    if(orphan.length) confirmSheet("Shrink the bed?",
      orphan.length + " planted square" + (orphan.length > 1 ? "s fall" : " falls") + " outside the new size and will be cleared.",
      "Shrink anyway", apply, true);
    else apply();
  },

  suggest(){
    const b = DB.find("beds", APP.bedId);
    const recs = Recommend.now({ bedId: b.id }).slice(0, 12);
    let h = '<p class="muted sm" style="margin-top:0">Ranked for <b>' + esc(b.name) + '</b> — ' + esc(b.sun_hours || "?") +
      'h of sun, what is already growing there, what grew there before, and what is in your seed bank.</p>';

    recs.forEach(r => {
      h += '<div class="card" style="margin-bottom:10px"><div class="row" style="gap:10px">' +

        '<div class="b">' + esc(r.crop.n) + '</div><div class="tiny muted">' + esc(FAMILY[r.crop.fam].n) + ' · ' + r.crop.dtm + ' days · ' + r.crop.sun + 'h sun</div></div>' +
        '<button class="btn sm" onclick="Garden.paint=\'' + r.crop.id + '\';closeSheet();Garden.render();toast(\'Tap squares to place\')">Place</button></div>';
      r.why.slice(0, 3).forEach(x => h += '<div class="tiny" style="margin-top:5px">' + esc(x) + '</div>');
      r.warn.slice(0, 2).forEach(x => h += '<div class="tiny" style="margin-top:5px;color:var(--warn)">' + esc(x) + '</div>');
      h += '</div>';

    openSheet("Suggestions for this bed", h);

  bedMenu(){
    const b = DB.find("beds", APP.bedId);
    openSheet("Bed settings",
      '<div class="field"><label class="f">Name</label><input type="text" id="bd-name" value="' + esc(b.name) + '"></div>' +
      '<div class="grid2" style="margin-top:12px">' +
        '<div><label class="f">Square size (inches)</label><input type="number" id="bd-cell" value="' + esc(b.cell_in || 12) + '" min="3" max="48"></div>' +

          ["","loam","sandy","clay","raised mix","container","silt"].map(s => '<option' + (b.soil === s ? " selected" : "") + '>' + s + '</option>').join("") + '</select></div>' +
        '<div><label class="f">Irrigation</label><select id="bd-irr">' +
          ["","hand water","drip","soaker","sprinkler","rain only"].map(s => '<option' + (b.irrigation === s ? " selected" : "") + '>' + s + '</option>').join("") + '</select></div>' +
      '</div>' +
      '<div class="field"><label class="f">Plot / group</label><select id="bd-plot"><option value="">— none —</option>' +
        DB.all("plots").map(p => '<option value="' + p.id + '"' + (b.plot_id === p.id ? " selected" : "") + '>' + esc(p.name) + '</option>').join("") + '</select></div>' +
      '<div class="field"><label class="f">Notes</label><textarea id="bd-notes">' + esc(b.notes || "") + '</textarea></div>' +
      '<button class="btn block" style="margin-top:14px" onclick="Garden.saveBed()">Save bed</button>' +
      '<button class="btn ghost block" style="margin-top:8px" onclick="Garden.duplicateBed()">Duplicate this bed</button>' +
      '<button class="btn ghost block" style="margin-top:8px" onclick="Garden.clearBed()">Clear all plantings</button>' +
      '<button class="btn danger block" style="margin-top:8px" onclick="Garden.deleteBed()">Delete bed</button>');

  saveBed(){
    const b = DB.find("beds", APP.bedId);

      name: $("#bd-name").value.trim() || b.name, cell_in: num($("#bd-cell").value, 12),
      sun_hours: num($("#bd-sun").value, 8), soil: $("#bd-soil").value, irrigation: $("#bd-irr").value,
      plot_id: $("#bd-plot").value || null, notes: $("#bd-notes").value.trim()
    });
    closeSheet(); Garden.render(); toast("Bed saved");
  },
  /* DB.body, not Object.assign({}, row, {id: undefined}) — that idiom read as
     "give this a new id" and did the reverse, because Object.assign copies a
     key whose value is undefined. It also carried the original's `created`
     stamp, so a bed duplicated today claimed to have been built last spring. */
  duplicateBed(){
    const b = Geom.bed(DB.find("beds", APP.bedId)); if(!b) return;
    const nb = DB.insert("beds", Object.assign(DB.body("beds", b), { name: b.name + " (copy)" }));
    DB.where("plantings", p => p.bed_id === b.id && p.status !== "removed").forEach(p =>
      DB.insert("plantings", Object.assign(DB.body("plantings", p), { bed_id: nb.id })));
    closeSheet(); Garden.open(nb.id); toast("Bed duplicated");
  },
  clearBed(){
    confirmSheet("Clear the bed?", "Every planting in this bed is removed. Harvest records stay.", "Clear it", () => {
      DB.where("plantings", p => p.bed_id === APP.bedId).forEach(p => DB.update("plantings", p.id, { status:"removed", removed_on: iso(today()) }));
      Garden.render(); toast("Bed cleared");
    }, true);
  },
  deleteBed(){
    confirmSheet("Delete this bed?", "The bed and its plantings are permanently removed.", "Delete", () => {
      DB.bulkRemove("plantings", p => p.bed_id === APP.bedId);
      DB.bulkRemove("events", e => e.bed_id === APP.bedId);
      DB.remove("beds", APP.bedId);
      APP.bedId = null; Garden.render(); toast("Bed deleted");
    }, true);
  },

  newPlot(){
    openSheet("New plot",
      '<p class="muted sm" style="margin-top:0">A plot is a group of beds — "back yard", "community plot", "greenhouse".</p>' +

  newBed(){

    openSheet("New bed",
      '<div class="field"><label class="f">Bed name</label><input type="text" id="nb-name" placeholder="Raised bed 1"></div>' +
      '<div class="grid2" style="margin-top:12px">' +
        '<div><label class="f">Columns</label><input type="number" id="nb-cols" value="4" min="1" max="24"></div>' +
        '<div><label class="f">Rows</label><input type="number" id="nb-rows" value="8" min="1" max="24"></div>' +
